# Merge this receiver into your existing Alertmanager configuration.
route:
  receiver: existing-default
  routes:
    - receiver: kube-agent
      matchers:
        - namespace="default"
      group_by: [namespace, alertname, deployment]
      group_wait: 60s
      group_interval: 10m
      repeat_interval: 4h
      continue: true
receivers:
  - name: existing-default
  - name: kube-agent
    webhook_configs:
      - url: http://agent-api.agent-system.svc.cluster.local:8080/v1/alertmanager
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            # Mount the same token into the Alertmanager pod using your installation's secret configuration.
            credentials_file: /etc/alertmanager/secrets/agent-auth/API_TOKEN
