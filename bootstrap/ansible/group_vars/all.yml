# Tool versions — update these or override with -e var=value on the CLI.
# Renovate bumps these automatically; the inline comments drive datasource lookup.
talosctl_version:  "1.13.6"   # renovate: datasource=github-releases depName=siderolabs/talos
kubectl_version:   "1.36.2"   # renovate: datasource=github-releases depName=kubernetes/kubernetes
flux_version:      "2.9.1"    # renovate: datasource=github-releases depName=fluxcd/flux2
sops_version:      "3.13.2"    # renovate: datasource=github-releases depName=getsops/sops
age_version:       "1.3.1"    # renovate: datasource=github-releases depName=FiloSottile/age
terraform_version: "1.15.8"   # renovate: datasource=github-releases depName=hashicorp/terraform
helm_version:      "4.2.3"   # renovate: datasource=github-releases depName=helm/helm

# Where to install binaries.
# Override with: -e tools_bin_dir=/usr/local/bin -e tools_become=true for system-wide install
tools_bin_dir: "{{ ansible_env.HOME }}/.local/bin"
tools_become:  false
