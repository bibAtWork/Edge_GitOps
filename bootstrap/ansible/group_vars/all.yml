# Tool versions — update these or override with -e var=value on the CLI.
# Renovate bumps these automatically; the preceding-line comments drive datasource lookup.
# renovate: datasource=github-releases depName=siderolabs/talos
talosctl_version:  "1.13.9"
# renovate: datasource=github-releases depName=kubernetes/kubernetes
kubectl_version:   "1.36.4"
# renovate: datasource=github-releases depName=fluxcd/flux2
flux_version:      "2.9.4"
# renovate: datasource=github-releases depName=getsops/sops
sops_version:      "3.13.3"
# renovate: datasource=github-releases depName=FiloSottile/age
age_version:       "1.3.1"
# renovate: datasource=github-releases depName=hashicorp/terraform
terraform_version: "1.15.9"
# renovate: datasource=github-releases depName=helm/helm
helm_version:      "4.2.4"

# Where to install binaries.
# Override with: -e tools_bin_dir=/usr/local/bin -e tools_become=true for system-wide install
tools_bin_dir: "{{ ansible_env.HOME }}/.local/bin"
tools_become:  false
