# Tool versions — update these or override with -e var=value on the CLI.
# Renovate bumps these automatically; the inline comments drive datasource lookup.
talosctl_version:  "1.13.2"   # renovate: datasource=github-releases depName=siderolabs/talos
kubectl_version:   "1.36.1"   # renovate: datasource=github-releases depName=kubernetes/kubernetes
flux_version:      "2.8.8"    # renovate: datasource=github-releases depName=fluxcd/flux2
sops_version:      "3.13.1"    # renovate: datasource=github-releases depName=getsops/sops
age_version:       "1.3.1"    # renovate: datasource=github-releases depName=FiloSottile/age
terraform_version: "1.15.4"   # renovate: datasource=github-releases depName=hashicorp/terraform
helm_version:      "4.2.0"   # renovate: datasource=github-releases depName=helm/helm

# Where to install binaries.
# Override with: -e tools_bin_dir=~/.local/bin (no become required)
tools_bin_dir: /usr/local/bin
tools_become:  true      # set false when installing into a user-owned directory
