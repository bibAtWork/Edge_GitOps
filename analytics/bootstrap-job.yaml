apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-bootstrap
  namespace: analytics
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-run
        homelab.local/analytics-storage-client: 'true'
    spec:
      serviceAccountName: analytics-runner
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
      containers:
      - name: bootstrap
        image: docker.io/library/python:3.12.12-slim-bookworm
        command:
        - python
        - /opt/analytics/bootstrap.py
        - --accept-terms
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        env:
        - name: PATH
          value: /opt/runtime/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: PYTHONPATH
          value: /opt/analytics
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HOME
          value: /tmp
        - name: DBT_TARGET_PATH
          value: /tmp/dbt/target
        - name: DBT_LOG_PATH
          value: /tmp/dbt/logs
        - name: LAKEKEEPER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: analytics-oauth
              key: client-id
        - name: LAKEKEEPER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: analytics-oauth
              key: client-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: analytics-s3
              key: admin_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: analytics-s3
              key: admin_secret_access_key
        volumeMounts:
        - name: pipeline-code
          mountPath: /opt/analytics
          readOnly: true
        - name: runtime
          mountPath: /opt/runtime
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: pipeline-code
        configMap:
          name: analytics-code
          items:
          - key: definitions.py
            path: definitions.py
          - key: bootstrap.py
            path: bootstrap.py
          - key: install-runtime.sh
            path: install-runtime.sh
          - key: requirements.lock
            path: requirements.lock
          - key: requirements-control.lock
            path: requirements-control.lock
          - key: dbt_project.yml
            path: dbt/dbt_project.yml
          - key: profiles.yml
            path: dbt/profiles.yml
          - key: event_summary.sql
            path: dbt/models/event_summary.sql
          - key: schema.yml
            path: dbt/models/schema.yml
      - name: runtime
        emptyDir:
          sizeLimit: 2Gi
      - name: tmp
        emptyDir:
          sizeLimit: 2Gi
      initContainers:
      - name: install-dependencies
        image: docker.io/library/python:3.12.12-slim-bookworm
        command:
        - sh
        - /opt/analytics/install-runtime.sh
        env:
        - name: HOME
          value: /tmp
        - name: REQUIREMENTS_FILE
          value: /opt/analytics/requirements.lock
        volumeMounts:
        - name: pipeline-code
          mountPath: /opt/analytics
          readOnly: true
        - name: runtime
          mountPath: /opt/runtime
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 2Gi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
