# Manual one-shot action AFTER reading the runbook and Lakekeeper terms.
# Deliberately excluded from the continuously reconciled Kustomization.
apiVersion: batch/v1
kind: Job
metadata:
  name: analytics-bootstrap
  namespace: analytics
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: analytics-run
        homelab.local/analytics-storage-client: 'true'
    spec:
      serviceAccountName: analytics-runner
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: ghcr.io/bibatwork/edge-analytics:analytics-v1
          command: [python, /opt/analytics/bootstrap.py, --accept-terms]
          envFrom:
            - secretRef:
                name: analytics-run-env
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
