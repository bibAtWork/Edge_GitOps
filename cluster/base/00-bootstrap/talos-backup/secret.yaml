# Encrypt this file with SOPS before committing:
#   sops --encrypt --in-place secret.yaml
#
# Required keys:
#   talos-backup-age.public-key  — output of: grep 'public key' talos-backup-age.key | awk '{print $4}'
#   seaweedfs-s3-creds.access-key
#   seaweedfs-s3-creds.secret-key
---
apiVersion: v1
kind: Secret
metadata:
  name: talos-backup-age
  namespace: talos-backup
stringData:
  public-key: REPLACE_WITH_AGE_PUBLIC_KEY
---
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-creds
  namespace: talos-backup
stringData:
  access-key: REPLACE_WITH_SEAWEEDFS_ACCESS_KEY
  secret-key: REPLACE_WITH_SEAWEEDFS_SECRET_KEY
