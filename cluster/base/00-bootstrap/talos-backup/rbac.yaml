---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: talos-backup
  namespace: talos-backup
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: talos-backup
  namespace: talos-backup
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-backup
  namespace: talos-backup
subjects:
  - kind: ServiceAccount
    name: talos-backup
    namespace: talos-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: talos-backup
