# Efficiency review 2026-08-17: briefly widened to 4Gi/2Gi/2cpu/15pods here to
# work around scan Jobs getting rejected by this quota. That was treating a
# symptom -- the actual cause was operator.scanJobConcurrentLimit being
# misspelled (real key: scanJobsConcurrentLimit), so trivy-operator ran on the
# chart's default of 10 concurrent scan Jobs instead of the intended 1. Fixed
# properly in 13-trivy-operator/helmrelease.yaml and
# 1-node/patches/trivy-concurrency-1.yaml, and verified live: with concurrency
# genuinely capped at 1, polling every 8s for 2 minutes under the same
# artificial burst that originally broke this quota never showed more than 1
# concurrent scan pod.
#
# Sized down from #160's 4Gi/2Gi/2cpu/15pods once the real cause (above) was
# fixed, but not all the way back to the original 2Gi: verified live that
# scanJobsConcurrentLimit is enforced per scanner type, not globally --
# vulnerabilityScanner, configAuditScanner, and rbacAssessmentScanner can each
# have their own scan Job in flight at once, so up to ~3 concurrent Jobs is
# the real worst case, not 1. Confirmed at 2Gi this still produced occasional
# (harmless -- retried and succeeded, zero app impact) rejections under a
# forced burst deliberately larger than anything realistic. 3Gi covers the
# operator (512Mi) plus 3 concurrent Jobs at up to ~830Mi each with real
# margin, still well short of #160's 4Gi.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: trivy-system
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1500Mi
    limits.memory: 3Gi
    pods: "12"
