---
# Efficiency review 2026-08-17: 2Gi was too tight and rejected real scan Jobs
# ("exceeded quota: default-quota, requested: limits.memory=1G, used:
# limits.memory=1536870912, limited: limits.memory=2Gi"). Root cause: Trivy's
# per-container scan limit is 500M (trivy-operator-trivy-config ConfigMap,
# trivy.resources.limits.memory), and trivy-operator creates one scan container
# per container in the target workload, so a single Job for a multi-container
# pod can already ask for 1G+. On top of that, the three scanner types
# (vulnerability, configAudit, rbacAssessment) run independently and can have
# their own scan Jobs in flight at once, so a burst of newly-changed images
# (the normal case right after a batch of image bumps) can stack multiple such
# Jobs simultaneously. 4Gi/2Gi gives comfortable headroom for that burst case
# without being unbounded -- the node has 32Gi total and sits around 42% used,
# so this is not a meaningful bite out of overall capacity.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: trivy-system
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "15"
