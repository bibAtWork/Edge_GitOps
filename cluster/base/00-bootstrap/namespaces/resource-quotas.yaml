---
# scanJobsConcurrentLimit: 1 limits vulnerability scan Jobs, not the number of
# containers in one Job. Trivy packs every container of a workload into one
# scan pod, giving each scanner the 1Gi limit in 13-trivy-operator/helmrelease.yaml.
# The live three-container Longhorn CSI workload therefore needs a 3Gi Job.
# On 2026-09-27 the old 3Gi namespace cap already held 1536Mi for the operator
# and server; 2Gi and 3Gi scan Jobs were repeatedly rejected and timed out.
# 6Gi admits that largest observed Job plus the resident pods and a small
# concurrent audit Job. It is a quota ceiling, not a memory reservation.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: trivy-system
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 2Gi
    limits.memory: 6Gi
    pods: "12"
