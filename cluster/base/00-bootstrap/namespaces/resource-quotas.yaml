# Efficiency review 2026-08-17: briefly widened to 4Gi/2Gi/2cpu/15pods here to
# work around scan Jobs getting rejected by this quota. That was treating a
# symptom -- the actual cause was operator.scanJobConcurrentLimit being
# misspelled (real key: scanJobsConcurrentLimit), so trivy-operator ran on the
# chart's default of 10 concurrent scan Jobs instead of the intended 1. Fixed
# properly in 13-trivy-operator/helmrelease.yaml and
# 1-node/patches/trivy-concurrency-1.yaml, and verified live: with concurrency
# genuinely capped at 1, polling every 8s for 2 minutes under the same
# artificial burst that originally broke this quota never showed more than 1
# concurrent scan pod.
#
# Sized down from #160's 4Gi/2Gi/2cpu/15pods once the real cause (above) was
# fixed. scanJobsConcurrentLimit: 1 is enforced per scanner type (verified
# live), not globally, so vulnerabilityScanner/configAuditScanner/
# rbacAssessmentScanner can each have one Job in flight at once -- up to ~3
# concurrent, not a strict 1. At this 2Gi cap that occasionally produced
# rejections under a forced burst deliberately larger than anything
# realistic -- harmless (the operator's reconcile loop retried them and they
# succeeded once earlier Jobs freed memory, zero app impact), and accepted as
# the tradeoff: prioritizing a tight, easy-to-reason-about quota over paying
# for headroom against a burst this large.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: trivy-system
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 1Gi
    limits.memory: 2Gi
    pods: "12"
