---
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
  labels:
    # SeaweedFS is the storage provider itself — needs hostPath for data dirs and
    # may run privileged containers (CSI driver). Cannot use baseline PSS.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # prometheus-node-exporter requires hostPID, hostNetwork, and hostPath volumes.
    # These are blocked by baseline and restricted PSS. Monitoring is a trusted
    # system-level namespace; privileged enforcement is appropriate.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: zot
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # tailscale-operator chart does not expose security context values;
    # the rendered pod has no securityContext, which restricted PSS rejects.
    # baseline is the right policy — operator manages VPN tunnels and may
    # need network capabilities that restricted would block anyway.
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: system-upgrade
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: cattle-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
