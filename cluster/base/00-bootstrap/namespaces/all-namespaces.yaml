# Security review 2026-08-14, finding M3: neither namespace had PSS enforcement —
# default had no PSS labels at all, flux-system only had the warn label Flux's own
# bootstrap manifest sets (gotk-components.yaml, regenerated by `flux bootstrap`,
# so not something to hand-edit for enforce). Both verified restricted-compatible
# before adding enforce, not just assumed: flux-system's six controller types
# (helm/kustomize/source/notification/image-reflector/image-automation) already run
# fully restricted-compliant securityContexts; default had two leftover manual debug
# pods (deleted in the same change) and nothing else, so it's empty going in.
apiVersion: v1
kind: Namespace
metadata:
  name: flux-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
# ── Namespaces this repo did not create ──────────────────────────────────────
#
# kube-system, kube-public, kube-node-lease and cilium-secrets are made by
# Kubernetes and Cilium. They are adopted here only to carry a Pod Security
# level: before this, the namespace running the CNI, CoreDNS and every static
# control-plane pod had no PSS floor at all, which is a gap that reads as a
# decision only once someone checks.
#
# Every one carries kustomize.toolkit.fluxcd.io/prune: disabled. Adopting an
# object means Flux deletes it if it ever leaves Git, and for kube-system that
# is a cluster-ending edit. The annotation makes Flux able to set labels and
# unable to remove the namespace.
apiVersion: v1
kind: Namespace
metadata:
  name: kube-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Privileged is the honest level, not an aspiration: Cilium, CoreDNS and the
    # static control-plane pods need host access and cannot run under baseline.
    #
    # audit and warn sit one bar higher on purpose. Nothing is blocked and
    # nothing changes for what runs today, but anything NEW that would fail
    # baseline is recorded in the audit log and surfaced at apply time -- which
    # is how you find out whether a future workload here genuinely needs host
    # access or merely inherited it.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-public
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Empty, and nothing here is expected to run pods.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: kube-node-lease
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Holds Lease objects only; no pods, by design.
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: cilium-secrets
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # Cilium's TLS material for Gateway listeners. Secrets only, never pods.
    pod-security.kubernetes.io/enforce: restricted
