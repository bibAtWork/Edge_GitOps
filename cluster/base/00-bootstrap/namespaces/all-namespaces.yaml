---
apiVersion: v1
kind: Namespace
metadata:
  name: seaweedfs
  labels:
    # SeaweedFS is the storage provider itself — needs hostPath for data dirs and
    # may run privileged containers (CSI driver). Cannot use baseline PSS.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    # prometheus-node-exporter requires hostPID, hostNetwork, and hostPath volumes.
    # These are blocked by baseline and restricted PSS. Monitoring is a trusted
    # system-level namespace; privileged enforcement is appropriate.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: velero
  labels:
    # velero-node-agent DaemonSet runs as root (UID 0) with privileged: true to
    # traverse /var/lib/kubelet/pods and read PV data for Kopia file system backup.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: cert-manager
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: zot
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    # Proxy pods (sysctler + tailscale containers) require privileged: true
    # to configure network interfaces and routing. baseline rejects this.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: system-upgrade
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: Namespace
metadata:
  name: cattle-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
