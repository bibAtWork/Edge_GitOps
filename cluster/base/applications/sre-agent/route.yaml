apiVersion: v1
kind: Service
metadata:
  name: sre-agent-dashboard
  namespace: sre-agent
spec:
  selector:
    app: agent-api
  ports:
    - name: dashboard
      port: 8081
      targetPort: dashboard
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sre-agent
  namespace: sre-agent
  annotations:
    gitops.homelab/auth: gateway-oidc
    gitops.homelab/auth-client: homelab-edge
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - sre-agent.homelab.data-harness.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sre-agent-dashboard
          port: 8081
