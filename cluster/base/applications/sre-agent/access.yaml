apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-app-operator-edit
  namespace: sre-agent
subjects:
  - kind: Group
    name: oidc:app-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-agent-isolation
  namespace: sre-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Shared policies supply DNS, same-namespace traffic, gateway ingress and HTTPS.
# Policies are additive: this rule does not narrow existing platform allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: investigator-kubernetes-api
  namespace: sre-agent
spec:
  endpointSelector:
    matchLabels:
      app: investigator
  egress:
    - toEntities: [kube-apiserver]
---
# Permit the monitoring alert sender to use only the bearer-protected API port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-alert-webhook
  namespace: sre-agent
spec:
  endpointSelector:
    matchLabels:
      app: agent-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
