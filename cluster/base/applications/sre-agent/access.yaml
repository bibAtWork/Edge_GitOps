apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-app-operator-edit
  namespace: sre-agent
subjects:
  - kind: Group
    name: oidc:app-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sre-agent-isolation
  namespace: sre-agent
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Shared policies supply DNS and gateway ingress. This application must explicitly
# permit internal API calls and the workers' external HTTPS dependencies.
# Policies are additive: this rule does not narrow existing platform allows.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: investigator-kubernetes-api
  namespace: sre-agent
spec:
  endpointSelector:
    matchLabels:
      app: investigator
  egress:
    - toEntities: [kube-apiserver]
---
# Permit the monitoring alert sender to use only the bearer-protected API port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: monitoring-alert-webhook
  namespace: sre-agent
spec:
  endpointSelector:
    matchLabels:
      app: agent-api
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP

---
# The shared same-namespace allow policies enumerate platform namespaces and do
# not include sre-agent. API ingress and caller egress both need an explicit rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-api-caller-egress
  namespace: sre-agent
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app: agent-api
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-api-internal-ingress
  namespace: sre-agent
spec:
  endpointSelector:
    matchLabels:
      app: agent-api
  ingress:
    - fromEndpoints:
        - {}
      toPorts:
        - ports:
            - port: '8080'
              protocol: TCP
---
# Gemini API for both workers; public GitHub checkout and model catalog for
# OpenCode. L4 allows TCP/443 destinations; it is not a hostname/TLS filter.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-worker-https-egress
  namespace: sre-agent
spec:
  endpointSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [investigator, proposer]
  egress:
    - toEntities: [world]
      toPorts:
        - ports:
            - port: '443'
              protocol: TCP
