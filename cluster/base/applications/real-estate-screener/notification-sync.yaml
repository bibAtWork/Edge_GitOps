apiVersion: batch/v1
kind: CronJob
metadata:
  name: screener-notification-sync
spec:
  schedule: '10,40 * * * *'
  timeZone: Europe/Berlin
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels:
            screener/worker: 'true'
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: notification-sync
            image: ghcr.io/bibatwork/real-estate-screener:v1.21.2@sha256:f8fd8a40a6c6d16b22205978bf5cb95cd129cd23eb0725a5e444f1f2b85bbebb
            imagePullPolicy: Always
            args: [notification-sync]
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits: {cpu: '1', memory: 512Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: screener-pg-app
                  key: uri
          initContainers:
          - name: migrate
            image: ghcr.io/bibatwork/real-estate-screener:v1.21.2@sha256:f8fd8a40a6c6d16b22205978bf5cb95cd129cd23eb0725a5e444f1f2b85bbebb
            args: [migrate]
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: screener-pg-app
                  key: uri
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: [ALL]
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
