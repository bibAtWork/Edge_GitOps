apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: screener-pg
  namespace: real-estate-screener
spec:
  instances: 1
  enablePDB: false
  stopDelay: 300
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15-minimal-bookworm@sha256:3181bfd1304928fb237d45d57fe61f05abd0e995d3e01e3cd383c3e5637057f3
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: recovery
  bootstrap:
    initdb:
      database: screener
      owner: screener
  storage:
    size: 10Gi
    storageClass: longhorn-db
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: '40'
      shared_buffers: 128MB
