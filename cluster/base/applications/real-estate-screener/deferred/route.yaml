apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: screener
  namespace: real-estate-screener
  annotations:
    gitops.homelab/auth: gateway-oidc
    gitops.homelab/auth-client: homelab-edge
spec:
  parentRefs:
  - name: homelab-gateway
    namespace: gateway-system
    sectionName: https
  hostnames:
  - screener.homelab.data-harness.org
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: screener-web
      port: 3000
