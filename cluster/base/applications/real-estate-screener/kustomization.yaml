apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: real-estate-screener
resources:
- namespace.yaml
- ../../secrets/ghcr-pull-secret.yaml
- recovery-object-store.yaml
- web.yaml
- collector.yaml
- macro.yaml
- house-indices.yaml
- etf-benchmark.yaml
- auctions.yaml
- access.yaml
configMapGenerator:
- name: screener-config
  files:
  - config/config.json
  - config/macro.config.json
