apiVersion: batch/v1
kind: CronJob
metadata:
  name: screener-house-indices
spec:
  schedule: 0 5 * * 0
  timeZone: Europe/Berlin
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: house-indices
            image: ghcr.io/bibatwork/real-estate-screener:v1.6.1@sha256:5826e326df6c9793b1adb8bd3c2969268db0a55ff4f1cebd7468d91dcfcda431
            imagePullPolicy: Always
            args:
            - house-index-sync
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: '1'
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: tmp
              mountPath: /tmp
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: screener-pg-app
                  key: uri
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
          initContainers:
          - name: migrate
            image: ghcr.io/bibatwork/real-estate-screener:v1.6.1@sha256:5826e326df6c9793b1adb8bd3c2969268db0a55ff4f1cebd7468d91dcfcda431
            args:
            - migrate
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: screener-pg-app
                  key: uri
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
        metadata:
          labels:
            screener/worker: 'true'
