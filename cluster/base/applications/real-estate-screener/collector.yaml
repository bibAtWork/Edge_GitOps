apiVersion: batch/v1
kind: CronJob
metadata:
  name: screener-collector
spec:
  schedule: '*/30 * * * *'
  timeZone: Europe/Berlin
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            kubernetes.io/arch: amd64
          imagePullSecrets:
          - name: ghcr-pull
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 120
          containers:
          - name: collector
            image: ghcr.io/bibatwork/real-estate-screener:v1.1.1@sha256:75ecf1b562312a4baa7ab8f0aed2c540a3be1a3b270ef9894b5b704c380476ef
            imagePullPolicy: Always
            args:
            - run
            - /config/config.json
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: '2'
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/node
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: screener-pg-app
                  key: uri
          volumes:
          - name: config
            configMap:
              name: screener-config
          - name: tmp
            emptyDir:
              sizeLimit: 1Gi
          - name: home
            emptyDir:
              sizeLimit: 256Mi
          initContainers:
          - name: migrate
            image: ghcr.io/bibatwork/real-estate-screener:v1.1.1@sha256:75ecf1b562312a4baa7ab8f0aed2c540a3be1a3b270ef9894b5b704c380476ef
            args:
            - migrate
            env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: screener-pg-app
                  key: uri
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
            volumeMounts:
            - name: tmp
              mountPath: /tmp
        metadata:
          labels:
            screener/worker: 'true'
