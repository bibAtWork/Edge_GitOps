apiVersion: apps/v1
kind: Deployment
metadata:
  name: screener-web
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: screener-web
  template:
    metadata:
      labels:
        app: screener-web
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '3000'
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
      imagePullSecrets:
      - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
      - name: web
        image: ghcr.io/bibatwork/real-estate-screener:v1.21.3@sha256:df1ef7b1452ddb07a862bf6895cde2af775ad9ec3a724d26c1f4e31e89fb6101
        imagePullPolicy: Always
        args:
        - serve
        ports:
        - name: http
          containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 2
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 15
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /health/checks
            port: http
          periodSeconds: 30
          timeoutSeconds: 15
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /config
          readOnly: true
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: screener-pg-app
              key: uri
        - name: SCREENER_CONFIG_PATH
          value: /config/config.json
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: config
        configMap:
          name: screener-config
      initContainers:
      - name: migrate
        image: ghcr.io/bibatwork/real-estate-screener:v1.21.3@sha256:df1ef7b1452ddb07a862bf6895cde2af775ad9ec3a724d26c1f4e31e89fb6101
        args:
        - migrate
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: screener-pg-app
              key: uri
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: tmp
          mountPath: /tmp
---
apiVersion: v1
kind: Service
metadata:
  name: screener-web
  labels:
    app: screener-web
spec:
  type: ClusterIP
  selector:
    app: screener-web
  ports:
  - name: http
    port: 3000
    targetPort: http
