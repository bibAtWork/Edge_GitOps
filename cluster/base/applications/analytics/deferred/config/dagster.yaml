storage:
  postgres:
    postgres_db:
      hostname: analytics-pg-rw.analytics.svc
      username: dagster
      password:
        env: PGPASSWORD
      db_name: dagster
      port: 5432
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 1
run_launcher:
  module: dagster_k8s
  class: K8sRunLauncher
  config:
    job_image: docker.io/library/python:3.12.12-slim-bookworm
    image_pull_policy: IfNotPresent
    job_namespace: analytics
    service_account_name: analytics-runner
    load_incluster_config: true
    dagster_home: /opt/dagster/home
    instance_config_map: dagster-config
    run_k8s_config:
      pod_template_spec_metadata:
        labels:
          app.kubernetes.io/name: analytics-run
          homelab.local/analytics-storage-client: 'true'
      pod_spec_config:
        automount_service_account_token: false
        security_context:
          run_as_non_root: true
          run_as_user: 1000
          run_as_group: 1000
          fs_group: 1000
          seccomp_profile:
            type: RuntimeDefault
          fs_group_change_policy: OnRootMismatch
        volumes:
        - name: ca
          secret:
            secretName: trino-tls
            items:
            - key: ca.crt
              path: ca.crt
        - name: pipeline-code
          configMap:
            name: analytics-code
            items:
            - key: definitions.py
              path: definitions.py
            - key: bootstrap.py
              path: bootstrap.py
            - key: install-runtime.sh
              path: install-runtime.sh
            - key: requirements.lock
              path: requirements.lock
            - key: requirements-control.lock
              path: requirements-control.lock
            - key: dbt_project.yml
              path: dbt/dbt_project.yml
            - key: profiles.yml
              path: dbt/profiles.yml
            - key: event_summary.sql
              path: dbt/models/event_summary.sql
            - key: schema.yml
              path: dbt/models/schema.yml
        - name: runtime
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
        init_containers:
        - name: install-dependencies
          image: docker.io/library/python:3.12.12-slim-bookworm
          command:
          - sh
          - /opt/analytics/install-runtime.sh
          env:
          - name: HOME
            value: /tmp
          - name: REQUIREMENTS_FILE
            value: /opt/analytics/requirements.lock
          volumeMounts:
          - name: pipeline-code
            mountPath: /opt/analytics
            readOnly: true
          - name: runtime
            mountPath: /opt/runtime
          - name: tmp
            mountPath: /tmp
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
              ephemeral-storage: 512Mi
            limits:
              cpu: '1'
              memory: 1Gi
              ephemeral-storage: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
      container_config:
        security_context:
          allow_privilege_escalation: false
          capabilities:
            drop:
            - ALL
          read_only_root_filesystem: true
        volume_mounts:
        - name: ca
          mountPath: /etc/analytics/tls
          readOnly: true
        - name: pipeline-code
          mountPath: /opt/analytics
          readOnly: true
        - name: runtime
          mountPath: /opt/runtime
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
            ephemeral-storage: 2Gi
        env:
        - name: PATH
          value: /opt/runtime/venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
        - name: PYTHONPATH
          value: /opt/analytics
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: HOME
          value: /tmp
        - name: DBT_TARGET_PATH
          value: /tmp/dbt/target
        - name: DBT_LOG_PATH
          value: /tmp/dbt/logs
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-dagster-db
              key: password
        - name: LAKEKEEPER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: analytics-oauth
              key: client-id
        - name: LAKEKEEPER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: analytics-oauth
              key: client-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: analytics-s3
              key: admin_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: analytics-s3
              key: admin_secret_access_key
        - name: TRINO_DBT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-trino-client
              key: dbt-password
      job_spec_config:
        ttl_seconds_after_finished: 3600
compute_logs:
  module: dagster.core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager
local_artifact_storage:
  module: dagster._core.storage.root
  class: LocalArtifactStorage
  config:
    base_dir: /tmp/dagster-storage
telemetry:
  enabled: false
