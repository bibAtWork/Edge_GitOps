apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-controller
  namespace: analytics

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: analytics-runner
  namespace: analytics
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: analytics-controller
  namespace: analytics
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ''
  resources:
  - pods
  - pods/log
  verbs:
  - get
  - list
  - watch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: analytics-controller
  namespace: analytics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: analytics-controller
subjects:
- kind: ServiceAccount
  name: analytics-controller
  namespace: analytics

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  namespace: analytics
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dagster-webserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagster-webserver
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dagster-webserver
        image: ghcr.io/bibatwork/edge-analytics:analytics-v1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        env:
        - name: PGHOST
          value: analytics-pg-rw.analytics.svc
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: dagster
        - name: PGUSER
          value: dagster
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-dagster-db
              key: password
        - name: DAGSTER_HOME
          value: /opt/dagster/home
        - name: DAGSTER_CURRENT_IMAGE
          value: ghcr.io/bibatwork/edge-analytics:analytics-v1
        volumeMounts:
        - name: config
          mountPath: /opt/dagster/home
          readOnly: true
        command:
        - dagster-webserver
        - -h
        - 0.0.0.0
        - -p
        - '3000'
        - -w
        - /opt/dagster/home/workspace.yaml
        ports:
        - name: http
          containerPort: 3000
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: config
        configMap:
          name: dagster-config
      serviceAccountName: analytics-controller

