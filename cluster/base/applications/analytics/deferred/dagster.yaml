---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-code
  namespace: analytics
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dagster-code
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dagster-code
        homelab.local/analytics-storage-client: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dagster-code
        image: ghcr.io/bibatwork/edge-analytics:analytics-v1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        env:
        - name: PGHOST
          value: analytics-pg-rw.analytics.svc
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: dagster
        - name: PGUSER
          value: dagster
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-dagster-db
              key: password
        - name: DAGSTER_HOME
          value: /opt/dagster/home
        - name: DAGSTER_CURRENT_IMAGE
          value: ghcr.io/bibatwork/edge-analytics:analytics-v1
        volumeMounts:
        - name: config
          mountPath: /opt/dagster/home
          readOnly: true
        command:
        - dagster
        - api
        - grpc
        - -h
        - 0.0.0.0
        - -p
        - '3030'
        - -m
        - definitions
        ports:
        - name: grpc
          containerPort: 3030
        readinessProbe:
          tcpSocket:
            port: grpc
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: grpc
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: config
        configMap:
          name: dagster-config

---
apiVersion: v1
kind: Service
metadata:
  name: dagster-webserver
  namespace: analytics
spec:
  selector:
    app.kubernetes.io/name: dagster-webserver
  ports:
  - name: http
    port: 3000
    targetPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: dagster-code
  namespace: analytics
spec:
  selector:
    app.kubernetes.io/name: dagster-code
  ports:
  - name: http
    port: 3030
    targetPort: 3030
