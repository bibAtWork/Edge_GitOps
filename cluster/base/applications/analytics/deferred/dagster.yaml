        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: dagster-daemon
        image: ghcr.io/bibatwork/edge-analytics:analytics-v1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 768Mi
        env:
        - name: PGHOST
          value: analytics-pg-rw.analytics.svc
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: dagster
        - name: PGUSER
          value: dagster
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: analytics-dagster-db
              key: password
        - name: DAGSTER_HOME
          value: /opt/dagster/home
        - name: DAGSTER_CURRENT_IMAGE
          value: ghcr.io/bibatwork/edge-analytics:analytics-v1
