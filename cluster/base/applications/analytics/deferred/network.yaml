apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: analytics-postgres
  namespace: analytics
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: analytics-pg
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: lakekeeper
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: lightdash
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: dagster-webserver
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: dagster-daemon
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: dagster-code
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: analytics-run
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: cnpg-system
    toPorts:
    - ports:
      - port: '8000'
        protocol: TCP
      - port: '5432'
        protocol: TCP
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        cnpg.io/cluster: analytics-pg
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
      - port: '6443'
        protocol: TCP

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-analytics-s3
  namespace: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        homelab.local/analytics-storage-client: 'true'
    toPorts:
    - ports:
      - port: '8333'
        protocol: TCP
  egress: []

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-analytics-token
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      app: keycloak
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: trino
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: analytics-run
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
      rules:
        http:
        - method: POST
          path: /realms/homelab/protocol/openid-connect/token
  egress: []
