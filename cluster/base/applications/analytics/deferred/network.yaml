apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: analytics-trino
  namespace: analytics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: trino
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: lightdash
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: analytics-run
    toPorts:
    - ports:
      - port: '8443'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: lakekeeper
    toPorts:
    - ports:
      - port: '8181'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: keycloak
        app: keycloak
    toPorts:
    - ports:
      - port: '8080'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: seaweedfs
        app.kubernetes.io/name: seaweedfs
    toPorts:
    - ports:
      - port: '8333'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
      rules:
        dns:
        - matchPattern: '*'

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: analytics-lakekeeper
  namespace: analytics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: lakekeeper
  ingress:
  - fromEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: trino
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        app.kubernetes.io/name: analytics-run
    toPorts:
    - ports:
      - port: '8181'
        protocol: TCP
  egress:
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: analytics
        cnpg.io/cluster: analytics-pg
    toPorts:
    - ports:
      - port: '5432'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: seaweedfs
        app.kubernetes.io/name: seaweedfs
    toPorts:
    - ports:
      - port: '8333'
        protocol: TCP
  - toFQDNs:
    - matchName: keycloak.homelab.data-harness.org
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP
  - toEndpoints:
    - matchLabels:
        io.kubernetes.pod.namespace: kube-system
        k8s-app: kube-dns
    toPorts:
    - ports:
      - port: '53'
        protocol: ANY
      rules:
        dns:
        - matchPattern: '*'
  - toEntities:
    - ingress
    toPorts:
    - ports:
      - port: '443'
        protocol: TCP

