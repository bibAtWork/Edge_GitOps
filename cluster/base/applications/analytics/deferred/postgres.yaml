apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: analytics-pg
  namespace: analytics
spec:
  instances: 1
  enablePDB: false
  stopDelay: 300
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15
  bootstrap:
    initdb:
      database: lakekeeper
      owner: lakekeeper
      postInitApplicationSQL:
      - CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
      - CREATE EXTENSION IF NOT EXISTS pgcrypto;
      - CREATE EXTENSION IF NOT EXISTS pg_trgm;
      - CREATE EXTENSION IF NOT EXISTS btree_gin;
      - CREATE EXTENSION IF NOT EXISTS btree_gist;
  managed:
    roles:
    - name: lightdash
      ensure: present
      login: true
      passwordSecret:
        name: analytics-lightdash-db
    - name: dagster
      ensure: present
      login: true
      passwordSecret:
        name: analytics-dagster-db
  storage:
    size: 10Gi
    storageClass: longhorn-db
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  postgresql:
    parameters:
      max_connections: '100'
      shared_buffers: 128MB

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lightdash
  namespace: analytics
spec:
  name: lightdash
  owner: lightdash
  cluster:
    name: analytics-pg

---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: dagster
  namespace: analytics
spec:
  name: dagster
  owner: dagster
  cluster:
    name: analytics-pg
