apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  namespace: analytics
data:
  config.properties: 'coordinator=true

    node-scheduler.include-coordinator=true

    http-server.http.port=8080

    http-server.https.enabled=true

    http-server.https.port=8443

    http-server.https.keystore.path=/etc/trino/tls/server.pem

    http-server.authentication.type=PASSWORD

    internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}

    discovery.uri=http://localhost:8080

    query.max-memory=2GB

    query.max-memory-per-node=2GB

    memory.heap-headroom-per-node=1GB

    '
  node.properties: 'node.environment=homelab

    node.data-dir=/data/trino

    '
  jvm.config: '-server

    -Xmx4G

    -XX:+UseG1GC

    -XX:+ExitOnOutOfMemoryError

    -XX:+HeapDumpOnOutOfMemoryError

    -XX:HeapDumpPath=/data/trino

    -Djdk.attach.allowAttachSelf=true

    '
  password-authenticator.properties: 'password-authenticator.name=file

    file.password-file=/etc/trino/auth/password.db

    '
  access-control.properties: 'access-control.name=opa

    opa.policy.uri=http://opa.security.svc:8181/v1/data/analytics_trino/allow

    opa.policy.row-filters-uri=http://opa.security.svc:8181/v1/data/analytics_trino/row_filters


    '

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-catalog
  namespace: analytics
data:
  iceberg.properties: 'connector.name=iceberg

    iceberg.catalog.type=rest

    iceberg.rest-catalog.uri=http://lakekeeper.analytics.svc:8181/catalog

    iceberg.rest-catalog.warehouse=analytics

    iceberg.rest-catalog.security=OAUTH2

    iceberg.rest-catalog.oauth2.credential=${ENV:LAKEKEEPER_CLIENT_ID}:${ENV:LAKEKEEPER_CLIENT_SECRET}

    iceberg.rest-catalog.oauth2.server-uri=http://keycloak.keycloak.svc/realms/homelab/protocol/openid-connect/token

    iceberg.rest-catalog.oauth2.scope=lakekeeper

    iceberg.rest-catalog.vended-credentials-enabled=false

    fs.s3.enabled=true

    s3.endpoint=http://seaweedfs-s3.seaweedfs.svc:8333

    s3.region=us-east-1

    s3.path-style-access=true

    s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}

    s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

    '

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trino
  namespace: analytics
  annotations:
    reloader.stakater.com/auto: 'true'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        homelab.local/analytics-storage-client: 'true'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: trino
        image: docker.io/trinodb/trino:483
        securityContext: &id001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: '2'
            memory: 6Gi
          limits:
            memory: 6Gi
            cpu: '2'
        env:
        - name: TRINO_INTERNAL_SECRET
          valueFrom:
            secretKeyRef:
              name: analytics-runtime
              key: trino-internal-secret
        - name: LAKEKEEPER_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: analytics-oauth
              key: client-id
        - name: LAKEKEEPER_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: analytics-oauth
              key: client-secret
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: analytics-s3
              key: admin_access_key_id
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: analytics-s3
              key: admin_secret_access_key
        volumeMounts:
        - name: config
          mountPath: /etc/trino
          readOnly: true
        - name: catalog
          mountPath: /etc/trino/catalog
          readOnly: true
        - name: auth
          mountPath: /etc/trino/auth
          readOnly: true
        - name: tls
          mountPath: /etc/trino/tls
          readOnly: true
        - name: data
          mountPath: /data/trino
        command:
        - /usr/lib/trino/bin/run-trino
        ports:
        - name: https
          containerPort: 8443
        readinessProbe:
          tcpSocket:
            port: https
          periodSeconds: 10
        startupProbe:
          tcpSocket:
            port: https
          periodSeconds: 5
          failureThreshold: 60
      volumes:
      - name: config
        configMap:
          name: trino-config
      - name: catalog
        configMap:
          name: trino-catalog
      - name: auth
        secret:
          secretName: analytics-trino
      - name: certs
        secret:
          secretName: trino-tls
      - name: tls
        emptyDir: {}
      - name: data
        emptyDir:
          sizeLimit: 2Gi
      initContainers:
      - name: tls-pem
        image: docker.io/library/busybox:1.38
        command:
        - sh
        - -ec
        - cat /certs/tls.crt /certs/tls.key > /tls/server.pem; chmod 600 /tls/server.pem
        securityContext: *id001
        volumeMounts:
        - name: certs
          mountPath: /certs
          readOnly: true
        - name: tls
          mountPath: /tls
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 32Mi

---
apiVersion: v1
kind: Service
metadata:
  name: trino
  namespace: analytics
spec:
  selector:
    app.kubernetes.io/name: trino
  ports:
  - name: http
    port: 8443
    targetPort: 8443
