apiVersion: v1
kind: Namespace
metadata:
  name: analytics
  labels:
    homelab.local/application: 'true'
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    homelab.local/recovery: persistent
    homelab.local/recovery-reason: Analytics metadata is on Longhorn; recovery integration
      is required before storing irreplaceable data.
