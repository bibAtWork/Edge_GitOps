apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cao-sre
  namespace: cao-sre
  annotations:
    gitops.homelab/auth: gateway-oidc
    gitops.homelab/auth-client: homelab-edge
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - cao-sre.homelab.data-harness.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cao-sre
          port: 9889
