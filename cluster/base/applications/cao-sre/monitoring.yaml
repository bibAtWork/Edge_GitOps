apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cao-sre
  namespace: cao-sre
spec:
  selector:
    matchLabels:
      app: cao-sre
  endpoints:
    - port: metrics
      path: /metrics
      relabelConfigs:
        - targetLabel: job
          replacement: cao-sre
