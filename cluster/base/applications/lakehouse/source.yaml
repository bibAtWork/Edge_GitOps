apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/bibAtWork/lakehouse
  ref:
    branch: main
    commit: 2fd93dfaace1db609a392062b247baac2c45f8b5
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  targetNamespace: lakehouse
  sourceRef:
    kind: GitRepository
    name: lakehouse-code
