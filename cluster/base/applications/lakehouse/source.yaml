apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/bibAtWork/lakehouse
  ref:
    branch: main
    commit: eb9b9e7ca3074960134c4b2f5e7ab4af7f81161d
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  targetNamespace: lakehouse
  sourceRef:
    kind: GitRepository
    name: lakehouse-code
