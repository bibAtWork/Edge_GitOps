apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/bibAtWork/lakehouse
  ref:
    branch: main
    commit: f9796bf9cd58e84e15b4cb8dcd39c3d3d68a0bb7
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  targetNamespace: lakehouse
  sourceRef:
    kind: GitRepository
    name: lakehouse-code
