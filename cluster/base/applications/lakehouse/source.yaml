apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/bibAtWork/lakehouse
  ref:
    branch: main
    commit: 51ded7e2f002959d72c44ff5d872916e92c43b04
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  targetNamespace: lakehouse
  sourceRef:
    kind: GitRepository
    name: lakehouse-code
