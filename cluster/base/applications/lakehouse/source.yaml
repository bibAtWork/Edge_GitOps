apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  url: https://github.com/bibAtWork/lakehouse
  ref:
    branch: main
    commit: cb64a194599cd3bf3ee7ca006b6c331385356111
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lakehouse-code
  namespace: flux-system
spec:
  interval: 10m
  path: ./
  prune: true
  targetNamespace: lakehouse
  sourceRef:
    kind: GitRepository
    name: lakehouse-code
