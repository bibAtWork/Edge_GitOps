apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-lakehouse-oidc-secret
  namespace: keycloak
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: lakehouse
  to:
    - group: ''
      kind: Secret
      name: keycloak-edge-oidc
