apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-canary
  namespace: platform-canary
  annotations:
    # How this route authenticates -- checked against Keycloak, the
    # SecurityPolicies and OPA by scripts/check-platform-contracts.py.
    gitops.homelab/auth: gateway-oidc
    gitops.homelab/auth-client: homelab-edge
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - canary.homelab.data-harness.org
  rules:
    - backendRefs:
        - name: platform-canary
          port: 8080
