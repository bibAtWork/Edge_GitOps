apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: platform-canary
  namespace: platform-canary
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - canary.homelab.data-harness.org
  rules:
    - backendRefs:
        - name: platform-canary
          port: 8080
