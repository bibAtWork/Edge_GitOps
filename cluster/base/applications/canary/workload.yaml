apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-canary
  namespace: platform-canary
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-canary
  namespace: platform-canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-canary
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-canary
    spec:
      serviceAccountName: platform-canary
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: docker.io/library/python:3.14.7-alpine
          command: [python, /app/app.py]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SERVICE_NAME
              value: platform-canary
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: application
              mountPath: /app
              readOnly: true
      volumes:
        - name: application
          configMap:
            name: platform-canary-app
---
apiVersion: v1
kind: Service
metadata:
  name: platform-canary
  namespace: platform-canary
spec:
  selector:
    app.kubernetes.io/name: platform-canary
  ports:
    - name: http
      port: 8080
      targetPort: http
