# DNS, HTTPS egress, Gateway ingress and OTLP are supplied by shared platform
# policies. This standard NetworkPolicy selects both directions without adding
# an allow rule, so every additional path remains an explicit opt-in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-canary-isolation
  namespace: platform-canary
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
