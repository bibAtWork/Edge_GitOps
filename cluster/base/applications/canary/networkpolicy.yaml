# DNS, HTTPS egress, Gateway ingress and OTLP are supplied by shared platform
# policies. This standard NetworkPolicy selects both directions without adding
# an allow rule, so every additional path remains an explicit opt-in.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-canary-isolation
  namespace: platform-canary
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# The public Gateway VIP is inside the LAN CIDR, and Cilium evaluates its
# service flow after translating it to the Envoy backend. Permit only the
# synthetic probe to reach that proxy on its TLS target port.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: platform-canary-synthetic-gateway
  namespace: platform-canary
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: platform-canary-synthetic
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: proxy
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
