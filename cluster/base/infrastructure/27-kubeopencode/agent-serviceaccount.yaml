# Required by the KubeOpenCode chart's Agent CRD (spec.serviceAccountName) but
# NOT created by the chart itself — see values.yaml's own note under `agent:`.
# No Role/RoleBinding attached: the agent doesn't need cluster read access for its
# core function; cluster introspection is provided exclusively via the kubernetes-mcp-server
# MCP tool, not this ServiceAccount's own Kubernetes API permissions.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubeopencode-agent
  namespace: kubeopencode-system
