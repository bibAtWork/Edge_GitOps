apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: kubeopencode-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kubernetes-mcp-server
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: kubernetes-mcp-server
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    serviceAccount:
      create: true
      name: mcp-viewer

    # Chart creates NO RBAC by default (templates/rbac.yaml is purely user-driven) —
    # this is the entire read-only surface for cluster introspection: get/list/watch
    # only, no mutating verbs, no pods/exec or pods/attach.
    #
    # Security review 2026-08-14, finding H1: this previously used
    # resources: ["*"], which — combined across all four apiGroups below — grants
    # get/list/watch on secrets cluster-wide. "Read-only" is true but misleading:
    # read-only access to every credential in the cluster is a full compromise of
    # every downstream service those credentials reach, and this is the tool
    # surface exposed to an LLM agent, so prompt-injection against content it
    # reads is a realistic path to exfiltrating them. RBAC has no "all resources
    # except X" syntax, so the fix is an explicit enumeration — every resource
    # actually present in these four API groups (checked live via
    # `kubectl api-resources`), secrets excluded, rather than a narrower guess at
    # what the MCP tool might need. If a real gap turns up in practice, add the
    # specific resource back with its own justification rather than reaching for
    # the wildcard again.
    rbac:
      create: true
      extraClusterRoles:
        - name: readonly
          rules:
            - apiGroups: [""]
              resources:
                - bindings
                - componentstatuses
                - configmaps
                - endpoints
                - events
                - limitranges
                - namespaces
                - nodes
                - persistentvolumeclaims
                - persistentvolumes
                - pods
                - podtemplates
                - replicationcontrollers
                - resourcequotas
                - serviceaccounts
                - services
              verbs: ["get", "list", "watch"]
            - apiGroups: ["apps"]
              resources:
                - controllerrevisions
                - daemonsets
                - deployments
                - replicasets
                - statefulsets
              verbs: ["get", "list", "watch"]
            - apiGroups: ["batch"]
              resources:
                - cronjobs
                - jobs
              verbs: ["get", "list", "watch"]
            - apiGroups: ["networking.k8s.io"]
              resources:
                - ingressclasses
                - ingresses
                - ipaddresses
                - networkpolicies
                - servicecidrs
              verbs: ["get", "list", "watch"]
      extraClusterRoleBindings:
        - name: readonly
          roleRef:
            name: readonly

    # Defense in depth alongside the RBAC restriction above: only expose
    # tools annotated readOnlyHint=true.
    config:
      read_only: true

    service:
      type: ClusterIP
      port: 8080

    # Internal only — reached from the KubeOpenCode pod via CiliumNetworkPolicy,
    # never exposed externally.
    ingress:
      enabled: false
    httpRoute:
      enabled: false
