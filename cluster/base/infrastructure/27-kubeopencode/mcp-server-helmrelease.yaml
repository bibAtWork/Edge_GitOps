apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubernetes-mcp-server
  namespace: kubeopencode-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kubernetes-mcp-server
      version: 0.1.0
      sourceRef:
        kind: HelmRepository
        name: kubernetes-mcp-server
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Security review 2026-08-14, finding M1 (partial): chart default is
    # quay.io/containers/kubernetes_mcp_server:latest — floating, unpinned, and
    # not scanned as a specific version by the Trivy CVE gate (Renovate can't
    # open a PR against a tag that never changes). v0.0.66 is the newest tagged
    # release as of 2026-08-17; Renovate's `docker` datasource will now track
    # and PR version bumps the same as every other pinned image in this repo.
    image:
      version: v0.0.66

    serviceAccount:
      create: true
      name: mcp-viewer

    # Chart creates NO RBAC by default (templates/rbac.yaml is purely user-driven) —
    # this is the entire read-only surface for cluster introspection: get/list/watch
    # only, no mutating verbs, no pods/exec or pods/attach.
    rbac:
      create: true
      extraClusterRoles:
        - name: readonly
          rules:
            - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
              resources: ["*"]
              verbs: ["get", "list", "watch"]
      extraClusterRoleBindings:
        - name: readonly
          roleRef:
            name: readonly

    # Defense in depth alongside the RBAC restriction above: only expose
    # tools annotated readOnlyHint=true.
    config:
      read_only: true

    service:
      type: ClusterIP
      port: 8080

    # Internal only — reached from the KubeOpenCode pod via CiliumNetworkPolicy,
    # never exposed externally.
    ingress:
      enabled: false
    httpRoute:
      enabled: false
