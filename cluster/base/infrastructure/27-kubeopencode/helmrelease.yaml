apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubeopencode
  namespace: kubeopencode-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kubeopencode
      version: 0.1.9
      sourceRef:
        kind: HelmRepository
        name: kubeopencode
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Security review 2026-08-14, finding M1 (partial): unset, this defaults to a
    # built-in :latest reference for the git-init/context-init containers every
    # Agent pod runs (confirmed live — rendered context-init container was
    # ghcr.io/kubeopencode/kubeopencode:latest even though controller/server
    # already pin v0.1.9 via chart.spec.version above). Pinned to match.
    kubeopencodeConfig:
      systemImage:
        image: ghcr.io/kubeopencode/kubeopencode:v0.1.9

    # The chart's own podSecurityContext defaults (runAsNonRoot only) don't satisfy
    # this namespace's restricted PSS enforcement, which also requires seccompProfile
    # set at pod or container level. kubernetes-mcp-server's chart sets this by
    # default; kubeopencode's doesn't, so it's added explicitly here for both
    # workloads the chart creates.
    controller:
      # Scaled to zero: parked, not running-and-broken.
      #
      # The controller builds a cluster-wide informer cache at startup and
      # cannot establish a Secret watch, because none of the kubeopencode
      # ClusterRoles grants any rule on secrets -- confirmed with `kubectl auth
      # can-i list secrets --all-namespaces` as its ServiceAccount, which
      # answers no. controller-runtime times out and the manager aborts, so it
      # had restarted 590 times over three days:
      #
      #   Timeout: failed waiting for *v1.Secret Informer to sync
      #
      # docs/backlog.md carries this as parked. Parked and crash-looping are
      # not the same thing: a CrashLoopBackOff generates events, burns kubelet
      # cycles and sits in every "what is unhealthy" check for ever, which
      # trains you to ignore that list. Zero replicas says the same thing and
      # stays quiet.
      #
      # The fix is upstream -- kubeopencode/kubeopencode#298 adds
      # --watch-namespaces so the informer can be scoped rather than demanding
      # cluster-wide Secret read. Granting that read is the alternative, and a
      # poor one for an LLM-agent tool this repo's own security review flags as
      # prompt-injection surface.
      #
      # The server is unaffected and still runs: it serves the UI and is what
      # the Gateway SecurityPolicy authenticates. Anything driven by the
      # controller -- CronTask, AgentTemplate, Task reconciliation -- does not
      # work, and did not work before this change either.
      # `replicas`, not `replicaCount`. This chart uses the former; setting
      # replicaCount was accepted into the HelmRelease and silently ignored by
      # the template, leaving the Deployment at 1 and the controller still
      # crash-looping while the values block claimed otherwise. Verified by
      # watching spec.replicas actually reach 0.
      replicas: 0
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    server:
      auth:
        enabled: true
        allowAnonymous: false
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # No server.ingress here — exposed via HTTPRoute (config/httproute.yaml) on the
      # shared homelab-gateway, same pattern as grafana/paperless/immich.

  # Security review 2026-08-14, finding C1: the chart's kubeopencode-server
  # ClusterRole grants unrestricted impersonate on users/groups/serviceaccounts
  # (includes system:masters -> full cluster-admin) plus cluster-wide secrets
  # read, from the upstream chart defaults (v0.1.9), not anything this repo asked
  # for. Verified 2026-08-16 that impersonation backs no feature this deployment
  # uses (no "run as the logged-in user" functionality is exposed) — confirmed by
  # removing it and testing the app end to end, not just by inspection. Cluster
  # -wide secrets read is dropped for the same reason: a code-task-execution tool
  # has no legitimate need to read every Secret in the cluster, and that grant
  # was never separately justified by the chart's own docs.
  #
  # Left alone deliberately: pods/get,list, pods/log/get, pods/exec/create. These
  # look like the tool's actual core mechanism (agents execute tasks by running
  # commands in pods it manages) rather than incidental over-grant, and dropping
  # them was not verified safe the way impersonation and secrets access were.
  #
  # A strategic-merge patch replaces the whole rules array (Kubernetes has no
  # merge key for ClusterRole.rules, so a partial patch would append rather than
  # remove) with the same 15 rules from the chart, minus these two.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: kubeopencode-server
            patch: |
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: kubeopencode-server
              rules:
                - apiGroups: ["kubeopencode.io"]
                  resources: ["tasks", "crontasks", "agents", "agenttemplates", "kubeopencodeconfigs", "registries"]
                  verbs: ["get", "list", "watch"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["registries"]
                  verbs: ["create", "update", "delete"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["tasks"]
                  verbs: ["create", "update", "delete", "patch"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["crontasks"]
                  verbs: ["create", "update", "delete", "patch"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["agents"]
                  verbs: ["create", "update", "patch", "delete"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["agenttemplates"]
                  verbs: ["create", "update", "delete"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["kubeopencodeconfigs"]
                  verbs: ["update"]
                - apiGroups: [""]
                  resources: ["pods"]
                  verbs: ["get", "list"]
                - apiGroups: [""]
                  resources: ["pods/log"]
                  verbs: ["get"]
                - apiGroups: [""]
                  resources: ["pods/exec"]
                  verbs: ["create"]
                - apiGroups: [""]
                  resources: ["namespaces"]
                  verbs: ["get", "list"]
                - apiGroups: [""]
                  resources: ["events"]
                  verbs: ["create", "patch"]
                - apiGroups: ["authentication.k8s.io"]
                  resources: ["tokenreviews"]
                  verbs: ["create"]
                # Removed vs. chart default: secrets (get/list/watch, cluster-wide)
                # and impersonate on users/groups/serviceaccounts. See comment above.

          # Security review 2026-08-14, finding M2: kubeopencode-controller's
          # ClusterRole grants cluster-wide (any namespace) create/update/patch/delete
          # on secrets, pods, services, deployments, and PVCs, plus full CRUD on
          # coordination.k8s.io/leases -- bound cluster-wide via a ClusterRoleBinding.
          # tasks.kubeopencode.io (and every other kubeopencode.io CRD) is namespace-
          # scoped, and nothing -- no admission webhook, no controller-side check --
          # stops a Task from being created in any namespace. Verified live: the
          # controller binary (`kubeopencode controller --help`) exposes no
          # namespace-scoping flag at all, and its only existing lease
          # (leader-election) has only ever lived in kubeopencode-system. So the
          # cluster-wide grant on these five resource types was never load-bearing --
          # it's blast radius, not function: today it means a Task placed in, say,
          # kube-system or cattle-system could make this controller create or delete
          # Secrets/Pods/Services/Deployments there.
          #
          # kubeopencode.io CRD rules (get/list/watch/create/update/patch/delete on
          # the CRs themselves, their /status, and /finalizers) stay on this
          # ClusterRole -- the controller has no per-namespace watch/cache option, so
          # cluster-wide List/Watch on Tasks is how it discovers work in whichever
          # namespace kubeopencode-server creates them in, not itself a privilege
          # issue since these are the product's own namespaced CRs. The five
          # dangerous resource types move to a namespace-scoped Role bound only in
          # kubeopencode-system (controller-rbac.yaml in this directory), matching
          # where their owning Task CRs actually live today.
          - target:
              kind: ClusterRole
              name: kubeopencode-controller
            patch: |
              apiVersion: rbac.authorization.k8s.io/v1
              kind: ClusterRole
              metadata:
                name: kubeopencode-controller
              rules:
                - apiGroups: ["kubeopencode.io"]
                  resources: ["agents", "agenttemplates", "contexts", "cronworkflows", "crontasks", "kubeopencodeconfigs", "registries", "tasks", "webhooktriggers", "workflows", "workflowruns"]
                  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["agents/status", "agenttemplates/status", "contexts/status", "cronworkflows/status", "crontasks/status", "kubeopencodeconfigs/status", "registries/status", "tasks/status", "webhooktriggers/status", "workflows/status", "workflowruns/status"]
                  verbs: ["get", "update", "patch"]
                - apiGroups: ["kubeopencode.io"]
                  resources: ["tasks/finalizers", "crontasks/finalizers", "agents/finalizers", "agenttemplates/finalizers", "registries/finalizers"]
                  verbs: ["update"]
                # Cluster-scope READ ONLY on the types controller-runtime builds
                # informers for. This is not a rollback of finding M2 -- every
                # mutating verb stays namespace-scoped in controller-rbac.yaml,
                # which is what M2 was actually about (cluster-wide create/
                # update/patch/delete on secrets, pods, services, deployments
                # and PVCs).
                #
                # Why it is required: controller-runtime caches via informers
                # that LIST/WATCH at CLUSTER scope. A namespaced Role can never
                # satisfy that, so the manager fails with "timed out waiting for
                # cache to be synced for Kind *v1alpha1.AgentTemplate" and
                # crash-loops. This comment block's own note above -- "the
                # controller has no per-namespace watch/cache option" -- is
                # exactly why read has to be cluster-scoped.
                #
                # This was a latent break, not a live one: the running process
                # had already built its cache before M2 narrowed the rules, so
                # it kept working and would have failed on its NEXT restart
                # whenever that happened. Surfaced 2026-08-18 when the
                # kube-apiserver restarted for the OIDC change and forced a
                # cache re-sync; the controller then could not recover and its
                # Agent stopped reconciling (observedGeneration stuck behind
                # generation). Confirmed live in the controller log:
                #   configmaps is forbidden: User "system:serviceaccount:
                #   kubeopencode-system:kubeopencode-controller" cannot list
                #   resource "configmaps" in API group "" at the cluster scope
                #
                # secrets are deliberately NOT included: cluster-wide secret
                # read is a genuine escalation, and the controller only needs
                # secrets in its own namespace, which controller-rbac.yaml
                # already grants.
                - apiGroups: [""]
                  resources: ["configmaps", "pods", "services", "persistentvolumeclaims"]
                  verbs: ["get", "list", "watch"]
                - apiGroups: ["apps"]
                  resources: ["deployments"]
                  verbs: ["get", "list", "watch"]
                # Still namespace-scoped in controller-rbac.yaml: every mutating
                # verb on the above, plus secrets, events and leases entirely.
