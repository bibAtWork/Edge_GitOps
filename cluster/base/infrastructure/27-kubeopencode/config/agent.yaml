# Requires the kubeopencode.io CRDs installed by the bootstrap-layer HelmRelease
# (../helmrelease.yaml) — hence this lives in the config layer, applied by Flux only
# after the bootstrap Kustomization reports healthy. See cluster/overlays/1-node-config.
apiVersion: kubeopencode.io/v1alpha1
kind: Agent
metadata:
  name: default
  namespace: kubeopencode-system
spec:
  profile: "General-purpose homelab operations agent"
  workspaceDir: /workspace
  serviceAccountName: kubeopencode-agent
  # Security review 2026-08-14, finding M1 (partial): unset, these three default
  # to :latest (ghcr.io/kubeopencode/kubeopencode-agent-{opencode,devbox,attach)
  # — floating tags the Trivy CVE gate never scans a specific version of, and
  # Renovate can't PR a version bump for. Pinned to v0.1.9 to match the chart
  # version already pinned for the controller/server images above.
  agentImage: ghcr.io/kubeopencode/kubeopencode-agent-opencode:v0.1.9
  executorImage: ghcr.io/kubeopencode/kubeopencode-agent-devbox:v0.1.9
  attachImage: ghcr.io/kubeopencode/kubeopencode-agent-attach:v0.1.9
  config:
    $schema: https://opencode.ai/config.json
    # Free OpenCode Zen model — no API key/credentials required.
    model: opencode/big-pickle
    share: disabled
    autoupdate: false
    mcp:
      kubernetes:
        type: remote
        url: http://kubernetes-mcp-server.kubeopencode-system.svc.cluster.local:8080/sse
  persistence:
    sessions:
      size: "1Gi"
      # Migrated to SeaweedFS CSI (2026-08-18). Unlike the other migrations
      # this one sets storageClassName directly rather than using an
      # existingClaim: the PVC is created and owned by the Agent controller
      # (ownerReference kubeopencode.io/v1alpha1 Agent), so it is not ours to
      # point elsewhere. Contents are agent session scratch, recreated as
      # needed, so no data copy is required.
      storageClassName: seaweedfs-storage
  # The chart's own default agent-container securityContext (allowPrivilegeEscalation:
  # false, drop ALL capabilities, seccompProfile RuntimeDefault — see security.md)
  # doesn't set runAsNonRoot, so it fails this namespace's restricted PSS enforcement.
  # Set at pod level (podSecurityContext) rather than per-container (securityContext)
  # so it also covers the openCodeInit/contextInit init containers, which don't
  # inherit a container-level override.
  podSpec:
    podSecurityContext:
      runAsNonRoot: true
      # Required because the agent images have no USER directive (default to root) —
      # runAsNonRoot alone can't be verified against an image with no declared UID.
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
