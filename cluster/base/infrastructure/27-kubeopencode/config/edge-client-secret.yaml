# Shared edge-auth client secret, copy for the kubeopencode-system namespace.
#
# Envoy Gateway resolves SecurityPolicy.oidc.clientSecret from the policy's own
# namespace, so every namespace holding an edge-gated app needs this value.
# Same secret, same Keycloak client (homelab-edge) -- see
# 26-keycloak/edge-client-secret.yaml for why one shared client is used and
# what the wildcard redirect trades away.
#
# All copies must carry the same value. Rotating means rotating every copy
# together; rotate the keycloak/ one first, since that is what config-cli
# pushes into Keycloak.
