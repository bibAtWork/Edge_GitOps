# Real per-user Keycloak login for KubeOpenCode. Same rationale and mechanism
# as 05-cilium/config/hubble-securitypolicy.yaml — see that file's comment for
# the full explanation of forwardAccessToken and why no OPA Rego change is
# needed, AND for why the extAuth block below is mandatory here (Envoy
# Gateway's SecurityPolicy attachment is REPLACE not MERGE at the per-route
# level — 28-envoy-gateway/config/securitypolicy.yaml's Gateway-scoped extAuth
# does not apply once a route has its own SecurityPolicy).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kubeopencode-oidc
  namespace: kubeopencode-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kubeopencode
  oidc:
    provider:
      issuer: https://keycloak.homelab.data-harness.org/realms/homelab
      authorizationEndpoint: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/auth
      tokenEndpoint: http://keycloak.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/token
      backendRefs:
        - group: ""
          kind: Service
          name: keycloak
          namespace: keycloak
          port: 80
    # Shared edge client, not a per-app one. homelab-edge covers every
    # app gated at the Gateway rather than by its own OIDC integration, via
    # a wildcard redirect URI -- so adding an edge-gated app needs no
    # Keycloak change, just this policy and a copy of the secret.
    clientID: homelab-edge
    clientSecret:
      name: keycloak-edge-oidc
    forwardAccessToken: true
    # groups: ADR-002 -- see 05-cilium/config/hubble-securitypolicy.yaml's
    # comment for the full rationale, and 24-opa/configmap.yaml for the
    # policy that now reads it.
    scopes:
      - openid
      - email
      - groups
  extAuth:
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: opa
          namespace: security
          port: 9191
