apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: vmstack
      namespace: monitoring
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    service:
      appProtocol: kubernetes.io/http
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Keep downloaded dashboards/plugins ephemeral so deleted Git entries cannot
    # linger on disk. Persist only Grafana's database and alert notification state.
    # Local-path preserves the monitor's independence from Longhorn failures.
    persistence:
      enabled: false
    deploymentStrategy:
      type: Recreate
    extraVolumes:
      - name: alert-state
        existingClaim: grafana-alert-state
    extraVolumeMounts:
      - name: alert-state
        mountPath: /var/lib/grafana-state
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            url: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428 # nosonar
            access: proxy
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            url: http://vlsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:9428 # nosonar
            access: proxy
            isDefault: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        # These dashboards keep the UIDs of the former Grafana.com imports so
        # saved links survive. Their old selectors required absent labels or
        # recording rules; the local versions query the metrics we scrape.
        node-exporter:
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "panels": [
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 8, "x": 0, "y": 0},
                  "id": 1, "title": "Node exporter targets", "type": "stat",
                  "targets": [{"expr": "sum(up{job=\"node-exporter\"})", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 8, "x": 8, "y": 0},
                  "id": 2, "title": "CPU busy", "type": "stat",
                  "targets": [{"expr": "100*(1-avg(rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m])))", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 8, "x": 16, "y": 0},
                  "id": 3, "title": "Memory used", "type": "stat",
                  "targets": [{"expr": "100*(1-node_memory_MemAvailable_bytes{job=\"node-exporter\"}/node_memory_MemTotal_bytes{job=\"node-exporter\"})", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "id": 4, "title": "CPU busy by core", "type": "timeseries",
                  "targets": [{"expr": "100*(1-rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m]))", "refId": "A", "legendFormat": "{{cpu}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                  "id": 5, "title": "Memory used", "type": "timeseries",
                  "targets": [{"expr": "node_memory_MemTotal_bytes{job=\"node-exporter\"}-node_memory_MemAvailable_bytes{job=\"node-exporter\"}", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                  "id": 6, "title": "Filesystem used", "type": "timeseries",
                  "targets": [{"expr": "100*(1-node_filesystem_avail_bytes{job=\"node-exporter\",fstype!~\"tmpfs|overlay\"}/node_filesystem_size_bytes{job=\"node-exporter\",fstype!~\"tmpfs|overlay\"})", "refId": "A", "legendFormat": "{{mountpoint}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                  "id": 7, "title": "Top disk throughput", "type": "timeseries",
                  "targets": [{"expr": "topk(5,sum by(device)(rate(node_disk_read_bytes_total{job=\"node-exporter\"}[5m])+rate(node_disk_written_bytes_total{job=\"node-exporter\"}[5m])))", "refId": "A", "legendFormat": "{{device}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "Bps"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
                  "id": 8, "title": "Top network throughput", "type": "timeseries",
                  "targets": [{"expr": "topk(5,sum by(device)(rate(node_network_receive_bytes_total{job=\"node-exporter\"}[5m])+rate(node_network_transmit_bytes_total{job=\"node-exporter\"}[5m])))", "refId": "A", "legendFormat": "{{device}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "percent"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
                  "id": 9, "title": "CPU pressure", "type": "timeseries",
                  "targets": [{"expr": "100*rate(node_pressure_cpu_waiting_seconds_total{job=\"node-exporter\"}[5m])", "refId": "A"}]
                }
              ],
              "refresh": "5m",
              "schemaVersion": 39,
              "tags": ["node-exporter", "infrastructure"],
              "templating": {"list": []},
              "time": {"from": "now-24h", "to": "now"},
              "timezone": "browser",
              "title": "Node Exporter Full",
              "uid": "rYdddlPWk",
              "version": 1
            }
        cilium-hubble:
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "panels": [
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 12, "x": 0, "y": 0},
                  "id": 1, "title": "Agent targets", "type": "stat",
                  "targets": [{"expr": "sum(up{job=\"monitoring/cilium-agent\"})", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 12, "x": 12, "y": 0},
                  "id": 2, "title": "Managed endpoints", "type": "stat",
                  "targets": [{"expr": "sum(cilium_endpoint_state)", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "id": 3, "title": "Errors and warnings", "type": "timeseries",
                  "targets": [{"expr": "sum by(level)(rate(cilium_errors_warnings_total[5m]))", "refId": "A", "legendFormat": "{{level}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                  "id": 4, "title": "Agent CPU", "type": "timeseries",
                  "targets": [{"expr": "sum by(pod)(rate(cilium_process_cpu_seconds_total[5m]))", "refId": "A", "legendFormat": "{{pod}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                  "id": 5, "title": "Agent memory", "type": "timeseries",
                  "targets": [{"expr": "sum by(pod)(cilium_process_resident_memory_bytes)", "refId": "A", "legendFormat": "{{pod}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                  "id": 6, "title": "Packet drops by reason", "type": "timeseries",
                  "targets": [{"expr": "sum by(reason)(rate(cilium_drop_count_total[5m]))", "refId": "A", "legendFormat": "{{reason}}"}]
                }
              ],
              "refresh": "5m",
              "schemaVersion": 39,
              "tags": ["cilium", "network"],
              "templating": {"list": []},
              "time": {"from": "now-24h", "to": "now"},
              "timezone": "browser",
              "title": "Cilium Agent Metrics",
              "uid": "vtuWtdumz",
              "version": 1
            }
        trivy-operator:
          # The Grafana.com import keeps ${DS_PROMETHEUS} in nested datasource
          # objects. The chart's datasource rewrite only handles single-line
          # string fields, so every imported panel had an unresolved UID.
          # Keep this compact dashboard in Git with the actual datasource UID.
          # The operator's scrape adds namespace=trivy-system; workload
          # namespaces are exposed under exported_namespace.
          # Raw trivy_image_vulnerabilities series include repeated and inactive
          # reports. Use the active CVE inventory for image findings, collapsing
          # the same digest deployed in multiple namespaces for cluster totals.
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "panels": [
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "description": "Critical image/CVE findings for active workloads, counted once per image digest across namespaces. See inventory age below before treating this as current.",
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                  "id": 1, "title": "Active Critical image findings", "type": "stat",
                  "targets": [{"expr": "sum(max by (image_registry, image_repository, image_digest) (cve_inventory_image_findings{severity=\"Critical\"}))", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                  "description": "HIGH checks on current non-Job/ReplicaSet resources, scaled-up ReplicaSets, and active Jobs. Completed Jobs and scaled-to-zero ReplicaSets are excluded. See raw totals below and [audit triage](https://github.com/bibAtWork/Edge_GitOps/blob/ops/talos_linux/docs/runbooks/trivy-config-audit.md).",
                  "id": 2, "title": "Active High config checks", "type": "stat",
                  "targets": [{"expr": "sum(trivy_resource_configaudits{severity=\"High\",resource_kind!=\"ReplicaSet\",resource_kind!=\"Job\"} or (label_replace(trivy_resource_configaudits{severity=\"High\",resource_kind=\"ReplicaSet\"},\"replicaset\",\"$1\",\"resource_name\",\"(.*)\") * on(exported_namespace,replicaset) group_left label_replace(kube_replicaset_spec_replicas > 0,\"exported_namespace\",\"$1\",\"namespace\",\"(.*)\")) or (label_replace(trivy_resource_configaudits{severity=\"High\",resource_kind=\"Job\"},\"job_name\",\"$1\",\"resource_name\",\"(.*)\") * on(exported_namespace,job_name) group_left label_replace(kube_job_status_active > 0,\"exported_namespace\",\"$1\",\"namespace\",\"(.*)\")))", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                  "description": "Raw failed CRITICAL checks across all Role and ClusterRole reports. This includes unbound roles; review bindings and effective permissions before remediation.",
                  "id": 3, "title": "Critical RBAC checks (all roles)", "type": "stat",
                  "targets": [{"expr": "sum(trivy_role_rbacassessments{severity=\"Critical\"}) + sum(trivy_clusterrole_clusterrbacassessments{severity=\"Critical\"})", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                  "id": 4, "title": "Exposed secret findings", "type": "stat",
                  "targets": [{"expr": "sum(trivy_image_exposedsecrets)", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "id": 5, "title": "Active High/Critical image findings by severity", "type": "timeseries",
                  "targets": [{"expr": "sum by (severity) (max by (image_registry, image_repository, image_digest, severity) (cve_inventory_image_findings))", "legendFormat": "{{severity}}", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                  "id": 6, "title": "All config checks by severity (incl inactive)", "type": "timeseries",
                  "targets": [{"expr": "sum by (severity) (trivy_resource_configaudits)", "legendFormat": "{{severity}}", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                  "id": 7, "title": "Active High/Critical image findings by namespace", "type": "timeseries",
                  "targets": [{"expr": "sum by (exported_namespace) (cve_inventory_image_findings)", "legendFormat": "{{exported_namespace}}", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                  "id": 8, "title": "Active High config checks by namespace", "type": "timeseries",
                  "targets": [{"expr": "sum by (exported_namespace) (trivy_resource_configaudits{severity=\"High\",resource_kind!=\"ReplicaSet\",resource_kind!=\"Job\"} or (label_replace(trivy_resource_configaudits{severity=\"High\",resource_kind=\"ReplicaSet\"},\"replicaset\",\"$1\",\"resource_name\",\"(.*)\") * on(exported_namespace,replicaset) group_left label_replace(kube_replicaset_spec_replicas > 0,\"exported_namespace\",\"$1\",\"namespace\",\"(.*)\")) or (label_replace(trivy_resource_configaudits{severity=\"High\",resource_kind=\"Job\"},\"job_name\",\"$1\",\"resource_name\",\"(.*)\") * on(exported_namespace,job_name) group_left label_replace(kube_job_status_active > 0,\"exported_namespace\",\"$1\",\"namespace\",\"(.*)\"))) > 0", "legendFormat": "{{exported_namespace}}", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20},
                  "id": 9, "title": "All RBAC checks by severity", "type": "timeseries",
                  "targets": [
                    {"expr": "sum by (severity) (trivy_role_rbacassessments)", "legendFormat": "Role {{severity}}", "refId": "A"},
                    {"expr": "sum by (severity) (trivy_clusterrole_clusterrbacassessments)", "legendFormat": "ClusterRole {{severity}}", "refId": "B"}
                  ]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20},
                  "id": 10, "title": "Active Critical findings by image", "type": "table",
                  "targets": [{"expr": "sum by (image_repository) (max by (image_repository, image_digest) (cve_inventory_image_findings{severity=\"Critical\"}))", "format": "table", "instant": true, "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "description": "Seconds since the active CVE inventory last completed successfully. A rising age means the findings may be stale.",
                  "fieldConfig": {"defaults": {"unit": "s", "decimals": 0}, "overrides": []},
                  "gridPos": {"h": 4, "w": 6, "x": 0, "y": 28},
                  "id": 11, "title": "CVE inventory age", "type": "stat",
                  "targets": [{"expr": "time() - cve_inventory_last_success_timestamp", "refId": "A"}]
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "description": "Raw failed config checks from all retained reports and severities, including completed Jobs and scaled-to-zero ReplicaSets.",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 6,
                    "y": 28
                  },
                  "id": 12,
                  "title": "All config checks (incl inactive)",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "sum(trivy_resource_configaudits)",
                      "refId": "A"
                    }
                  ]
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "description": "Raw High checks minus current active High checks. This is retained report history, not current workload exposure.",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 12,
                    "y": 28
                  },
                  "id": 13,
                  "title": "Inactive High config checks",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "sum(trivy_resource_configaudits{severity=\"High\"}) - sum(trivy_resource_configaudits{severity=\"High\",resource_kind!=\"ReplicaSet\",resource_kind!=\"Job\"} or (label_replace(trivy_resource_configaudits{severity=\"High\",resource_kind=\"ReplicaSet\"},\"replicaset\",\"$1\",\"resource_name\",\"(.*)\") * on(exported_namespace,replicaset) group_left label_replace(kube_replicaset_spec_replicas > 0,\"exported_namespace\",\"$1\",\"namespace\",\"(.*)\")) or (label_replace(trivy_resource_configaudits{severity=\"High\",resource_kind=\"Job\"},\"job_name\",\"$1\",\"resource_name\",\"(.*)\") * on(exported_namespace,job_name) group_left label_replace(kube_job_status_active > 0,\"exported_namespace\",\"$1\",\"namespace\",\"(.*)\")))",
                      "refId": "A"
                    }
                  ]
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "victoriametrics"
                  },
                  "description": "Raw failed RBAC checks from every reported Role and ClusterRole, including unbound roles.",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "short",
                      "decimals": 0
                    },
                    "overrides": []
                  },
                  "gridPos": {
                    "h": 4,
                    "w": 6,
                    "x": 18,
                    "y": 28
                  },
                  "id": 14,
                  "title": "All RBAC checks (all roles)",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "sum(trivy_role_rbacassessments) + sum(trivy_clusterrole_clusterrbacassessments)",
                      "refId": "A"
                    }
                  ]
                }
              ],
              "refresh": "5m",
              "schemaVersion": 39,
              "tags": ["trivy", "security", "operator"],
              "templating": {"list": []},
              "time": {"from": "now-24h", "to": "now"},
              "timezone": "browser",
              "title": "Trivy Operator Dashboard",
              "uid": "ycwPj724k",
              "version": 1
            }
        # The former Envoy imports required a cluster label absent from both
        # scrapes, leaving all template variables and panels empty. The local
        # dashboards target the two explicit scrape jobs instead.
        envoy-gateway-overview:
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "panels": [
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 12, "x": 0, "y": 0},
                  "id": 1, "title": "Controller targets", "type": "stat",
                  "targets": [{"expr": "sum(up{job=\"envoy-gateway-controller\"})", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                  "gridPos": {"h": 4, "w": 12, "x": 12, "y": 0},
                  "id": 2, "title": "XDS snapshots", "type": "stat",
                  "targets": [{"expr": "sum(xds_snapshot_update_total{job=\"envoy-gateway-controller\"})", "refId": "A"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "id": 3, "title": "XDS snapshot updates by status", "type": "timeseries",
                  "targets": [{"expr": "sum by(status)(rate(xds_snapshot_update_total{job=\"envoy-gateway-controller\"}[5m]))", "refId": "A", "legendFormat": "{{status}}"}]
                },
                {
                  "datasource": {"type": "prometheus", "uid": "victoriametrics"},
                  "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                  "id": 4, "title": "Resource applies by kind and status", "type": "timeseries",
                  "targets": [{"expr": "sum by(kind,status)(resource_apply_total{job=\"envoy-gateway-controller\"})", "refId": "A", "legendFormat": "{{kind}} {{status}}"}]
                }
              ],
              "refresh": "5m",
              "schemaVersion": 39,
              "tags": ["envoy", "gateway"],
              "templating": {"list": []},
              "time": {"from": "now-24h", "to": "now"},
              "timezone": "browser",
              "title": "Envoy Gateway / Overview",
