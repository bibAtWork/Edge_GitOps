                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'increase(envoy_http_ext_authz_denied{envoy_http_conn_manager_prefix="gateway_authz"}[5m])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [10]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 5m
                annotations:
                  summary: >-
                    {{ "{{" }} $value }} OPA ext_authz denials in the last 5 minutes
                  description: >-
                    More than 10 requests were denied by OPA in the last 5 minutes. Possible causes: expired/invalid API tokens, unauthorized access attempts on admin-only apps (hubble-ui), or a misconfigured client. Check Envoy stats: kubectl exec -n kube-system ds/cilium-envoy -- wget -qO- localhost:9964/stats/prometheus | grep ext_authz
                labels:
                  severity: warning
                isPaused: false
              # Keycloak realm drift. keycloak-config-cli reverts it hourly; the
              # point of alerting is that reverting SILENTLY teaches you nothing.
              # A correction means somebody changed the identity provider outside
              # Git, and the useful question is who had console access to do it,
              # not whether the group came back.
              #
              # The tool logs nothing at INFO when it corrects drift, so this
              # rides on a metric the Job derives itself by fingerprinting the
              # managed surface either side of the run.
              - uid: keycloak-config-drift
                title: KeycloakRealmDriftCorrected
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 10800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(keycloak_config_drift_corrected[3h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData: the Job runs hourly, so three hours of
                # silence is the reconciler having stopped -- and a stopped
                # reconciler means drift is neither corrected nor reported,
                # which is strictly worse than drift that is.
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Keycloak realm had drifted from Git and was reverted
                  description: >-
                    keycloak-config-cli found the realm did not match realm-config/homelab.yaml and corrected it. The change is already undone, so nothing is broken -- what needs looking at is why it happened. Someone edited the realm through the admin console, or a component wrote to it directly. Read the Job log for the before/after fingerprints, then check Keycloak's admin events for who made the change. If it was deliberate, it belongs in Git; if it was not, someone holds console access they should not.
                labels:
                  severity: warning
                isPaused: false
              # The reconcile failing is a different problem from it finding
              # drift, and it is the more urgent one: while the import errors,
              # nothing is converging the realm at all.
              - uid: keycloak-config-import-failed
                title: KeycloakConfigImportFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 10800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(keycloak_config_import_failed[3h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    keycloak-config-cli import is failing
                  description: >-
                    The realm reconcile exited non-zero, so the realm is no longer converging on realm-config/homelab.yaml and drift will accumulate unnoticed. Usual causes: the admin credential rotated without the Secret being updated, a syntax error in the realm file, or Keycloak being unreachable from the Job. Read the Job log directly -- kubectl logs -n keycloak job/<latest keycloak-config-cli job>.
                labels:
                  severity: critical
                isPaused: false
          # Added 2026-08-18 after an outage that was invisible until users hit
          # it. The seaweedfs-csi-driver mount pod holds the FUSE daemon for
          # EVERY SeaweedFS PVC on a node -- when it was OOMKilled (it had no
          # resource limits, so the namespace LimitRange capped it at 256Mi),
          # every mount became "transport endpoint is not connected" and all
          # consumers got EIO at once. Grafana returned 500 on every request,
          # immich-valkey went 0/1. Nothing alerted; the first signal was a
          # human noticing a broken UI, and the failure looked like an
          # application bug rather than a storage one.
          #
          # These two rules make that failure mode self-announcing. The restart
          # alert is the important one -- a restart of this pod IS a
          # cluster-wide storage incident, not a routine pod bounce -- and the
          # memory rule is the early warning that should fire first.
          # Filesystem-level capacity, deliberately not per-PVC. There are two
          # filesystems on this node and each one is a shared failure domain:
          # /var carries etcd, container images and EVERY local-path PVC, and
          # /var/mnt/seaweedfs carries all SeaweedFS data. If either fills, a
          # long list of unrelated workloads fails together.
          #
          # Per-PVC alerting is not used here for two reasons. kubelet_volume_
          # stats_* is not exposed by the kubelet on this Talos node (the
          # kubelet scrape works and returns ~1140 other series, but that
          # family is absent, and the API server's kubelet proxy is blocked so
          # it cannot be read directly either). And it would be misleading
          # anyway: a local-path PVC's requested size is not enforced -- the
          # volume is just a directory on /var -- so a PVC can quietly exceed
          # its own request until the underlying disk is what actually runs out.
          - orgId: 1
            name: Storage Capacity Alerts
            folder: Infrastructure
            interval: 5m
            rules:
              - uid: system-disk-space-low
                title: SystemDiskSpaceLow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(node_filesystem_avail_bytes{mountpoint="/var"}) / min(node_filesystem_size_bytes{mountpoint="/var"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.15]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    System disk below 15% free -- etcd and every local-path volume share it
                  description: >-
                    /var backs etcd, the container image store and all local-path PVCs on this node. Running it out takes the control plane down with the workloads, so this is a cluster-level alert rather than a storage one. Find the consumers: du -sh /var/lib/local-path-provisioner/* and check container image usage. Bulk volumes can be moved to SeaweedFS (see docs/backlog.md); databases should not be.
                labels:
                  severity: critical
                isPaused: false
              - uid: seaweedfs-disk-space-low
                title: SeaweedFSDiskSpaceLow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(node_filesystem_avail_bytes{mountpoint="/var/mnt/seaweedfs"}) / min(node_filesystem_size_bytes{mountpoint="/var/mnt/seaweedfs"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.20]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    SeaweedFS backing disk below 20% free
                  description: >-
                    The dedicated NVMe holding all SeaweedFS volume data is filling. Every SeaweedFS-backed PVC in the cluster draws from it, so this affects all of them at once rather than one workload. Check current usage per component and whether old volumes left over from migrations are still holding space.
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Backup Alerts
            folder: Infrastructure
            interval: 10m
            rules:
              # ADR-002 Task 15. These watch the backup chain itself rather than the
              # storage under it: a backup system that silently stops is
              # indistinguishable from one that is working, right until a restore is
              # attempted.
              #
              # These metric names are pushed by the jobs themselves to vmsingle via
              # /api/v1/import/prometheus, so they are known to exist rather than
              # assumed. Longhorn's own RecurringJob metrics are deliberately NOT
              # alerted on yet -- nothing in longhorn-system was scraped at all until
              # the VMServiceScrape added alongside this, and writing rules against
              # unverified label names is exactly how the Trivy CVE alert above spent
              # weeks silently matching nothing.
              #
              # Every push-based rule below wraps its metric in last_over_time().
              # That is not stylistic. These jobs run daily or monthly, while an
              # instant query resolves a series only if it has a sample within
              # VictoriaMetrics' staleness window -- five minutes. So for all but a
              # few minutes of each day, every one of these rules evaluated NoData
              # rather than against its data.
              #
              # It failed in both directions at once. The two rules with
              # noDataState: Alerting fired permanently: on 2026-08-25 both
              # SeaweedFSStagingStale and BackupRestoreTestStale were firing with
              # state "Alerting (NoData)" while their jobs had last succeeded 7 and 1
              # hours earlier, against thresholds of 36 and 48 hours. The rest,
              # noDataState: OK, could never fire at all -- including
              # SeaweedFSUnreadableBackupObjects, the alert for the one failure mode
              # this cluster has actually experienced.
              #
              # The lookbehind is one job interval plus margin, except on the
              # staleness rules, where it is longer than the rule's own threshold so
              # the value comparison gets to fire first and absence only takes over
              # past that point.
              - uid: backup-unreadable-objects
                title: SeaweedFSUnreadableBackupObjects
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # Today's count against yesterday's, not a bare `> 0`.
                      #
                      # Staging counts every object it could not read, and 53 of
                      # those are permanently lost from the 2026-08-26 incident:
                      # their chunks are gone here and they were never relayed,
                      # so no action recovers them and no future run reduces the
                      # count. A `> 0` rule therefore fires from the next staging
                      # run onward and never clears -- a critical alert that is
                      # always on, which is the fastest way to teach everyone to
                      # ignore the one that matters.
                      #
                      # Comparing against the previous day cancels the baseline
                      # out and leaves only NEW unreadable objects firing, which
                      # is the actionable signal. SeaweedFSBackupUnreadable
                      # covers the recoverable subset from the other side, using
                      # backup-verify's own metric.
                      expr: 'last_over_time(seaweedfs_staging_unreadable_objects[26h]) - last_over_time(seaweedfs_staging_unreadable_objects[26h] offset 24h)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Backup objects exist but cannot be read
                  description: >-
                    Objects in the SeaweedFS backup buckets list correctly and report correct sizes but fail on read -- their metadata survived while their chunks did not. Four dumps were in this state on 2026-08-24, including every Immich database backup, while the jobs that wrote them reported success. Listings and size guards cannot see this; only a real GET can. Run the staging job and read its WARN lines to identify them, then re-create the affected dumps from their live source.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-staging-stale
                title: SeaweedFSStagingStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(seaweedfs_staging_last_success_timestamp[48h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [129600]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    SeaweedFS staging has not succeeded in 36 hours
                  description: >-
                    The daily staging job copies SeaweedFS's own buckets -- Velero archives, database dumps, the Zot registry, filer metadata -- onto Longhorn. Nothing else protects them: Velero's file-system backup skips hostPath volumes and the SeaweedFS volume servers are hostPath by design. While this is stale those buckets have no current second copy. noDataState is Alerting here because a job that has stopped running emits nothing at all, and silence is the symptom.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-relay-failures
                title: BackupRelayFailures
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_relay_failures[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Relay to the AWS vault reported failures
                  description: >-
                    The nightly relay mirrors the local Longhorn backupstore and the newest SeaweedFS staging snapshot into the immutable AWS vault. Failures mean the off-site copy is diverging while local backups continue to look healthy. noDataState is OK because the relay ships suspended until the vault Terraform is applied.
                labels:
                  severity: warning
                isPaused: false
              - uid: backup-relay-stale
                title: BackupRelayStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(backup_relay_last_success_timestamp[48h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [129600]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting, matching the other two staleness rules. Beyond the
                # 48h lookbehind the series stops resolving, so absence is the
                # only remaining evidence -- and for a rule whose entire job is
                # to notice that something stopped, absence is the symptom, not
                # a reason to stay quiet.
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    AWS relay has not succeeded in 36 hours
                  description: >-
                    No new data has reached the off-site vault for over a day. Local backups are unaffected so nothing else will look wrong; this is the only signal that disaster-recovery coverage has stopped advancing. Expected to stay silent until the relay is unsuspended.
                labels:
                  severity: warning
                isPaused: false
              # Longhorn RecurringJob coverage. Held back until the VMServiceScrape in #272
              # was live and these series had actually been observed, rather than written
              # against label names taken on trust.
              #
              # Both are scoped to volumes the policy job says should be backed up, by
              # joining on the pvc label that Longhorn's own metric already carries.
              # Unscoped they count the deliberate exclusions too -- 13 volumes rather
              # than 4 -- and since nothing ever backs those up, they would report a
              # permanent fault about volumes nobody intends to protect. An alert that
              # is always red is an alert nobody reads.
              #
              # The join makes these depend on the policy job still running. That is the
              # correct direction: if it stops, BackupScopeDrift goes off on NoData.
              - uid: longhorn-volume-never-backed-up
                title: LonghornVolumeNeverBackedUp
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'count((longhorn_volume_last_backup_at == 0) * on(pvc) group_left() last_over_time(backup_volume_policy_in_scope[3h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    Longhorn volumes have never been backed up
                  description: >-
                    One or more Longhorn volumes report no backup at all. RecurringJobs place every volume carrying no recurring-job label into the default group, so a volume showing zero is either newer than the first scheduled run or is being skipped. Sixteen volumes were in this state on 2026-08-24 because the jobs had just been created and the weekly tier had not yet fired -- expected then, but volume-backup-policy.yaml now triggers an immediate backup-weekly the first time it finds an in-scope volume with none, so this firing at all past that means the on-demand trigger itself failed, not that anyone forgot to wait. immich-library-lh sat in exactly this state for ten days spanning both the 2026-08-24 storage migration and the 2026-08-26 incident (docs/backlog.md) before this alert or its trigger existed -- raised from warning because a volume with zero backups ever is the same class of risk as SeaweedFSUnreadableBackupObjects, not a lesser one.
                labels:
                  severity: critical
                isPaused: false
              - uid: longhorn-backup-stale
                title: LonghornBackupStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'count(((time() - longhorn_volume_last_backup_at > 864000) and (longhorn_volume_last_backup_at > 0)) * on(pvc) group_left() last_over_time(backup_volume_policy_in_scope[3h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    A Longhorn volume has not been backed up in 10 days
                  description: >-
                    The weekly tier runs every Sunday, so ten days means at least one run was missed entirely rather than merely delayed. Filtered to volumes that already have a backup, because a volume with none reports zero and would otherwise look infinitely stale -- that case is LonghornVolumeNeverBackedUp instead.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-restore-test-failing
                title: BackupRestoreTestFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_restore_test_pass[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The backup restore-test is failing
                  description: >-
                    A real backup was restored and read back and something did not verify -- e2fsck errors, a volume that would not mount, a sqlite integrity failure, or a sampled object whose staged copy does not match live. This also freezes remote pruning: the reconciler gates on this result and refuses to tag anything while it is failing, which is deliberate.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-restore-test-stale
                title: BackupRestoreTestStale
                condition: B
                data:
