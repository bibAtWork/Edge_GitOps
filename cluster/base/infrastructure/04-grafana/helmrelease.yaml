                            * on(namespace, job_name) (kube_job_status_active{namespace="trivy-system"} == bool 0)
                            * on(namespace, job_name) (kube_job_status_succeeded{namespace="trivy-system"} == bool 0))
                        ) or vector(0))[10m:1m])
                      instant: true
                      range: false
