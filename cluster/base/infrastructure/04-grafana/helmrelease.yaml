          - orgId: 1
            name: Trivy Scan Health
            folder: Security
            # Jobs time out and disappear after five minutes. Evaluate before
            # that, and retain failed/podless evidence for ten minutes so a
            # deleted Job cannot clear the alert before notification.
            interval: 1m
            rules:
              - uid: trivy-scan-job-unhealthy
                title: TrivyScanJobUnhealthy
                condition: B
