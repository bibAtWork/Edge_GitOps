apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: vmstack
      namespace: monitoring
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    service:
      appProtocol: kubernetes.io/http
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Stateless. /var/lib/grafana is an emptyDir, so everything Grafana serves
    # comes from this file on every start: datasources, the eight gnetId
    # dashboards, all twenty-four alert rules, and the admin user from
    # grafana-admin.
    #
    # The volume was removed rather than moved to Longhorn because it had
    # stopped being state and started being drift. Its dashboards directory is
    # written by the chart's download-dashboards init container, which only
    # ever adds, so an entry deleted from this list never removed the file it
    # had written. Two dashboards were still on disk and still loading with
    # nothing in Git describing them; both are declared again above.
    #
    # One of them is a good illustration of how little a filename proves. It
    # was being served from a file called seaweedfs.json, which contained not a
    # SeaweedFS dashboard but a copy of gnetId 14817, "Node Exporter - USE
    # Method / Node" -- so the dashboard that appeared in Grafana had no
    # relationship to the name of the file producing it, and no way to notice
    # short of reading the JSON.
    #
    # What is genuinely lost, and it is not nothing:
    #
    #  - Alert state. A restart re-evaluates every rule from scratch, so
    #    anything currently firing notifies again. Silences do not survive
    #    either; there were none.
    #  - Annotation history, starred dashboards, user preferences.
    #  - ~255MB of plugin payload, re-downloaded from grafana.com on every
    #    start (208MB of it victoriametrics-logs-datasource). This puts an
    #    external dependency on the startup path: if grafana.com is
    #    unreachable, Grafana comes up without the VictoriaLogs datasource
    #    rather than not at all, which is the quieter of the two failures and
    #    so the one worth knowing about in advance.
    #
    # No API keys or service accounts live in that database -- nothing in this
    # cluster authenticates to Grafana -- so nothing else breaks when it is
    # discarded. Anything that should survive a restart belongs in this file.
    persistence:
      enabled: false
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            url: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428 # nosonar
            access: proxy
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            url: http://vlsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:9428 # nosonar
            access: proxy
            isDefault: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
        cilium-hubble:
          gnetId: 16611
          revision: 1
          datasource: VictoriaMetrics
        velero:
          gnetId: 15469
          revision: 1
          datasource: VictoriaMetrics
        trivy-operator:
          gnetId: 17813
          revision: 1
          datasource: VictoriaMetrics
        # Backlog item 13 / ADR-001 "not yet realized": Envoy Gateway's own
        # observability. Official envoy-mixin-project dashboards, matching the
        # two scrape targets in 02-victoriametrics-stack/scrape-configs.yaml —
        # control plane (envoy-gateway-controller) and data plane
        # (envoy-gateway-proxy). Both use a `job` template variable populated
        # from label_values(), not a hardcoded job name, so they work
        # regardless of the exact job label our scrape configs set.
        envoy-gateway-overview:
          gnetId: 24460
          revision: 1
          datasource: VictoriaMetrics
        envoy-overview:
          gnetId: 24459
          revision: 3
          datasource: VictoriaMetrics
        # These two were already being served before the move to a stateless
        # Grafana, from files left on the old volume by dashboard entries
        # deleted from this list months ago. The download-dashboards init
        # container only ever adds, so removing an entry here never removed the
        # file, and both kept loading with nothing in Git describing them.
        #
        # Declared rather than dropped: they were in daily use, and the point of
        # going stateless was to make what Grafana serves match what is written
        # down, not to lose dashboards.
        #
        # gnetId 14817 is a special case worth flagging before someone
        # "corrects" it. https://grafana.com/api/dashboards/14817 returns 404,
        # so it looks deleted -- but the revisions/N/download endpoint the chart
        # actually calls returns it fine. Confirmed by fetching both and
        # comparing against the copies recovered from the old volume.
        node-exporter-use-method:
          gnetId: 14817
          revision: 1
          datasource: VictoriaMetrics
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: VictoriaMetrics
    alerting:
      rules.yaml:
        apiVersion: 1
        groups:
          - orgId: 1
            name: Trivy CVE Alerts
            folder: Security
            interval: 15m
            rules:
              # Efficiency review 2026-08-17: this rule (previously trivy-high-cvss /
              # ImageHighCVSS) had never once fired since it was written -- its PromQL
              # filtered on a label called `score`, but trivy-operator actually exports
              # the field as `vuln_score` (confirmed live against the raw metric's label
              # set). `score` doesn't exist on any of the ~3500 CVE series this cluster
              # currently has, so the filter silently matched nothing, forever. Fixing
              # the label surfaced 208 real findings across 18 images that had been
              # invisible the whole time.
              #
              # Split into two rules on the way past, per explicit direction: alert
              # (urgent, fast-repeat) only for Critical; track (visible, slower-repeat)
              # for High+Critical combined -- reusing the existing severity-based
              # routing in grafana-telegram.yaml's alerting.policies.yaml
              # (severity=critical -> repeat_interval 1h; everything else -> 4h) rather
              # than building new notification plumbing. Matching on the severity label
              # directly (Critical/High, confirmed exact casing live) instead of a CVSS
              # score regex -- simpler and avoids the boundary-off-by-one risk a regex
              # has (Trivy's own severity classification is already CVSS-score-derived).
              - uid: trivy-critical-cve
                title: ImageCriticalCVE
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'trivy_vulnerability_id{severity="Critical"}'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Lengthened 2026-08-17: home lab, not production -- a CVE finding isn't a
                # transient blip, it'll still be there in two hours, so there's no reason to
                # notify within the first one.
                for: 2h
                annotations:
                  # {{ "{{" }} ... }} escapes Helm's tpl pass; Grafana sees {{ $labels.xxx }}
                  summary: >-
                    CRITICAL: {{ "{{" }} $labels.image_repository }}:{{ "{{" }} $labels.image_tag }} — {{ "{{" }} $labels.vuln_id }} score {{ "{{" }} $labels.vuln_score }}
                  description: >-
                    {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.name }} (container {{ "{{" }} $labels.container_name }}) has CVE {{ "{{" }} $labels.vuln_id }} (Critical, CVSS {{ "{{" }} $labels.vuln_score }}). Fixed in: {{ "{{" }} $labels.fixed_version }}.
                labels:
                  severity: critical
                isPaused: false
              - uid: trivy-high-critical-tracking
                title: ImageHighOrCriticalCVE
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'trivy_vulnerability_id{severity=~"High|Critical"}'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Lengthened 2026-08-17 — see trivy-critical-cve above.
                for: 2h
                annotations:
                  summary: >-
                    {{ "{{" }} $labels.image_repository }}:{{ "{{" }} $labels.image_tag }} — {{ "{{" }} $labels.vuln_id }} score {{ "{{" }} $labels.vuln_score }} ({{ "{{" }} $labels.severity }})
                  description: >-
                    {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.name }} (container {{ "{{" }} $labels.container_name }}) has CVE {{ "{{" }} $labels.vuln_id }} with CVSS score {{ "{{" }} $labels.vuln_score }} ({{ "{{" }} $labels.severity }}). Fixed in: {{ "{{" }} $labels.fixed_version }}.
                labels:
                  severity: warning
                isPaused: false
              # New: trivy_image_exposedsecrets was already exported by the operator
              # (metricsVulnIdEnabled's sibling data) with zero alerting on it. Unlike
              # CVEs -- numerous, often no fix available yet -- a secret baked into an
              # image is rare and almost always actionable, so this pages on the fast
              # route like Critical CVEs rather than getting bundled into the tracking
              # rule above.
              - uid: trivy-exposed-secrets
                title: ImageExposedSecret
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'trivy_image_exposedsecrets > 0'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Lengthened 2026-08-17 — see trivy-critical-cve above.
                for: 1h
                annotations:
                  summary: >-
                    Exposed secret in {{ "{{" }} $labels.image_repository }}:{{ "{{" }} $labels.image_tag }}
                  description: >-
                    {{ "{{" }} $labels.exported_namespace }}/{{ "{{" }} $labels.resource_name }} ({{ "{{" }} $labels.resource_kind }}) runs an image Trivy flagged as containing an exposed secret. Check: kubectl get vulnerabilityreport -n {{ "{{" }} $labels.exported_namespace }} {{ "{{" }} $labels.name }} -o jsonpath='{.report.secrets}'
                labels:
                  severity: critical
                isPaused: false
          - orgId: 1
            name: Log Security Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: log-oomkilled
                title: PodOOMKilled
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # "by (namespace, pod, container)" rather than a bare
                      # sum(): container_oom_events_total already carries those
                      # labels, and collapsing them produces a single anonymous
                      # "something was OOMKilled" alert that names neither the
                      # workload nor the namespace. Same fix, and same reason,
                      # as the FalcoCriticalEvent rule below.
                      #
                      # This mattered on 2026-08-18: the SeaweedFS CSI mount
                      # daemon was OOMKilled, which took every SeaweedFS volume
                      # on the node down at once, and this rule reported it as
                      # an unlabelled warning indistinguishable from any other
                      # pod hitting its limit.
                      expr: 'sum by (namespace, pod, container) (increase(container_oom_events_total{pod!=""}[10m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    OOMKilled: {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.pod }} (container {{ "{{" }} $labels.container }})
                  description: >-
                    Container {{ "{{" }} $labels.container }} in {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.pod }} exceeded its memory limit and was killed. Check whether the limit is genuinely too low or the workload regressed: kubectl get pod -n {{ "{{" }} $labels.namespace }} {{ "{{" }} $labels.pod }} -o jsonpath='{.spec.containers[*].resources}'. Note that a container with no explicit limit inherits the namespace LimitRange default, which is how the SeaweedFS mount daemon ended up capped at 256Mi.
                labels:
                  severity: warning
                isPaused: false
              - uid: log-grafana-auth-fail
                title: GrafanaAuthFailures
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(grafana_api_login_post_total[5m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [5]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 2m
                annotations:
                  summary: >-
                    {{ "{{" }} $value }} native Grafana login attempts in 5 min
                  description: >-
                    More than 5 native Grafana login attempts detected. With Keycloak SSO active, native logins are anomalous and may indicate credential stuffing. Check: kubectl logs -n monitoring -l app.kubernetes.io/name=grafana
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Security Tool Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: kyverno-policy-violation
                title: KyvernoPolicyViolation
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'increase(kyverno_policy_results_total{result="fail"}[5m])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Kyverno policy violation in {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.resource_namespace }}
                  description: >-
                    Policy {{ "{{" }} $labels.policy_name }} failed for resource {{ "{{" }} $labels.resource_kind }}/{{ "{{" }} $labels.resource_name }} in namespace {{ "{{" }} $labels.resource_namespace }}. Check: kubectl get policyreport -A
                labels:
                  severity: warning
                isPaused: false
              - uid: falco-critical-event
                title: FalcoCriticalEvent
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # "by (rule_name, priority)" instead of a bare sum():
                      # a plain sum() collapses every label, which is why
                      # the alert previously had no context about which
                      # rule actually fired. Grouping keeps rule_name/
                      # priority available for the annotation template
                      # below, and splits distinct rules into separate
                      # alert instances instead of one undifferentiated
                      # blob. The metric itself doesn't carry the specific
                      # offending pod/namespace/process (that level of
                      # detail only exists in Falco's own logs, not this
                      # aggregate counter), so the annotation still points
                      # at the log command for full detail.
                      expr: 'sum by (rule_name, priority) (increase(falcosecurity_falco_rules_matches_total{priority=~"0|1|2"}[5m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Falco rule "{{ "{{" }} $labels.rule_name }}" fired (priority {{ "{{" }} $labels.priority }}, 0=Emergency 1=Alert 2=Critical)
                  description: >-
                    {{ "{{" }} $value }} matches in the last 5 minutes. Check: kubectl logs -n falco ds/falco --since=5m | grep '"rule":"{{ "{{" }} $labels.rule_name }}"'
                labels:
                  severity: critical
                isPaused: false
          - orgId: 1
            name: Gateway Auth Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: opa-unavailable
                title: OPAUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'increase(envoy_http_ext_authz_failure_mode_allowed{envoy_http_conn_manager_prefix="gateway_authz"}[5m])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: OPA ext_authz is down — requests bypassing authorization
                  description: >-
                    OPA is unavailable; Envoy's failure_mode_allow forwarded requests without an authorization check. Native app auth (Grafana OIDC, etc.) still applies, but Rego policies (hubble-ui admin gate, 401 for bad tokens) are not enforced. Check: kubectl get pods -n security -l app=opa
                labels:
                  severity: critical
                isPaused: false
              - uid: opa-denial-spike
                title: OPADenialSpike
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'increase(envoy_http_ext_authz_denied{envoy_http_conn_manager_prefix="gateway_authz"}[5m])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [10]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 5m
                annotations:
                  summary: >-
                    {{ "{{" }} $value }} OPA ext_authz denials in the last 5 minutes
                  description: >-
                    More than 10 requests were denied by OPA in the last 5 minutes. Possible causes: expired/invalid API tokens, unauthorized access attempts on admin-only apps (hubble-ui), or a misconfigured client. Check Envoy stats: kubectl exec -n kube-system ds/cilium-envoy -- wget -qO- localhost:9964/stats/prometheus | grep ext_authz
                labels:
                  severity: warning
                isPaused: false
          # Added 2026-08-18 after an outage that was invisible until users hit
          # it. The seaweedfs-csi-driver mount pod holds the FUSE daemon for
          # EVERY SeaweedFS PVC on a node -- when it was OOMKilled (it had no
          # resource limits, so the namespace LimitRange capped it at 256Mi),
          # every mount became "transport endpoint is not connected" and all
          # consumers got EIO at once. Grafana returned 500 on every request,
          # immich-valkey went 0/1. Nothing alerted; the first signal was a
          # human noticing a broken UI, and the failure looked like an
          # application bug rather than a storage one.
          #
          # These two rules make that failure mode self-announcing. The restart
          # alert is the important one -- a restart of this pod IS a
          # cluster-wide storage incident, not a routine pod bounce -- and the
          # memory rule is the early warning that should fire first.
          # Filesystem-level capacity, deliberately not per-PVC. There are two
          # filesystems on this node and each one is a shared failure domain:
          # /var carries etcd, container images and EVERY local-path PVC, and
          # /var/mnt/seaweedfs carries all SeaweedFS data. If either fills, a
          # long list of unrelated workloads fails together.
          #
          # Per-PVC alerting is not used here for two reasons. kubelet_volume_
          # stats_* is not exposed by the kubelet on this Talos node (the
          # kubelet scrape works and returns ~1140 other series, but that
          # family is absent, and the API server's kubelet proxy is blocked so
          # it cannot be read directly either). And it would be misleading
          # anyway: a local-path PVC's requested size is not enforced -- the
          # volume is just a directory on /var -- so a PVC can quietly exceed
          # its own request until the underlying disk is what actually runs out.
          - orgId: 1
            name: Storage Capacity Alerts
            folder: Infrastructure
            interval: 5m
            rules:
              - uid: system-disk-space-low
                title: SystemDiskSpaceLow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(node_filesystem_avail_bytes{mountpoint="/var"}) / min(node_filesystem_size_bytes{mountpoint="/var"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.15]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    System disk below 15% free -- etcd and every local-path volume share it
                  description: >-
                    /var backs etcd, the container image store and all local-path PVCs on this node. Running it out takes the control plane down with the workloads, so this is a cluster-level alert rather than a storage one. Find the consumers: du -sh /var/lib/local-path-provisioner/* and check container image usage. Bulk volumes can be moved to SeaweedFS (see docs/backlog.md); databases should not be.
                labels:
                  severity: critical
                isPaused: false
              - uid: seaweedfs-disk-space-low
                title: SeaweedFSDiskSpaceLow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(node_filesystem_avail_bytes{mountpoint="/var/mnt/seaweedfs"}) / min(node_filesystem_size_bytes{mountpoint="/var/mnt/seaweedfs"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.20]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    SeaweedFS backing disk below 20% free
                  description: >-
                    The dedicated NVMe holding all SeaweedFS volume data is filling. Every SeaweedFS-backed PVC in the cluster draws from it, so this affects all of them at once rather than one workload. Check current usage per component and whether old volumes left over from migrations are still holding space.
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Backup Alerts
            folder: Infrastructure
            interval: 10m
            rules:
              # ADR-002 Task 15. These watch the backup chain itself rather than the
              # storage under it: a backup system that silently stops is
              # indistinguishable from one that is working, right until a restore is
              # attempted.
              #
              # These metric names are pushed by the jobs themselves to vmsingle via
              # /api/v1/import/prometheus, so they are known to exist rather than
              # assumed. Longhorn's own RecurringJob metrics are deliberately NOT
              # alerted on yet -- nothing in longhorn-system was scraped at all until
              # the VMServiceScrape added alongside this, and writing rules against
              # unverified label names is exactly how the Trivy CVE alert above spent
              # weeks silently matching nothing.
              #
              # Every push-based rule below wraps its metric in last_over_time().
              # That is not stylistic. These jobs run daily or monthly, while an
              # instant query resolves a series only if it has a sample within
              # VictoriaMetrics' staleness window -- five minutes. So for all but a
              # few minutes of each day, every one of these rules evaluated NoData
              # rather than against its data.
              #
              # It failed in both directions at once. The two rules with
              # noDataState: Alerting fired permanently: on 2026-08-25 both
              # SeaweedFSStagingStale and BackupRestoreTestStale were firing with
              # state "Alerting (NoData)" while their jobs had last succeeded 7 and 1
              # hours earlier, against thresholds of 36 and 48 hours. The rest,
              # noDataState: OK, could never fire at all -- including
              # SeaweedFSUnreadableBackupObjects, the alert for the one failure mode
              # this cluster has actually experienced.
              #
              # The lookbehind is one job interval plus margin, except on the
              # staleness rules, where it is longer than the rule's own threshold so
              # the value comparison gets to fire first and absence only takes over
              # past that point.
              - uid: backup-unreadable-objects
                title: SeaweedFSUnreadableBackupObjects
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(seaweedfs_staging_unreadable_objects[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Backup objects exist but cannot be read
                  description: >-
                    Objects in the SeaweedFS backup buckets list correctly and report correct sizes but fail on read -- their metadata survived while their chunks did not. Four dumps were in this state on 2026-08-24, including every Immich database backup, while the jobs that wrote them reported success. Listings and size guards cannot see this; only a real GET can. Run the staging job and read its WARN lines to identify them, then re-create the affected dumps from their live source.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-staging-stale
                title: SeaweedFSStagingStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(seaweedfs_staging_last_success_timestamp[48h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [129600]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    SeaweedFS staging has not succeeded in 36 hours
                  description: >-
                    The daily staging job copies SeaweedFS's own buckets -- Velero archives, database dumps, the Zot registry, filer metadata -- onto Longhorn. Nothing else protects them: Velero's file-system backup skips hostPath volumes and the SeaweedFS volume servers are hostPath by design. While this is stale those buckets have no current second copy. noDataState is Alerting here because a job that has stopped running emits nothing at all, and silence is the symptom.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-relay-failures
                title: BackupRelayFailures
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_relay_failures[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Relay to the AWS vault reported failures
                  description: >-
                    The nightly relay mirrors the local Longhorn backupstore and the newest SeaweedFS staging snapshot into the immutable AWS vault. Failures mean the off-site copy is diverging while local backups continue to look healthy. noDataState is OK because the relay ships suspended until the vault Terraform is applied.
                labels:
                  severity: warning
                isPaused: false
              - uid: backup-relay-stale
                title: BackupRelayStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(backup_relay_last_success_timestamp[48h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [129600]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting, matching the other two staleness rules. Beyond the
                # 48h lookbehind the series stops resolving, so absence is the
                # only remaining evidence -- and for a rule whose entire job is
                # to notice that something stopped, absence is the symptom, not
                # a reason to stay quiet.
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    AWS relay has not succeeded in 36 hours
                  description: >-
                    No new data has reached the off-site vault for over a day. Local backups are unaffected so nothing else will look wrong; this is the only signal that disaster-recovery coverage has stopped advancing. Expected to stay silent until the relay is unsuspended.
                labels:
                  severity: warning
                isPaused: false
              # Longhorn RecurringJob coverage. Held back until the VMServiceScrape in #272
              # was live and these series had actually been observed, rather than written
              # against label names taken on trust.
              #
              # Both are scoped to volumes the policy job says should be backed up, by
              # joining on the pvc label that Longhorn's own metric already carries.
              # Unscoped they count the deliberate exclusions too -- 13 volumes rather
              # than 4 -- and since nothing ever backs those up, they would report a
              # permanent fault about volumes nobody intends to protect. An alert that
              # is always red is an alert nobody reads.
              #
              # The join makes these depend on the policy job still running. That is the
              # correct direction: if it stops, BackupScopeDrift goes off on NoData.
              - uid: longhorn-volume-never-backed-up
                title: LonghornVolumeNeverBackedUp
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'count((longhorn_volume_last_backup_at == 0) * on(pvc) group_left() last_over_time(backup_volume_policy_in_scope[3h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    Longhorn volumes have never been backed up
                  description: >-
                    One or more Longhorn volumes report no backup at all. RecurringJobs place every volume carrying no recurring-job label into the default group, so a volume showing zero is either newer than the first scheduled run or is being skipped. Sixteen volumes were in this state on 2026-08-24 because the jobs had just been created and the weekly tier had not yet fired -- expected then, but a volume still reporting zero after a full week is not.
                labels:
                  severity: warning
                isPaused: false
              - uid: longhorn-backup-stale
                title: LonghornBackupStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'count(((time() - longhorn_volume_last_backup_at > 864000) and (longhorn_volume_last_backup_at > 0)) * on(pvc) group_left() last_over_time(backup_volume_policy_in_scope[3h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    A Longhorn volume has not been backed up in 10 days
                  description: >-
                    The weekly tier runs every Sunday, so ten days means at least one run was missed entirely rather than merely delayed. Filtered to volumes that already have a backup, because a volume with none reports zero and would otherwise look infinitely stale -- that case is LonghornVolumeNeverBackedUp instead.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-restore-test-failing
                title: BackupRestoreTestFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_restore_test_pass[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The backup restore-test is failing
                  description: >-
                    A real backup was restored and read back and something did not verify -- e2fsck errors, a volume that would not mount, a sqlite integrity failure, or a sampled object whose staged copy does not match live. This also freezes remote pruning: the reconciler gates on this result and refuses to tag anything while it is failing, which is deliberate.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-restore-test-stale
                title: BackupRestoreTestStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(backup_restore_test_last_run_timestamp[60h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [172800]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The backup restore-test has not run in 48 hours
                  description: >-
                    Backups are no longer being verified. The threshold matches the reconciler's gate exactly, so by the time this fires pruning has already frozen -- the safe direction, but it means the vault grows until the restore-test runs again.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-reconciler-mass-tagging
                title: BackupReconcilerMassTagging
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_reconcile_objects_tagged[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [50]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The reconciler tagged an unusual number of objects for expiry
                  description: >-
                    Each tagged object gets a delete marker within about a day. S3 Inventory does not report object tags, so this metric is the only routine visibility into the pruning path -- after the fact there is no way to see what was tagged except through CloudTrail. A normal day tags a handful. A large run means the local side looked emptier than it is, and those objects remain recoverable by an MFA admin inside the Object Lock window.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-reconciler-cap-abort
                title: BackupReconcilerCapAbort
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_reconcile_cap_abort[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The reconciler aborted on its safety cap
                  description: >-
                    The eligible-for-pruning set exceeded the cap, or the local listing came back empty, and the run refused to tag anything. This is the circuit breaker working: a large eligible set means the diff or local storage is broken, never that pruning should be more aggressive. Nothing was deleted, and nothing will be until the cause is found.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-remote-probe-failing
                title: BackupRemoteProbeFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_remote_probe_pass[35d])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The monthly remote probe could not verify the vault
                  description: >-
                    The probe read objects back from AWS and either could not fetch them or found bytes that differ from the local copy. This is the only check that exercises the remote path at all -- every other signal in the chain is local and would stay green while the vault was unreadable, the credential had been rotated away, or the bucket policy had been tightened into refusal. noDataState is OK because the probe runs monthly and would otherwise report missing between runs; staleness is not meaningful at that cadence.
                labels:
                  severity: critical
                isPaused: false
              - uid: backup-remote-probe-egress-anomaly
                title: BackupRemoteProbeEgressAnomaly
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(backup_remote_probe_egress_bytes[35d])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [67108864]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The remote probe transferred far more data than expected
                  description: >-
                    The probe is bounded by a 32MiB egress budget, not by object count -- the sampled population mixes small metadata with 16MB database dumps, so a fixed count costs anywhere between 1MB and hundreds. A large jump almost always means the smallest-object selection logic broke and it is now pulling real volume data, which costs egress every month for no additional assurance. The threshold is set well above the observed envelope so ordinary growth does not trip it.
                labels:
                  severity: warning
                isPaused: false
              # Backup scope. This is the rule that would have caught the
              # exclusion bug fixed in the same series of changes: the policy job
              # reported volumes as excluded on every run, for its whole life,
              # while every one of them stayed in Longhorn's `default` group and
              # was still being backed up.
              #
              # Alerting on drift rather than on an absolute count keeps it
              # self-adjusting. Adding an application adds a volume to both the
              # actual and the expected side, so nothing fires; an exclusion that
              # stops taking effect moves only one side. A fixed threshold on
              # in_default would have to be revised every time an app is added,
              # and a threshold nobody maintains is one nobody trusts.
              - uid: backup-scope-drift
                title: BackupScopeDrift
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 10800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'abs(last_over_time(backup_volume_policy_drift[3h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # The job runs hourly, so three hours of silence is the job
                # having stopped -- and a scope reconciler that has stopped is
                # exactly when scope drifts unnoticed.
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Longhorn backup scope does not match the policy
                  description: >-
                    The number of volumes in Longhorn's `default` group differs from the number the exclusion list in 34-backup/volume-backup-policy.yaml says should be there. Either an exclusion has stopped taking effect and something is being backed up that should not be, or a volume that should be protected has dropped out of the group. Compare `kubectl get volumes.longhorn.io -n longhorn-system -l recurring-job-group.longhorn.io/default=enabled` against that list, and read the tail of the last volume-backup-policy run, which prints both. Do not judge this from the job's "excluded" lines; those describe what it attempted, not what took effect.
                labels:
                  severity: critical
                isPaused: false
    initChownData:
      enabled: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      fsGroup: 472
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
    # Inject GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from grafana-oauth-secret into Grafana's env.
    # Grafana config below references it via $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}.
    envFromSecret: grafana-oauth-secret
    grafana.ini:
      server:
        root_url: https://grafana.homelab.data-harness.org
      auth.generic_oauth:
        enabled: true
        name: Homelab SSO
        allow_sign_up: true
        scopes: openid email profile groups
        auth_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/userinfo
        client_id: grafana
        client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
        # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): Keycloak's
        # /owner/platform-admin -> Grafana Admin, /maintainer/app-operator ->
        # Editor, everyone else (including /reader/viewer) -> Viewer. Replaces
        # the old flat 'admin' group check now that the group is gone --
        # see setup-job.yaml's migration comment.
        role_attribute_path: "contains(groups[*], 'platform-admin') && 'Admin' || contains(groups[*], 'app-operator') && 'Editor' || 'Viewer'"
        use_pkce: true
        auto_login: false
    image:
      tag: 12.4.8
