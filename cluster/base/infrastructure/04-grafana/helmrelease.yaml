                annotations:
                  summary: >-
                    A Talos node has not matched the version pinned in git for a week
                  description: >-
                    talos-fleet-health found at least one node NOT running TALOS_VERSION from versions.env, continuously for 8 days -- long enough that a routine wait for the Sunday upgrade window no longer explains it. This is the exact failure mode this cluster already had once for 44 days (docs/backlog.md) with nothing detecting it -- an automated upgrade that silently never ran, or never completed. Identify the node with the talos_fleet_node_info series and compare against `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              # ── Kubernetes version, same shape as Talos above ────────────
              # Added on code review (PR #386, round 3): the Talos-only fleet
              # check would have missed a Kubernetes upgrade that silently
              # never ran the exact same way this repo's history already
              # missed a Talos one for 44 days -- reproduced on the axis this
              # PR itself introduces, if left unmonitored. Same metrics
              # source (kube_node_info's kubelet_version), same script run.
