                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # for: 8h, same headroom and same reasoning as
                # TalosFleetVersionSkew above -- see that rule's comment.
                for: 8h
                annotations:
                  summary: >-
                    Talos nodes disagree with each other on Kubernetes version
                  description: >-
                    talos-fleet-health found more than one distinct kubelet_version across nodes via kube_node_info. Identify the split with the talos_fleet_node_info series, which carries each node's kubernetes_version as a label. Either the talos-kubernetes upgrade is genuinely in progress outside its expected window, or it stalled partway through the cluster-wide rollout upgrade-k8s performs internally. Check `kubectl get jobs -n cattle-system` and `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              - uid: talos-fleet-k8s-version-drift
                title: TalosFleetK8sVersionDrift
                condition: B
                data:
                  - refId: A
                    # Grace period lives in the query, not in `for:`, from the
                    # start -- see TalosFleetVersionDrift's own comment for
                    # why: Grafana's alert-instance pending state is
                    # ephemeral (persistence.enabled: false), so a wall-clock
                    # `for:` duration this long cannot survive a pod restart,
                    # and why min_over_time alone is not a grace period --
                    # the count_over_time(...) >= 28 clause is the part that
                    # actually is one. This is the series round 4 review
                    # named as the likeliest to be caught by that gap: it is
                    # brand new, and KUBERNETES_VERSION is a first-time
                    # inference of what the cluster actually runs, so it is
                    # the more likely of the two to be genuinely drifted on
                    # its very first sample.
                    relativeTimeRange:
                      from: 691200
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min_over_time(talos_fleet_k8s_version_drift[8d]) and (count_over_time(talos_fleet_k8s_version_drift[8d]) >= 28)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A Talos node has not matched the Kubernetes version pinned in git for a week
                  description: >-
                    talos-fleet-health found at least one node NOT running KUBERNETES_VERSION from versions.env, continuously for 8 days -- long enough that a routine wait for the Sunday upgrade window no longer explains it. Identify the node with the talos_fleet_node_info series and compare against `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              - uid: talos-fleet-unready-nodes
                title: TalosFleetUnreadyNodes
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_unready_nodes[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # for: 8h, same headroom and same reasoning as
                # TalosFleetVersionSkew above -- see that rule's comment. This
                # is the rule round 4 review specifically named: a node
                # legitimately cordoned/rebooting mid-upgrade would otherwise
                # page as a critical outage every routine Sunday.
                for: 8h
                annotations:
                  summary: >-
                    A node is not Ready per talos-fleet-health
                  description: >-
                    talos-fleet-health found at least one node not reporting kube_node_status_condition{condition="Ready",status="true"}. Identify it with the talos_fleet_node_info series (its value is 0 for an unready node) and check `kubectl get nodes` and `kubectl describe node <name>` directly -- this alert is a lagging indicator (checked every 6h), not a substitute for a live node-health dashboard.
                labels:
                  severity: critical
                isPaused: false
              - uid: talos-fleet-health-check-failing
                title: TalosFleetHealthCheckFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_health_check_failed[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData, same reasoning as TalosCveCheckFailing:
                # a fleet-health check that silently stopped running is
                # indistinguishable from a clean result unless something
                # notices the silence itself.
                noDataState: Alerting
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    The Talos fleet-health check is failing or has stopped running
                  description: >-
                    talos-fleet-health either reported a failure or has not pushed a result in over 8h, so the cluster currently has no working answer to whether all nodes agree on version and are Ready. Read the last run with `kubectl logs -n monitoring -l app.kubernetes.io/name=talos-fleet-health --tail=50`. Common causes: kube_node_info missing its os_image label, or kube_node_status_condition not present (kube-state-metrics down).
                labels:
                  severity: warning
                isPaused: false
              # ── Longhorn storage availability ───────────────────────────
              # Added after 2026-08-30. Longhorn had been publishing
              # longhorn_disk_status{condition="ready"} = 0, with
              # condition_reason="DiskFilesystemChanged", for four days on a
              # scraped endpoint -- while fifteen of sixteen volumes sat
              # faulted and every stateful workload was down. Nothing
              # alerted, because the only Longhorn metric any rule referenced
              # was longhorn_volume_last_backup_at: a backup-freshness
              # signal, which says nothing about whether the disk holding the
              # data is usable.
              #
              # A disk that is not ready is not a degradation, it is total
              # loss of storage on that node -- no volume can attach, so
              # every stateful pod stops. On a single-node cluster that is
              # the whole cluster.
              - uid: longhorn-disk-not-ready
                title: LonghornDiskNotReady
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # `== bool 0` rather than `== 0`, and sum rather than
                      # count. The difference decides whether this rule works.
                      #
                      # `count(X == 0)` FILTERS: when every disk is healthy it
                      # matches no series and returns an empty result, which
                      # Grafana reports as NoData. Paired with
                      # noDataState: Alerting that fires the alert precisely
                      # when the disk is fine -- observed live on 2026-08-31,
                      # with longhorn_disk_status{condition="ready"} = 1 and
                      # this alert firing.
                      #
                      # `== bool 0` MAPS instead: each series becomes 1 or 0, so
                      # sum() is the number of unhealthy disks and is 0 rather
                      # than empty when all are fine. NoData then means only one
                      # thing -- the metric is absent entirely -- which is a real
                      # fault and correctly alerts, because a disk nobody can see
                      # is not a disk known to be good.
                      expr: 'sum(longhorn_disk_status{condition="ready"} == bool 0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    A Longhorn disk is not ready -- no volume can attach
                  description: >-
                    Longhorn has marked a disk not ready, so no volume backed by it can attach and every stateful pod using one will stay Pending or CrashLooping. Read the reason from the condition_reason label on longhorn_disk_status. DiskFilesystemChanged means the diskUUID Longhorn recorded no longer matches the longhorn-disk.cfg on the filesystem -- which happens when the disk is replaced, reformatted, or re-initialised underneath it, and Longhorn then refuses it rather than risk writing replicas onto the wrong storage. Compare the diskUUID in nodes.longhorn.io status.diskStatus against the on-disk longhorn-disk.cfg. If the filesystem genuinely is the original, restoring the recorded UUID into that file re-adopts the disk with its replicas intact; if it genuinely is a new disk, the replicas are gone and the volumes must be restored from backup.
                labels:
                  severity: critical
                isPaused: false
              - uid: longhorn-not-schedulable
                title: LonghornNodeNotSchedulable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # `== bool 0` rather than `== 0`, and sum rather than
                      # count. The difference decides whether this rule works.
                      #
                      # `count(X == 0)` FILTERS: when every disk is healthy it
                      # matches no series and returns an empty result, which
                      # Grafana reports as NoData. Paired with
                      # noDataState: Alerting that fires the alert precisely
                      # when the disk is fine -- observed live on 2026-08-31,
                      # with longhorn_disk_status{condition="ready"} = 1 and
                      # this alert firing.
                      #
                      # `== bool 0` MAPS instead: each series becomes 1 or 0, so
                      # sum() is the number of unschedulable disks and is 0 rather
                      # than empty when all are fine. NoData then means only one
                      # thing -- the metric is absent entirely -- which is a real
                      # fault and correctly alerts, because a disk nobody can see
                      # is not a disk known to be good.
                      expr: 'sum(longhorn_disk_status{condition="schedulable"} == bool 0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting, not OK. With the bool form above, an empty
                # result no longer means "all healthy" -- it means the
                # metric is gone, and a scheduling state nobody can read
                # is not a scheduling state known to be good.
                noDataState: Alerting
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    Longhorn cannot place new replicas
                  description: >-
                    A Longhorn node or disk cannot accept new replicas. Less severe than the disk being not-ready -- already-attached volumes keep working -- but a volume that detaches cannot come back, and any rebuild or new PVC will hang. Often the same underlying cause as LonghornDiskNotReady and expected to fire alongside it; on its own it usually means allowScheduling was turned off or the disk is out of space.
                labels:
                  severity: warning
                isPaused: false
              # backup-verify reads every SeaweedFS backup object and compares it
              # to the vault. These four rules are the only thing that surfaces
              # its result -- without them the job is a check nobody sees.
              #
              # Every query is wrapped in last_over_time(). These are PUSHED once
              # a day, not scraped, so an instant query returns nothing for
              # 23 of every 24 hours and the rules would sit permanently in
              # NoData. Confirmed on this cluster: the same metrics read ABSENT
              # instantly and correct through a 6h window, 42 minutes after the
              # run that wrote them.
              - uid: seaweedfs-backup-unreadable
                title: SeaweedFSBackupUnreadable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 93600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(seaweedfs_verify_objects_unreadable[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0s
                annotations:
                  summary: >-
                    A backup object cannot be read locally and IS recoverable from the vault
                  description: >-
                    backup-verify found objects that list at the correct size, answer HEAD, and fail on GET -- SeaweedFS has lost their chunks while the filer kept their metadata. These specific objects still exist in the offsite vault, so they are recoverable and the recovery is a single deliberate step. Run `kubectl create job -n longhorn-system repair-manual --from=cronjob/backup-repair`, then read its output before assuming it worked. Do not leave this firing: an object counted here is a backup you do not actually have, and the count only grows.
                labels:
                  severity: critical
                isPaused: false
              - uid: seaweedfs-backup-mismatch
                title: SeaweedFSBackupMismatch
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 93600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(seaweedfs_verify_objects_mismatch[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0s
                annotations:
                  summary: >-
                    A local backup and its offsite copy have diverged
                  description: >-
                    An object reads correctly on both sides but their MD5s differ, so one of the two copies is not what was written. This is more serious than it looks: nothing else in the pipeline would notice, because both copies are individually healthy. The comparison cannot say which side is wrong -- check whether the local object still matches what produced it (a database dump should still restore) before deciding which copy to trust. Never resolve it by running backup-repair blindly: that overwrites local with remote and would destroy the good copy if the remote is the corrupted one.
                labels:
                  severity: critical
                isPaused: false
              - uid: seaweedfs-lost-objects-increased
                title: SeaweedFSLostObjectsIncreased
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 180000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # Today's count against yesterday's, rather than a fixed
                      # threshold. 53 objects are permanently lost from the
                      # 2026-08-26 incident and no run will ever recover them, so
                      # a `> 0` rule would fire forever and be muted within a
                      # week. Comparing against the previous day makes the rule
                      # self-maintaining: the known baseline cancels out and only
                      # NEW permanent loss fires.
                      expr: 'last_over_time(seaweedfs_verify_objects_lost[26h]) - last_over_time(seaweedfs_verify_objects_lost[26h] offset 24h)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0s
                annotations:
                  summary: >-
                    Backup objects were lost with no offsite copy to recover from
                  description: >-
                    The count of permanently unrecoverable objects went up since yesterday. These are objects whose local chunks are gone AND which were never relayed, so nothing can bring them back -- the data is simply lost. That places the fault in the window between an object being written and the relay copying it out, which is the gap that destroyed the 26 August database dumps. Investigate what wrote the objects and whether the relay ran; if this recurs, the relay cadence is too slow for how fast that data changes.
                labels:
                  severity: warning
                isPaused: false
              - uid: seaweedfs-verify-stale
                title: SeaweedFSVerifyStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 93600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(seaweedfs_verify_objects_checked[26h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting, not OK. The whole point of this rule is the case
                # where the job stopped running: it pushes nothing, the series
                # goes stale, and the query returns no data. Treating that as OK
                # would mean the three rules above go quiet exactly when their
                # input disappears -- silence that reads identically to success.
                noDataState: Alerting
                execErrState: Alerting
                for: 30m
                annotations:
                  summary: >-
                    backup-verify has not reported in over a day -- the other backup checks are blind
                  description: >-
                    No result from backup-verify in 26 hours. While this is firing, SeaweedFSBackupUnreadable and SeaweedFSBackupMismatch prove nothing: they read a metric that is no longer being written, so their silence means the check stopped rather than that the backups are healthy. Check the CronJob in longhorn-system and read the last Job's logs. If the pod is already gone, the logs are still in VictoriaLogs -- query kubernetes_pod_name, since the Job controller deletes pods on BackoffLimitExceeded and takes the logs with them.
                labels:
                  severity: warning
                isPaused: false
              # The upgrade gate authorises Sunday's upgrades by labelling the
              # nodes, and the label is a STANDING permission -- it persists
              # until something removes it. The gate clears it at the start of
              # every run so a crash mid-check cannot leave last week's
              # authorisation in place, but that only helps if the gate RUNS.
              # A gate that stops firing entirely leaves the last successful
              # label sitting there, and the Plans would upgrade on evidence
              # nobody re-examined. These two rules are what makes that visible.
              - uid: upgrade-gate-stale
                title: UpgradeGateStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 864000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: '(time() - last_over_time(upgrade_gate_last_run_timestamp[9d])) / 86400'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [8]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on absence, deliberately. A gate that has never
                # pushed and a gate that stopped pushing are the same hazard,
                # and treating "no data" as healthy would mean this rule goes
                # quiet in precisely the case it exists for.
                noDataState: Alerting
                execErrState: Alerting
                for: 1h
                annotations:
                  summary: >-
                    The pre-upgrade backup gate has not run in over 8 days
                  description: >-
                    upgrade-backup-gate runs at 11:00 on Sundays and decides whether that day's Talos and Kubernetes upgrades may proceed, by proving the backups are recent and readable. It has not reported in over 8 days, so it has missed at least one window. That matters beyond the missed upgrade: the talos.homelab/upgrade-ready label is a standing permission, so if a previous run left it set, the Plans will act on an authorisation nothing has re-checked since. Verify with `kubectl get nodes -L talos.homelab/upgrade-ready` and remove the label by hand if it is present while this is firing.
                labels:
                  severity: warning
                isPaused: false
              - uid: upgrade-gate-refusing
                title: UpgradeGateRefusing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 864000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(upgrade_gate_pass[9d])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK on no-data: absence is UpgradeGateStale's job, and having
                # both fire on it would double-page for one fault.
                noDataState: OK
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    Upgrades are blocked -- the backup gate refused
                  description: >-
                    The gate ran and declined to authorise upgrades, so no Talos or Kubernetes Plan will act until it passes. This is the mechanism working, not failing: it means the backups could not be shown to be both recent and readable, and upgrading a single-node cluster without a proven way back is the thing it exists to prevent. It is a warning rather than a page because nothing is broken right now -- but left unattended the cluster silently stops receiving upgrades, including security ones. Read the last gate Job's log for the reasons; the usual causes are a Longhorn backup that did not run, or backup-verify finding unreadable objects. The manual override is talos-on-demand, which is deliberately ungated.
                labels:
                  severity: warning
                isPaused: false
          # 2026-09-04. The Talos/Kubernetes upgrade Plans have no dependency
          # field between them (see talos-version-gate-script.yaml) and no
          # native alert of their own -- the only reason the 2026-09-03
          # drain-storm incident and a transient scheduler-config-propagation
          # retry were both caught was a human watching the rehearsal live.
          # Sunday's real run is unattended, so a Job that hangs or exhausts
          # its retries needs to page someone rather than sit unnoticed until
          # the next manual check.
          - orgId: 1
            name: System Upgrade Alerts
            folder: Infrastructure
            interval: 5m
            rules:
              # kube_job_status_start_time/succeeded come from kube-state-
              # metrics, confirmed present for cattle-system Jobs by direct
              # query against vmsingle on 2026-09-04. `unless on(job_name)` on
              # a metric family that ONLY carries succeeded==1 series drops any
              # job_name that has already succeeded, leaving only jobs still
              # running or that gave up -- both read the same way here, since
              # a Job that exhausted SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT (see
              # operator/helmrelease.yaml) never sets succeeded and its
              # start_time stops advancing, so elapsed time keeps climbing
              # past the threshold below exactly like a hang would.
              #
              # `or vector(0)` guarantees a value even on the normal six days
              # a week with no matching Job at all, so noDataState never has
              # to guess between "nothing running" and "query broke".
              #
              # 1200s (20m): every completed run this cluster has seen,
              # including the one that needed a retry, finished in well under
              # that; ACTIVE_DEADLINE_SECONDS still kills the Job at 2700s
              # regardless, so this fires with ~25 minutes to spare for
              # someone to look before that happens.
              - uid: stuck-upgrade-job
                title: StuckUpgradeJob
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 60
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        max((time() -
                        kube_job_status_start_time{namespace="cattle-system",
                        job_name=~"apply-talos-.*"}) unless on(job_name)
                        kube_job_status_succeeded{namespace="cattle-system",
                        job_name=~"apply-talos-.*"} == 1) or vector(0)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1200]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A Talos/Kubernetes upgrade Job has not completed in over 20 minutes
                  description: >-
                    apply-talos-controlplane or apply-talos-kubernetes has been running (or exhausted its retries trying to) for more than 20 minutes without succeeding -- every clean run so far, including one that needed a retry, finished well inside that. Check `kubectl get jobs -n cattle-system` and `kubectl logs -n cattle-system -l upgrade.cattle.io/plan=<plan>` first. On 2026-09-03 the cause was talosctl's own --drain=true evicting Kyverno's admission controller, which fails closed and blocked every pod create cluster-wide, including the retry pods for this same Job -- that specific failure mode is now fixed (--drain=false on all three Plans), but this alert exists because the next cause is not guaranteed to be the same one.
                labels:
                  severity: critical
                isPaused: false
          # 2026-09-04. Ported from 02-victoriametrics-stack/alert-rules.yaml,
          # which is deleted in the same commit.
          #
          # Those five VMRules reported `operational` for their whole life and
          # could never have notified anyone: vmalert runs with
          # `-notifier.blackhole=true` and this cluster has no Alertmanager, so
          # every alert they produced was discarded. vmalert itself stays --
          # it also evaluates 253 chart-shipped RECORDING rules that dashboards
          # read, which is why the fix is to move the alerting rules here rather
          # than to remove vmalert.
          #
          # Two of the nine were not ported, and two more were wrong on their
          # own terms -- all four found by querying the metric before trusting
          # the rule, which is the only reason they surfaced at all:
          #
          #   - CiliumL7PolicyAccessDenied read envoy_cilium_access_denied.
          #     That metric family does not exist here at all: the Gateway moved
          #     off Cilium's embedded GatewayClass to Envoy Gateway on
          #     2026-08-16 (ADR-001), so Cilium's L7 proxy is no longer in the
          #     data path and never will be again. Dropped rather than ported.
          #   - TrivyExposedSecret is already covered by ImageExposedSecret.
          #   - TrivyRBACCritical read trivy_resource_rbacassessments, which
          #     does not exist. The real names are trivy_role_rbacassessments
          #     and trivy_clusterrole_clusterrbacassessments. Corrected below.
          #   - Both Trivy rules matched severity="CRITICAL". The label value is
          #     title case, "Critical". They could not have matched even with a
          #     working notifier. Corrected below.
          #
          # VeleroBackupStale was also rebuilt. The original compared every
          # schedule against a single 25h bound, which the weekly and monthly
          # schedules exceed by design -- it would have been permanently true.
          # Each schedule is now divided by its own allowance so the rule reads
          # "any schedule past its own deadline", and stays correct if the
          # schedules change.
          - orgId: 1
            name: Platform Health
            folder: Infrastructure
            interval: 5m
            rules:
              # One Certificate exists (homelab-wildcard-tls, gateway-system)
              # and it fronts every HTTPS listener, so min() over the family is
              # both the soonest expiry and the only one.
              - uid: certificate-expiry-warning
                title: CertificateExpiryWarning
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(certmanager_certificate_expiration_timestamp_seconds - time())'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1209600]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK here, Alerting on the critical rule below -- a missing
                # metric is one fault and should page once, not twice.
                noDataState: OK
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    A TLS certificate expires in under 14 days
                  description: >-
                    cert-manager reports a certificate inside 14 days of expiry and it has not renewed. Check `kubectl describe certificate -n gateway-system homelab-wildcard-tls` and the cert-manager logs. This is the wildcard that fronts every HTTPS listener, so an expiry is a full outage of everything behind the Gateway, not a partial one.
                labels:
                  severity: warning
                isPaused: false
              - uid: certificate-expiry-critical
                title: CertificateExpiryCritical
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(certmanager_certificate_expiration_timestamp_seconds - time())'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [259200]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting: if the metric disappears, cert expiry is unobservable
                # on the one certificate the whole Gateway depends on. Not
                # knowing is the same risk as knowing it is close.
                noDataState: Alerting
                execErrState: Alerting
                for: 1h
                annotations:
                  summary: >-
                    A TLS certificate expires in under 3 days
                  description: >-
                    Renewal has not happened with three days left. Manual intervention is likely needed -- `kubectl delete certificaterequest -n gateway-system --all` forces cert-manager to retry. If this is firing on NoData instead, cert-manager is not being scraped and the expiry is simply unknown, which needs the same urgency.
                labels:
                  severity: critical
                isPaused: false
              - uid: flux-reconciliation-error
                title: FluxReconciliationError
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(controller_runtime_reconcile_total{job="flux", result="error"}[10m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    Flux is failing to reconcile
                  description: >-
                    A Flux controller is returning reconciliation errors, which means git is no longer being applied to the cluster -- changes merge and silently do not land. Start with `flux get kustomizations` and `flux get helmreleases -A`, then the failing controller's logs. `or vector(0)` keeps this at 0 rather than empty when healthy, so NoData means the Flux metrics stopped being scraped rather than that everything is fine.
                labels:
                  severity: warning
                isPaused: false
              - uid: velero-backup-failed
                title: VeleroBackupFailed
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 21600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(velero_backup_failure_total[6h])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    A Velero backup failed
                  description: >-
                    Velero is the namespace/manifest arm of the backup strategy -- Longhorn covers volumes, the logical dumps cover databases, and this covers the Kubernetes objects needed to rebuild. Check `kubectl get backups.velero.io -n velero` for the phase and `kubectl describe` the failing one. Critical rather than warning because backup-chain failures elsewhere in this cluster page, and a warning only repeats daily.
                labels:
                  severity: critical
                isPaused: false
              # Each schedule against its own allowance, expressed as a ratio so
              # one threshold covers all three: daily 25h, weekly 8d, monthly
              # 32d. Above 1 means that schedule is past its own deadline. The
              # selectors are disjoint, so `or` unions them rather than masking.
              - uid: velero-backup-stale
                title: VeleroBackupStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        max(
                        (time() - velero_backup_last_successful_timestamp{schedule="daily-local"}) / 90000
                        or (time() - velero_backup_last_successful_timestamp{schedule="weekly-offsite"}) / 691200
                        or (time() - velero_backup_last_successful_timestamp{schedule="monthly-offsite"}) / 2764800
                        )
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    A Velero schedule has not had a successful backup within its own deadline
                  description: >-
                    Expect this to be firing when first deployed: weekly-offsite last succeeded 2026-08-09 and has been Failed, PartiallyFailed or FailedValidation on every run since, which is exactly what nothing was reporting while these rules were blackholed. Check `kubectl get backups.velero.io -n velero` -- the phase column, not just presence. NoData alerts because Velero not publishing this metric is indistinguishable from Velero not running.
                labels:
                  severity: critical
                isPaused: false
              - uid: trivy-config-audit-critical
                title: TrivyConfigAuditCritical
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(trivy_resource_configaudits{severity="Critical"}) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    Trivy found CRITICAL config-audit findings
                  description: >-
                    Workload misconfiguration, distinct from the image CVE rules. Run `kubectl get configauditreports -A --sort-by=.metadata.creationTimestamp`. Currently 0 Critical (306 High, 483 Medium), so this firing means something new landed.
                labels:
                  severity: warning
                isPaused: false
              # Delta, not an absolute count, and the 62 findings this fired on
              # when first deployed are why.
              #
              # All 62 were triaged 2026-09-04. 61 of them are on roles this
              # repo cannot change:
              #
              #   13  Kubernetes built-ins -- system:*, cluster-admin, admin,
              #       edit, view. Shipped by Kubernetes, reverted if edited.
              #   26  upstream chart/operator roles -- kyverno:* (6),
              #       cert-manager-* (6), victoria-metrics/vmstack (4),
              #       envoy-gateway (2), flux (3), longhorn, cilium-operator,
              #       cloudnative-pg, reloader, trivy-operator. Reverted on the
              #       next chart upgrade.
              #    3  namespaced Roles, all Helm-managed: longhorn, velero-server,
              #       tailscale operator.
              #
              # The 62nd is kubescape-scan, the only one this repo authors, and
              # it is a false positive: AVD-KSV-0046 flags wildcard RESOURCES
              # without regard to the verbs, and that role holds get/list/watch
              # and nothing else. A cluster posture scanner that cannot read
              # every resource cannot scan every resource.
              #
              # So the absolute count cannot reach zero, and an alert that is
              # always firing is one nobody reads -- the failure mode Agent.md
              # records under "an alert that is always on". Its prescription is
              # this: compare against the previous day so a known-bad baseline
              # cancels and only NEW findings fire. Same shape as
              # SeaweedFSUnreadableBackupObjects, for the same reason.
              #
              # Scoping by name instead was considered and does not work: the
              # only distinguishing label Trivy puts on these series is `name`,
              # and it carries the hashed report name (clusterrole-54cdc9b678),
              # not the ClusterRole's. There is nothing readable to exclude on.
              #
              # The trade is explicit: a new finding that persists past 24h
              # stops alerting once the baseline absorbs it. That is acceptable
              # here because a rise is the actionable signal -- the standing 62
              # are already recorded in docs/backlog.md rather than depending on
              # this rule to keep saying so.
              #
              # Both sides are guarded with `or vector(0)`, verified live: with
              # the metric absent the expression returns 0 rather than empty, so
              # NoData continues to mean "Trivy stopped reporting" and not
              # "nothing is wrong".
              - uid: trivy-rbac-critical
                title: TrivyRBACCritical
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 90000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: '((sum(trivy_role_rbacassessments{severity="Critical"}) or vector(0)) + (sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"}) or vector(0))) - ((sum(trivy_role_rbacassessments{severity="Critical"} offset 24h) or vector(0)) + (sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"} offset 24h) or vector(0)))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    New CRITICAL RBAC findings appeared in the last 24h
                  description: >-
                    This fires on a RISE, not on the total -- 62 findings are a known, triaged baseline that cancels out (see docs/backlog.md and the comment above this rule). A positive delta means a role gained a critical permission since yesterday, which is the part worth waking up for. Identify it with `kubectl get clusterrbacassessmentreports` and `kubectl get rbacassessmentreports -A`, then read the checks -- the report name is hashed, so resolve the real role via its ownerReference. If the new finding is on an upstream chart role it will have arrived with a chart bump, in which case the question is whether that bump is acceptable rather than whether the role can be edited.
                labels:
                  severity: warning
                isPaused: false
              # kubescape's weekly NSA/MITRE posture scan.
              #
              # These read kubescape's OWN metric names and its OWN `severity`
              # label, because --format prometheus emits both natively. An
              # earlier revision parsed the JSON report and derived severity
              # from each control's scoreFactor -- that reinvented a mapping
              # kubescape already publishes, and got a different answer.
              #
              # Push metrics from a WEEKLY job, so both rules wrap in
              # last_over_time over a window wider than the cadence. An instant
              # query returns nothing for six days out of seven.
              - uid: kubescape-critical-control-failing
                title: KubescapeCriticalControlFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 691200
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max(last_over_time(kubescape_control_count_resources_failed{severity="Critical"}[8d])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK, not Alerting: absence here means the scan has not run,
                # which is what KubescapeScanStale is for. Two rules firing on
                # one cause is how a channel stops being read.
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A CRITICAL kubescape control has failing resources
                  description: >-
                    Measured 2026-09-04, the cluster has 3 Critical-severity controls and all of them pass -- the 28 failing controls are 10 High, 14 Medium and 4 Low. So this firing means a resource started failing a control kubescape rates Critical, not that the baseline is bad. The full report for every run is in VictoriaLogs; query `kubernetes_container_name:"publish" AND kubernetes_namespace_name:"kubescape"` and read the kubescape_control_* lines, each of which carries the control name, its severity and a docs link.
                labels:
                  severity: critical
                isPaused: false
              - uid: kubescape-scan-stale
                title: KubescapeScanStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 1209600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(kubescape_scan_last_run_timestamp[14d])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [864000]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData: a scan that never ran and a scan whose
                # metrics never arrived are the same outcome -- no posture
                # signal -- and the whole point of this pair is that the
                # previous job reported nothing for its entire life.
                noDataState: Alerting
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    The kubescape posture scan has not reported in over 10 days
                  description: >-
                    The scan runs Sundays at 02:00, so 10 days means at least one run was missed entirely rather than merely delayed. Check `kubectl get cronjob kubescape-scan -n kubescape` and the last Job's logs. kubescape_scan_last_run_timestamp is appended by the job itself rather than emitted by kubescape, so this can also mean the publish step failed after a successful scan -- the report would still be in VictoriaLogs in that case.
                labels:
                  severity: warning
                isPaused: false
    initChownData:
      enabled: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      fsGroup: 472
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
    # Inject GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from grafana-oauth-secret into Grafana's env.
    # Grafana config below references it via $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}.
    envFromSecret: grafana-oauth-secret
    grafana.ini:
      server:
        root_url: https://grafana.homelab.data-harness.org
      auth.generic_oauth:
        enabled: true
        name: Homelab SSO
        allow_sign_up: true
        scopes: openid email profile groups
        auth_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/userinfo
        client_id: grafana
        client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
        # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): Keycloak's
        # /owner/platform-admin -> Grafana Admin, /maintainer/app-operator ->
        # Editor, everyone else (including /reader/viewer) -> Viewer. Replaces
        # the old flat 'admin' group check now that the group is gone --
        # see setup-job.yaml's migration comment.
        # No trailing 'Viewer' fallback, and role_attribute_strict on. Together
        # they mean a user whose groups match none of these is refused a role,
        # and Grafana then refuses the login.
        #
        # This became load-bearing the moment public self-registration was
        # enabled on the realm. The previous expression ended in || 'Viewer',
        # so ANY account Keycloak authenticated -- including one a stranger had
        # just created for themselves -- was granted Grafana Viewer and could
        # read every dashboard and all metrics. Self-registered accounts are
        # scoped to Paperless and Immich; this is what keeps them out of here.
        #
        # Consequence worth knowing: a real person added to Keycloak but not yet
        # put in a tier group cannot log in to Grafana at all. That is the
        # intended direction of failure -- refused rather than quietly admitted
        # as a Viewer -- but it will look like a broken login rather than a
        # missing group membership.
        role_attribute_path: "contains(groups[*], 'platform-admin') && 'Admin' || contains(groups[*], 'app-operator') && 'Editor' || contains(groups[*], 'viewer') && 'Viewer'"
        role_attribute_strict: true
        use_pkce: true
        auto_login: false
    image:
      tag: 12.4.8
