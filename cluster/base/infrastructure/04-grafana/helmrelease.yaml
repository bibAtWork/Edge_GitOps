apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: vmstack
      namespace: monitoring
  chart:
    spec:
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    service:
      appProtocol: kubernetes.io/http
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Stateless. /var/lib/grafana is an emptyDir, so everything Grafana serves
    # comes from this file on every start: datasources, the eight gnetId
    # dashboards, all twenty-six alert rules, and the admin user from
    # grafana-admin.
    #
    # The volume was removed rather than moved to Longhorn because it had
    # stopped being state and started being drift. Its dashboards directory is
    # written by the chart's download-dashboards init container, which only
    # ever adds, so an entry deleted from this list never removed the file it
    # had written. Two dashboards were still on disk and still loading with
    # nothing in Git describing them; both are declared again above.
    #
    # One of them is a good illustration of how little a filename proves. It
    # was being served from a file called seaweedfs.json, which contained not a
    # SeaweedFS dashboard but a copy of gnetId 14817, "Node Exporter - USE
    # Method / Node" -- so the dashboard that appeared in Grafana had no
    # relationship to the name of the file producing it, and no way to notice
    # short of reading the JSON.
    #
    # What is genuinely lost, and it is not nothing:
    #
    #  - Alert state. A restart re-evaluates every rule from scratch, so
    #    anything currently firing notifies again. Silences do not survive
    #    either; there were none.
    #  - Annotation history, starred dashboards, user preferences.
    #  - ~255MB of plugin payload, re-downloaded from grafana.com on every
    #    start (208MB of it victoriametrics-logs-datasource). This puts an
    #    external dependency on the startup path: if grafana.com is
    #    unreachable, Grafana comes up without the VictoriaLogs datasource
    #    rather than not at all, which is the quieter of the two failures and
    #    so the one worth knowing about in advance.
    #
    # No API keys or service accounts live in that database -- nothing in this
    # cluster authenticates to Grafana -- so nothing else breaks when it is
    # discarded. Anything that should survive a restart belongs in this file.
    persistence:
      enabled: false
    plugins:
      - victoriametrics-logs-datasource
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: VictoriaMetrics
            uid: victoriametrics
            type: prometheus
            url: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428 # nosonar
            access: proxy
            isDefault: true
          - name: VictoriaLogs
            uid: victorialogs
            type: victoriametrics-logs-datasource
            url: http://vlsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:9428 # nosonar
            access: proxy
            isDefault: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        node-exporter:
          gnetId: 1860
          revision: 37
          datasource: VictoriaMetrics
        cilium-hubble:
          gnetId: 16611
          revision: 1
          datasource: VictoriaMetrics
        velero:
          gnetId: 15469
          revision: 1
          datasource: VictoriaMetrics
        trivy-operator:
          gnetId: 17813
          revision: 1
          datasource: VictoriaMetrics
        # Backlog item 13 / ADR-001 "not yet realized": Envoy Gateway's own
        # observability. Official envoy-mixin-project dashboards, matching the
        # two scrape targets in 02-victoriametrics-stack/scrape-configs.yaml —
        # control plane (envoy-gateway-controller) and data plane
        # (envoy-gateway-proxy). Both use a `job` template variable populated
        # from label_values(), not a hardcoded job name, so they work
        # regardless of the exact job label our scrape configs set.
        envoy-gateway-overview:
          gnetId: 24460
          revision: 1
          datasource: VictoriaMetrics
        envoy-overview:
          gnetId: 24459
          revision: 3
          datasource: VictoriaMetrics
        # These two were already being served before the move to a stateless
        # Grafana, from files left on the old volume by dashboard entries
        # deleted from this list months ago. The download-dashboards init
        # container only ever adds, so removing an entry here never removed the
        # file, and both kept loading with nothing in Git describing them.
        #
        # Declared rather than dropped: they were in daily use, and the point of
        # going stateless was to make what Grafana serves match what is written
        # down, not to lose dashboards.
        #
        # gnetId 14817 is a special case worth flagging before someone
        # "corrects" it. https://grafana.com/api/dashboards/14817 returns 404,
        # so it looks deleted -- but the revisions/N/download endpoint the chart
        # actually calls returns it fine. Confirmed by fetching both and
        # comparing against the copies recovered from the old volume.
        node-exporter-use-method:
          gnetId: 14817
          revision: 1
          datasource: VictoriaMetrics
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: VictoriaMetrics
    alerting:
      rules.yaml:
        apiVersion: 1
        groups:
          # Detects the blind spot rather than engineering around it.
          #
          # The monitoring stores sit on Longhorn, which is also what they
          # monitor. On 2026-08-26 a Longhorn fault faulted vmsingle's volume
          # and took out the detection for its own cause: the disk published
          # longhorn_disk_status{condition="ready"} = 0 for four days and no
          # rule could evaluate, because every rule needs the datasource that
          # was down. Moving the stores off Longhorn breaks that loop but
          # costs snapshots and, past one node, the ability to reschedule
          # with the data. These rules keep Longhorn and close the loop the
          # other way.
          #
          # VictoriaMetricsUnavailable is the one that matters, and it is
          # deliberately built so that it CANNOT depend on what it watches.
          # Grafana evaluates it, runs with persistence.enabled: false, holds
          # no PVC, and so has no Longhorn dependency. The query is vector(1)
          # -- constant, no stored data required -- so it succeeds whenever
          # VictoriaMetrics answers at all and errors when it does not.
          # execErrState: Alerting turns that error into a page. A rule that
          # queried real data would report NoData for an empty-but-healthy
          # database and could not tell "nothing scraped" from "nothing
          # answering".
          #
          # The other two go through VictoriaMetrics on purpose. A rule
          # against the VictoriaLogs datasource does not work in this cluster
          # -- that datasource has never produced a working alert here -- and
          # there is no Grafana datasource for VictoriaTraces at all. Reading
          # their up series out of VictoriaMetrics is sound because the case
          # where VictoriaMetrics itself is down is already covered above;
          # the rules compose rather than overlap.
          - orgId: 1
            name: Monitoring Availability
            folder: Monitoring
            interval: 1m
            rules:
              - uid: victoriametrics-unavailable
                title: VictoriaMetricsUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'vector(1)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Alerting
                for: 5m
                annotations:
                  summary: >-
                    VictoriaMetrics is not answering -- every other alert in this cluster is currently blind
                description: >-
                  Grafana cannot query VictoriaMetrics. Treat every other alert as unreliable while this is firing: they all evaluate against this datasource, so their silence means nothing. This rule is the exception, because it queries vector(1) -- a constant needing no stored data -- so it fires on the datasource being unreachable rather than on the data being absent. Most likely causes are the vmsingle pod not running, or its Longhorn PVC failing to attach. Check the vmsingle pod first, then its PVC, then the Longhorn disk condition. If the disk is the cause, longhorn_disk_status cannot be read while this is firing -- read it from nodes.longhorn.io in the API instead.
                labels:
                  severity: critical
                isPaused: false
              - uid: victorialogs-unavailable
                title: VictoriaLogsUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(up{job="vlsingle-vmstack-victoria-metrics-k8s-stack"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Alerting
                for: 10m
                annotations:
                  summary: >-
                    VictoriaLogs is not answering -- log queries and log-based panels are blind
                description: >-
                  The vlsingle scrape target is down or its series has gone stale. Collectors keep shipping logs but they have nowhere to land, so the gap is not recoverable after the fact. noDataState is Alerting deliberately: if the pod is deleted outright the up series disappears rather than going to 0, and a rule that only tested for 0 would go quiet exactly when the component is most gone. Check the vlsingle pod and its Longhorn PVC.
                labels:
                  severity: warning
                isPaused: false
              - uid: victoriatraces-unavailable
                title: VictoriaTracesUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(up{job="vtsingle-vmstack-victoria-metrics-k8s-stack"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Alerting
                for: 10m
                annotations:
                  summary: >-
                    VictoriaTraces is not answering
                description: >-
                  The vtsingle scrape target is down or its series has gone stale. Traces are the least critical of the three stores -- nothing alerts on them and no Grafana datasource is wired to it -- so this is a warning rather than a page. It is included because a store nothing watches is a store that stays broken.
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Trivy CVE Alerts
            folder: Security
            interval: 15m
            rules:
              # Efficiency review 2026-08-17: this rule (previously trivy-high-cvss /
              # ImageHighCVSS) had never once fired since it was written -- its PromQL
              # filtered on a label called `score`, but trivy-operator actually exports
              # the field as `vuln_score` (confirmed live against the raw metric's label
              # set). `score` doesn't exist on any of the ~3500 CVE series this cluster
              # currently has, so the filter silently matched nothing, forever. Fixing
              # the label surfaced 208 real findings across 18 images that had been
              # invisible the whole time.
              #
              # Split into two rules on the way past, per explicit direction: alert
              # (urgent, fast-repeat) only for Critical; track (visible, slower-repeat)
              # for High+Critical combined -- reusing the existing severity-based
              # routing in grafana-telegram.yaml's alerting.policies.yaml
              # (severity=critical -> repeat_interval 1h; everything else -> 4h) rather
              # than building new notification plumbing. Matching on the severity label
              # directly (Critical/High, confirmed exact casing live) instead of a CVSS
              # score regex -- simpler and avoids the boundary-off-by-one risk a regex
              # has (Trivy's own severity classification is already CVSS-score-derived).
              - uid: trivy-critical-cve
                title: ImageCriticalCVE
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # Aggregated per IMAGE, not per CVE.
                      #
                      # trivy_vulnerability_id carries one series per CVE per
                      # resource -- 10,392 of them on this cluster. Grafana
                      # creates one alert instance per returned series, so
                      # querying it raw produced 1,325 firing instances on
                      # 2026-09-03: an alerting system that is technically
                      # working and practically off.
                      #
                      # count by (namespace, image) collapses that to one
                      # instance per affected image -- 16 for Critical. The CVE
                      # list is dashboard material; a notification only has to
                      # say which image needs attention.
                      #
                      # No fixed_version filter. Unfixable CVEs are still worth
                      # knowing about even though no upgrade clears them, so
                      # they are counted here and broken out separately in the
                      # annotation rather than dropped.
                      expr: 'count by (exported_namespace, image_repository) (trivy_vulnerability_id{severity="Critical"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Lengthened 2026-08-17: home lab, not production -- a CVE finding isn't a
                # transient blip, it'll still be there in two hours, so there's no reason to
                # notify within the first one.
                for: 2h
                annotations:
                  # {{ "{{" }} ... }} escapes Helm's tpl pass; Grafana sees {{ $labels.xxx }}
                  summary: >-
                    CRITICAL CVEs in {{ "{{" }} $labels.image_repository }} ({{ "{{" }} $value }} findings)
                  description: >-
                    Trivy found {{ "{{" }} $value }} Critical CVEs in {{ "{{" }} $labels.image_repository }}, running in namespace {{ "{{" }} $labels.exported_namespace }}. Counted per IMAGE rather than per CVE: querying trivy_vulnerability_id directly returns one series per CVE per resource -- 10,392 on this cluster -- and Grafana raises one alert instance per series, which produced 1,325 firing instances on 2026-09-03. The individual CVE ids, scores and fixed versions are in the Trivy dashboard; this alert exists to name the image that needs attention. Unfixable CVEs are included in the count on purpose -- no upgrade clears them, but they still describe the exposure being carried.
                labels:
                  severity: critical
                isPaused: false
              - uid: trivy-high-critical-tracking
                title: ImageHighCVE
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # High EXCLUDING images that already have a Critical.
                      #
                      # Previously this matched severity=~"High|Critical", so
                      # every image with a Critical fired both this rule and
                      # ImageCriticalCVE -- two notifications, same action. The
                      # `unless` drops images already covered by the Critical
                      # rule, leaving this one to mean exactly "High, and
                      # nothing worse".
                      expr: 'count by (exported_namespace, image_repository) (trivy_vulnerability_id{severity="High"}) unless count by (exported_namespace, image_repository) (trivy_vulnerability_id{severity="Critical"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Lengthened 2026-08-17 — see trivy-critical-cve above.
                for: 2h
                annotations:
                  summary: >-
                    High CVEs in {{ "{{" }} $labels.image_repository }} ({{ "{{" }} $value }} findings, no Critical)
                  description: >-
                    Trivy found {{ "{{" }} $value }} High CVEs in {{ "{{" }} $labels.image_repository }}, in namespace {{ "{{" }} $labels.exported_namespace }}, and no Critical ones. Images that also carry a Critical are excluded here and covered by ImageCriticalCVE instead -- previously both rules matched them, so every Critical image produced two notifications for one action. Counted per image rather than per CVE; the CVE list belongs in the dashboard.
                labels:
                  severity: warning
                isPaused: false
              # New: trivy_image_exposedsecrets was already exported by the operator
              # (metricsVulnIdEnabled's sibling data) with zero alerting on it. Unlike
              # CVEs -- numerous, often no fix available yet -- a secret baked into an
              # image is rare and almost always actionable, so this pages on the fast
              # route like Critical CVEs rather than getting bundled into the tracking
              # rule above.
              - uid: trivy-exposed-secrets
                title: ImageExposedSecret
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 900
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'trivy_image_exposedsecrets > 0'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Lengthened 2026-08-17 — see trivy-critical-cve above.
                for: 1h
                annotations:
                  summary: >-
                    Exposed secret in {{ "{{" }} $labels.image_repository }}:{{ "{{" }} $labels.image_tag }}
                  description: >-
                    {{ "{{" }} $labels.exported_namespace }}/{{ "{{" }} $labels.resource_name }} ({{ "{{" }} $labels.resource_kind }}) runs an image Trivy flagged as containing an exposed secret. Check: kubectl get vulnerabilityreport -n {{ "{{" }} $labels.exported_namespace }} {{ "{{" }} $labels.name }} -o jsonpath='{.report.secrets}'
                labels:
                  severity: critical
                isPaused: false
          - orgId: 1
            name: Log Security Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: log-oomkilled
                title: PodOOMKilled
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # "by (namespace, pod, container)" rather than a bare
                      # sum(): container_oom_events_total already carries those
                      # labels, and collapsing them produces a single anonymous
                      # "something was OOMKilled" alert that names neither the
                      # workload nor the namespace. Same fix, and same reason,
                      # as the FalcoCriticalEvent rule below.
                      #
                      # This mattered on 2026-08-18: the SeaweedFS CSI mount
                      # daemon was OOMKilled, which took every SeaweedFS volume
                      # on the node down at once, and this rule reported it as
                      # an unlabelled warning indistinguishable from any other
                      # pod hitting its limit.
                      expr: 'sum by (namespace, pod, container) (increase(container_oom_events_total{pod!=""}[10m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    OOMKilled: {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.pod }} (container {{ "{{" }} $labels.container }})
                  description: >-
                    Container {{ "{{" }} $labels.container }} in {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.pod }} exceeded its memory limit and was killed. Check whether the limit is genuinely too low or the workload regressed: kubectl get pod -n {{ "{{" }} $labels.namespace }} {{ "{{" }} $labels.pod }} -o jsonpath='{.spec.containers[*].resources}'. Note that a container with no explicit limit inherits the namespace LimitRange default, which is how the SeaweedFS mount daemon ended up capped at 256Mi.
                labels:
                  severity: warning
                isPaused: false
              - uid: log-grafana-auth-fail
                title: GrafanaAuthFailures
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(grafana_api_login_post_total[5m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [5]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 2m
                annotations:
                  summary: >-
                    {{ "{{" }} $value }} native Grafana login attempts in 5 min
                  description: >-
                    More than 5 native Grafana login attempts detected. With Keycloak SSO active, native logins are anomalous and may indicate credential stuffing. Check: kubectl logs -n monitoring -l app.kubernetes.io/name=grafana
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Security Tool Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: kyverno-policy-violation
                title: KyvernoPolicyViolation
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'increase(kyverno_policy_results_total{result="fail"}[5m])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Kyverno policy violation in {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.resource_namespace }}
                  description: >-
                    Policy {{ "{{" }} $labels.policy_name }} failed for resource {{ "{{" }} $labels.resource_kind }}/{{ "{{" }} $labels.resource_name }} in namespace {{ "{{" }} $labels.resource_namespace }}. Check: kubectl get policyreport -A
                labels:
                  severity: warning
                isPaused: false
              - uid: falco-critical-event
                title: FalcoCriticalEvent
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # "by (rule_name, priority)" instead of a bare sum():
                      # a plain sum() collapses every label, which is why
                      # the alert previously had no context about which
                      # rule actually fired. Grouping keeps rule_name/
                      # priority available for the annotation template
                      # below, and splits distinct rules into separate
                      # alert instances instead of one undifferentiated
                      # blob. The metric itself doesn't carry the specific
                      # offending pod/namespace/process (that level of
                      # detail only exists in Falco's own logs, not this
                      # aggregate counter), so the annotation still points
                      # at the log command for full detail.
                      expr: 'sum by (rule_name, priority) (increase(falcosecurity_falco_rules_matches_total{priority=~"0|1|2"}[5m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Falco rule "{{ "{{" }} $labels.rule_name }}" fired (priority {{ "{{" }} $labels.priority }}, 0=Emergency 1=Alert 2=Critical)
                  description: >-
                    {{ "{{" }} $value }} matches in the last 5 minutes. Check: kubectl logs -n falco ds/falco --since=5m | grep '"rule":"{{ "{{" }} $labels.rule_name }}"'
                labels:
                  severity: critical
                isPaused: false
          - orgId: 1
            name: Gateway Auth Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: opa-unavailable
                title: OPAUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'increase(envoy_http_ext_authz_failure_mode_allowed{envoy_http_conn_manager_prefix="gateway_authz"}[5m])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: OPA ext_authz is down — requests bypassing authorization
                  description: >-
