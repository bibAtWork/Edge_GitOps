                  description: >-
                    The probe is bounded by a 32MiB egress budget, not by object count -- the sampled population mixes small metadata with 16MB database dumps, so a fixed count costs anywhere between 1MB and hundreds. A large jump almost always means the smallest-object selection logic broke and it is now pulling real volume data, which costs egress every month for no additional assurance. The threshold is set well above the observed envelope so ordinary growth does not trip it.
                labels:
