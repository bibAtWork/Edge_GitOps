                  severity: warning
                isPaused: false
          - orgId: 1
            name: Log Security Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: log-oomkilled
                title: PodOOMKilled
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # "by (namespace, pod, container)" rather than a bare
                      # sum(): container_oom_events_total already carries those
                      # labels, and collapsing them produces a single anonymous
                      # "something was OOMKilled" alert that names neither the
                      # workload nor the namespace. Same fix, and same reason,
                      # as the FalcoCriticalEvent rule below.
                      #
                      # This mattered on 2026-08-18: the SeaweedFS CSI mount
                      # daemon was OOMKilled, which took every SeaweedFS volume
                      # on the node down at once, and this rule reported it as
                      # an unlabelled warning indistinguishable from any other
                      # pod hitting its limit.
                      expr: 'sum by (namespace, pod, container) (increase(container_oom_events_total{pod!=""}[10m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    OOMKilled: {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.pod }} (container {{ "{{" }} $labels.container }})
                  description: >-
                    Container {{ "{{" }} $labels.container }} in {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.pod }} exceeded its memory limit and was killed. Check whether the limit is genuinely too low or the workload regressed: kubectl get pod -n {{ "{{" }} $labels.namespace }} {{ "{{" }} $labels.pod }} -o jsonpath='{.spec.containers[*].resources}'. Note that a container with no explicit limit inherits the namespace LimitRange default, which is how the SeaweedFS mount daemon ended up capped at 256Mi.
                labels:
                  severity: warning
                isPaused: false
              - uid: log-grafana-auth-fail
                title: GrafanaAuthFailures
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(grafana_api_login_post_total[5m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [5]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 2m
                annotations:
                  summary: >-
                    {{ "{{" }} $value }} native Grafana login attempts in 5 min
                  description: >-
                    More than 5 native Grafana login attempts detected. With Keycloak SSO active, native logins are anomalous and may indicate credential stuffing. Check: kubectl logs -n monitoring -l app.kubernetes.io/name=grafana
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Security Tool Alerts
            folder: Security
            interval: 5m
            rules:
              # Scoped by ENFORCEMENT MODE, not by policy name.
              #
              # An Audit policy exists to produce a report. By definition it
              # describes a tolerated baseline, so it must never page anyone --
              # and this rule learned that the hard way twice. First it matched
              # `result` instead of `rule_result` and fired on nothing while
              # 4,392 real failures went unseen. Then, once fixed, it was scoped
              # by excluding a single policy by name; adding four more policies
              # on 2026-09-05 left the exclusion behind and the alert fired
              # continuously on 23 failures per 5m, essentially all of them the
              # accepted read-only-rootfs and probe baselines.
              #
              # policy_validation_mode is a real label on this metric, carrying
              # `enforce` or `audit`. Keying on it means a new Audit policy adds
              # nothing here and a policy promoted to Enforce is picked up
              # automatically -- there is no list to keep in step, which is the
              # thing that actually failed last time.
              #
              # What it now means: an Enforce policy recorded a failure. Since
              # Enforce blocks at admission, that is either a resource that
              # predates enforcement or a rejected request -- both worth
              # knowing, and both currently 0.
              - uid: kyverno-policy-violation
                title: KyvernoPolicyViolation
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(kyverno_policy_results_total{rule_result="fail", policy_validation_mode="enforce"}[5m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Kyverno policy violation in {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.resource_namespace }}
                  description: >-
                    Policy {{ "{{" }} $labels.policy_name }} failed for resource {{ "{{" }} $labels.resource_kind }}/{{ "{{" }} $labels.resource_name }} in namespace {{ "{{" }} $labels.resource_namespace }}. Check: kubectl get policyreport -A
                labels:
                  severity: warning
                isPaused: false
              - uid: falco-critical-event
                title: FalcoCriticalEvent
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # "by (rule_name, priority)" instead of a bare sum():
                      # a plain sum() collapses every label, which is why
                      # the alert previously had no context about which
                      # rule actually fired. Grouping keeps rule_name/
                      # priority available for the annotation template
                      # below, and splits distinct rules into separate
                      # alert instances instead of one undifferentiated
                      # blob. The metric itself doesn't carry the specific
                      # offending pod/namespace/process (that level of
                      # detail only exists in Falco's own logs, not this
                      # aggregate counter), so the annotation still points
                      # at the log command for full detail.
                      expr: 'sum by (rule_name, priority) (increase(falcosecurity_falco_rules_matches_total{priority=~"0|1|2"}[5m]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Falco rule "{{ "{{" }} $labels.rule_name }}" fired (priority {{ "{{" }} $labels.priority }}, 0=Emergency 1=Alert 2=Critical)
                  description: >-
                    {{ "{{" }} $value }} matches in the last 5 minutes. Check: kubectl logs -n falco ds/falco --since=5m | grep '"rule":"{{ "{{" }} $labels.rule_name }}"'
                labels:
                  severity: critical
                isPaused: false
          - orgId: 1
            name: Gateway Auth Alerts
            folder: Security
            interval: 5m
            rules:
              - uid: opa-unavailable
                title: OPAUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(envoy_http_ext_authz_failure_mode_allowed[5m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: OPA ext_authz is down — requests bypassing authorization
                  description: >-
                    OPA is unavailable; Envoy's failure_mode_allow forwarded requests without an authorization check. Native app auth (Grafana OIDC, etc.) still applies, but Rego policies (hubble-ui admin gate, 401 for bad tokens) are not enforced. Check: kubectl get pods -n security -l app=opa
                labels:
                  severity: critical
                isPaused: false
              - uid: opa-denial-spike
                title: OPADenialSpike
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 300
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(envoy_http_ext_authz_denied[5m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [10]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: sum
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 5m
                annotations:
                  summary: >-
                    {{ "{{" }} $value }} OPA ext_authz denials in the last 5 minutes
                  description: >-
                    More than 10 requests were denied by OPA in the last 5 minutes. Possible causes: expired/invalid API tokens, unauthorized access attempts on admin-only apps (hubble-ui), or a misconfigured client. Check Envoy stats: kubectl exec -n kube-system ds/cilium-envoy -- wget -qO- localhost:9964/stats/prometheus | grep ext_authz
                labels:
                  severity: warning
                isPaused: false
              # Keycloak realm drift. keycloak-config-cli reverts it hourly; the
              # point of alerting is that reverting SILENTLY teaches you nothing.
              # A correction means somebody changed the identity provider outside
              # Git, and the useful question is who had console access to do it,
              # not whether the group came back.
              #
              # The tool logs nothing at INFO when it corrects drift, so this
              # rides on a metric the Job derives itself by fingerprinting the
              # managed surface either side of the run.
              - uid: keycloak-config-drift
                title: KeycloakRealmDriftCorrected
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 10800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(keycloak_config_drift_corrected[3h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData: the Job runs hourly, so three hours of
                # silence is the reconciler having stopped -- and a stopped
                # reconciler means drift is neither corrected nor reported,
                # which is strictly worse than drift that is.
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Keycloak realm had drifted from Git and was reverted
                  description: >-
                    keycloak-config-cli found the realm did not match realm-config/homelab.yaml and corrected it. The change is already undone, so nothing is broken -- what needs looking at is why it happened. Someone edited the realm through the admin console, or a component wrote to it directly. Read the Job log for the before/after fingerprints, then check Keycloak's admin events for who made the change. If it was deliberate, it belongs in Git; if it was not, someone holds console access they should not.
                labels:
                  severity: warning
                isPaused: false
              # The reconcile failing is a different problem from it finding
              # drift, and it is the more urgent one: while the import errors,
              # nothing is converging the realm at all.
              - uid: keycloak-config-import-failed
                title: KeycloakConfigImportFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 10800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(keycloak_config_import_failed[3h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    keycloak-config-cli import is failing
                  description: >-
                    The realm reconcile exited non-zero, so the realm is no longer converging on realm-config/homelab.yaml and drift will accumulate unnoticed. Usual causes: the admin credential rotated without the Secret being updated, a syntax error in the realm file, or Keycloak being unreachable from the Job. Read the Job log directly -- kubectl logs -n keycloak job/<latest keycloak-config-cli job>.
                labels:
                  severity: critical
                isPaused: false
          # Added 2026-08-18 after an outage that was invisible until users hit
          # it. The seaweedfs-csi-driver mount pod holds the FUSE daemon for
          # EVERY SeaweedFS PVC on a node -- when it was OOMKilled (it had no
          # resource limits, so the namespace LimitRange capped it at 256Mi),
          # every mount became "transport endpoint is not connected" and all
          # consumers got EIO at once. Grafana returned 500 on every request,
          # immich-valkey went 0/1. Nothing alerted; the first signal was a
          # human noticing a broken UI, and the failure looked like an
          # application bug rather than a storage one.
          #
          # These two rules make that failure mode self-announcing. The restart
          # alert is the important one -- a restart of this pod IS a
          # cluster-wide storage incident, not a routine pod bounce -- and the
          # memory rule is the early warning that should fire first.
          # Filesystem-level capacity, deliberately not per-PVC. There are two
          # filesystems on this node and each one is a shared failure domain:
          # /var carries etcd, container images and EVERY local-path PVC, and
          # /var/mnt/seaweedfs carries all SeaweedFS data. If either fills, a
          # long list of unrelated workloads fails together.
          #
          # Per-PVC alerting is not used here for two reasons. kubelet_volume_
          # stats_* is not exposed by the kubelet on this Talos node (the
          # kubelet scrape works and returns ~1140 other series, but that
          # family is absent, and the API server's kubelet proxy is blocked so
          # it cannot be read directly either). And it would be misleading
          # anyway: a local-path PVC's requested size is not enforced -- the
          # volume is just a directory on /var -- so a PVC can quietly exceed
          # its own request until the underlying disk is what actually runs out.
          - orgId: 1
            name: Storage Capacity Alerts
            folder: Infrastructure
            interval: 5m
            rules:
              - uid: system-disk-space-low
                title: SystemDiskSpaceLow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(node_filesystem_avail_bytes{mountpoint="/var"}) / min(node_filesystem_size_bytes{mountpoint="/var"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.15]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    System disk below 15% free -- etcd and every local-path volume share it
                  description: >-
                    /var backs etcd, the container image store and all local-path PVCs on this node. Running it out takes the control plane down with the workloads, so this is a cluster-level alert rather than a storage one. Find the consumers: du -sh /var/lib/local-path-provisioner/* and check container image usage. Bulk volumes can be moved to SeaweedFS (see docs/backlog.md); databases should not be.
                labels:
                  severity: critical
                isPaused: false
              - uid: seaweedfs-disk-space-low
                title: SeaweedFSDiskSpaceLow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(node_filesystem_avail_bytes{mountpoint="/var/mnt/seaweedfs"}) / min(node_filesystem_size_bytes{mountpoint="/var/mnt/seaweedfs"})'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.20]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    SeaweedFS backing disk below 20% free
                  description: >-
                    The NVMe partition holding all SeaweedFS volume data is filling. Every SeaweedFS-backed PVC in the cluster draws from it, so this affects all of them at once rather than one workload -- including the recovery system's local backup repository, which shares this partition, not a separate disk. Check current usage per component and whether old volumes left over from migrations are still holding space.
                labels:
                  severity: warning
                isPaused: false
          - orgId: 1
            name: Backup Alerts
            folder: Infrastructure
            interval: 10m
            rules:
              # Paperless removes a successfully ingested file from consume,
              # usually within minutes. Until then this PVC holds the only
              # copy, so age rather than mere presence is the useful signal.
              - uid: paperless-consume-file-stalled
                title: PaperlessConsumeFileStalled
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max(paperless_consume_oldest_file_age_seconds) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [21600]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A unique Paperless input has not been consumed for six hours
                  description: >-
                    A file in paperless-consume-lh is older than six hours. Until Paperless ingests it, this is the only copy and it is not part of a recovery dataset. Inspect `/usr/src/paperless/consume` and Paperless task logs; preserve the file before retrying or removing it.
                labels:
                  severity: warning
                isPaused: false
              - uid: paperless-consume-monitor-failed
                title: PaperlessConsumeMonitorFailed
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(paperless_consume_scan_success)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    Paperless consume directory is no longer monitored
                  description: >-
                    The consume monitor cannot scan paperless-consume-lh or its metrics target disappeared. Check the Paperless pod's consume-monitor container, its PVC mount, and the paperless-consume VMPodScrape. Stalled unique inputs are invisible while this alert is active.
                labels:
                  severity: warning
                isPaused: false
              # The recovery system (ADR-012). Its workflows push these metrics to
              # vmsingle themselves, once per run, so every rule wraps them in
              # last_over_time(): an instant query sees a series only within
              # VictoriaMetrics' five-minute staleness window, and for the rest of
              # the day would evaluate NoData instead of the data.
              #
              # ── Recovery system limits (ADR-012) ────────────────────────
              # Alerts only, by decision: neither ever fails a backup. The
              # thresholds are recovery-policy's `limits`, evaluated where the
              # data is (the backup step) and published as 0/1, so no rule here
              # restates a number.
              - uid: recovery-backup-unusual-growth
                title: RecoveryBackupUnusualGrowth
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max by (dataset) (last_over_time(recovery_dataset_growth_unusual[26h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A backup added far more data than usual
                  description: >-
                    One backup of this dataset added more than recovery-policy's growth limits allow. A bulk import explains it and needs nothing. Every file being rewritten at once -- which is what ransomware looks like to a backup -- also explains it, and does. The backup itself succeeded; this alert blocks nothing. Compare recovery_dataset_data_added_bytes with recovery_dataset_bytes, and look at the application before the next promotion carries the data offsite.
                labels:
                  severity: warning
                isPaused: false
              - uid: recovery-local-repository-over-cap
                title: RecoveryLocalRepositoryOverCap
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max(last_over_time(recovery_repository_over_cap{repository="local"}[26h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The local restic repository is over its cap
                  description: >-
                    The local repository has grown past recovery-policy's local-repository limit. Backups continue -- a full local repository must never mean no backups -- but it shares its disk with the production volumes. Check recovery_repository_bytes against the retention settings and the disk-space alert, and either raise the limit deliberately or find what grew.
                labels:
                  severity: warning
                isPaused: false
              # ── Recovery system guarantees (ADR-012) ────────────────────
              # One rule per guarantee in recovery-policy's `profiles`: a
              # validated point every 24h, one offsite within 48h, and the two
              # ways the chain can stop short of those without a job failing
              # loudly -- a point recorded FAILED, and a promotion refused by
              # the vault's cap. Ages come from the points' own records (the
              # time the point was taken), so a late run still counts from
              # when the data was captured.
              #
              # The staleness rules look back further than their threshold, as
              # above: the value comparison fires first, and absence (NoData,
              # Alerting) only takes over once no point at all is left in the
              # window.
              - uid: recovery-point-stale
                title: RecoveryPointStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # Hours since each dataset's newest validated point was
                      # taken. 26 = the 24h RPO plus the run itself.
                      #
                      # The `or` union covers a dataset that has NEVER
                      # validated -- new, or failing since the day it was
                      # added -- which otherwise has no
                      # recovery_dataset_validated_timestamp series at all, so
                      # the left side alone has nothing to evaluate for it and
                      # this alert never fires (only the warning-severity
                      # RecoveryPointFailed does). recovery_policy_dataset
                      # (pushed hourly by the reconciler for every dataset the
                      # policy declares, reconcile.yaml) scaled to a large
                      # synthetic age stands in for it, restricted by `unless`
                      # to only the datasets with no real series -- a dataset
                      # with one is excluded here and takes its real age from
                      # the left side instead, never both. Found on code
                      # review.
                      #
                      # recovery_policy_dataset is itself pushed hourly, not
                      # continuously -- so it needs the same last_over_time()
                      # wrap as every other pushed metric here (see this
                      # section's own header on the five-minute staleness
                      # window), or an instant query only sees it for about
                      # five minutes out of every sixty. Missed on the first
                      # pass (round-2 code review): without the wrap, the
                      # synthetic arm existed for ~5 minutes an hour and the
                      # alert flapped on and off with it instead of firing
                      # steadily for a genuinely never-validated dataset.
                      expr: >-
                        (time() - max by (application, dataset) (last_over_time(recovery_dataset_validated_timestamp[3d]))) / 3600
                        or
                        (max by (application, dataset) (last_over_time(recovery_policy_dataset[2h])) * 0 + 999)
                        unless on (application, dataset)
                        (max by (application, dataset) (last_over_time(recovery_dataset_validated_timestamp[3d])))
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [26]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A dataset has no validated recovery point within its RPO
                  description: >-
                    The newest recovery point in which this dataset passed its restore test is older than the 24-hour RPO. Backups may still be running and finishing -- a point only counts once its restore test has passed. Look at the latest recovery-point-<application> Workflow in backup-system: a FAILED point keeps the logs of its failed steps in the configmap logs-<workflow>.
                labels:
                  severity: critical
                isPaused: false
              - uid: recovery-offsite-stale
                title: RecoveryOffsiteStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # Hours since each dataset's newest REMOTE_VERIFIED point
                      # was taken; the profile's offsite RPO is 48h.
                      #
                      # Same `or` union as RecoveryPointStale, and for the same
                      # reason: a dataset that has never been verified offsite
                      # has no recovery_dataset_remote_verified_timestamp
                      # series, so the left side alone never evaluates it.
                      # recovery_policy_dataset needs the same last_over_time()
                      # wrap as there too -- see RecoveryPointStale's comment;
                      # missed here identically on the first pass.
                      expr: >-
                        (time() - max by (application, dataset) (last_over_time(recovery_dataset_remote_verified_timestamp[5d]))) / 3600
                        or
                        (max by (application, dataset) (last_over_time(recovery_policy_dataset[2h])) * 0 + 999)
                        unless on (application, dataset)
                        (max by (application, dataset) (last_over_time(recovery_dataset_remote_verified_timestamp[5d])))
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [48]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A dataset has no verified offsite copy within 48 hours
                  description: >-
                    No recovery point of this dataset has been promoted to the AWS vault and verified there for more than 48 hours, so losing the house now would lose more than the offsite RPO allows. Either there was no validated point to promote (see RecoveryPointStale), or promotion failed or was refused (see RecoveryPromotionRefused). Look at the latest promote-<application> Workflow in backup-system. Pending points stay pending and are promoted by the next successful run.
                labels:
                  severity: critical
                isPaused: false
              - uid: recovery-point-failed
                title: RecoveryPointFailed
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min by (application) (last_over_time(recovery_point_validated[26h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    The latest recovery point of an application FAILED
                  description: >-
                    At least one of this application's datasets did not reach VALIDATED in its latest recovery point: its backup, plausibility check or restore test failed. The other datasets of the point are still valid, and the previous validated point is still the recovery point for the failed one. The Workflow's record says which dataset failed, and the configmap logs-<workflow> in backup-system holds the failed steps' last log lines.
                labels:
                  severity: warning
                isPaused: false
              - uid: recovery-promotion-refused
                title: RecoveryPromotionRefused
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max by (application) (last_over_time(recovery_promotion_refused[26h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Promotion to AWS was refused by the vault's cap
                  description: >-
                    Copying this application's pending recovery points would push the AWS repository past recovery-policy's aws-repository limit, so nothing was uploaded. The cap exists to bound the bill: raise it deliberately if the growth is real, or find what grew (RecoveryBackupUnusualGrowth, recovery_dataset_data_added_bytes). Until then the points stay PROMOTION_PENDING and RecoveryOffsiteStale follows after 48 hours.
                labels:
                  severity: warning
                isPaused: false
              # Retention's two safeties, each of which stops it on purpose.
              # 8-day windows: the AWS repository is thinned weekly.
              - uid: recovery-retention-held
                title: RecoveryRetentionHeld
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max by (repository, dataset) (last_over_time(recovery_retention_held[8d]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Retention's verification gate is holding a dataset
                  description: >-
                    Retention did not thin this dataset in this repository, because its newest snapshot there does not belong to a VALIDATED recovery point -- or, on AWS, to one verified there within the offsite RPO. Nothing is lost; the repository only grows until a validated point arrives. The latest retention-<repository> Workflow in backup-system gives the reason; RecoveryPointFailed or RecoveryOffsiteStale usually names the cause.
                labels:
                  severity: warning
                isPaused: false
              - uid: recovery-retention-refused
                title: RecoveryRetentionRefused
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max by (repository) (last_over_time(recovery_retention_refused[8d]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Retention refused its own plan
                  description: >-
                    Retention's dry run would have removed more than recovery-policy's forget-* limits allow, so nothing was forgotten. The latest retention-<repository> Workflow in backup-system lists the plan and the limit it broke. If the plan is intended -- photos deleted months ago finally leaving the last monthly snapshot, for example -- raise the limit in the policy for that run, as a reviewed change.
                labels:
                  severity: warning
                isPaused: false
              # Retention pushes its last success at the end of every run that
              # completes. A run that fails -- a restic error, lost access to AWS,
              # a lock it waited on for 2 hours -- pushes nothing, and neither
              # RecoveryRetentionRefused nor RecoveryRetentionHeld fires, so the
              # repository only grows. Local runs daily at 04:00 and may wait 2
              # hours on a lock: 30 hours. AWS runs on Sundays at 04:30: 8 days.
              # The value is the hours overdue, negative while on schedule.
              - uid: recovery-retention-stale
                title: RecoveryRetentionStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: '(time() - max by (repository) (last_over_time(recovery_retention_last_success_timestamp{repository="local"}[30d]))) / 3600 - 30 or (time() - max by (repository) (last_over_time(recovery_retention_last_success_timestamp{repository="aws"}[30d]))) / 3600 - 192'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Retention has not completed on schedule
                  description: >-
                    The last successful retention run in this repository is older than its schedule allows: 30 hours for local (daily at 04:00), 8 days for AWS (Sundays at 04:30). A retention run that fails, rather than refusing or holding, raises no other alert, and the repository only grows. The latest retention-<repository> Workflow in backup-system shows the failed step and its log. A lock left by a dead process is removed by the next run; any other failure repeats until it is fixed.
                labels:
                  severity: warning
                isPaused: false
              # ── Talos advisories ────────────────────────────────────────
              # Fed by the talos-cve-watch CronJob, which compares the version
              # actually running on each node -- read from kube_node_info's
              # os_image label, not from the pin in git -- against SideroLabs'
              # published advisories.
              #
              # 26h windows because the job runs daily. An instant query
              # returns nothing for a metric pushed once a day: verified live
              # on 2026-08-26, where the same series was empty instantly and
              # present under last_over_time.
              - uid: talos-advisory-affecting
                title: TalosAdvisoryAffectingRunningVersion
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 93600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(last_over_time(talos_advisory_affecting{severity=~"critical|high"}[26h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK rather than Alerting on NoData: a broken check is already
                # covered by TalosCveCheckFailing below, and having both fire
                # for one cause makes the pair less informative, not more.
                noDataState: OK
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    A Talos security advisory affects the running version
                  description: >-
                    SideroLabs has published a critical or high advisory whose affected range covers the Talos version currently running on a node. Identify it with the talos_advisory_detail series, which carries the GHSA id, severity and affected version as labels, and read the advisory at https://github.com/siderolabs/talos/security/advisories. Upgrading is the fix, and it does not have to wait for the Sunday window -- label the node talos.homelab/upgrade-now to run the on-demand Plan, provided the version pinned in the repo is actually a fixed one.
                labels:
                  severity: critical
                isPaused: false
              - uid: talos-cve-check-failing
                title: TalosCveCheckFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 172800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # 48h, against a job that now runs every 12h. The window
                      # has to outlast more than one missed run: these metrics are
                      # PUSHED, so a run that does not happen leaves no value and
                      # the rule sees NoData rather than a stale number. With
                      # noDataState: Alerting that is indistinguishable from a
                      # real failure.
                      #
                      # 26h against a daily job left exactly one miss between
                      # healthy and firing, and on 2026-09-03 that fired for hours
                      # because vmsingle happened to be restarting when the job
                      # ran. 48h/12h tolerates three consecutive misses, which is
                      # a genuine outage rather than a coincidence.
                      expr: 'last_over_time(talos_advisory_check_failed[48h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData, deliberately. If the job stops running
                # altogether the series ages out of the 26h window and this
                # goes off -- which is the point. A vulnerability check that
                # silently stopped checking is indistinguishable from a clean
                # result, and that is a failure this cluster has seen before.
                noDataState: Alerting
                execErrState: Error
                for: 2h
                annotations:
                  summary: >-
                    The Talos advisory check is failing or has stopped running
                  description: >-
                    talos-cve-watch either reported a failure or has not pushed a result in over a day, so the cluster currently has no working answer to whether its Talos version is affected by a published advisory. Read the last run with `kubectl logs -n monitoring -l app.kubernetes.io/name=talos-cve-watch --tail=50`. The common causes are an exhausted GitHub anonymous rate limit, which the job detects and reports rather than treating as an empty advisory list, and kube_node_info missing its os_image label.
                labels:
                  severity: warning
                isPaused: false
              # ── Talos fleet health ──────────────────────────────────────
              # Fed by the talos-fleet-health CronJob (every 6h), which
              # compares each node's actual running Talos version against
              # every other node's and against versions.env, and checks each
              # node's Ready condition. Without these rules the metrics exist
              # but nothing pages on them, which is the exact gap this whole
              # mechanism was built to close.
              #
              # 8h query windows: the job runs every 6h, +2h slack, same ratio
              # as the daily/26h talos-advisory pair above.
              #
              # `for: 8h` on this rule and the two below (K8s skew, unready
              # nodes) -- NOT `for: 0m` as an earlier version of this comment
              # had it. That version relied on the fleet-health CronJob's
              # schedule never landing inside a Sunday upgrade window "by
              # construction", which held only as long as nobody moved either
              # side without checking the other: round 4 code review found
              # the OS windows had moved to midday (12:00-17:00) while the
              # schedule was untouched, and 12:35 UTC now sits inside the
              # control-plane window -- exactly the silent collision that
              # comment warned was possible once 3-node made a rollout long
              # enough to overlap a check, except it took a window move on
              # the 1-node profile to trigger it, not a multi-node rollout.
              #
              # Two changes instead of one, matching the review's own
              # framing of a fix that survives the NEXT window move, not
              # just this one:
              #
              #   (a) the schedule itself moved to 05:35/11:35/17:35/23:35
              #       UTC, clear of the current 12:00-17:00 span (see
              #       fleet-health-cronjob.yaml) -- and the Talos image CI
              #       workflow now asserts this schedule/window relationship
              #       as an invariant, the same way it already asserts
              #       `replacements` resolve, so the next window (or
              #       schedule) move that reintroduces a collision fails at
              #       PR time instead of at the next Sunday 12:35.
              #   (b) `for: 8h` here regardless -- sized to the longest
              #       window (2h) plus one full check interval (6h), so even
              #       if (a) is ever wrong, a single mid-window sample is not
              #       enough to page: the metric stays "last" for up to 6h
              #       until the next (post-window) run supersedes it, which
              #       clears the condition well before 8h of continuous
              #       pending time can accumulate. A genuine, persistent
              #       problem still fires, just up to ~8h later than
              #       instantly -- the review's own tradeoff, judged
              #       acceptable here against a guaranteed weekly false page.
              #       This is a wall-clock `for:` duration, not a
              #       min_over_time query -- it does not have
              #       TalosFleetVersionDrift's ephemeral-state problem, since
              #       8 hours of Grafana uptime is a low bar compared to 8
              #       days, and the cost of getting it wrong here is delayed
              #       detection, not a permanently inert rule.
              - uid: talos-fleet-version-skew
                title: TalosFleetVersionSkew
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_version_skew[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 8h
                annotations:
                  summary: >-
                    Talos nodes disagree with each other on OS version
                  description: >-
                    talos-fleet-health found more than one distinct Talos version across nodes via kube_node_info. Identify the split with the talos_fleet_node_info series, which carries each node's version as a label. Either a rolling upgrade is genuinely in progress outside its expected window, or a node's upgrade stalled partway. Check `kubectl get jobs -n cattle-system` and the Plan status with `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              - uid: talos-fleet-version-drift
                title: TalosFleetVersionDrift
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 691200
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min_over_time(talos_fleet_version_drift[36h]) and (count_over_time(talos_fleet_version_drift[36h]) >= 4)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Grace period, not a window-aware gate: code review on PR
                # #386 (round 2) found that versions.env applies at merge,
                # while the automated upgrade waits for the Sunday window --
                # a merge shortly after that window means up to ~7 days where
                # this condition is true and describes nothing more than
                # normal operation. Gating on the actual window was
                # considered and rejected as more complex than warranted; a
                # grace period spanning one full week (the longest possible
                # merge-to-window gap, plus the window itself, plus a day of
                # buffer) instead, so this only fires once an upgrade has had
                # a full cycle to happen and still hasn't. Severity dropped
                # to warning to match: a week-old drift is worth a look, not
                # a page.
                #
                # Round 3 review found the grace period couldn't actually be
                # `for: 8d`: Grafana's persistence.enabled: false (this file,
                # above) means alert-instance pending state lives in an
                # ephemeral SQLite DB, wiped on every pod restart -- and a
                # HelmRelease reconcile, a node reboot, or one of the very
                # Talos upgrades this alert watches for would all reset an
                # 8-day wall-clock pending timer to zero, making the rule
                # effectively inert. Moved the grace period into the query
                # instead: min_over_time over 8 days of STORED samples in
                # vmsingle (retention comfortably exceeds 8 days), true
                # regardless of how many times Grafana itself has restarted
                # in that span, with `for: 0m` since the 8 days now live in
                # the expression rather than in pending-state duration.
                #
                # Round 4 review found that first version of the query still
                # didn't implement a grace period: min_over_time aggregates
                # only the samples that EXIST in the window, so a brand-new
                # series with a single drifted sample (the check runs once
                # and immediately sees drift) returns 1 and fires the same
                # instant, not after 8 days. "Ignores absent samples" cuts
                # both ways -- it also means the window doesn't need to be
                # full before the rule can fire. The count_over_time(...) >=
                # 28 clause is the actual grace period: the check runs every
                # 6h (4/day), so a fully-populated 8-day window holds 32
                # samples; 28 requires ~7 of those 8 days to have reported in
                # before the rule can fire at all, tolerating a few missed
                # runs without requiring every single one.
                for: 0m
                annotations:
                  summary: >-
                    A Talos node has not matched the version pinned in git for a week
                  description: >-
                    talos-fleet-health found at least one node NOT running TALOS_VERSION from versions.env, continuously for 8 days -- long enough that a routine wait for the Sunday upgrade window no longer explains it. This is the exact failure mode this cluster already had once for 44 days (docs/backlog.md) with nothing detecting it -- an automated upgrade that silently never ran, or never completed. Identify the node with the talos_fleet_node_info series and compare against `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              # ── Kubernetes version, same shape as Talos above ────────────
              # Added on code review (PR #386, round 3): the Talos-only fleet
              # check would have missed a Kubernetes upgrade that silently
              # never ran the exact same way this repo's history already
              # missed a Talos one for 44 days -- reproduced on the axis this
              # PR itself introduces, if left unmonitored. Same metrics
              # source (kube_node_info's kubelet_version), same script run.
              - uid: talos-fleet-k8s-version-skew
                title: TalosFleetK8sVersionSkew
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_k8s_version_skew[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # for: 8h, same headroom and same reasoning as
                # TalosFleetVersionSkew above -- see that rule's comment.
                for: 8h
                annotations:
                  summary: >-
                    Talos nodes disagree with each other on Kubernetes version
                  description: >-
                    talos-fleet-health found more than one distinct kubelet_version across nodes via kube_node_info. Identify the split with the talos_fleet_node_info series, which carries each node's kubernetes_version as a label. Either the talos-kubernetes upgrade is genuinely in progress outside its expected window, or it stalled partway through the cluster-wide rollout upgrade-k8s performs internally. Check `kubectl get jobs -n cattle-system` and `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              - uid: talos-fleet-k8s-version-drift
                title: TalosFleetK8sVersionDrift
                condition: B
                data:
                  - refId: A
                    # Grace period lives in the query, not in `for:`, from the
                    # start -- see TalosFleetVersionDrift's own comment for
                    # why: Grafana's alert-instance pending state is
                    # ephemeral (persistence.enabled: false), so a wall-clock
                    # `for:` duration this long cannot survive a pod restart,
                    # and why min_over_time alone is not a grace period --
                    # the count_over_time(...) >= 28 clause is the part that
                    # actually is one. This is the series round 4 review
                    # named as the likeliest to be caught by that gap: it is
                    # brand new, and KUBERNETES_VERSION is a first-time
                    # inference of what the cluster actually runs, so it is
                    # the more likely of the two to be genuinely drifted on
                    # its very first sample.
                    relativeTimeRange:
                      from: 691200
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min_over_time(talos_fleet_k8s_version_drift[36h]) and (count_over_time(talos_fleet_k8s_version_drift[36h]) >= 4)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A Talos node has not matched the Kubernetes version pinned in git for a week
                  description: >-
                    talos-fleet-health found at least one node NOT running KUBERNETES_VERSION from versions.env, continuously for 8 days -- long enough that a routine wait for the Sunday upgrade window no longer explains it. Identify the node with the talos_fleet_node_info series and compare against `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              - uid: talos-fleet-unready-nodes
                title: TalosFleetUnreadyNodes
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_unready_nodes[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # for: 8h, same headroom and same reasoning as
                # TalosFleetVersionSkew above -- see that rule's comment. This
                # is the rule round 4 review specifically named: a node
                # legitimately cordoned/rebooting mid-upgrade would otherwise
                # page as a critical outage every routine Sunday.
                for: 8h
                annotations:
                  summary: >-
                    A node is not Ready per talos-fleet-health
                  description: >-
                    talos-fleet-health found at least one node not reporting kube_node_status_condition{condition="Ready",status="true"}. Identify it with the talos_fleet_node_info series (its value is 0 for an unready node) and check `kubectl get nodes` and `kubectl describe node <name>` directly -- this alert is a lagging indicator (checked every 6h), not a substitute for a live node-health dashboard.
                labels:
                  severity: critical
                isPaused: false
              - uid: talos-fleet-health-check-failing
                title: TalosFleetHealthCheckFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_health_check_failed[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData, same reasoning as TalosCveCheckFailing:
                # a fleet-health check that silently stopped running is
                # indistinguishable from a clean result unless something
                # notices the silence itself.
                noDataState: Alerting
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    The Talos fleet-health check is failing or has stopped running
                  description: >-
                    talos-fleet-health either reported a failure or has not pushed a result in over 8h, so the cluster currently has no working answer to whether all nodes agree on version and are Ready. Read the last run with `kubectl logs -n monitoring -l app.kubernetes.io/name=talos-fleet-health --tail=50`. Common causes: kube_node_info missing its os_image label, or kube_node_status_condition not present (kube-state-metrics down).
                labels:
                  severity: warning
                isPaused: false
              # ── Longhorn storage availability ───────────────────────────
              # Added after 2026-08-30. Longhorn had been publishing
              # longhorn_disk_status{condition="ready"} = 0, with
              # condition_reason="DiskFilesystemChanged", for four days on a
              # scraped endpoint -- while fifteen of sixteen volumes sat
              # faulted and every stateful workload was down. Nothing
              # alerted, because the only Longhorn metric any rule referenced
              # was longhorn_volume_last_backup_at: a backup-freshness
              # signal, which says nothing about whether the disk holding the
              # data is usable.
              #
              # A disk that is not ready is not a degradation, it is total
              # loss of storage on that node -- no volume can attach, so
              # every stateful pod stops. On a single-node cluster that is
              # the whole cluster.
              - uid: longhorn-disk-not-ready
                title: LonghornDiskNotReady
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # `== bool 0` rather than `== 0`, and sum rather than
                      # count. The difference decides whether this rule works.
                      #
                      # `count(X == 0)` FILTERS: when every disk is healthy it
                      # matches no series and returns an empty result, which
                      # Grafana reports as NoData. Paired with
                      # noDataState: Alerting that fires the alert precisely
                      # when the disk is fine -- observed live on 2026-08-31,
                      # with longhorn_disk_status{condition="ready"} = 1 and
                      # this alert firing.
                      #
                      # `== bool 0` MAPS instead: each series becomes 1 or 0, so
                      # sum() is the number of unhealthy disks and is 0 rather
                      # than empty when all are fine. NoData then means only one
                      # thing -- the metric is absent entirely -- which is a real
                      # fault and correctly alerts, because a disk nobody can see
                      # is not a disk known to be good.
                      expr: 'sum(longhorn_disk_status{condition="ready"} == bool 0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    A Longhorn disk is not ready -- no volume can attach
                  description: >-
                    Longhorn has marked a disk not ready, so no volume backed by it can attach and every stateful pod using one will stay Pending or CrashLooping. Read the reason from the condition_reason label on longhorn_disk_status. DiskFilesystemChanged means the diskUUID Longhorn recorded no longer matches the longhorn-disk.cfg on the filesystem -- which happens when the disk is replaced, reformatted, or re-initialised underneath it, and Longhorn then refuses it rather than risk writing replicas onto the wrong storage. Compare the diskUUID in nodes.longhorn.io status.diskStatus against the on-disk longhorn-disk.cfg. If the filesystem genuinely is the original, restoring the recorded UUID into that file re-adopts the disk with its replicas intact; if it genuinely is a new disk, the replicas are gone and the volumes must be restored from backup.
                labels:
                  severity: critical
                isPaused: false
              - uid: longhorn-not-schedulable
                title: LonghornNodeNotSchedulable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # `== bool 0` rather than `== 0`, and sum rather than
                      # count. The difference decides whether this rule works.
                      #
                      # `count(X == 0)` FILTERS: when every disk is healthy it
                      # matches no series and returns an empty result, which
                      # Grafana reports as NoData. Paired with
                      # noDataState: Alerting that fires the alert precisely
                      # when the disk is fine -- observed live on 2026-08-31,
                      # with longhorn_disk_status{condition="ready"} = 1 and
                      # this alert firing.
                      #
                      # `== bool 0` MAPS instead: each series becomes 1 or 0, so
                      # sum() is the number of unschedulable disks and is 0 rather
                      # than empty when all are fine. NoData then means only one
                      # thing -- the metric is absent entirely -- which is a real
                      # fault and correctly alerts, because a disk nobody can see
                      # is not a disk known to be good.
                      expr: 'sum(longhorn_disk_status{condition="schedulable"} == bool 0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting, not OK. With the bool form above, an empty
                # result no longer means "all healthy" -- it means the
                # metric is gone, and a scheduling state nobody can read
                # is not a scheduling state known to be good.
                noDataState: Alerting
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    Longhorn cannot place new replicas
                  description: >-
                    A Longhorn node or disk cannot accept new replicas. Less severe than the disk being not-ready -- already-attached volumes keep working -- but a volume that detaches cannot come back, and any rebuild or new PVC will hang. Often the same underlying cause as LonghornDiskNotReady and expected to fire alongside it; on its own it usually means allowScheduling was turned off or the disk is out of space.
                labels:
                  severity: warning
                isPaused: false
              # The upgrade gate authorises Sunday's upgrades by labelling the
              # nodes, and the label is a STANDING permission -- it persists
              # until something removes it. The gate clears it at the start of
              # every run so a crash mid-check cannot leave last week's
              # authorisation in place, but that only helps if the gate RUNS.
              # A gate that stops firing entirely leaves the last successful
              # label sitting there, and the Plans would upgrade on evidence
              # nobody re-examined. These two rules are what makes that visible.
              - uid: upgrade-gate-stale
                title: UpgradeGateStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 864000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: '(time() - last_over_time(upgrade_gate_last_run_timestamp[9d])) / 86400'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [8]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on absence, deliberately. A gate that has never
                # pushed and a gate that stopped pushing are the same hazard,
                # and treating "no data" as healthy would mean this rule goes
                # quiet in precisely the case it exists for.
                noDataState: Alerting
                execErrState: Alerting
                for: 1h
                annotations:
                  summary: >-
                    The pre-upgrade gate has not run in over 8 days
                  description: >-
                    upgrade-backup-gate runs at 11:00 on Sundays and decides whether that day's Talos and Kubernetes upgrades may proceed, by proving that every application has a recent, restore-tested recovery point with a verified copy in AWS. It has not reported in over 8 days, so it has missed at least one window. That matters beyond the missed upgrade: the talos.homelab/upgrade-ready label is a standing permission, so if a previous run left it set, the Plans will act on an authorisation nothing has re-checked since. Verify with `kubectl get nodes -L talos.homelab/upgrade-ready` and remove the label by hand if it is present while this is firing.
                labels:
                  severity: warning
                isPaused: false
              - uid: upgrade-gate-refusing
                title: UpgradeGateRefusing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 864000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(upgrade_gate_pass[9d])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK on no-data: absence is UpgradeGateStale's job, and having
                # both fire on it would double-page for one fault.
                noDataState: OK
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    Upgrades are blocked -- the pre-upgrade gate refused
                  description: >-
                    The gate ran and declined to authorise upgrades, so no Talos or Kubernetes Plan will act until it passes. This is the mechanism working, not failing: it means not every application could be shown to have a recent recovery point that passed its restore test and has a verified copy in AWS, and upgrading a single-node cluster without a proven way back is the thing it exists to prevent. It is a warning rather than a page because nothing is broken right now -- but left unattended the cluster silently stops receiving upgrades, including security ones. Read the last gate Job's log for the reasons; the usual causes are a recovery point that FAILED (RecoveryPointFailed) or a promotion that has not run since the newest point (RecoveryOffsiteStale). The manual override is talos-on-demand, which is deliberately ungated.
                labels:
                  severity: warning
                isPaused: false
          # 2026-09-04. The Talos/Kubernetes upgrade Plans have no dependency
          # field between them (see talos-version-gate-script.yaml) and no
          # native alert of their own -- the only reason the 2026-09-03
          # drain-storm incident and a transient scheduler-config-propagation
          # retry were both caught was a human watching the rehearsal live.
          # Sunday's real run is unattended, so a Job that hangs or exhausts
          # its retries needs to page someone rather than sit unnoticed until
          # the next manual check.
          - orgId: 1
            name: System Upgrade Alerts
            folder: Infrastructure
            interval: 5m
            rules:
              # kube_job_status_start_time/succeeded come from kube-state-
              # metrics, confirmed present for cattle-system Jobs by direct
              # query against vmsingle on 2026-09-04. `unless on(job_name)` on
              # a metric family that ONLY carries succeeded==1 series drops any
              # job_name that has already succeeded, leaving only jobs still
              # running or that gave up -- both read the same way here, since
              # a Job that exhausted SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT (see
              # operator/helmrelease.yaml) never sets succeeded and its
              # start_time stops advancing, so elapsed time keeps climbing
              # past the threshold below exactly like a hang would.
              #
              # `or vector(0)` guarantees a value even on the normal six days
              # a week with no matching Job at all, so noDataState never has
              # to guess between "nothing running" and "query broke".
              #
              # 1200s (20m): every completed run this cluster has seen,
              # including the one that needed a retry, finished in well under
              # that; ACTIVE_DEADLINE_SECONDS still kills the Job at 2700s
              # regardless, so this fires with ~25 minutes to spare for
              # someone to look before that happens.
              - uid: stuck-upgrade-job
                title: StuckUpgradeJob
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 60
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        max((time() -
                        kube_job_status_start_time{namespace="cattle-system",
                        job_name=~"apply-talos-.*"}) unless on(job_name)
                        kube_job_status_succeeded{namespace="cattle-system",
                        job_name=~"apply-talos-.*"} == 1) or vector(0)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1200]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A Talos/Kubernetes upgrade Job has not completed in over 20 minutes
                  description: >-
                    apply-talos-controlplane or apply-talos-kubernetes has been running (or exhausted its retries trying to) for more than 20 minutes without succeeding -- every clean run so far, including one that needed a retry, finished well inside that. Check `kubectl get jobs -n cattle-system` and `kubectl logs -n cattle-system -l upgrade.cattle.io/plan=<plan>` first. On 2026-09-03 the cause was talosctl's own --drain=true evicting Kyverno's admission controller, which fails closed and blocked every pod create cluster-wide, including the retry pods for this same Job -- that specific failure mode is now fixed (--drain=false on all three Plans), but this alert exists because the next cause is not guaranteed to be the same one.
                labels:
                  severity: critical
                isPaused: false
          # 2026-09-04. Ported from 02-victoriametrics-stack/alert-rules.yaml,
          # which is deleted in the same commit.
          #
          # Those five VMRules reported `operational` for their whole life and
          # could never have notified anyone: vmalert runs with
          # `-notifier.blackhole=true` and this cluster has no Alertmanager, so
          # every alert they produced was discarded. vmalert itself stays --
          # it also evaluates 253 chart-shipped RECORDING rules that dashboards
          # read, which is why the fix is to move the alerting rules here rather
          # than to remove vmalert.
          #
          # Two of the nine were not ported, and two more were wrong on their
          # own terms -- all four found by querying the metric before trusting
          # the rule, which is the only reason they surfaced at all:
          #
          #   - CiliumL7PolicyAccessDenied read envoy_cilium_access_denied.
          #     That metric family does not exist here at all: the Gateway moved
          #     off Cilium's embedded GatewayClass to Envoy Gateway on
          #     2026-08-16 (ADR-001), so Cilium's L7 proxy is no longer in the
          #     data path and never will be again. Dropped rather than ported.
          #   - TrivyExposedSecret is already covered by ImageExposedSecret.
          #   - TrivyRBACCritical read trivy_resource_rbacassessments, which
          #     does not exist. The real names are trivy_role_rbacassessments
          #     and trivy_clusterrole_clusterrbacassessments. Corrected below.
          #   - Both Trivy rules matched severity="CRITICAL". The label value is
          #     title case, "Critical". They could not have matched even with a
          #     working notifier. Corrected below.
          - orgId: 1
            name: Platform Health
            folder: Infrastructure
            interval: 5m
            rules:
              # One Certificate exists (homelab-wildcard-tls, gateway-system)
              # and it fronts every HTTPS listener, so min() over the family is
              # both the soonest expiry and the only one.
              - uid: certificate-expiry-warning
                title: CertificateExpiryWarning
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(certmanager_certificate_expiration_timestamp_seconds - time())'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1209600]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK here, Alerting on the critical rule below -- a missing
                # metric is one fault and should page once, not twice.
                noDataState: OK
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    A TLS certificate expires in under 14 days
                  description: >-
                    cert-manager reports a certificate inside 14 days of expiry and it has not renewed. Check `kubectl describe certificate -n gateway-system homelab-wildcard-tls` and the cert-manager logs. This is the wildcard that fronts every HTTPS listener, so an expiry is a full outage of everything behind the Gateway, not a partial one.
                labels:
                  severity: warning
                isPaused: false
              - uid: certificate-expiry-critical
                title: CertificateExpiryCritical
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(certmanager_certificate_expiration_timestamp_seconds - time())'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [259200]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting: if the metric disappears, cert expiry is unobservable
                # on the one certificate the whole Gateway depends on. Not
                # knowing is the same risk as knowing it is close.
                noDataState: Alerting
                execErrState: Alerting
                for: 1h
                annotations:
                  summary: >-
                    A TLS certificate expires in under 3 days
                  description: >-
                    Renewal has not happened with three days left. Manual intervention is likely needed -- `kubectl delete certificaterequest -n gateway-system --all` forces cert-manager to retry. If this is firing on NoData instead, cert-manager is not being scraped and the expiry is simply unknown, which needs the same urgency.
                labels:
                  severity: critical
                isPaused: false
              - uid: flux-reconciliation-error
                title: FluxReconciliationError
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase(controller_runtime_reconcile_total{job="flux", result="error"}[10m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    Flux is failing to reconcile
                  description: >-
                    A Flux controller is returning reconciliation errors, which means git is no longer being applied to the cluster -- changes merge and silently do not land. Start with `flux get kustomizations` and `flux get helmreleases -A`, then the failing controller's logs. `or vector(0)` keeps this at 0 rather than empty when healthy, so NoData means the Flux metrics stopped being scraped rather than that everything is fine.
                labels:
                  severity: warning
                isPaused: false
              # Reconciliation errors are covered above. These target-level
              # rules close the distinct blind spot where a controller or data
              # plane disappears and therefore emits no error counter at all.
              - uid: flux-controller-unavailable
                title: FluxControllerUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(up{job="flux"} == 1) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [6]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    A Flux controller metrics target is unavailable
                  description: >-
                    Fewer than the six installed Flux controllers can be scraped. Reconciliation errors cannot detect a controller that is no longer running. Check `flux get all -A`, the controller Deployments in flux-system, and the flux-controllers VMPodScrape.
                labels:
                  severity: critical
                isPaused: false
              # VMAlert evaluates the upstream Deployment mismatch rule but its
              # notifier is a blackhole here. Grafana must watch the operator
              # that builds vmagent's scrape configuration; a crash loop leaves
              # existing targets running while new scrape changes silently stall.
              - uid: victoria-metrics-operator-unavailable
                title: VictoriaMetricsOperatorUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(kube_deployment_status_replicas_available{namespace="monitoring",deployment="vmstack-victoria-metrics-operator"}) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    VictoriaMetrics operator is unavailable
                  description: >-
                    The operator Deployment has no available replica, or kube-state-metrics no longer reports it. New scrape and alert configuration will not reconcile even though existing targets may still work. Check `kubectl -n monitoring get deploy vmstack-victoria-metrics-operator` and its pod logs, then verify the operator CRDs match the installed image.
                labels:
                  severity: critical
                isPaused: false
              - uid: gateway-component-unavailable
                title: GatewayComponentUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(max by (job) (up{job=~"envoy-gateway-controller|envoy-gateway-proxy"})) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [2]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    An Envoy Gateway control-plane or proxy target is unavailable
                  description: >-
                    The shared Gateway has lost either its Envoy Gateway controller or every serving proxy. Check the Deployments and pods in envoy-gateway-system, then the matching scrape target. The platform canary separately tests the public request and authentication path; this rule identifies the infrastructure tier that disappeared.
                labels:
                  severity: critical
                isPaused: false
              - uid: otel-collector-target-unavailable
                title: OTelCollectorTargetUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(max by (job) (up{job=~"otel-agent|otel-collector-gateway"})) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [2]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    An OpenTelemetry agent or gateway target is unavailable
                  description: >-
                    Either the node-agent tier or the shared gateway tier has no healthy scrape target. Check the otel-agent DaemonSet in monitoring-agents and otel-collector-gateway Deployment in monitoring. A surviving replica does not hide a failed target because this rule evaluates the minimum.
                labels:
                  severity: critical
                isPaused: false
              - uid: otel-receiver-refusing-data
                title: OTelReceiverRefusingData
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase({__name__=~"otelcol_receiver_refused_(log_records|metric_points|spans)"}[15m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    An OpenTelemetry collector is refusing incoming telemetry
                  description: >-
                    A collector receiver has rejected logs, metric points, or spans for at least ten minutes. Clients may retry, but sustained refusals risk data loss. Break down the matching metric by job, receiver, and transport, then check collector memory pressure and client/export rates.
                labels:
                  severity: warning
                isPaused: false
              - uid: otel-export-failing
                title: OTelExportFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(increase({__name__=~"otelcol_exporter_send_failed_(log_records|metric_points|spans)"}[15m])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    An OpenTelemetry exporter cannot deliver telemetry
                  description: >-
                    A collector exporter has failed to send logs, metric points, or spans for at least ten minutes. Retries can prevent immediate loss, but a sustained failure eventually fills queues or drops data. Break down the metric by job and exporter, then check VictoriaMetrics, VictoriaLogs, VictoriaTraces, and the collector network policies.
                labels:
                  severity: critical
                isPaused: false
              - uid: postgresql-instance-unavailable
                title: PostgreSQLInstanceUnavailable
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min(cnpg_collector_up)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    A CloudNativePG instance is unavailable
                  description: >-
                    CloudNativePG reports at least one PostgreSQL instance down, or metrics from every database instance have disappeared. Check `kubectl get clusters.postgresql.cnpg.io -A` and the affected instance pods. Recovery point age, failed validation, and offsite promotion remain covered by the dedicated Recovery alerts.
                labels:
                  severity: critical
                isPaused: false
              # A failed Job deserves prompt attention; its terminal pod's continued
              # existence does not. Limit the alert to the first day after failure
              # so retained Job history cannot send the same warning indefinitely.
              - uid: recent-failed-jobs
                title: RecentFailedJobs
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        sum by (namespace, job_name) ((kube_job_status_failed{reason!=""} > 0)
                        and on (namespace, job_name) (time() - kube_job_created < 86400))
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 5m
                annotations:
                  summary: >-
                    Job {{ "{{" }} $labels.namespace }}/{{ "{{" }} $labels.job_name }} failed
                  description: >-
                    Inspect the failed Job and its pod logs. This alert tracks Jobs created in the last 24 hours; terminal pod retention is handled separately from workload health.
                labels:
                  severity: warning
                isPaused: false
              # Argo Workflows can enter Error before any pod is created, or
              # Failed after a step fails. VictoriaMetrics increase() counts a
              # newly appearing phase series at its first observed value; the
              # Prometheus-compatible variant misses the first Error event.
              - uid: recent-failed-recovery-workflow
                title: RecentFailedRecoveryWorkflow
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        sum(increase(argo_workflows_total_count{namespace="backup-system",phase=~"Failed|Error"}[1h])) or vector(0)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 1m
                annotations:
                  summary: >-
                    A recovery Workflow failed or errored in the last hour
                  description: >-
                    Inspect recent Workflows in backup-system and their terminal messages. The Argo controller outcome counter detects both pre-pod Errors and failed steps; this alert resolves after the one-hour window instead of repeating for retained history.
                labels:
                  severity: warning
                isPaused: false
              # Each schedule against its own allowance, expressed as a ratio so
              # one threshold covers all three: daily 25h, weekly 8d, monthly
              # 32d. Above 1 means that schedule is past its own deadline. The
              # selectors are disjoint, so `or` unions them rather than masking.
              - uid: log-ingestion-stalled
                title: LogIngestionStalled
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        sum(increase(vl_rows_ingested_total[30m])) or vector(0)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: Alerting
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    Nothing is reaching VictoriaLogs -- the log pipeline has stopped
                  description: >-
                    Steady state is roughly 57 rows/sec, so zero across 30 minutes means the otel agent has stopped shipping rather than the cluster having gone quiet. This is primarily an AUDIT alert. The API server keeps only about 6 hours of audit history on the node -- maxbackup 10 x maxsize 100MB fills long before the 30-day maxage is ever reached -- and VictoriaLogs, at 90 days, is the durable copy. While this is firing, audit records are rotating off the node and are gone permanently, which is why the ~45 minutes it takes to fire is deliberately a small fraction of that 6-hour budget. Check the otel-agent DaemonSet in monitoring-agents first. NoData alerts because a pipeline that stops publishing this metric is indistinguishable from one that stopped working.
                labels:
                  severity: critical
              - uid: alert-rule-evaluation-failing
                title: AlertRuleEvaluationFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        sum(increase(grafana_alerting_rule_evaluation_failures_total[15m])) or vector(0)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: NoData
                execErrState: Error
                for: 10m
                annotations:
                  summary: >-
                    Grafana is failing to evaluate alert rules -- alerts are silently unreliable
                  description: >-
                    A rule that cannot be evaluated reports inactive, which is indistinguishable from a rule whose condition is false. Every alert in this stack is therefore untrustworthy while this fires. Usual causes are a datasource that stopped answering or a rule whose query became invalid; check the Grafana logs and the victoriametrics datasource. NOTE THE LIMIT OF THIS RULE: it is itself a Grafana rule, so it cannot detect the case where Grafana has restarted and NOTHING has evaluated yet -- it would be equally unevaluated. That blind window is addressed by shortening `for` on the rules whose condition is persistent, not by this alert. What this catches is Grafana running while evaluation is broken.
                labels:
                  severity: critical
              - uid: node-memory-pressure
                title: NodeMemoryPressure
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        max(100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)))
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [85]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: NoData
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    Node memory is genuinely under pressure
                  description: >-
                    This watches memory ACTUALLY IN USE, which is the thing that OOM-kills pods. It deliberately does not watch the limits-to-allocatable ratio, which reads 127% and is not a fault: bounding a previously unlimited container raises that number while improving governance, so the headline metric moves the wrong way when things get better. Requests are at 36%, so the scheduler has room; the exposure is the gap between what is requested and what may be consumed on a node with nowhere to reschedule. Threshold is measured rather than guessed - observed usage sits in a 41-45% band with a 7-day peak of 45.1%, so 85% is well clear of normal and means something has genuinely changed. On a single node there is no eviction target, so this is the warning before an OOM kill rather than before a reschedule.
                labels:
                  severity: warning
              - uid: etcd-metrics-absent
                title: EtcdMetricsAbsent
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        absent(etcd_server_has_leader) or vector(0)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    etcd is publishing no metrics at all
                  description: >-
                    The etcd leader metric has disappeared for fifteen minutes. Check that cluster.etcd.extraArgs.listen-metrics-urls is still set on the machineconfig (applied out-of-band via talosctl, so a node rebuilt from a stale config loses it silently) and that the VMNodeScrape control-plane selector still matches. Other etcd rules may have no data while this rule reports the missing scrape.
                labels:
                  severity: warning
              - uid: etcd-no-leader
                title: EtcdNoLeader
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        min(etcd_server_has_leader)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [1]
                            type: lt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: NoData
                execErrState: Error
                for: 5m
                annotations:
                  summary: >-
                    etcd has no leader -- the cluster cannot accept writes
                  description: >-
                    Without a leader etcd accepts no writes, so the API server cannot persist anything: no scheduling, no scaling, no config changes. On this single-node cluster there is no second member to take over, so this is a full outage rather than a failover. Check `talosctl etcd status` and `talosctl service etcd`. NoData is deliberately not Alerting here -- EtcdMetricsAbsent already covers that case with better wording, and duplicating it would mean two alerts for one fault.
                labels:
                  severity: critical
              - uid: etcd-database-size-high
                title: EtcdDatabaseSizeHigh
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        max(etcd_mvcc_db_total_size_in_bytes / etcd_server_quota_backend_bytes)
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.8]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: NoData
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    etcd database is approaching its backend quota
                  description: >-
                    Above 80% of the backend quota. On reaching the quota etcd raises NOSPACE and goes read-only, taking the API server with it -- without warning, which is the specific scenario this rule exists to prevent. The usual cause is accumulated revisions rather than real data: `talosctl etcd status` shows DB SIZE against IN USE, and a large gap between them means a defrag will reclaim it. Compaction runs automatically; defrag does not.
                labels:
                  severity: critical
              - uid: etcd-high-fsync-latency
                title: EtcdHighFsyncLatency
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        histogram_quantile(0.99,
                        sum by (le) (rate(etcd_disk_wal_fsync_duration_seconds_bucket[5m])))
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0.5]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: NoData
                execErrState: Error
                for: 15m
                annotations:
                  summary: >-
                    etcd WAL fsync p99 latency is high
                  description: >-
                    etcd fsyncs every write to the WAL before acknowledging it, so this latency is a floor under every write in the cluster. Sustained values above 500ms mean the disk is the bottleneck and etcd starts missing heartbeats, which on a multi-node cluster triggers spurious leader elections. p99 rather than an average on purpose: the tail causes the timeouts and an average hides it. Correlate with Longhorn and SeaweedFS I/O on the same disk before concluding etcd is at fault.
                labels:
                  severity: warning
              - uid: trivy-config-audit-critical
                title: TrivyConfigAuditCritical
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 3600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'sum(trivy_resource_configaudits{severity="Critical"}) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    Trivy found CRITICAL config-audit findings
                  description: >-
                    Workload misconfiguration, distinct from the image CVE rules. Run `kubectl get configauditreports -A --sort-by=.metadata.creationTimestamp`. A Critical finding would be new relative to the current zero baseline. This rule is a canary for the first Critical; the standing High population is reviewed through TrivyConfigAuditHighRise below, because an absolute-count rule would fire permanently.
                labels:
                  severity: warning
                isPaused: false
              # The Critical rule above cannot fire today and is not meant to:
              # Trivy's config-audit checks top out at High on this cluster, so
              # `severity="Critical"` is structurally 0 and the rule is a canary
              # for the first such finding.
              # Compare each report to its own previous value. A cluster-wide
              # sum can rise because stale reports appeared while unrelated
              # reports disappeared, then oscillate as rollouts retain old
              # ReplicaSets. Normalize ReplicaSet reports to their Deployment
              # owner and count only the active revision at each point in time.
              # Other resource kinds retain their kind/name identity. WITH is
              # supported by this VictoriaMetrics datasource and keeps the
              # current and previous sides auditable.
              - uid: trivy-config-audit-high-rise
                title: TrivyConfigAuditHighRise
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 90000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: >-
                        WITH (
                          current_rs = max by (exported_namespace, owner_name) (
                            label_replace(trivy_resource_configaudits{severity="High",resource_kind="ReplicaSet"}, "replicaset", "$1", "resource_name", "(.*)")
                            * on (exported_namespace, replicaset) group_left (owner_name)
                              label_replace(kube_replicaset_owner{owner_kind="Deployment",owner_is_controller="true"}
                                and on (namespace, replicaset) (kube_replicaset_spec_replicas > 0),
                                "exported_namespace", "$1", "namespace", "(.*)")),
                          previous_rs = max by (exported_namespace, owner_name) (
                            label_replace(trivy_resource_configaudits{severity="High",resource_kind="ReplicaSet"} offset 24h, "replicaset", "$1", "resource_name", "(.*)")
                            * on (exported_namespace, replicaset) group_left (owner_name)
                              label_replace((kube_replicaset_owner{owner_kind="Deployment",owner_is_controller="true"} offset 24h)
                                and on (namespace, replicaset) (kube_replicaset_spec_replicas offset 24h > 0),
                                "exported_namespace", "$1", "namespace", "(.*)")),
                          current_other = sum by (exported_namespace, resource_kind, resource_name) (trivy_resource_configaudits{severity="High",resource_kind!="ReplicaSet"}),
                          previous_other = sum by (exported_namespace, resource_kind, resource_name) (trivy_resource_configaudits{severity="High",resource_kind!="ReplicaSet"} offset 24h),
                          current = current_rs or current_other,
                          previous = previous_rs or previous_other
                        )
                        (current - on (exported_namespace, owner_name, resource_kind, resource_name)
                          (previous or on (exported_namespace, owner_name, resource_kind, resource_name) current * 0)) > 0
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    HIGH config-audit findings increased on {{ "{{" }} if $labels.owner_name }}Deployment {{ "{{" }} $labels.exported_namespace }}/{{ "{{" }} $labels.owner_name }}{{ "{{" }} else }}{{ "{{" }} $labels.resource_kind }} {{ "{{" }} $labels.exported_namespace }}/{{ "{{" }} $labels.resource_name }}{{ "{{" }} end }}
                  description: >-
                    Compare this workload's current ConfigAuditReport with its report from 24 hours ago; inspect `.report.checks[] | select(.severity == "HIGH")`. ReplicaSet findings are attributed to the active Deployment revision so a rollout does not count retained reports as new findings.
                labels:
                  severity: warning
                isPaused: false
              # Delta, not an absolute count, and the 62 findings this fired on
              # when first deployed are why.
              #
              # All 62 were triaged 2026-09-04. 61 of them are on roles this
              # repo cannot change:
              #
              #   13  Kubernetes built-ins -- system:*, cluster-admin, admin,
              #       edit, view. Shipped by Kubernetes, reverted if edited.
              #   26  upstream chart/operator roles -- kyverno:* (6),
              #       cert-manager-* (6), victoria-metrics/vmstack (4),
              #       envoy-gateway (2), flux (3), longhorn, cilium-operator,
              #       cloudnative-pg, reloader, trivy-operator. Reverted on the
              #       next chart upgrade.
              #    3  namespaced Roles, all Helm-managed: longhorn, velero-server,
              #       tailscale operator.
              #
              # The 62nd is kubescape-scan, the only one this repo authors, and
              # it is a false positive: AVD-KSV-0046 flags wildcard RESOURCES
              # without regard to the verbs, and that role holds get/list/watch
              # and nothing else. A cluster posture scanner that cannot read
              # every resource cannot scan every resource.
              #
              # So the absolute count cannot reach zero, and an alert that is
              # always firing is one nobody reads -- the failure mode Agent.md
              # records under "an alert that is always on". Its prescription is
              # this: compare against the previous day so a known-bad baseline
              # cancels and only NEW findings fire. Same shape as
              # SeaweedFSUnreadableBackupObjects, for the same reason.
              #
              # Scoping by name instead was considered and does not work: the
              # only distinguishing label Trivy puts on these series is `name`,
              # and it carries the hashed report name (clusterrole-54cdc9b678),
              # not the ClusterRole's. There is nothing readable to exclude on.
              #
              # The trade is explicit: a new finding that persists past 24h
              # stops alerting once the baseline absorbs it. That is acceptable
              # here because a rise is the actionable signal -- the standing 62
              # are already recorded in docs/backlog.md rather than depending on
              # this rule to keep saying so.
              #
              # Both sides are guarded with `or vector(0)`, verified live: with
              # the metric absent the expression returns 0 rather than empty, so
              # NoData continues to mean "Trivy stopped reporting" and not
              # "nothing is wrong".
              - uid: trivy-rbac-critical
                title: TrivyRBACCritical
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 90000
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: '((sum(trivy_role_rbacassessments{severity="Critical"}) or vector(0)) + (sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"}) or vector(0))) - ((sum(trivy_role_rbacassessments{severity="Critical"} offset 24h) or vector(0)) + (sum(trivy_clusterrole_clusterrbacassessments{severity="Critical"} offset 24h) or vector(0)))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 30m
                annotations:
                  summary: >-
                    New CRITICAL RBAC findings appeared in the last 24h
                  description: >-
                    This fires on a RISE, not on the total -- 62 findings are a known, triaged baseline that cancels out (see docs/backlog.md and the comment above this rule). A positive delta means a role gained a critical permission since yesterday, which is the part worth waking up for. Identify it with `kubectl get clusterrbacassessmentreports` and `kubectl get rbacassessmentreports -A`, then read the checks -- the report name is hashed, so resolve the real role via its ownerReference. If the new finding is on an upstream chart role it will have arrived with a chart bump, in which case the question is whether that bump is acceptable rather than whether the role can be edited.
                labels:
                  severity: warning
                isPaused: false
              # kubescape's weekly NSA/MITRE posture scan.
              #
              # These read kubescape's OWN metric names and its OWN `severity`
              # label, because --format prometheus emits both natively. An
              # earlier revision parsed the JSON report and derived severity
              # from each control's scoreFactor -- that reinvented a mapping
              # kubescape already publishes, and got a different answer.
              #
              # Push metrics from a WEEKLY job, so both rules wrap in
              # last_over_time over a window wider than the cadence. An instant
              # query returns nothing for six days out of seven.
              - uid: kubescape-critical-control-failing
                title: KubescapeCriticalControlFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 691200
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'max(last_over_time(kubescape_control_count_resources_failed{severity="Critical"}[8d])) or vector(0)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK, not Alerting: absence here means the scan has not run,
                # which is what KubescapeScanStale is for. Two rules firing on
                # one cause is how a channel stops being read.
                noDataState: OK
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    A CRITICAL kubescape control has failing resources
                  description: >-
                    Measured 2026-09-04, the cluster has 3 Critical-severity controls and all of them pass -- the 28 failing controls are 10 High, 14 Medium and 4 Low. So this firing means a resource started failing a control kubescape rates Critical, not that the baseline is bad. The full report for every run is in VictoriaLogs; query `kubernetes_container_name:"publish" AND kubernetes_namespace_name:"kubescape"` and read the kubescape_control_* lines, each of which carries the control name, its severity and a docs link.
                labels:
                  severity: critical
                isPaused: false
              - uid: kubescape-scan-stale
                title: KubescapeScanStale
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 1209600
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'time() - last_over_time(kubescape_scan_last_run_timestamp[14d])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [864000]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData: a scan that never ran and a scan whose
                # metrics never arrived are the same outcome -- no posture
                # signal -- and the whole point of this pair is that the
                # previous job reported nothing for its entire life.
                noDataState: Alerting
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    The kubescape posture scan has not reported in over 10 days
                  description: >-
                    The scan runs Sundays at 02:00, so 10 days means at least one run was missed entirely rather than merely delayed. Check `kubectl get cronjob kubescape-scan -n kubescape` and the last Job's logs. kubescape_scan_last_run_timestamp is appended by the job itself rather than emitted by kubescape, so this can also mean the publish step failed after a successful scan -- the report would still be in VictoriaLogs in that case.
                labels:
                  severity: warning
                isPaused: false
    initChownData:
      enabled: false
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

    # The download-dashboards initContainer, which is why the grafana Deployment
    # failed require-resource-limits even though the grafana container above is
    # bounded. Kyverno checks every container in the spec, initContainers
    # included -- and the report names the Deployment, not the container, which
    # reads as "grafana has no limit" and sends you to the wrong place.
    #
    # No measurement behind this one: it runs only at pod start and is gone
    # before any scrape samples it. 128Mi is generous for a process that curls
    # dashboard JSON onto a shared volume.
    downloadDashboards:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
    # Inject GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET from grafana-oauth-secret into Grafana's env.
    # Grafana config below references it via $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}.
    envFromSecret: grafana-oauth-secret
    grafana.ini:
      paths:
        data: /var/lib/grafana-state
        plugins: /var/lib/grafana/plugins
      server:
        root_url: https://grafana.homelab.data-harness.org
      auth.generic_oauth:
        enabled: true
        name: Homelab SSO
        allow_sign_up: true
        scopes: openid email profile groups
        auth_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/auth
        token_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/token
        api_url: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/userinfo
        client_id: grafana
        client_secret: "$__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}"
        # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): Keycloak's
        # /owner/platform-admin -> Grafana Admin, /maintainer/app-operator ->
        # Editor, everyone else (including /reader/viewer) -> Viewer. Replaces
        # the old flat 'admin' group check now that the group is gone --
        # see setup-job.yaml's migration comment.
        # No trailing 'Viewer' fallback, and role_attribute_strict on. Together
        # they mean a user whose groups match none of these is refused a role,
        # and Grafana then refuses the login.
        #
        # This became load-bearing the moment public self-registration was
        # enabled on the realm. The previous expression ended in || 'Viewer',
        # so ANY account Keycloak authenticated -- including one a stranger had
        # just created for themselves -- was granted Grafana Viewer and could
        # read every dashboard and all metrics. Self-registered accounts are
        # scoped to Paperless and Immich; this is what keeps them out of here.
        #
        # Consequence worth knowing: a real person added to Keycloak but not yet
        # put in a tier group cannot log in to Grafana at all. That is the
        # intended direction of failure -- refused rather than quietly admitted
        # as a Viewer -- but it will look like a broken login rather than a
        # missing group membership.
        role_attribute_path: "contains(groups[*], 'platform-admin') && 'Admin' || contains(groups[*], 'app-operator') && 'Editor' || contains(groups[*], 'viewer') && 'Viewer'"
        role_attribute_strict: true
        use_pkce: true
        auto_login: false
    image:
      # registry and repository restate the chart's own defaults, so the
      # running image is unchanged: docker.io/grafana/grafana:12.4.10.
      # They are here because a bare `tag:` is not resolvable -- Renovate
      # cannot tell which image a lone version belongs to, so it never
      # proposed an update for this pin. That mattered: the tag was applied
      # by hand to patch an active Critical CVE (#411) and would otherwise
      # have sat here ageing with nothing watching it.
      #
      # It is currently AHEAD of the chart's appVersion (12.3.1), so it is a
      # patch rather than a freeze. If the chart's appVersion ever passes
      # this value, it silently becomes a freeze instead -- which is the
      # reason to keep it tracked rather than pinned and forgotten.
      #
      # On staying at 12 (decided 2026-09-09, #517): no chart carries
      # Grafana 13. grafana 10.5.15 is the newest chart published and still
      # ships appVersion 12.3.1, and no version in the index ships a 13.x
      # appVersion at all -- so taking 13 means running it against templates
      # written for 12.x, and this release provisions its dashboards and
      # alert rules through those templates.
      #
      # Holding costs no patch currency: Grafana maintains 12.4 alongside 13,
      # and 12.4.10, 13.1.5 and 13.2.1 all shipped on 2026-09-01. Nothing
      # blocks the proposal -- a v13 PR is expected to sit open as a standing
      # reminder, labelled major-update and never auto-merged. Take it when a
      # grafana chart ships a 13.x appVersion, which arrives on its own as a
      # chart update.
      registry: docker.io
      repository: grafana/grafana
      tag: 12.4.12
