                isPaused: false
              # Backup scope. This is the rule that would have caught the
              # exclusion bug fixed in the same series of changes: the policy job
              # reported volumes as excluded on every run, for its whole life,
              # while every one of them stayed in Longhorn's `default` group and
              # was still being backed up.
              #
              # Alerting on drift rather than on an absolute count keeps it
              # self-adjusting. Adding an application adds a volume to both the
              # actual and the expected side, so nothing fires; an exclusion that
              # stops taking effect moves only one side. A fixed threshold on
              # in_default would have to be revised every time an app is added,
              # and a threshold nobody maintains is one nobody trusts.
              - uid: backup-scope-drift
                title: BackupScopeDrift
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 10800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'abs(last_over_time(backup_volume_policy_drift[3h]))'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # The job runs hourly, so three hours of silence is the job
                # having stopped -- and a scope reconciler that has stopped is
                # exactly when scope drifts unnoticed.
                noDataState: Alerting
                execErrState: Error
                for: 0m
                annotations:
                  summary: >-
                    Longhorn backup scope does not match the policy
                  description: >-
                    The number of volumes in Longhorn's `default` group differs from the number the exclusion list in 34-backup/volume-backup-policy.yaml says should be there. Either an exclusion has stopped taking effect and something is being backed up that should not be, or a volume that should be protected has dropped out of the group. Compare `kubectl get volumes.longhorn.io -n longhorn-system -l recurring-job-group.longhorn.io/default=enabled` against that list, and read the tail of the last volume-backup-policy run, which prints both. Do not judge this from the job's "excluded" lines; those describe what it attempted, not what took effect.
                labels:
                  severity: critical
                isPaused: false
              # ── Talos advisories ────────────────────────────────────────
              # Fed by the talos-cve-watch CronJob, which compares the version
              # actually running on each node -- read from kube_node_info's
              # os_image label, not from the pin in git -- against SideroLabs'
              # published advisories.
              #
              # 26h windows because the job runs daily. An instant query
              # returns nothing for a metric pushed once a day: verified live
              # on 2026-08-26, where the same series was empty instantly and
              # present under last_over_time.
              - uid: talos-advisory-affecting
                title: TalosAdvisoryAffectingRunningVersion
                condition: B
