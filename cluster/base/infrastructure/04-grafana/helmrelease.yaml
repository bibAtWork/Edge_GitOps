                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # OK rather than Alerting on NoData: a broken check is already
                # covered by TalosCveCheckFailing below, and having both fire
                # for one cause makes the pair less informative, not more.
                noDataState: OK
                execErrState: Error
                for: 1h
                annotations:
                  summary: >-
                    A Talos security advisory affects the running version
                  description: >-
                    SideroLabs has published a critical or high advisory whose affected range covers the Talos version currently running on a node. Identify it with the talos_advisory_detail series, which carries the GHSA id, severity and affected version as labels, and read the advisory at https://github.com/siderolabs/talos/security/advisories. Upgrading is the fix, and it does not have to wait for the Sunday window -- label the node talos.homelab/upgrade-now to run the on-demand Plan, provided the version pinned in the repo is actually a fixed one.
                labels:
                  severity: critical
                isPaused: false
              - uid: talos-cve-check-failing
                title: TalosCveCheckFailing
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 172800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      # 48h, against a job that now runs every 12h. The window
                      # has to outlast more than one missed run: these metrics are
                      # PUSHED, so a run that does not happen leaves no value and
                      # the rule sees NoData rather than a stale number. With
                      # noDataState: Alerting that is indistinguishable from a
                      # real failure.
                      #
                      # 26h against a daily job left exactly one miss between
                      # healthy and firing, and on 2026-09-03 that fired for hours
                      # because vmsingle happened to be restarting when the job
                      # ran. 48h/12h tolerates three consecutive misses, which is
                      # a genuine outage rather than a coincidence.
                      expr: 'last_over_time(talos_advisory_check_failed[48h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                # Alerting on NoData, deliberately. If the job stops running
                # altogether the series ages out of the 26h window and this
                # goes off -- which is the point. A vulnerability check that
                # silently stopped checking is indistinguishable from a clean
                # result, and that is a failure this cluster has seen before.
                noDataState: Alerting
                execErrState: Error
                for: 2h
                annotations:
                  summary: >-
                    The Talos advisory check is failing or has stopped running
                  description: >-
                    talos-cve-watch either reported a failure or has not pushed a result in over a day, so the cluster currently has no working answer to whether its Talos version is affected by a published advisory. Read the last run with `kubectl logs -n monitoring -l app.kubernetes.io/name=talos-cve-watch --tail=50`. The common causes are an exhausted GitHub anonymous rate limit, which the job detects and reports rather than treating as an empty advisory list, and kube_node_info missing its os_image label.
                labels:
                  severity: warning
                isPaused: false
              # ── Talos fleet health ──────────────────────────────────────
              # Fed by the talos-fleet-health CronJob (every 6h), which
              # compares each node's actual running Talos version against
              # every other node's and against versions.env, and checks each
              # node's Ready condition. Without these rules the metrics exist
              # but nothing pages on them, which is the exact gap this whole
              # mechanism was built to close.
              #
              # 8h query windows: the job runs every 6h, +2h slack, same ratio
              # as the daily/26h talos-advisory pair above.
              #
              # `for: 8h` on this rule and the two below (K8s skew, unready
              # nodes) -- NOT `for: 0m` as an earlier version of this comment
              # had it. That version relied on the fleet-health CronJob's
              # schedule never landing inside a Sunday upgrade window "by
              # construction", which held only as long as nobody moved either
              # side without checking the other: round 4 code review found
              # the OS windows had moved to midday (12:00-17:00) while the
              # schedule was untouched, and 12:35 UTC now sits inside the
              # control-plane window -- exactly the silent collision that
              # comment warned was possible once 3-node made a rollout long
              # enough to overlap a check, except it took a window move on
              # the 1-node profile to trigger it, not a multi-node rollout.
              #
              # Two changes instead of one, matching the review's own
              # framing of a fix that survives the NEXT window move, not
              # just this one:
              #
              #   (a) the schedule itself moved to 05:35/11:35/17:35/23:35
              #       UTC, clear of the current 12:00-17:00 span (see
              #       fleet-health-cronjob.yaml) -- and the Talos image CI
              #       workflow now asserts this schedule/window relationship
              #       as an invariant, the same way it already asserts
              #       `replacements` resolve, so the next window (or
              #       schedule) move that reintroduces a collision fails at
              #       PR time instead of at the next Sunday 12:35.
              #   (b) `for: 8h` here regardless -- sized to the longest
              #       window (2h) plus one full check interval (6h), so even
              #       if (a) is ever wrong, a single mid-window sample is not
              #       enough to page: the metric stays "last" for up to 6h
              #       until the next (post-window) run supersedes it, which
              #       clears the condition well before 8h of continuous
              #       pending time can accumulate. A genuine, persistent
              #       problem still fires, just up to ~8h later than
              #       instantly -- the review's own tradeoff, judged
              #       acceptable here against a guaranteed weekly false page.
              #       This is a wall-clock `for:` duration, not a
              #       min_over_time query -- it does not have
              #       TalosFleetVersionDrift's ephemeral-state problem, since
              #       8 hours of Grafana uptime is a low bar compared to 8
              #       days, and the cost of getting it wrong here is delayed
              #       detection, not a permanently inert rule.
              - uid: talos-fleet-version-skew
                title: TalosFleetVersionSkew
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 28800
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'last_over_time(talos_fleet_version_skew[8h])'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                for: 8h
                annotations:
                  summary: >-
                    Talos nodes disagree with each other on OS version
                  description: >-
                    talos-fleet-health found more than one distinct Talos version across nodes via kube_node_info. Identify the split with the talos_fleet_node_info series, which carries each node's version as a label. Either a rolling upgrade is genuinely in progress outside its expected window, or a node's upgrade stalled partway. Check `kubectl get jobs -n cattle-system` and the Plan status with `kubectl get plans -n cattle-system`.
                labels:
                  severity: warning
                isPaused: false
              - uid: talos-fleet-version-drift
                title: TalosFleetVersionDrift
                condition: B
                data:
                  - refId: A
                    relativeTimeRange:
                      from: 691200
                      to: 0
                    datasourceUid: victoriametrics
                    model:
                      expr: 'min_over_time(talos_fleet_version_drift[8d]) and (count_over_time(talos_fleet_version_drift[8d]) >= 28)'
                      instant: true
                      range: false
                      refId: A
                  - refId: B
                    datasourceUid: '-100'
                    model:
                      type: threshold
                      refId: B
                      conditions:
                        - evaluator:
                            params: [0]
                            type: gt
                          operator:
                            type: and
                          query:
                            params: [A]
                          reducer:
                            params: []
                            type: last
                          type: query
                      datasource:
                        type: __expr__
                        uid: '-100'
                      expression: A
                noDataState: OK
                execErrState: Error
                # Grace period, not a window-aware gate: code review on PR
                # #386 (round 2) found that versions.env applies at merge,
                # while the automated upgrade waits for the Sunday window --
                # a merge shortly after that window means up to ~7 days where
                # this condition is true and describes nothing more than
                # normal operation. Gating on the actual window was
                # considered and rejected as more complex than warranted; a
                # grace period spanning one full week (the longest possible
                # merge-to-window gap, plus the window itself, plus a day of
                # buffer) instead, so this only fires once an upgrade has had
                # a full cycle to happen and still hasn't. Severity dropped
                # to warning to match: a week-old drift is worth a look, not
                # a page.
                #
                # Round 3 review found the grace period couldn't actually be
                # `for: 8d`: Grafana's persistence.enabled: false (this file,
                # above) means alert-instance pending state lives in an
                # ephemeral SQLite DB, wiped on every pod restart -- and a
                # HelmRelease reconcile, a node reboot, or one of the very
                # Talos upgrades this alert watches for would all reset an
                # 8-day wall-clock pending timer to zero, making the rule
                # effectively inert. Moved the grace period into the query
                # instead: min_over_time over 8 days of STORED samples in
                # vmsingle (retention comfortably exceeds 8 days), true
                # regardless of how many times Grafana itself has restarted
                # in that span, with `for: 0m` since the 8 days now live in
                # the expression rather than in pending-state duration.
                #
                # Round 4 review found that first version of the query still
                # didn't implement a grace period: min_over_time aggregates
                # only the samples that EXIST in the window, so a brand-new
                # series with a single drifted sample (the check runs once
                # and immediately sees drift) returns 1 and fires the same
                # instant, not after 8 days. "Ignores absent samples" cuts
                # both ways -- it also means the window doesn't need to be
                # full before the rule can fire. The count_over_time(...) >=
