# ENCRYPT WITH SOPS BEFORE COMMITTING:
#
# Use the same value as dex-secrets.grafana-client-secret in 23-dex/secret.yaml.
# Run: sops --encrypt --in-place grafana-oauth-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: grafana-oauth-secret
  namespace: monitoring
stringData:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "REPLACE-WITH-SAME-VALUE-AS-dex-secrets.grafana-client-secret"
