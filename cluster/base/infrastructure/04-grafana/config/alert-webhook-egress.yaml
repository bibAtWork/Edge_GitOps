apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-cao-alert-egress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cao-sre
            app: cao-sre
      toPorts:
        - ports:
            - port: '9891'
              protocol: TCP
