apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    # How this route authenticates -- checked against Keycloak, the
    # SecurityPolicies and OPA by scripts/check-platform-contracts.py.
    gitops.homelab/auth: native-oidc
    gitops.homelab/auth-client: grafana
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - grafana.homelab.data-harness.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
