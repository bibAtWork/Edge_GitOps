apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-falco-dashboard-reader
  namespace: monitoring
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [falco-grafana-dashboard]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-falco-dashboard-reader
  namespace: monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: grafana-falco-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: grafana
    namespace: monitoring
