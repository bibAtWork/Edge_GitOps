# Encrypt with SOPS before committing:
#   sops --encrypt --in-place s3-secret.yaml
#
# The chart mounts this secret at /etc/sw/ and reads /etc/sw/seaweedfs_s3_config.
# Use the JSON format below. The admin_access_key_id / admin_secret_access_key keys
# are kept for rotate-secrets.py compatibility.
apiVersion: v1
kind: Secret
metadata:
  name: seaweedfs-s3-secret
  namespace: seaweedfs
stringData:
  admin_access_key_id: REPLACE_WITH_ADMIN_KEY
  admin_secret_access_key: REPLACE_WITH_ADMIN_SECRET
  seaweedfs_s3_config: |
    {
      "identities": [
        {
          "name": "admin",
          "credentials": [
            {
              "accessKey": "REPLACE_WITH_ADMIN_KEY",
              "secretKey": "REPLACE_WITH_ADMIN_SECRET"
            }
          ],
          "actions": ["Admin", "Read", "Write", "DeleteObject", "CreateBucket", "DeleteBucket", "ListBuckets"]
        }
      ]
    }
