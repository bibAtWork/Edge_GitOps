# Schema for the SeaweedFS filer Postgres store.
#
# WHY this file has to exist: unlike the leveldb2 store (which creates its own
# on-disk structures), the SeaweedFS Postgres store does NOT create its table.
# Confirmed in SeaweedFS source -- weed/filer/postgres/postgres_store.go sets
# `CreateTableSqlTemplate: ""`, so nothing issues any DDL at startup. Point the
# filer at an empty database and it starts, fails every metadata query, and the
# StatefulSet never goes Ready. That is exactly what happened on the first
# cutover attempt here: Helm reported "stalled resources: StatefulSet/
# seaweedfs-filer status: 'Failed'" and Flux correctly rolled back to leveldb2.
#
# Mounted into /docker-entrypoint-initdb.d/ so Postgres applies it during
# database initialisation -- keeping the schema declarative and versioned
# alongside everything else, rather than a manual psql step nobody remembers
# when the cluster is rebuilt. IF NOT EXISTS keeps it safe to re-run.
apiVersion: v1
kind: ConfigMap
metadata:
  name: seaweedfs-filer-postgres-schema
  namespace: seaweedfs
data:
  01-filemeta.sql: |
    -- SeaweedFS filer metadata table.
    --
    -- dirhash:   first 64 bits of the MD5 of the parent directory path, used
    --            as the leading key so all entries in one directory cluster
    --            together and a directory listing is a single index range scan.
    -- name:      the file or directory name within that parent.
    -- directory: the full parent path, kept alongside the hash because the
    --            hash is lossy and cannot be reversed for listings.
    -- meta:      the serialised entry -- attributes plus the chunk-ID list
    --            that reassembles the file from the volume servers. This
    --            column is the mapping that makes the stored blobs meaningful.
    CREATE TABLE IF NOT EXISTS filemeta (
        dirhash   BIGINT,
        name      VARCHAR(65535),
        directory VARCHAR(65535),
        meta      bytea,
        PRIMARY KEY (dirhash, name)
    );
