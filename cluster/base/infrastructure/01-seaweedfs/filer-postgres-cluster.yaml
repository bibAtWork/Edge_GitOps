# SeaweedFS filer metadata, run by CloudNativePG on Longhorn block storage.
#
# Replaces filer-postgres.yaml's hand-rolled StatefulSet on local-path.
#
# This database IS the SeaweedFS namespace: volume servers hold anonymous chunks,
# and only this metadata maps them back to real files. Losing it renders every
# byte on every volume server unrecoverable, which makes it the highest-value and
# smallest-volume database in the cluster. The 2026-08-24 repartition demonstrated
# the inverse failure too -- metadata surviving while chunks were wiped produced
# 155 objects that listed fine and could not be read.
#
# On Longhorn rather than SeaweedFS, deliberately. Putting the filer's own
# metadata on storage that the filer serves would be circular: recovering
# SeaweedFS would require SeaweedFS. Longhorn has no such dependency -- it is
# iSCSI against a local disk and comes up without the filer -- so the original
# reason this database avoided SeaweedFS is satisfied while it still gains a real
# block device with ext4.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: filer-pg
  namespace: seaweedfs
spec:
  # Matches the StatefulSet being migrated from (postgres:16-alpine). A restore
  # into an older major fails outright, and pg_dump refuses to read a newer
  # server than itself.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.10

  # Single instance: one node, so a second replica has nowhere to run and CNPG
  # would leave it permanently pending. Durability comes from the hourly logical
  # dumps to the filer-metadata bucket, not from replication.
  instances: 1

  bootstrap:
    initdb:
      # Names carried over from the existing deployment so the filer's
      # WEED_POSTGRES_* configuration changes only its hostname.
      database: seaweedfs_filer
      owner: seaweedfs

  storage:
    size: 5Gi
    storageClass: longhorn-db

  walStorage:
    size: 2Gi
    storageClass: longhorn-db

  # Every file operation in the cluster becomes a query here once CSI volumes are
  # served from SeaweedFS, so the connection ceiling matters more than raw size.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
