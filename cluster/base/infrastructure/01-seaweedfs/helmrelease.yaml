apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 30m
  chart:
    spec:
      chart: seaweedfs
      version: 4.43.0
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # v4 moved app-specific globals under global.seaweedfs to avoid collisions when
    # used as a subchart. Image tag moved to a top-level image block.
    global:
      seaweedfs:
        createClusterRole: true

    image:
      tag: "4.40"

    # Efficiency review 2026-08-17: none of the three seaweedfs components had any
    # resources set, making all of them BestEffort QoS — the first pods the kubelet
    # evicts under node memory pressure. That ordering is backwards here: seaweedfs
    # is the storage backbone (Zot's registry, Velero's backup target, talos-backup's
    # etcd snapshots), so evicting it takes the backup/restore path down with it.
    # Requests sized from measured 24h peaks (filer 748Mi, master/volume ~110Mi
    # each), set as a steady-state floor rather than the peak — a request is a
    # reservation, not a cap. Limits are deliberately generous: the point is QoS
    # class and eviction ordering, not capping a component that has never OOMed.
    # All hostPathPrefix values point at /var/mnt/seaweedfs -- the dedicated
    # 512GB NVMe provisioned via UserVolumeConfig in
    # cluster/overlays/1-node/talos-machineconfigs/controlplane.yaml, NOT the
    # system disk. Before this, SeaweedFS shared sda with the OS, etcd,
    # container images and every local-path PVC, so storage load and control
    # plane stability were the same failure domain (2026-08-18 audit).
    #
    # Data was migrated with SeaweedFS scaled to zero for a consistent copy,
    # and verified byte-for-byte per directory (2,990,094,543 bytes total)
    # before the switch. The old copy under /var/lib/seaweedfs is intentionally
    # left in place as a rollback path -- revert these six values to
    # /var/lib/seaweedfs/... and it comes straight back.
    master:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      data:
        type: hostPath
        hostPathPrefix: /var/mnt/seaweedfs/master
      logs:
        type: hostPath
        hostPathPrefix: /var/mnt/seaweedfs/master-logs

    volume:
      enabled: true
      # Single-node baseline. "000" means no replica copies -- with one volume
      # server there is nowhere to put a second copy, so any other value would
      # leave writes unsatisfiable rather than adding redundancy.
      #
      # The 3-node overlay patches this to "001" alongside replicaCount: 3
      # (overlays/3-node/patches/seaweedfs-ha.yaml). Worth noting that the same
      # patch also sets filer.replicaCount: 2, which was silently impossible
      # until the filer moved off leveldb2 -- an embedded single-writer store
      # cannot be shared by two filers. On this single-node cluster durability
      # comes from backups, not replication.
      replicaCount: 1
      replication: "000"
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi
      # dataDirs controls the actual data path; volume.data has no effect for this component
      dataDirs:
        - name: data1
          type: hostPath
          hostPathPrefix: /var/mnt/seaweedfs/volume
          maxVolumes: 0
      logs:
        type: hostPath
        hostPathPrefix: /var/mnt/seaweedfs/volume-logs

    filer:
      enabled: true
      # Raised from 1536Mi on 2026-08-24 after the filer was OOMKilled (exit 137)
      # streaming a bulk read of the 4GB etcd-snapshot bucket during the
      # pre-repartition offsite copy. The failure surfaced as
      # "Could not connect to the endpoint URL" in the *client*, which reads as a
      # network fault rather than the filer dying underneath it -- the same
      # misleading signature as the CSI mount daemon OOM.
      #
      # The filer streams object bodies for every S3 GET, so its memory scales
      # with concurrent transfer size, not with stored data. Bulk operations are
      # exactly when it is needed and exactly when it was capped.
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 3Gi
      data:
        type: hostPath
        hostPathPrefix: /var/mnt/seaweedfs/filer
      logs:
        type: hostPath
        hostPathPrefix: /var/mnt/seaweedfs/filer-logs
      # Metadata store: PostgreSQL, not the chart default leveldb2.
      #
      # SeaweedFS classifies leveldb/leveldb2/leveldb3 as "Local" stores --
      # embedded single-writer libraries, so exactly one filer process can ever
      # hold one open. That caps the cluster at a single filer permanently,
      # makes the filer an unremovable SPOF, and pins the namespace to one
      # node's disk. Postgres is classified "Local or Distributed": several
      # filers share one namespace and any of them can serve any request.
      # This single setting is what makes a multi-node SeaweedFS possible.
      #
      # See filer-postgres.yaml for why that database intentionally does NOT
      # live on SeaweedFS itself (circular dependency) and how it is protected.
      extraEnvironmentVars:
        WEED_LEVELDB2_ENABLED: "false"
        WEED_POSTGRES_ENABLED: "true"
        # CNPG read-write service, which always resolves to the current primary.
        # The previous value named the hand-rolled StatefulSet directly.
        WEED_POSTGRES_HOSTNAME: filer-pg-rw
        WEED_POSTGRES_PORT: "5432"
        WEED_POSTGRES_USERNAME: seaweedfs
        WEED_POSTGRES_DATABASE: seaweedfs_filer
        WEED_POSTGRES_SSLMODE: disable
        # Connection pool sized for CSI: once app PVCs are served from
        # SeaweedFS, every file operation in the cluster becomes a query here.
        WEED_POSTGRES_CONNECTION_MAX_IDLE: "10"
        WEED_POSTGRES_CONNECTION_MAX_OPEN: "50"
      # Password comes from the SOPS-managed secret rather than being inlined,
      # so it is never rendered into the HelmRelease or the chart's ConfigMap.
      # Key name verified against the chart's own values.yaml
      # (filer.secretExtraEnvironmentVars, per-variable secretKeyRef) rather
      # than assumed -- an invented key here would be silently ignored by Helm
      # and the filer would start with no password against a live database.
      secretExtraEnvironmentVars:
        WEED_POSTGRES_PASSWORD:
          secretKeyRef:
            name: filer-pg-app
            key: password
      s3:
        enabled: true
        enableAuth: true
        # Use our SOPS-managed secret directly so v4's pre-upgrade hook does not
        # overwrite it. The secret must contain a seaweedfs_s3_config key.
        existingConfigSecret: seaweedfs-s3-secret
        # Enable virtual-hosted-style bucket addressing so that S3 clients
        # that ignore USE_PATH_STYLE (e.g. talos-backup v0.1.0-beta.2) can
        # reach buckets via <bucket>.seaweedfs-s3.seaweedfs.svc:8333.
        domainName: seaweedfs-s3.seaweedfs.svc.cluster.local

    # Use filer's embedded S3 endpoint on port 8333; standalone s3 Deployment is redundant.
    s3:
      enabled: false
