apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 30m
  chart:
    spec:
      chart: seaweedfs
      version: ">=3.0.0 <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    global:
      createClusterRole: true
      registry: ""
      repository: ""
      imageName: chrislusf/seaweedfs
      imageTag: "latest"
      imagePullPolicy: IfNotPresent

    master:
      enabled: true
      replicaCount: 1
      data:
        type: "existingClaim"
      logs:
        type: "existingClaim"

    volume:
      enabled: true
      replicaCount: 1
      replication: "000"
      data:
        type: "existingClaim"
      logs:
        type: "existingClaim"

    filer:
      enabled: true
      replicaCount: 1
      s3:
        enabled: true
        enableAuth: true
        existingConfigSecret: seaweedfs-s3-secret

    s3:
      enabled: true
      port: 8333

    csi:
      enabled: true
      controller:
        replicas: 1
