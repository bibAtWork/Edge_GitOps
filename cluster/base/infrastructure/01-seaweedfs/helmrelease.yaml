apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  interval: 30m
  chart:
    spec:
      chart: seaweedfs
      version: ">=3.0.0 <4.0.0"
      sourceRef:
        kind: HelmRepository
        name: seaweedfs
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    global:
      createClusterRole: true
      registry: ""
      repository: ""
      imageName: chrislusf/seaweedfs
      imageTag: "latest"
      imagePullPolicy: IfNotPresent

    master:
      enabled: true
      replicaCount: 1
      data:
        type: hostPath
        hostPathPrefix: /var/lib/seaweedfs/master
      logs:
        type: hostPath
        hostPathPrefix: /var/lib/seaweedfs/master-logs

    volume:
      enabled: true
      replicaCount: 1
      replication: "000"
      # dataDirs controls the actual data path; volume.data has no effect for this component
      dataDirs:
        - name: data1
          type: hostPath
          hostPathPrefix: /var/lib/seaweedfs/volume
          maxVolumes: 0
      logs:
        type: hostPath
        hostPathPrefix: /var/lib/seaweedfs/volume-logs

    filer:
      enabled: true
      replicaCount: 1
      data:
        type: hostPath
        hostPathPrefix: /var/lib/seaweedfs/filer
      logs:
        type: hostPath
        hostPathPrefix: /var/lib/seaweedfs/filer-logs
      s3:
        enabled: true
        enableAuth: true

    # Use filer's embedded S3 endpoint on port 8333; standalone s3 Deployment is redundant.
    s3:
      enabled: false

    csi:
      enabled: true
      controller:
        replicas: 1
