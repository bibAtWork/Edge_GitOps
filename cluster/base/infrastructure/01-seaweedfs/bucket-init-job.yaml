apiVersion: batch/v1
kind: Job
metadata:
  # Job.spec.template is immutable. A static name means any change to the pod
  # spec — including an automated image bump, which is exactly what happened
  # 2026-08-17 when Renovate's kubernetes manager (enabled #131) bumped
  # amazon/aws-cli here — fails outright against the still-existing prior Job,
  # and that failure blocks the whole flux-system Kustomization (this Job is
  # on its reconcile path), not just this one resource. Confirmed live: no
  # Kustomization reconciled until the stale Job was deleted by hand. Same
  # root cause and fix as 26-keycloak/setup-job.yaml (see its comment for the
  # full incident writeup).
  #
  # This Kustomization runs with prune: true, so bump the numeric suffix
  # whenever this file's pod spec changes for any reason (not just manual
  # edits — Renovate PRs count) and Flux will garbage-collect the old-named
  # Job cleanly instead of trying to patch it in place.
  name: seaweedfs-bucket-init-6
  namespace: seaweedfs
  annotations:
    # Re-run manually if buckets are lost: kubectl delete job seaweedfs-bucket-init-4 -n seaweedfs
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-s3
          image: busybox:1.38
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for SeaweedFS S3 endpoint..."
              until nc -z seaweedfs-s3.seaweedfs.svc 8333; do
                echo "  not ready, retrying in 5s..."
                sleep 5
              done
              echo "SeaweedFS S3 is up."
      containers:
        - name: create-buckets
          image: amazon/aws-cli:2.36.38
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_secret_access_key
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              S3="http://seaweedfs-s3.seaweedfs.svc:8333"
              # filer-metadata holds the filer's PostgreSQL dumps. It is a separate bucket
              # rather than a prefix inside velero-backups on purpose: Velero rejects any
              # top-level directory in its own bucket that it does not own, and marks the
              # BackupStorageLocation Unavailable, which blocks all backups to it.
              # longhorn-backups is Longhorn's backup target (ADR-002 Task 1). It is a
              # dedicated bucket so the relay to AWS can mirror one prefix wholesale
              # without entangling it with Velero's or Zot's contents.
              # "pvs" is deliberately absent. It was a vestige of an earlier plan to back
              # application PVCs with SeaweedFS through its CSI driver, which was never
              # carried through: the driver was removed entirely in #264 once no PVC used
              # it, and application volumes are on Longhorn. Creating the bucket every
              # reconcile advertised a storage path that does not exist.
              #
              # Confirmed empty before removal, on 2026-08-17 when this was first proposed
              # and again on 2026-08-25 -- the 64MB it briefly held in between was debris
              # from a SeaweedFS round-trip integrity test, since cleared.
              for bucket in etcd-backups velero-backups zot-registry filer-metadata db-backups longhorn-backups seaweedfs-staging; do
                if aws --endpoint-url "$S3" s3api head-bucket --bucket "$bucket" 2>/dev/null; then
                  echo "Bucket already exists: $bucket"
                else
                  aws --endpoint-url "$S3" s3api create-bucket --bucket "$bucket"
                  echo "Created bucket: $bucket"
                fi
              done
              echo "All buckets ready."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
