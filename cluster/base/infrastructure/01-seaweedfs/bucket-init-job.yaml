apiVersion: batch/v1
kind: Job
metadata:
  name: seaweedfs-bucket-init
  namespace: seaweedfs
  annotations:
    # Re-run manually if buckets are lost: kubectl delete job seaweedfs-bucket-init -n seaweedfs
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-s3
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for SeaweedFS S3 endpoint..."
              until nc -z seaweedfs-s3.seaweedfs.svc 8333; do
                echo "  not ready, retrying in 5s..."
                sleep 5
              done
              echo "SeaweedFS S3 is up."
      containers:
        - name: create-buckets
          image: amazon/aws-cli:2.36.11
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_access_key_id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: seaweedfs-s3-secret
                  key: admin_secret_access_key
          command:
            - /bin/sh
            - -c
            - |
              set -euo pipefail
              S3="http://seaweedfs-s3.seaweedfs.svc:8333"
              for bucket in etcd-backups velero-backups zot-registry pvs; do
                if aws --endpoint-url "$S3" s3api head-bucket --bucket "$bucket" 2>/dev/null; then
                  echo "Bucket already exists: $bucket"
                else
                  aws --endpoint-url "$S3" s3api create-bucket --bucket "$bucket"
                  echo "Created bucket: $bucket"
                fi
              done
              echo "All buckets ready."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
