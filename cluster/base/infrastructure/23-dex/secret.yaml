# ENCRYPT WITH SOPS BEFORE COMMITTING:
#
# 1. Generate Grafana client secret (random string):
#      openssl rand -base64 32 | tr -d '\n'
#    Copy the output as grafana-client-secret.
#    Use the SAME value in cluster/base/infrastructure/04-grafana/grafana-oauth-secret.yaml.
#
# 2. Generate admin bcrypt password hash:
#      htpasswd -nbBC 10 "" 'your-password-here' | tr -d ':\n'
#    Copy the $2y$... hash as admin-password-hash.
#
# 3. Encrypt this file in place:
#      sops --encrypt --in-place secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: dex-secrets
  namespace: dex
stringData:
  grafana-client-secret: "REPLACE-WITH-RANDOM-SECRET"
  admin-password-hash: "REPLACE-WITH-BCRYPT-HASH"
