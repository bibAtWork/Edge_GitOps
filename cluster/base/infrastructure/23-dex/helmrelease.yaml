apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dex
  namespace: dex
spec:
  interval: 30m
  chart:
    spec:
      chart: dex
      version: "0.24.*"
      sourceRef:
        kind: HelmRepository
        name: dex
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  valuesFrom:
    - kind: Secret
      name: dex-static-clients
      valuesKey: values.yaml
  values:
    config:
      issuer: https://dex.homelab.data-harness.org

      storage:
        type: kubernetes
        config:
          inCluster: true

      web:
        http: 0.0.0.0:5556

      expiry:
        idTokens: 24h
        signingKeys: 6h

      oauth2:
        skipApprovalScreen: true
        responseTypes:
          - code

      # Local password database — no external IdP connector needed for homelab.
      # To add GitHub/Google SSO: add a connector here and set clientID/secret via env vars.
      # See: https://dexidp.io/docs/connectors/
      enablePasswordDB: true

      staticPasswords:
        - email: admin@homelab.internal
          hashFromEnv: DEX_ADMIN_PASSWORD_HASH
          username: admin
          userID: "00000000-0000-0000-0000-000000000001"

    envVars:
      - name: DEX_ADMIN_PASSWORD_HASH
        valueFrom:
          secretKeyRef:
            name: dex-secrets
            key: admin-password-hash

    serviceAccount:
      create: true
      name: dex

    rbac:
      create: true

    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 256Mi

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1001
      seccompProfile:
        type: RuntimeDefault

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1001
      fsGroup: 1001
      seccompProfile:
        type: RuntimeDefault
