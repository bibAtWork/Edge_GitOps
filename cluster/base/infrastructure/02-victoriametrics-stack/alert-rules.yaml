apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cilium-gateway-health
  namespace: monitoring
spec:
  groups:
    - name: cilium.gateway
      interval: 30s
      rules:
        # Fires when cilium.l7policy denies connections at the Envoy L7 proxy.
        # Root causes: missing egress CCNP on reserved:ingress, wrong source identity
        # from bpf_metadata (L3 TUN bug), or NPDS allowlist misconfiguration.
        # See Agent.md for the full diagnostic procedure.
        - alert: CiliumL7PolicyAccessDenied
          expr: rate(envoy_cilium_access_denied[2m]) > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "cilium.l7policy is dropping {{ printf \"%.1f\" $value }} conn/s"
            description: >-
              The Cilium Envoy L7 proxy is denying connections. This typically means a
              missing or misconfigured CiliumNetworkPolicy on the gateway ingress entity.
              Check: (1) allow-gateway-world-ingress CCNP exists, (2)
              allow-gateway-egress-to-cluster CCNP exists, (3) run
              'cilium-dbg envoy admin logging set global debug' and inspect logs for
              source_identity and DROP entries.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: velero-backup-health
  namespace: monitoring
spec:
  groups:
    - name: velero.backup
      interval: 5m
      rules:
        - alert: VeleroBackupFailed
          expr: increase(velero_backup_failure_total[2h]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Velero backup failure detected"
            description: >-
              A Velero backup failed in the last 2 hours.
              Check: kubectl get backup -n velero -o wide
              and kubectl describe backup -n velero <name> for details.

        - alert: VeleroBackupStale
          # velero_backup_last_successful_timestamp was added in Velero 1.5+.
          # If the metric is absent (older Velero), this alert is silently inactive.
          expr: (time() - velero_backup_last_successful_timestamp) > 90000
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "No successful Velero backup in {{ $value | humanizeDuration }}"
            description: >-
              No successful Velero backup for schedule {{ $labels.schedule }} in over 25 hours.
              Check: kubectl get schedule -n velero and kubectl get backup -n velero --sort-by=.metadata.creationTimestamp.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: cert-manager-health
  namespace: monitoring
spec:
  groups:
    - name: certmanager.certificates
      interval: 5m
      rules:
        - alert: CertificateExpiryWarning
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 14 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.name }}/{{ $labels.namespace }} expires in {{ $value | humanizeDuration }}"
            description: >-
              Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in less than 14 days.
              Check: kubectl describe certificate -n {{ $labels.namespace }} {{ $labels.name }}

        - alert: CertificateExpiryCritical
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 3 * 24 * 3600
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "CRITICAL: Certificate {{ $labels.name }}/{{ $labels.namespace }} expires in {{ $value | humanizeDuration }}"
            description: >-
              Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in less than 3 days.
              Manual renewal may be required: kubectl delete certificaterequest -n {{ $labels.namespace }} --all
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: flux-health
  namespace: monitoring
spec:
  groups:
    - name: flux.reconciliation
      interval: 1m
      rules:
        - alert: FluxReconciliationError
          # controller_runtime_reconcile_total is the standard controller-runtime metric
          # exposed by all Flux controllers on port 8080. job="flux" is set by the
          # VMPodScrape relabeling in scrape-configs.yaml.
          expr: increase(controller_runtime_reconcile_total{job="flux", result="error"}[5m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Flux {{ $labels.controller }} has reconciliation errors"
            description: >-
              The Flux {{ $labels.controller }} controller has {{ printf "%.0f" $value }} reconciliation errors
              in the last 5 minutes.
              Check: kubectl get kustomization,helmrelease -A | grep -v True
---
# Requires trivy-operator metricsVulnIdEnabled: true (13-trivy-operator/helmrelease.yaml).
# The trivy_vulnerability_id gauge emits one series per CVE per container image,
# with a score label containing the CVSS v3 base score as a decimal string.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: trivy-vulnerability-alerts
  namespace: monitoring
spec:
  groups:
    - name: trivy.vulnerabilities
      interval: 15m
      rules:
        - alert: ImageHighCVSS
          expr: |
            trivy_vulnerability_id{score=~"8\.[5-9]|9\.[0-9]|10(\.0)?"}
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              {{ $labels.image_repository }}:{{ $labels.image_tag }} —
              {{ $labels.vuln_id }} (score {{ $labels.score }}, {{ $labels.severity }})
            description: >-
              Namespace {{ $labels.namespace }} resource {{ $labels.name }}
              (container {{ $labels.container_name }}) is running image
              {{ $labels.image_repository }}:{{ $labels.image_tag }}
              with vulnerability {{ $labels.vuln_id }} (CVSS {{ $labels.score }}).
              Fixed in: {{ $labels.fixed_version }}.
              Check: kubectl get vulnerabilityreport -n {{ $labels.namespace }} -o wide
