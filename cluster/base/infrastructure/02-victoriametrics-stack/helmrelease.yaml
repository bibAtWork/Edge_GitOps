apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmstack
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.2
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    vmsingle:
      enabled: true
      spec:
        # 3 months. The bare number is months in VictoriaMetrics, so this reads
        # as "3" rather than "3m" -- which would mean three minutes.
        #
        # Was 12. Nothing in this cluster has ever looked a year back: the
        # dashboards are operational, the alerts evaluate over hours, and a
        # homelab's year-old apiserver latency answers no question anyone asks.
        # A quarter still spans a season of behaviour, which is the longest
        # window that has actually been useful here.
        #
        # This deletes nothing today -- the cluster is 44 days old, so no data
        # is yet past 90 days. It caps future growth instead.
        retentionPeriod: "3"
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        storage:
          # On Longhorn since 2026-08-24: real block devices with ext4 rather than
          # hostPath on the system disk, so these no longer share an I/O queue with
          # etcd and can be backed up at the volume level.
          #
          # Sizes follow RETENTION, not current usage. 25Gi was sized for
          # 62MB/day against 12-month retention, ~22GB at steady state.
          #
          # That retention is now 3 months and the apiserver histograms above are
          # dropped, so this claim is roughly four times larger than the new
          # steady state needs -- and it stays 25Gi regardless, because Longhorn
          # can grow a volume but cannot shrink one. Reclaiming it would mean
          # provisioning a smaller volume and copying across, which is real risk
          # and downtime to recover space nothing else is currently waiting on.
          # Left deliberately oversized; revisit only if the ~238GiB Longhorn
          # budget (30% of 340GiB is reserved) starts blocking a real claim.
          #
          # vlsingle's 20Gi is still correctly sized: 107MB/day against its
          # unchanged 90-day retention is ~10GB.
          storageClassName: longhorn
          resources:
            requests:
              storage: 25Gi

    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "90d"
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
        storage:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi

    # VictoriaTraces (experimental — acceptable for home lab)
    vtsingle:
      enabled: true
      spec:
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
        storage:
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi

    grafana:
      enabled: false

    # Deployed on its own into monitoring-agents instead -- see
    # infrastructure/35-node-exporter. It is the only workload in this chart that
    # needs hostNetwork/hostPID/hostPath, and leaving it here forced the whole
    # monitoring namespace to PSS privileged.
    prometheus-node-exporter:
      enabled: false

    kube-state-metrics:
      enabled: true
      livenessProbe:
        initialDelaySeconds: 60
      readinessProbe:
        initialDelaySeconds: 60

    alertmanager:
      enabled: false

    # The kube-apiserver scrape is by far the most expensive thing this stack
    # collects. Measured 2026-08-25: seven of its histograms accounted for
    # 114,716 of 414,446 series -- 28% of the entire database -- for metrics
    # nothing in this cluster reads. No dashboard references them (all eight
    # were checked) and no alerting or recording rule does either.
    #
    # Histograms are expensive in a way their name hides: one series per bucket
    # boundary per label combination. apiserver_request_duration_seconds_bucket
    # alone is 41,400 series because it crosses verb x resource x scope x
    # component x bucket.
    #
    # Only `_bucket` is dropped. `_sum` and `_count` are separate metric names
    # and survive, so average latency and request rates remain available; what
    # is given up is quantiles, which requires the buckets.
    #
    # etcd_request_duration_seconds_bucket is in this list and is not a mistake:
    # it is the apiserver's own etcd-client metric, exposed on the apiserver
    # endpoint, not by etcd. Confirmed live -- every one of these carries
    # job="apiserver". The kube-etcd scrape is left alone; its histograms are
    # small and three of them are referenced by shipped rules.
    #
    # apiserver_request_sli_duration_seconds_bucket is deliberately NOT dropped
    # despite being the third largest. The chart ships 44 SLO recording rules
    # built on it. Those recorded series are themselves unread here, so
    # disabling that rule group would save another 22,660 series -- a separate
    # decision, and not one to make silently inside a relabel regex.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - port: https
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  sourceLabels: [__name__]
                  regex: "apiserver_request_duration_seconds_bucket|etcd_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_watch_list_duration_seconds_bucket|apiserver_watch_cache_read_wait_seconds_bucket|apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket"

    # kube-controller-manager and kube-scheduler generate an in-memory
    # self-signed certificate on every start, valid for localhost and 127.0.0.1
    # only. The scrape reaches them on the node address, so verifying against
    # the ServiceAccount CA can never succeed -- the chart default fails with
    # "certificate is valid for 127.0.0.1, not <node ip>".
    #
    # insecureSkipVerify is the standard answer for these two components and is
    # what kube-prometheus-stack ships by default. It does not make the endpoint
    # anonymous: authentication is the bearer token, which is a ServiceAccount
    # token bound to a role that permits the scrape. What is given up is proof
    # of server identity on a connection to the node this scrape already runs on.
    #
    # The alternative would be issuing real certificates for both components and
    # setting --tls-cert-file on each, which means managing a certificate
    # lifecycle for two endpoints that serve nothing but metrics.
    kubeControllerManager:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true

    kubeScheduler:
      vmScrape:
        spec:
          endpoints:
            - port: http-metrics
              scheme: https
              bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              tlsConfig:
                insecureSkipVerify: true

    vmalert:
      spec:
        # No external notifiers: alert evaluation and routing is handled by
        # Grafana's native alerting engine. VMAlert runs for recording rules only.
        # notifier.blackhole suppresses the chart's "no notifier configured" error.
        extraArgs:
          notifier.blackhole: "true"
