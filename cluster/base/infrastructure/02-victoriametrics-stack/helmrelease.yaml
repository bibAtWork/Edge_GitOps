apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmstack
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.90.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    victoria-metrics-single:
      enabled: true
      server:
        retentionPeriod: 12
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        persistentVolume:
          enabled: true
          size: 50Gi
          storageClassName: local-path

    victoria-logs-single:
      enabled: true
      server:
        retentionPeriod: "90d"
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
        persistentVolume:
          enabled: true
          size: 40Gi
          storageClassName: local-path

    # VictoriaTraces (experimental — acceptable for home lab)
    victoria-traces-single:
      enabled: true
      server:
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
        persistentVolume:
          enabled: true
          size: 10Gi
          storageClassName: local-path

    grafana:
      enabled: false

    prometheus-node-exporter:
      enabled: true

    kube-state-metrics:
      enabled: true
      livenessProbe:
        initialDelaySeconds: 60
      readinessProbe:
        initialDelaySeconds: 60

    alertmanager:
      enabled: false

    vmalert:
      spec:
        # No external notifiers: alert evaluation and routing is handled by
        # Grafana's native alerting engine. VMAlert runs for recording rules only.
        # notifier.blackhole suppresses the chart's "no notifier configured" error.
        extraArgs:
          notifier.blackhole: "true"
