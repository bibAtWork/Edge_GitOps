apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmstack
  namespace: monitoring
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.91.1
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    vmsingle:
      enabled: true
      spec:
        retentionPeriod: "12"
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "2Gi"
        storage:
          # On Longhorn since 2026-08-24: real block devices with ext4 rather than
          # hostPath on the system disk, so these no longer share an I/O queue with
          # etcd and can be backed up at the volume level.
          #
          # Sizes follow RETENTION, not current usage -- which pushed metrics UP.
          # 62MB/day against 12-month retention is ~22GB at steady state; 107MB/day
          # of logs against 90 days is ~10GB. Measured on a 42-day-old cluster, so
          # none had reached steady state and observed usage alone would have
          # under-provisioned metrics.
          #
          # Over-claiming is not free: Longhorn reserves 30% of the disk, leaving a
          # ~238GiB budget of 340GiB, and oversized claims block real ones from
          # scheduling. Expansion is enabled, shrinking is not -- size to
          # observed-plus-headroom and grow later.
          storageClassName: longhorn
          resources:
            requests:
              storage: 25Gi

    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "90d"
        resources:
          requests:
            memory: "256Mi"
            cpu: "50m"
          limits:
            memory: "1Gi"
        storage:
          storageClassName: longhorn
          resources:
            requests:
              storage: 20Gi

    # VictoriaTraces (experimental — acceptable for home lab)
    vtsingle:
      enabled: true
      spec:
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "512Mi"
        storage:
          storageClassName: longhorn
          resources:
            requests:
              storage: 5Gi

    grafana:
      enabled: false

    prometheus-node-exporter:
      enabled: true

    kube-state-metrics:
      enabled: true
      livenessProbe:
        initialDelaySeconds: 60
      readinessProbe:
        initialDelaySeconds: 60

    alertmanager:
      enabled: false

    vmalert:
      spec:
        # No external notifiers: alert evaluation and routing is handled by
        # Grafana's native alerting engine. VMAlert runs for recording rules only.
        # notifier.blackhole suppresses the chart's "no notifier configured" error.
        extraArgs:
          notifier.blackhole: "true"
