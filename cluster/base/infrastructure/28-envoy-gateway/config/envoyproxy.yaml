# Needs Envoy Gateway's own CRDs (installed by the bootstrap-layer HelmRelease),
# hence config layer.
#
# externalTrafficPolicy: Cluster is required for correct L2Announce-based
# LoadBalancer traffic delivery once Envoy Gateway's proxy pods can land on any
# node — moot on the current single-node cluster, but matches the existing
# 3-node overlay and avoids a silent trap if that overlay is used later.
#
# Deliberately NOT set here: hostNetwork, useListenerPortAsContainerPort, and
# securityContext.privileged. An earlier plan reached for all three to bind 443
# directly, which Talos's SELinux pod_t confinement only permits under
# privileged: true. That whole path was abandoned once the real cutover blocker
# turned out to be a network policy on the wrong ports (see docs/backlog.md,
# "Real root cause found (2026-08-16)"). Keeping the default port remapping —
# listener 80 -> container 10080, 443 -> 10443 — means the proxy never needs
# CAP_NET_BIND_SERVICE, and envoy-gateway-system stays at PSS restricted.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy-gateway-config
  namespace: envoy-gateway-system
spec:
  # Envoy Gateway's documented default HTTP filter order runs ext_authz BEFORE
  # oauth2. That is backwards for any route needing both (SecurityPolicy.oidc
  # + SecurityPolicy.extAuth on the same route, e.g. hubble-ui,
  # kubeopencode — see 05-cilium/config/hubble-securitypolicy.yaml): with
  # ext_authz first, an unauthenticated request hits OPA before oauth2 ever
  # gets a chance to redirect to Keycloak, and OPA denies it outright (its
  # admin_only_apps rule has no session to check yet) — the login redirect
  # never happens, just an unconditional 403. Confirmed live 2026-08-16: with
  # the default order, the very first unauthenticated request returned 403
  # with no Location header at all.
  #
  # This reorders oauth2 before ext_authz globally, which is safe here because
  # only routes with BOTH filters enabled are affected — every other route
  # (grafana, zot, etc.) only has ext_authz in its per-route config, so
  # oauth2's position in the overall chain is irrelevant to them. Result:
  # unauthenticated -> oauth2 redirects to Keycloak (ext_authz never reached);
  # authenticated -> oauth2 forwards the access token as an Authorization
  # header -> ext_authz (OPA) evaluates it and applies admin_only_apps.
  filterOrder:
    - name: envoy.filters.http.oauth2
      before: envoy.filters.http.ext_authz
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        # Single replica: this cluster is one node. A 2-replica deployment with a
        # required podAntiAffinity on kubernetes.io/hostname — the shape the
        # draft ADRs specified — leaves the second pod Pending forever. Revisit
        # together with the 3-node overlay, not before.
        replicas: 1
      envoyService:
        patch:
          type: StrategicMerge
          value:
            metadata:
              # Reuses the existing gateway-pool CiliumLoadBalancerIPPool and
              # gateway-announce CiliumL2AnnouncementPolicy, both of which select
              # on this label and already own 192.168.178.200. Reusing them keeps
              # the VIP, and therefore every external-dns record and the Tailscale
              # subnet router's advertised route (TS_ROUTES=192.168.178.200/32),
              # unchanged across the cutover.
              #
              # The label is Cilium-Gateway-flavoured but is only ever read as a
              # selector, so it carries no behaviour of its own here.
              labels:
                io.cilium.gateway/owning-gateway: homelab-gateway
            spec:
              externalTrafficPolicy: Cluster
