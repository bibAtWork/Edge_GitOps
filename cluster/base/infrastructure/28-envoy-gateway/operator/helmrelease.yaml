apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  interval: 30m
  chart:
    spec:
      chart: gateway-helm
      version: 1.9.1
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Image pinned per ADR-009, at the version already running. The chart ships
    # empty repository and tag defaults and fills them from its appVersion, so
    # nothing here named the version before this.
    #
    # Only the control-plane image is pinned. The Envoy proxy image the Gateway
    # runs is resolved by digest through the EnvoyProxy resource, not from these
    # values -- see the digest limitation in ADR-009.
    deployment:
      envoyGateway:
        image:
          repository: docker.io/envoyproxy/gateway
          tag: v1.9.1
    # The chart's bundled crds subchart installs its own copy of the upstream
    # Gateway API CRDs alongside Envoy Gateway's own (EnvoyProxy, SecurityPolicy,
    # etc.), all under this one flag. Gateway API CRDs are managed separately by
    # 00-gateway-api — leaving this enabled makes helm-controller and
    # kustomize-controller fight over field ownership on every reconcile
    # (discovered 2026-08-14 while upgrading to the experimental channel: SSA
    # apply failed with 3-way conflicts against "helm-controller"). Envoy
    # Gateway's own CRDs, already installed from this HelmRelease's first
    # install, are unaffected — Flux/Helm never deletes CRDs a chart stops
    # rendering.
    crds:
      enabled: false
