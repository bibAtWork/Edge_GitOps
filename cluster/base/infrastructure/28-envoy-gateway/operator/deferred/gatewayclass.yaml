# Core Gateway API resource — needs only the CRDs from 00-gateway-api, not
# Envoy Gateway's own CRDs, so this is safe in the bootstrap layer even though
# parametersRef points at an EnvoyProxy object that doesn't exist until the
# config layer applies (parametersRef is not validated for target existence
# at admission time).
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy-gateway
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy-gateway-config
    namespace: envoy-gateway-system
