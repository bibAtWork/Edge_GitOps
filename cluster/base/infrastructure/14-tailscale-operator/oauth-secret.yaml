# Encrypt with SOPS before committing
# Create OAuth client at https://login.tailscale.com/admin/settings/oauth
# Required scopes: devices:write, routes:read, auth_keys:write
apiVersion: v1
kind: Secret
metadata:
  name: tailscale-oauth
  namespace: tailscale
stringData:
  client_id: REPLACE_WITH_TS_OAUTH_CLIENT_ID
  client_secret: REPLACE_WITH_TS_OAUTH_CLIENT_SECRET
