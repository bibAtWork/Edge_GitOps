apiVersion: v1
kind: Service
metadata:
  name: coredns-tailscale
  namespace: kube-system
  annotations:
    tailscale.com/hostname: homelab-dns
    tailscale.com/proxy-class: prod-ingress
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    k8s-app: kube-dns
  ports:
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: 53
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: 53
