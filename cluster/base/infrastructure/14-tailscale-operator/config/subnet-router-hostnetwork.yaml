apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
rules:
  # create cannot be scoped to resourceNames (k8s limitation) — mitigated by
  # pre-creating the secret below so this verb is only exercised on first boot.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["tailscaled-subnet-router-state"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
subjects:
  - kind: ServiceAccount
    name: tailscaled-subnet-router
    namespace: tailscale
roleRef:
  kind: Role
  name: tailscaled-subnet-router
  apiGroup: rbac.authorization.k8s.io
---
# Pre-created so the SA's unrestricted create is never exercised after first boot.
apiVersion: v1
kind: Secret
metadata:
  name: tailscaled-subnet-router-state
  namespace: tailscale
---
# Subnet routing via Tailscale kernel mode + Cilium cil_from_netdev on tailscale0.
#
# WHY kernel (not userspace) mode:
#   Userspace mode (TS_USERSPACE=true) proxies TCP via Go's net.Dial(), which goes
#   through Cilium's cgroup-level socket LB. However, the identity Cilium assigns to
#   the tailscaled process's socket connections is identity 0 (unknown), not world (2)
#   or host (1). Identity 0 cannot appear in any NPDS allowlist — even
#   fromEntities:all does not include it — so cilium.l7policy denies with 403.
#
#   Kernel mode (TS_USERSPACE=false) forwards decrypted Tailscale packets via the
#   tailscale0 TUN interface. Cilium's devices config includes tailscale0, so
#   cil_from_netdev (TC INGRESS) fires on that interface. It looks up the Tailscale
#   client source IP in ipcache (0.0.0.0/0 → world=2), writes world identity to the
#   proxy map, and marks the packet MARK_MAGIC_TO_PROXY. IP rule 9 then redirects
#   marked packets to loopback (table 2004: local default dev lo) → TPROXY socket
#   → Envoy, where bpf_metadata reads identity 2 and cilium.l7policy allows it.
#
#   The Fritz!Box same-port hairpin (which would drop packets whose src MAC = dst MAC
#   = enp2s0 MAC if the kernel tried to forward via enp2s0) is completely bypassed:
#   the BPF redirect in TC INGRESS fires BEFORE the kernel's IP forwarding decision,
#   so the packet goes directly to loopback and never exits enp2s0.
#
# The Connector CRD cannot expose hostNetwork — this StatefulSet replaces it.
#
# First boot: authenticates via the OAuth client secret (TS_AUTHKEY), registers
# a device named "homelab-router", and advertises 192.168.178.200/32.
# The route must be approved once in the Tailscale admin console (or via ACL) --
# set the ACL up (console.tailscale.com/admin/acls/visual/auto-approvers, approve
# 192.168.178.200/32 for tag:k8s-operator, the tag advertised below) so this is
# genuinely one-time instead of a recurring manual click. See
# docs/network-architecture.md section 1 for the full explanation.
# Subsequent restarts reuse state from the tailscaled-subnet-router-state Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscaled-subnet-router
  serviceName: tailscaled-subnet-router
  template:
    metadata:
      labels:
        app: tailscaled-subnet-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscaled-subnet-router
      containers:
        - name: tailscaled
          image: tailscale/tailscale:v1.102.3
          env:
            - name: TS_KUBE_SECRET
              value: tailscaled-subnet-router-state
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
            - name: TS_HOSTNAME
              value: homelab-router
            - name: TS_ROUTES
              value: "192.168.178.200/32"
            - name: TS_USERSPACE
              value: "false"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags=tag:k8s-operator --snat-subnet-routes=false"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
