apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
rules:
  # create cannot be scoped to resourceNames (k8s limitation) — mitigated by
  # pre-creating the secret below so this verb is only exercised on first boot.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "patch"]
    resourceNames: ["tailscaled-subnet-router-state"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
subjects:
  - kind: ServiceAccount
    name: tailscaled-subnet-router
    namespace: tailscale
roleRef:
  kind: Role
  name: tailscaled-subnet-router
  apiGroup: rbac.authorization.k8s.io
---
# Pre-created so the SA's unrestricted create is never exercised after first boot.
apiVersion: v1
kind: Secret
metadata:
  name: tailscaled-subnet-router-state
  namespace: tailscale
---
# Subnet routing via Tailscale userspace mode + Cilium socket LB.
#
# WHY userspace (not kernel) mode:
#   Kernel mode (TS_USERSPACE=false) forwards packets: tailscale0 → enp2s0 →
#   Fritz!Box switch → enp2s0. The Fritz!Box drops same-port hairpin (src MAC =
#   dst MAC), so the packet never reaches cil_from_netdev. TPROXY never fires.
#
#   Userspace mode (TS_USERSPACE=true) instead proxies each TCP connection at the
#   application level via Go's net.Dial(192.168.178.200:443). Cilium's cgroup-
#   level socket LB (active for all processes via kubeProxyReplacement: true)
#   intercepts that connect() and redirects it to 127.0.0.1:19349 (Envoy). The
#   hostNetwork: true pod runs as host identity (1), which is in the NPDS allowlist
#   on the reserved:ingress endpoint. cilium.l7policy passes the request. Envoy
#   detects TLS via transport-protocol filter chain match, terminates TLS, and
#   routes by SNI/Host header.
#
# The Connector CRD cannot expose hostNetwork — this StatefulSet replaces it.
#
# First boot: authenticates via the OAuth client secret (TS_AUTHKEY), registers
# a device named "homelab-router", and advertises 192.168.178.200/32.
# The route must be approved once in the Tailscale admin console (or via ACL).
# Subsequent restarts reuse state from the tailscaled-subnet-router-state Secret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tailscaled-subnet-router
  namespace: tailscale
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tailscaled-subnet-router
  serviceName: tailscaled-subnet-router
  template:
    metadata:
      labels:
        app: tailscaled-subnet-router
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tailscaled-subnet-router
      containers:
        - name: tailscaled
          image: tailscale/tailscale:v1.98.10
          env:
            - name: TS_KUBE_SECRET
              value: tailscaled-subnet-router-state
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: tailscale-oauth
                  key: client_secret
            - name: TS_HOSTNAME
              value: homelab-router
            - name: TS_ROUTES
              value: "192.168.178.200/32"
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags=tag:k8s-operator"
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      volumes:
        - name: tun
          hostPath:
            path: /dev/net/tun
