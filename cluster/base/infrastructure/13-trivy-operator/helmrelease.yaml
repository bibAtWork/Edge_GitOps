apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.34.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    operator:
      # Overlays patch this: 2 on 3-node, 1 on single-node
      scanJobConcurrentLimit: 2
      vulnerabilityScanner:
        enabled: true
      configAuditScanner:
        enabled: true
      rbacAssessmentScanner:
        enabled: true
      # node-collector requires hostPID + hostPath + root to read kubelet/etcd
      # config files for CIS benchmarks — incompatible with restricted PSS and
      # not useful on a single-node homelab.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false

    trivy:
      ignoreUnfixed: false
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

    serviceMonitor:
      enabled: false

    # Operator pod security context
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    # Scan job pod/container security context (separate from the operator pod)
    trivyOperator:
      scanJobPodSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      scanJobContainerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
