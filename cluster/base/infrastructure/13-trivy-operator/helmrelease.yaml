apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.36.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    operator:
      # Efficiency review 2026-08-17: this key was misspelled
      # (scanJobConcurrentLimit, missing the "s" in "Jobs") for as long as it's
      # existed in this repo. The real chart key is scanJobsConcurrentLimit --
      # confirmed against the chart's own values.yaml source. Silently ignored,
      # same failure class as the H2 trivy-operator security-context bug and the
      # immich resources bug: looked correct in git, did nothing live. Confirmed
      # live: the operator's own Deployment env vars have no concurrency-limit
      # setting at all while this was wrong, meaning it ran on the chart's
      # built-in default of 10 concurrent scan Jobs regardless of what this file
      # said -- which is what actually produced the burst that motivated
      # widening trivy-system's ResourceQuota (#160). With this fixed, scans
      # queue and run within the configured limit instead of firing off up to
      # 10 at once.
      #
      # Overlays patch this: 2 on 3-node, 1 on single-node
      scanJobsConcurrentLimit: 2
      vulnerabilityScanner:
        enabled: true
      configAuditScanner:
        enabled: true
      rbacAssessmentScanner:
        enabled: true
      # node-collector requires hostPID + hostPath + root to read kubelet/etcd
      # config files for CIS benchmarks — incompatible with restricted PSS and
      # not useful on a single-node homelab.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      # Emit one trivy_vulnerability_id time series per CVE with vuln_id, severity,
      # and score labels so VMAlert can alert on CVSS score >= 8.5.
      metricsVulnIdEnabled: true

    trivy:
      ignoreUnfixed: false
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      # ClientServer, not Standalone. In Standalone every scan container carries
      # its own cache and database, and trivy-operator packs all containers of a
      # workload into ONE pod sharing a single emptyDir with one --cache-dir.
      # Trivy 0.71+ locks that directory, so the first scanner wins and the rest
      # die with "Failed to acquire cache or database lock".
      #
      # It failed selectively, which is why it went unnoticed for so long: 123
      # single-container reports existed while every multi-container workload
      # silently lost one image. library/postgres:16-alpine and 17-alpine -- the
      # pg_dump images in the database backup CronJobs, which run holding database
      # credentials -- had never been scanned at all.
      #
      # Per-container cache directories would also solve it and are not available:
      # scan containers run readOnlyRootFilesystem: true, so the cache must sit on
      # a mounted volume and the only mounted volume is the shared one. Relaxing
      # that on a security scanner to work around a lock is the wrong trade.
      #
      # In ClientServer the clients hold no cache and no database, so there is
      # nothing to contend for. It also stops every scan job downloading the 109MB
      # vulnerability database before it can start.
      mode: ClientServer
      serverURL: http://trivy-server.trivy-system.svc:4954

    serviceMonitor:
      enabled: false

    # Operator pod security context
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    # Scan job pod/container security context (separate from the operator pod).
    #
    # Security review 2026-08-14, finding H2: this HelmRelease already carried a
    # security-context override at this point, but under the wrong key names
    # (scanJobPodSecurityContext / scanJobContainerSecurityContext — missing the
    # PodTemplate segment) — silently ignored by the chart, so it did nothing.
    # Confirmed live: the rendered scan Job's pod-level securityContext was `{}`,
    # and the container-level one only ever showed the chart's own hardcoded
    # defaults (allowPrivilegeEscalation: false, capabilities.drop: [ALL],
    # privileged: false, readOnlyRootFilesystem: true) — never runAsNonRoot or
    # seccompProfile, exactly the two fields restricted PSS was rejecting scan
    # pods for. trivy-system enforces PSS restricted, so every scan Job failed to
    # even create a pod: "Error creating: ... violates PodSecurity restricted:
    # runAsNonRoot != true ..., seccompProfile ... must set ...". Trivy's own
    # config-audit scanner kept working throughout (263 reports) because it runs
    # differently; vulnerabilityreports stayed at 0 the whole time, with zero
    # error visible from `kubectl get vulnerabilityreports` alone — a control
    # that looked deployed and healthy while covering nothing.
    #
    # Correct key names confirmed against the chart's own default values.yaml
    # (aquasecurity/trivy-operator, chart version matches this HelmRelease):
    trivyOperator:
      scanJobPodTemplatePodSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      scanJobPodTemplateContainerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
