apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  interval: 30m
  chart:
    spec:
      chart: trivy-operator
      version: 0.35.0
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    operator:
      # Overlays patch this: 2 on 3-node, 1 on single-node
      scanJobConcurrentLimit: 2
      vulnerabilityScanner:
        enabled: true
      configAuditScanner:
        enabled: true
      rbacAssessmentScanner:
        enabled: true
      # node-collector requires hostPID + hostPath + root to read kubelet/etcd
      # config files for CIS benchmarks — incompatible with restricted PSS and
      # not useful on a single-node homelab.
      infraAssessmentScannerEnabled: false
      clusterComplianceEnabled: false
      # Emit one trivy_vulnerability_id time series per CVE with vuln_id, severity,
      # and score labels so VMAlert can alert on CVSS score >= 8.5.
      metricsVulnIdEnabled: true

    trivy:
      ignoreUnfixed: false
      severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

    serviceMonitor:
      enabled: false

    # Operator pod security context
    securityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    # Scan job pod/container security context (separate from the operator pod).
    #
    # Security review 2026-08-14, finding H2: this HelmRelease already carried a
    # security-context override at this point, but under the wrong key names
    # (scanJobPodSecurityContext / scanJobContainerSecurityContext — missing the
    # PodTemplate segment) — silently ignored by the chart, so it did nothing.
    # Confirmed live: the rendered scan Job's pod-level securityContext was `{}`,
    # and the container-level one only ever showed the chart's own hardcoded
    # defaults (allowPrivilegeEscalation: false, capabilities.drop: [ALL],
    # privileged: false, readOnlyRootFilesystem: true) — never runAsNonRoot or
    # seccompProfile, exactly the two fields restricted PSS was rejecting scan
    # pods for. trivy-system enforces PSS restricted, so every scan Job failed to
    # even create a pod: "Error creating: ... violates PodSecurity restricted:
    # runAsNonRoot != true ..., seccompProfile ... must set ...". Trivy's own
    # config-audit scanner kept working throughout (263 reports) because it runs
    # differently; vulnerabilityreports stayed at 0 the whole time, with zero
    # error visible from `kubectl get vulnerabilityreports` alone — a control
    # that looked deployed and healthy while covering nothing.
    #
    # Correct key names confirmed against the chart's own default values.yaml
    # (aquasecurity/trivy-operator, chart version matches this HelmRelease):
    trivyOperator:
      scanJobPodTemplatePodSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      scanJobPodTemplateContainerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        privileged: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
