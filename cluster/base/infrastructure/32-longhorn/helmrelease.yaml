apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: longhorn
      version: "1.12.1"
      sourceRef:
        kind: HelmRepository
        name: longhorn
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  driftDetection:
    mode: enabled
  values:
    # Images pinned per ADR-009, at the versions already running.
    #
    # All ten move as one group. The four longhorn-* images are one release, and
    # the six CSI sidecars are republished by longhornio and version-matched to
    # it -- upstream csi-attacher and Longhorn's build of it are not
    # interchangeable. A CSI driver assembled from mismatched sidecars fails at
    # volume attach, which on this cluster means every workload with a PVC.
    #
    # longhorn-ui, backingImageManager and supportBundleKit are deliberately
    # absent: they are not deployed here, so a pin could never be verified
    # against a running pod.
    image:
      longhorn:
        manager:
          repository: longhornio/longhorn-manager
          tag: v1.12.1
        engine:
          repository: longhornio/longhorn-engine
          tag: v1.12.1
        instanceManager:
          repository: longhornio/longhorn-instance-manager
          tag: v1.12.1
        shareManager:
          repository: longhornio/longhorn-share-manager
          tag: v1.12.1
      csi:
        attacher:
          repository: longhornio/csi-attacher
          tag: v4.12.0
        provisioner:
          repository: longhornio/csi-provisioner
          tag: v5.3.0
        resizer:
          repository: longhornio/csi-resizer
          tag: v2.2.1
        snapshotter:
          repository: longhornio/csi-snapshotter
          tag: v8.6.0
        nodeDriverRegistrar:
          repository: longhornio/csi-node-driver-registrar
          tag: v2.17.0
        livenessProbe:
          repository: longhornio/livenessprobe
          tag: v2.19.0

    # Fails the release before it touches the running cluster if the upgrade is
    # incompatible, rather than discovering it half-applied.
    preUpgradeChecker:
      jobEnabled: true

    # --- Footprint -----------------------------------------------------------
    # Chart defaults assume a much larger cluster: four CSI sidecars at 3
    # replicas each is 12 pods. All are leader-elected, so one replica apiece
    # costs only a brief gap while a pod reschedules.
    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1

    # --- Resource governance, and the one that must NOT be applied here --------
    #
    # DO NOT add longhorn-system to 00-bootstrap/namespaces/limit-ranges.yaml.
    #
    # That LimitRange defaults limit-less containers to 256Mi. instance-manager
    # was measured at 646Mi and it is the process serving every Longhorn volume
    # on the node, so the default would OOM-kill it and take all storage down
    # with it. The same pattern already cost Immich an outage when a chart
    # dropped its own resources and the namespace default silently caught it.
    #
    # instance-manager and the CSI plugin are therefore left unbounded on
    # purpose. Longhorn's own guidance is not to cap instance-manager memory:
    # an OOM there is not a restart, it is I/O loss on live volumes.
    #
    # longhorn-manager is different. It is the control plane, not the data path,
    # so a ceiling costs a restart rather than storage. Measured at 243Mi.
    longhornManager:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    # The UI ships with NO authentication whatsoever -- anyone who can reach the
    # Service can detach volumes, delete replicas, or repoint the backup target.
    # Disabling it removes two pods and that unauthenticated surface at once.
    #
    # The cost is that manual operations become CRD work. To bring it up
    # temporarily, change this in git for the duration: driftDetection is enabled
    # below, so an ad-hoc `kubectl scale` is reverted within the reconcile
    # interval. If it is ever left running, expose it only via Tailscale with an
    # auth layer in front, never a public Gateway listener.
    longhornUI:
      replicas: 0

    # The chart creates its own "longhorn" StorageClass and marks it default with
    # 3 replicas. Both are wrong here and the collision is not theoretical: a
    # hand-written StorageClass of the same name fought the chart's, leaving TWO
    # default classes (local-path and longhorn) and a test volume provisioned with
    # replicas=3 on a node that has exactly one Longhorn disk.
    #
    # Configure the chart's class rather than duplicating it.
    #
    # defaultClass was false while workloads migrated, so that flipping it
    # early could not silently send every new PVC to storage not yet proven
    # under load here. That condition is met: 15 volumes have run on Longhorn
    # for the life of this cluster, and the migration it was waiting for is
    # done.
    #
    # Being the default now matters for more than tidiness. local-path held it
    # before, so a PVC that named no class got node-local storage with no
    # replication, no snapshots, no backups and reclaimPolicy Delete -- and
    # nothing reported that. On Longhorn the same PVC is snapshotted daily and
    # backed up weekly and monthly from the moment it exists, because Longhorn
    # stamps recurring-job-group.longhorn.io/default on every new volume and
    # every RecurringJob is bound to that group. Forgetting to classify
    # a volume now means it is protected rather than silently exposed.
    #
    # The cost of that direction is a reconstructible volume being backed up
    # until someone excludes it in backup-policy's not-backed-up list.
    # Against a 1.24Gi backed-up baseline that is cheap; the reverse mistake is
    # silent data loss.
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
      defaultFsType: ext4
      # Retain, matching longhorn-db (storageclass.yaml) and for the same
      # stated reason: "a one-character mistake in a manifest should not be
      # unrecoverable." The chart defaults to Delete, which left the split
      # backwards -- the DATABASES, which also have logical dumps in
      # db-backups and a nightly restore-test replaying them, were protected
      # from a stray PVC deletion, while immich-library-lh and
      # paperless-media-lh, whose only copy is the volume itself, were not.
      #
      # This is not hypothetical here. A Helm-pruned PVC on a Delete class is
      # exactly the mechanism recorded in "existingClaim is not a rollback",
      # and the Immich library is the volume this cluster has already lost
      # once (docs/backlog.md).
      #
      # The cost is the same trade longhorn-db already makes and documents: a
      # deleted PVC leaves its PV and data behind as Released, needing manual
      # cleanup rather than disappearing. That is the intended direction.
      #
      # NOTE: reclaimPolicy is immutable on an existing StorageClass, so this
      # value only takes effect once the class is recreated, and it only
      # governs volumes provisioned AFTER that. Existing PVs keep the policy
      # captured at provision time and were patched separately -- see the PR.
      reclaimPolicy: Retain

    defaultSettings:
      # Per-node disk config comes from node labels/annotations set in the Talos
      # patch, NOT from a global defaultDataPath -- a single cluster-wide string
      # cannot describe nodes with different disk counts.
      createDefaultDiskLabeledNodes: true

      # V2 (SPDK) stays off deliberately -- see ADR-004. It has an open Talos
      # SPDK/IOMMU bug and a separate PostgreSQL-during-backup I/O bug, and needs
      # hugepages plus a dedicated core.
      v2DataEngine: false

      # Never evict the last healthy replica during a node drain. On this
      # single-node cluster that means a drain will block rather than destroy the
      # only copy -- which is why the upgrade script skips the drain entirely.
      nodeDrainPolicy: block-if-contains-last-replica

      # Without this (default 0 = disabled) every chart bump leaves engine images
      # to be upgraded by hand.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1

      defaultDataLocality: best-effort
      replicaAutoBalance: best-effort

      # This is a REQUEST, i.e. capacity removed from the schedulable pool whether
      # or not Longhorn is busy. Valid range 0-40. Do not set 0 with PostgreSQL on
      # the cluster -- replica processes can stall under contention.
      guaranteedInstanceManagerCPU: 5

      # Headroom guards. Over-provisioning at 100% means Longhorn will not promise
      # more space than physically exists.
      storageOverProvisioningPercentage: 100
      storageMinimalAvailablePercentage: 15

      # snapshotDataIntegrity is deliberately left at the chart default
      # (fast-check). Disabling it saves CPU and I/O but removes silent-corruption
      # detection, which is not a trade worth making with a database on consumer
      # SSDs.

      # backupTarget is intentionally unset. Longhorn RecurringJob backups need an
      # S3 endpoint, and pointing them at the in-cluster SeaweedFS would put the
      # backups in the same failure domain as the data -- on this single node,
      # literally the same machine. Set it once an off-cluster target exists.
