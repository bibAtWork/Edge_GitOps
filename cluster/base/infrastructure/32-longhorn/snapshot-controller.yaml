apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      # 5.4.0 ships the v8.7.0 controller and CRDs. Longhorn 1.13 still runs
      # csi-snapshotter v8.6.0; GroupSnapshot remains disabled below.
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    installCRDs: true
    # A Helm uninstall must not erase existing VolumeSnapshot objects.
    keepCRDs: true
    # The controller and CRDs alone cannot create a Longhorn CSI snapshot.
    # Use an in-cluster snapshot; off-cluster backups belong to the recovery
    # system, not to a CSI VolumeSnapshotClass with type: bak.
    volumeSnapshotClasses:
      - name: longhorn-snapshot
        annotations:
          snapshot.storage.kubernetes.io/is-default-class: "true"
        driver: driver.longhorn.io
        deletionPolicy: Delete
        parameters:
          type: snap
    controller:
      replicaCount: 1
      revisionHistoryLimit: 3
      args:
        leaderElection: true
        leaderElectionNamespace: "$(NAMESPACE)"
        httpEndpoint: ":8080"
        # Longhorn does not enable CSI VolumeGroupSnapshot support.
        featureGates: CSIVolumeGroupSnapshot=false
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
