apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus-charts
  namespace: flux-system
spec:
  interval: 1h
  url: https://piraeus.io/helm-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: longhorn-system
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      # 5.3.0 ships the v8.6.0 CRDs and controller matching Longhorn's
      # csi-snapshotter v8.6.0. Upgrade these components together.
      version: "5.4.0"
      sourceRef:
        kind: HelmRepository
        name: piraeus-charts
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    installCRDs: true
    # A Helm uninstall must not erase existing VolumeSnapshot objects.
    keepCRDs: true
    controller:
      replicaCount: 1
      revisionHistoryLimit: 3
      args:
        leaderElection: true
        leaderElectionNamespace: "$(NAMESPACE)"
        httpEndpoint: ":8080"
        # Longhorn does not enable CSI VolumeGroupSnapshot support.
        featureGates: CSIVolumeGroupSnapshot=false
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 256Mi
