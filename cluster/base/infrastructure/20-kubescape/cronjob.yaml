apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubescape-scan
  namespace: kubescape
spec:
  # Run every Sunday at 02:00 UTC — low-traffic window, avoids weekday disruption
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            # Selected by networkpolicy.yaml in this directory, and by
            # 34-backup/networkpolicy.yaml on vmsingle's ingress side. Without
            # it the metric push is denied by default-deny.
            backup.homelab/egress: "true"
        spec:
          serviceAccountName: kubescape
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: scan
              # Efficiency review 2026-08-17: quay.io/kubescape/kubescape is the
              # *operator/server* image -- its ENTRYPOINT is `ksserver`, a
              # completely different binary from the CLI, which ignores the `args`
              # below as unrecognized input and starts listening on :8080 (plus a
              # swagger UI and a :6060 pprof server) instead of scanning anything.
              # Confirmed live: the job had been "Running" for 20+ hours with 2
              # restarts (exitCode 2), logging "Started Kubescape server" and
              # "continuous posture scan" -- textbook operator-mode startup, not a
              # hung scan. With concurrencyPolicy: Forbid this was on track to
              # block every future Sunday run too. quay.io/kubescape/kubescape-cli
              # is the actual one-shot CLI image (Entrypoint: ["kubescape"],
              # confirmed via the image manifest); bumped to v3.0.39 (latest at
              # time of fix) rather than re-pinning the stale v3.0.22 tag.
              image: quay.io/kubescape/kubescape-cli:v3.0.39
              args:
                - scan
                - framework
                - NSA,MITRE
                # kubescape emits Prometheus exposition format natively, with
                # `severity` already a real label -- so nothing here has to parse
                # a report or derive a severity, and the artefact is 23KB of text
                # rather than a 3.3MB JSON document.
                - --format
                - prometheus
                # NOT /dev/stdout. kubescape APPENDS `.json` to whatever --output
                # is given, so an earlier revision produced `/dev/stdout.json` and
                # failed with "permission denied" -- confirmed in the job's own
                # logs on 2026-09-04. It then fell back to dumping a report into
                # the log stream interleaved with its own JSON log lines, where
                # the payload was truncated and nothing read it anyway.
                - --output
                - /work/metrics
                # Do not phone home. Without it kubescape submits results to the
                # ARMO SaaS backend, which is a posture report of this cluster
                # leaving it.
                - --keep-local
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          containers:
            - name: publish
              # rancher/kuberlr-kubectl, already pulled on this node for SUC's own
              # Jobs and the upgrade gates. It carries wget, which is all this
              # step needs now -- no jq, no python, no aws-cli, nothing installed
              # at runtime.
              image: docker.io/rancher/kuberlr-kubectl:v8.1.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  SRC=/work/metrics

                  if [ ! -s "$SRC" ]; then
                    echo "ERROR: $SRC missing or empty -- the scan produced nothing" >&2
                    exit 1
                  fi

                  # kubescape has no metric for "when did this run", and staleness
                  # is the failure that went unnoticed for this job's entire life,
                  # so add one. Appended rather than replacing anything kubescape
                  # emits.
                  echo "kubescape_scan_last_run_timestamp $(date -u +%s)" >> "$SRC"

                  # THE REPORT. Printed to stdout so it lands in VictoriaLogs via
                  # the normal pod-log pipeline -- no bucket, no credential, no
                  # second backup mechanism for an artefact that is regenerated
                  # from the live cluster every Sunday.
                  #
                  # This works precisely because the prometheus format is small:
                  # ~180 lines, one per control per counter, each carrying the
                  # control name, its severity and its docs link. The JSON report
                  # this replaced was 3.3MB on a single line, which the log
                  # pipeline truncated -- the reason the previous output was
                  # unreadable even though it was technically being emitted.
                  echo "----- kubescape posture report -----"
                  cat "$SRC"
                  echo "----- end of report -----"

                  # A one-line summary, so the common question does not require
                  # reading 180 lines back.
                  echo "SUMMARY $(grep -c '^kubescape_control_count_resources_failed' "$SRC") control counters, cluster score $(sed -n 's/^kubescape_cluster_complianceScore{} //p' "$SRC")"

                  # -T 10 so a denied egress path costs seconds rather than the
                  # two minutes a default wget timeout burns.
                  if ! wget -q -T 10 -O /dev/null --post-file="$SRC" "$VM_IMPORT_URL"; then
                    echo "WARN: metric push failed -- the report above is still in VictoriaLogs, but the alerts are blind this run" >&2
                  fi
                  echo "SCAN_PUBLISHED_OK"
              env:
                - name: VM_IMPORT_URL
                  value: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428/api/v1/import/prometheus
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: work
              emptyDir:
                sizeLimit: 64Mi
