apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubescape-scan
  namespace: kubescape
spec:
  # Run every Sunday at 02:00 UTC — low-traffic window, avoids weekday disruption
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          serviceAccountName: kubescape
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: kubescape
              image: quay.io/kubescape/kubescape:v3.0.22
              args:
                - scan
                - framework
                - NSA,MITRE
                - --format
                - json
                - --output
                - /dev/stdout
                - --verbose
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 65534
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
