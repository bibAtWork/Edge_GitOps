# S3 credentials for the kubescape scan-report upload.
#
# Same single SeaweedFS admin credential the rest of the cluster uses (see
# CLAUDE.md: one admin credential plus network policy, deliberately not
# per-bucket IAM users). A Secret cannot be referenced across namespaces, so
# this namespace needs its own copy, exactly as immich, paperless and keycloak
# each do.
#
# Encrypt with SOPS before committing:
#   sops --encrypt --in-place backup-s3-secret.yaml
apiVersion: v1
kind: Secret
metadata:
    name: seaweedfs-backup-credentials
    namespace: kubescape
type: Opaque
