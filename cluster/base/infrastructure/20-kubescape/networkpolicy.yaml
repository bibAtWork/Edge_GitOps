# Egress for the kubescape scan job's two outbound needs.
#
# Cilium is default-deny in both directions, and this namespace previously had
# only allow-intra-namespace-egress -- enough for a scan that talked to nothing
# but the API server (exempt cluster-wide, see 10-network-policies/
# default-deny.yaml) and threw its report away. Storing the report and reporting
# a metric are both new outbound paths.
#
# Scoped to the backup.homelab/egress label rather than the whole namespace,
# matching 34-backup/networkpolicy.yaml. The scan ServiceAccount holds a
# cluster-wide read of every resource in the cluster, so this is precisely the
# workload where a blanket egress grant would be worth the least and cost the
# most: it would turn a read-everything credential into a read-everything
# credential with an exfiltration path.
#
# Note there is deliberately no `world` egress here. The scan runs with
# --keep-local so it never submits results to the ARMO SaaS backend, and nothing
# else in this job needs the internet.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kubescape-scan-egress
  namespace: kubescape
spec:
  endpointSelector:
    matchLabels:
      backup.homelab/egress: "true"
  egress:
    # The scan report, stored as an object.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: seaweedfs
            app.kubernetes.io/name: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    # The per-run metrics, so a failing control is visible as an alert rather
    # than only inside a 3.3MB object nobody opens.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
