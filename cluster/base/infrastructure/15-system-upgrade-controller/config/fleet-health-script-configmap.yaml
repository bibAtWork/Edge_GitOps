# Placed alongside the Plans and versions.env, not under its own top-level
# infra component the way 36-talos-cve-watch is, because it needs a build-time
# value (DESIRED_TALOS_VERSION in cronjob.yaml) from the talos-versions
# ConfigMap generated in this same kustomization tree. `replacements` only
# resolves within one kustomize build, and 1-node's operator layer (where
# 36-talos-cve-watch lives) and this config layer are two separate Flux
# Kustomizations applied in sequence -- so the source and the target of that
# replacement have to live in the same directory.
apiVersion: v1
kind: ConfigMap
metadata:
  name: talos-fleet-health-script
  namespace: monitoring
data:
  check.py: |
    # Compares every node's ACTUAL running Talos version AND Kubernetes
    # (kubelet) version against every other node's (skew) and against what
    # this repo declares (drift), and checks each node's Ready condition.
    # Reports all of it as metrics.
    #
    # Kubernetes-version skew/drift added on code review (PR #386, round 3):
    # the Talos-only version of this check would have missed a Kubernetes
    # upgrade that silently never ran the exact same way this repo's history
    # already missed a Talos one for 44 days -- reproduced on the new axis
    # this PR itself introduces, if left uncovered. Both come off the same
    # kube_node_info series already being fetched for the Talos comparison,
    # so this is not a second scrape.
    #
    # ── Why this is separate from talos-cve-watch ────────────────────────────
    # talos-cve-watch answers "is the running version affected by a known
    # advisory". This answers a different pair of questions that mattered
    # enough to get asked explicitly: are all nodes even on the SAME version
    # (a partial rollout stuck halfway, or a node that silently never
    # upgraded), and does the fleet match what git says it should be running.
    # Both read kube_node_info the same way and need no Kubernetes API access
    # to do it, for the same reason the CVE watcher doesn't: the pin in git is
    # what the cluster is supposed to run, the node is what it does run, and
    # those two have already drifted here once for 44 days without anything
    # noticing.
    import json
    import os
    import re
    import time
    import urllib.parse
    import urllib.request

    VM = os.environ["VM_URL"]
    VM_IMPORT = os.environ["VM_IMPORT_URL"]
    # Both baked in at build time from versions.env via the `replacements`
    # block in ../kustomization.yaml -- see the ConfigMap generator there.
    DESIRED_TALOS_VERSION = os.environ["DESIRED_TALOS_VERSION"]
    DESIRED_KUBERNETES_VERSION = os.environ["DESIRED_KUBERNETES_VERSION"]


    def get(url, timeout=30):
        with urllib.request.urlopen(url, timeout=timeout) as r:
            return r.read().decode()


    def running_versions():
        """Talos AND Kubernetes versions, both off kube_node_info.

        Talos lives in os_image='Talos (v1.13.6)' and needs extracting.
        kubelet_version is already a bare 'v1.32.3'-shaped string -- kube-
        state-metrics reports it directly from the Kubernetes API, no
        parsing required, unlike os_image's free-text Talos-specific format.
        """
        q = urllib.parse.urlencode({"match[]": "kube_node_info"})
        body = get(f"{VM}/api/v1/series?{q}")
        talos, kubernetes = {}, {}
        for s in json.loads(body).get("data", []):
            node = s.get("node", "?")
            m = re.search(r"Talos \(?(v[\d.]+)\)?", s.get("os_image", ""))
            if m:
                talos.setdefault(node, m.group(1))
            kv = s.get("kubelet_version", "")
            if kv:
                kubernetes.setdefault(node, kv)
        return talos, kubernetes


    def ready_status():
        """kube_node_status_condition{condition="Ready",status="true"} == 1 per node."""
        q = urllib.parse.urlencode(
            {"query": 'kube_node_status_condition{condition="Ready",status="true"}'}
        )
        body = get(f"{VM}/api/v1/query?{q}")
        out = {}
        for r in json.loads(body).get("data", {}).get("result", []):
            node = r.get("metric", {}).get("node", "?")
            value = r.get("value", [None, "0"])[1]
            out[node] = value == "1"
        return out


    def push(lines):
        data = ("\n".join(lines) + "\n").encode()
        req = urllib.request.Request(VM_IMPORT, data=data, method="POST")
        with urllib.request.urlopen(req, timeout=20) as r:
            r.read()


    def skew_drift(versions, desired, label):
        distinct = set(versions.values())
        skew = 0 if len(distinct) <= 1 else 1
        drift_nodes = [n for n, v in versions.items() if v != desired]
        drift = 1 if drift_nodes else 0
        print(f"{label}: desired={desired} running={versions}")
        if skew:
            print(f"  SKEW: nodes disagree on version: {sorted(distinct)}")
        if drift:
            print(f"  DRIFT: not on {desired}: {drift_nodes}")
        return skew, drift

    failed = 0
    detail = ""
    talos_versions = {}
    kubernetes_versions = {}
    node_ready = {}

    try:
        talos_versions, kubernetes_versions = running_versions()
        if not talos_versions:
            raise RuntimeError("kube_node_info returned no Talos os_image label")
        if not kubernetes_versions:
            raise RuntimeError("kube_node_info returned no kubelet_version label")
        node_ready = ready_status()
        # A node kube_node_info knows about but kube_node_status_condition does
        # not is itself a fault, not something to paper over as "not ready".
        #
        # Round 4 code review found the previous version of this comment
        # described the wrong fix: defaulting a missing sample to "not ready"
        # means kube_node_status_condition returning NOTHING AT ALL --
        # kube-state-metrics down, the metric renamed -- reports every single
        # node as unready, a fabricated fleet-wide-outage page from a check
        # that actually just couldn't get data. That failure belongs on
        # check_failed (TalosFleetHealthCheckFailing already exists to alert
        # on exactly this), not synthesized as TalosFleetUnreadyNodes.
        missing_ready = [n for n in talos_versions if n not in node_ready]
        if missing_ready:
            raise RuntimeError(
                f"kube_node_status_condition has no Ready sample for: {missing_ready}"
            )
        # The reverse direction of the same check. A node kube_node_status_
        # condition knows about but that has no PARSEABLE version in
        # kube_node_info -- os_image not matching the "Talos (vX.Y.Z)"
        # pattern, or an empty kubelet_version -- was silently dropped from
        # talos_versions/kubernetes_versions by running_versions()'s `if m:`
        # / `if kv:` guards, and from there from skew_drift() and the
        # unready_nodes computation below, both of which only ever iterate
        # the version dicts. The fleet could report "uniform, on the
        # declared version, all Ready" while one node contributed nothing to
        # any of those checks at all. Found on round 6 code review.
        missing_talos_version = [n for n in node_ready if n not in talos_versions]
        if missing_talos_version:
            raise RuntimeError(
                f"kube_node_info has no parseable Talos version for: {missing_talos_version}"
            )
        missing_k8s_version = [n for n in node_ready if n not in kubernetes_versions]
        if missing_k8s_version:
            raise RuntimeError(
                f"kube_node_info has no parseable Kubernetes version for: {missing_k8s_version}"
            )

        talos_skew, talos_drift = skew_drift(talos_versions, DESIRED_TALOS_VERSION, "talos")
        k8s_skew, k8s_drift = skew_drift(
            kubernetes_versions, DESIRED_KUBERNETES_VERSION, "kubernetes"
        )
        unready_nodes = [n for n in talos_versions if not node_ready[n]]

        if unready_nodes:
            print(f"NOT READY: {unready_nodes}")
        if not (talos_skew or talos_drift or k8s_skew or k8s_drift or unready_nodes):
            print("fleet is uniform, on the declared versions, and all nodes Ready")

    except Exception as exc:  # noqa: BLE001 -- any failure must be reported, not swallowed
        failed = 1
        detail = str(exc)
        print(f"CHECK FAILED: {detail}")

    lines = [
        f"talos_fleet_health_check_last_run_timestamp {int(time.time())}",
        f"talos_fleet_health_check_failed {failed}",
    ]

    # Emitted even when the fleet is clean, same reasoning as talos-cve-watch:
    # a gauge that only appears when something is wrong cannot be alerted on
    # with a simple comparison, and reads as NoData rather than as "healthy".
    if not failed:
        lines.append(f"talos_fleet_version_skew {talos_skew}")
        lines.append(f"talos_fleet_version_drift {talos_drift}")
        lines.append(f"talos_fleet_k8s_version_skew {k8s_skew}")
        lines.append(f"talos_fleet_k8s_version_drift {k8s_drift}")
        lines.append(f"talos_fleet_unready_nodes {len(unready_nodes)}")
        for node, version in talos_versions.items():
            ready = 1 if node_ready.get(node, False) else 0
            kube_version = kubernetes_versions.get(node, "")
            lines.append(
                f'talos_fleet_node_info{{node="{node}",version="{version}",'
                f'kubernetes_version="{kube_version}"}} {ready}'
            )

    try:
        push(lines)
        print(f"pushed {len(lines)} metrics")
    except Exception as exc:  # noqa: BLE001
        print(f"WARN: metric push failed: {exc}")

    raise SystemExit(failed)
