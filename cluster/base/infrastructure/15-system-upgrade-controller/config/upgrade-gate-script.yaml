# The pre-upgrade gate. Held in a ConfigMap rather than inlined into a Plan,
# which is also why it is a CronJob and not spec.prepare -- SUC Plans can mount
# secrets but not ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: upgrade-backup-gate-script
  namespace: longhorn-system
data:
  gate.sh: |
    #!/bin/sh
    # Decides whether this node may be upgraded, by proving that every
    # application has a recent recovery point that restores, with a verified
    # copy in AWS. It records the answer as a node label that the SUC Plans
    # require via nodeSelector.
    #
    # An upgrade reboots a single-node cluster. What makes that acceptable is
    # being able to go back, and "there is a backup" is not the same claim as
    # "the backup restores" -- this cluster once spent four days with 584
    # unreadable backup objects while every job reported success. The recovery
    # system (ADR-012) builds the stronger claim into every point:
    #
    #   - a recovery-point Workflow succeeds only when every dataset's restore
    #     test passed and the point was recorded VALIDATED;
    #   - a promote Workflow succeeds only when each point it copied was
    #     verified in the AWS repository.
    #
    # So the gate reads those Workflows. It reads them through the Kubernetes
    # API rather than VictoriaMetrics, so the decision does not depend on the
    # metrics pipeline being healthy. It never submits work of its own.
    #
    # Fails CLOSED. If anything here cannot be established, the label is removed
    # and no Plan acts. A missed upgrade window is recoverable; an upgrade with
    # no working recovery point is not.
    set -u

    LABEL="talos.homelab/upgrade-ready"
    NS="backup-system"
    MAX_POINT_AGE_HOURS="${MAX_POINT_AGE_HOURS:-26}"
    FAILURES=""
    UNPROVEN=0

    log()  { echo "[$(date -u +%H:%M:%S)] $*"; }
    fail() { FAILURES="${FAILURES}${1}; "; log "REFUSE: $1"; }

    # Revoke first, re-earn second.
    #
    # The label is a STANDING authorisation: once set, it persists until
    # something removes it. Setting it on success and removing it on refusal
    # covers both verdicts, but not a third outcome: reaching no verdict at
    # all, because this pod was killed or the API failed midway. Then last
    # week's label would authorise an upgrade that nothing examined this week.
    # Clearing it up front makes the absence of a verdict a refusal. The gate
    # runs at 11:00 and the first window opens at 12:00.
    for N in $(kubectl get nodes -o name 2>/dev/null | sed 's|^node/||'); do
      kubectl label node "$N" "${LABEL}-" >/dev/null 2>&1 || true
    done
    log "cleared $LABEL from all nodes -- it must be re-earned by this run"

    # ---------------------------------------------------------------
    # 1. Every application the policy declares is proven.
    # ---------------------------------------------------------------
    # The applications come from recovery-policy's own `applications` table,
    # not from the recovery-point CronWorkflows that implement it. Found on
    # code review: nothing else bound those two lists together, so an
    # application added to the policy without a matching CronWorkflow was
    # still backed up by the reconciler (which does read the policy) but
    # never checked here -- upgrades got authorised without proving it.
    # Reading the policy directly, rather than deriving the list from
    # whichever CronWorkflows exist, makes that gap impossible to reopen the
    # same way twice: a missing CronWorkflow now fails proof (below) for the
    # application it should have protected, instead of the application
    # being invisible to this gate entirely.
    APPS="$(kubectl get configmap recovery-policy -n "$NS" -o jsonpath='{.data.applications}' 2>/dev/null \
      | sed 's/#.*//' | awk 'NF >= 1 { print $1 }')"
    [ -n "$APPS" ] || fail "could not read recovery-policy's applications table in $NS, or it is empty"

    # RFC3339 UTC timestamps are zero-padded, so their string order is time
    # order, and they compare with the shell's own string comparison.
    CUTOFF="$(date -u -d "@$(( $(date -u +%s) - MAX_POINT_AGE_HOURS * 3600 ))" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null)"
    [ -n "$CUTOFF" ] || fail "could not compute the ${MAX_POINT_AGE_HOURS}h cutoff"

    # A Workflow's application is its `application` argument, whoever
    # submitted it: the CronWorkflow, the reconciler or an operator.
    if ! kubectl get workflows -n "$NS" -o jsonpath='{range .items[?(@.spec.workflowTemplateRef.name=="recovery-point")]}{.spec.arguments.parameters[?(@.name=="application")].value} {.status.phase} {.status.finishedAt}{"\n"}{end}' > /tmp/points 2>/dev/null; then
      fail "could not list the recovery-point Workflows"
    fi
    if ! kubectl get workflows -n "$NS" -o jsonpath='{range .items[?(@.spec.workflowTemplateRef.name=="promote")]}{.spec.arguments.parameters[?(@.name=="application")].value} {.status.phase} {.status.startedAt}{"\n"}{end}' > /tmp/promotions 2>/dev/null; then
      fail "could not list the promote Workflows"
    fi

    # promoted APP POINT: the start of the newest successful promotion of APP
    # that began after POINT finished. Promotion copies every VALIDATED point
    # still waiting for AWS, and succeeds only once each is verified there, so
    # such a promotion has taken the point.
    promoted() {
      PB=""
      while read -r PA PP PT; do
        [ "$PA" = "$1" ] && [ "$PP" = Succeeded ] && [ -n "$PT" ] || continue
        [ "$PT" \< "$2" ] && continue
        { [ -z "$PB" ] || [ "$PT" \> "$PB" ]; } && PB="$PT"
      done < /tmp/promotions
      echo "$PB"
    }

    # For each application: the newest validated point that is also verified
    # in AWS, which must be under MAX_POINT_AGE_HOURS old. A newer point still
    # waiting for its promotion does not hide an older one that is complete:
    # the question is whether there is a proven point to go back to.
    for APP in $APPS; do
      NEWEST=""; POINT=""; BY=""
      while read -r A PHASE T; do
        [ "$A" = "$APP" ] && [ "$PHASE" = Succeeded ] && [ -n "$T" ] || continue
        { [ -z "$NEWEST" ] || [ "$T" \> "$NEWEST" ]; } && NEWEST="$T"
        P="$(promoted "$APP" "$T")"
        [ -n "$P" ] || continue
        { [ -z "$POINT" ] || [ "$T" \> "$POINT" ]; } && { POINT="$T"; BY="$P"; }
      done < /tmp/points
      if [ -z "$NEWEST" ]; then
        fail "$APP has no validated recovery point"
      elif [ -z "$POINT" ]; then
        fail "$APP: no validated recovery point has a verified copy in AWS yet (the newest finished $NEWEST)"
      elif [ -n "$CUTOFF" ] && [ "$POINT" \< "$CUTOFF" ]; then
        fail "$APP: its newest recovery point verified in AWS finished $POINT, older than ${MAX_POINT_AGE_HOURS}h"
      else
        log "$APP: recovery point validated $POINT, verified in AWS by the promotion started $BY"
        continue
      fi
      UNPROVEN=$((UNPROVEN + 1))
    done

    # ---------------------------------------------------------------
    # 2. Record the verdict.
    # ---------------------------------------------------------------
    # Every node, not just the one this pod landed on. The verdict is about the
    # cluster's recovery points, which are cluster-wide, so it applies to every
    # node equally. Labelling only the local node would work by accident on one
    # node and silently leave the other two unupgradeable on three.
    NODES="$(kubectl get nodes -o name 2>/dev/null | sed 's|^node/||')"
    if [ -z "$NODES" ]; then
      fail "could not list nodes to record the verdict"
    fi

    if [ -z "$FAILURES" ]; then
      for N in $NODES; do
        kubectl label node "$N" "$LABEL=true" --overwrite >/dev/null 2>&1 \
          && log "GATE PASSED -- $N labelled $LABEL=true" \
          || { log "GATE PASSED but labelling $N failed"; FAILURES="label write failed on $N; "; }
      done
    fi

    # Not an else. If labelling failed above, the verdict is now a refusal and
    # every label must come off -- otherwise a partial pass leaves some nodes
    # authorised on a run that did not actually succeed.
    if [ -n "$FAILURES" ]; then
      for N in $NODES; do
        kubectl label node "$N" "${LABEL}-" >/dev/null 2>&1 || true
      done
      log "GATE REFUSED -- $LABEL removed from all nodes"
      log "reasons: $FAILURES"
    fi

    PASS=0
    [ -z "$FAILURES" ] && PASS=1
    {
      echo "upgrade_gate_pass $PASS"
      echo "upgrade_gate_last_run_timestamp $(date -u +%s)"
      echo "upgrade_gate_unproven_applications $UNPROVEN"
    } | wget -q -O /dev/null --post-file=- "$VM_IMPORT_URL" || log "WARN: metric push failed"

    [ -z "$FAILURES" ] || exit 1
    log "GATE_OK"
