# The pre-upgrade backup gate. Held in a ConfigMap rather than inlined into a
# Plan, which is also why it is a CronJob and not spec.prepare -- SUC Plans can
# mount secrets but not ConfigMaps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: upgrade-backup-gate-script
  namespace: longhorn-system
data:
  gate.sh: |
    #!/bin/sh
    # Decides whether this node may be upgraded, by proving the backups are both
    # RECENT and READABLE, and records the answer as a node label that the SUC
    # Plans require via nodeSelector.
    #
    # An upgrade reboots a single-node cluster. The thing that makes that
    # acceptable is being able to go back, and "there is a backup" is not the
    # same claim as "the backup restores" -- this cluster spent four days with
    # 584 unreadable backup objects while every job reported success. So the
    # gate does not check that backups exist; it checks that they read.
    #
    # Fails CLOSED. If anything here cannot be established, the label is removed
    # and no Plan acts. A missed upgrade window is recoverable; an upgrade with
    # no working backup is not.
    set -u

    LABEL="talos.homelab/upgrade-ready"
    MAX_BACKUP_AGE_HOURS="${MAX_BACKUP_AGE_HOURS:-26}"
    FAILURES=""

    log()  { echo "[$(date -u +%H:%M:%S)] $*"; }
    fail() { FAILURES="${FAILURES}${1}; "; log "REFUSE: $1"; }

    # Revoke first, re-earn second.
    #
    # The label is a STANDING authorisation: once set it persists until something
    # removes it, and the checks below take minutes during which this process can
    # be OOM-killed, evicted, or hit an API error. Setting on success and
    # removing on refusal covers both verdicts but not the third outcome --
    # reaching no verdict at all -- and in that case last week's label would sit
    # there authorising an upgrade nothing examined this week.
    #
    # Clearing up front makes the absence of a verdict indistinguishable from a
    # refusal, which is the correct default for a mechanism whose entire purpose
    # is failing closed. The gate runs at 11:00 and the first window opens at
    # 12:00, so the hour of "unauthorised" in between costs nothing.
    for N in $(kubectl get nodes -o name 2>/dev/null | sed 's|^node/||'); do
      kubectl label node "$N" "${LABEL}-" >/dev/null 2>&1 || true
    done
    log "cleared $LABEL from all nodes -- it must be re-earned by this run"
    # ---------------------------------------------------------------
    # 0. If a version bump is pending, force a fresh backup+relay first.
    # ---------------------------------------------------------------
    # "A new version was merged" is detected as DRIFT: the version this repo
    # declares (DESIRED_*, baked in at build time from versions.env) differs
    # from what is actually running. That is exactly what talos-fleet-health
    # already computes (talos_fleet_version_drift / talos_fleet_k8s_version_drift)
    # -- but this reads kubectl directly rather than through VictoriaMetrics,
    # on purpose: whether to force a pre-upgrade backup must not depend on the
    # metrics pipeline being healthy, and VictoriaMetrics has already had one
    # multi-hour outage on this cluster (2026-09-02/03).
    #
    # Talos version comes off status.nodeInfo.osImage ("Talos (v1.13.9)"), the
    # same field-and-regex fleet-health uses, just read from the node directly
    # instead of from kube_node_info. Kubernetes version is
    # status.nodeInfo.kubeletVersion, already bare and needing no parsing.
    #
    # Runs only when something is actually pending, so a normal Sunday with no
    # version change costs nothing extra -- it fires exactly the week a bump
    # has landed, which is also the one week the existing weekly cadence is
    # not enough to trust blindly: "there is a backup" says nothing about
    # whether it predates the change being tested.
    wait_for_job() {
      J="$1"; BUDGET="$2"
      i=0; STATE=""
      while [ "$i" -lt "$BUDGET" ]; do
        if kubectl get job -n longhorn-system "$J" -o jsonpath='{.status.succeeded}' 2>/dev/null | grep -q 1; then
          STATE=ok; break
        fi
        if kubectl get job -n longhorn-system "$J" -o jsonpath='{.status.failed}' 2>/dev/null | grep -q '[1-9]'; then
          STATE=failed; break
        fi
        i=$((i + 1)); sleep 10
      done
      # Same reason as step 2 below: the Job controller deletes the pod (and
      # its logs) on BackoffLimitExceeded, so capture before deleting.
      kubectl logs -n longhorn-system "job/$J" --tail=15 2>/dev/null | sed 's/^/    /' || true
      kubectl delete job -n longhorn-system "$J" --wait=false >/dev/null 2>&1 || true
      [ "$STATE" = "ok" ]
    }

    # Desired versions come from the Plans SUC will act on, not from a copy
    # baked into this CronJob. Those were two records of the same fact, and if a
    # `replacements` target were ever dropped this gate would compare against a
    # stale value and PASS -- authorising an upgrade on a check that examined
    # the wrong thing. Reading spec.version removes the second record.
    DESIRED_TALOS_VERSION="$(kubectl get plan talos-controlplane -n cattle-system -o jsonpath='{.spec.version}' 2>/dev/null)"
    DESIRED_KUBERNETES_VERSION="$(kubectl get plan talos-kubernetes -n cattle-system -o jsonpath='{.spec.version}' 2>/dev/null)"
    if [ -z "$DESIRED_TALOS_VERSION" ] || [ -z "$DESIRED_KUBERNETES_VERSION" ]; then
      # Fail closed. Not knowing what is desired is not the same as there being
      # no drift, and this gate's whole job is to refuse when it cannot tell.
      fail "could not read spec.version from the talos-controlplane/talos-kubernetes Plans"
    fi
    log "desired from Plans: talos=$DESIRED_TALOS_VERSION kubernetes=$DESIRED_KUBERNETES_VERSION"

    DRIFT=0
    for N in $(kubectl get nodes -o name 2>/dev/null | sed 's|^node/||'); do
      RT="$(kubectl get node "$N" -o jsonpath='{.status.nodeInfo.osImage}' 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')"
      RK="$(kubectl get node "$N" -o jsonpath='{.status.nodeInfo.kubeletVersion}' 2>/dev/null)"
      [ "$RT" != "$DESIRED_TALOS_VERSION" ] && DRIFT=1
      [ "$RK" != "$DESIRED_KUBERNETES_VERSION" ] && DRIFT=1
    done

    if [ "$DRIFT" = "1" ]; then
      log "version drift detected (running vs. desired differ) -- a Talos or Kubernetes bump is pending"
      log "forcing a fresh backup + offsite relay before trusting freshness below"

      BJOB="upgrade-gate-backup-$(date -u +%Y%m%d%H%M)"
      log "running $BJOB (backup-weekly, on demand)"
      if kubectl create job -n longhorn-system "$BJOB" --from=cronjob/backup-weekly >/dev/null 2>&1; then
        wait_for_job "$BJOB" 60 && log "fresh backup completed" \
          || fail "pre-upgrade backup ($BJOB) did not complete"
      else
        fail "could not create the pre-upgrade backup job"
      fi

      # Do not wait for the 05:00 relay schedule -- push this backup offsite
      # now, so a same-day rollback (Scenario E2) also has a vault copy rather
      # than only a local one.
      RJOB="upgrade-gate-relay-$(date -u +%Y%m%d%H%M)"
      log "running $RJOB (backup-relay, on demand)"
      if kubectl create job -n longhorn-system "$RJOB" --from=cronjob/backup-relay >/dev/null 2>&1; then
        wait_for_job "$RJOB" 60 && log "offsite relay completed" \
          || fail "pre-upgrade offsite relay ($RJOB) did not complete"
      else
        fail "could not create the pre-upgrade relay job"
      fi
    else
      log "no version drift -- running on the existing weekly backup cadence"
    fi


    # ---------------------------------------------------------------
    # 1. Longhorn volume backups are recent.
    # ---------------------------------------------------------------
    # Read from backupvolume status, the only place the last successful backup
    # time is recorded. A volume with no backup at all is not a failure here --
    # volumes in the `ephemeral` recurring-job group are excluded from backups
    # on purpose, and treating them as missing would make the gate refuse
    # forever over caches nobody wants backed up.
    NOW="$(date -u +%s)"
    CUTOFF=$(( NOW - MAX_BACKUP_AGE_HOURS * 3600 ))
    STALE=0
    CHECKED=0

    kubectl get backupvolumes.longhorn.io -n longhorn-system \
      -o custom-columns=VOL:.spec.volumeName,AT:.status.lastBackupAt --no-headers 2>/dev/null > /tmp/bvs || true

    while read -r VOL AT; do
      [ -z "${VOL:-}" ] && continue
      [ -z "${AT:-}" ] || [ "$AT" = "<none>" ] && continue
      CHECKED=$((CHECKED + 1))
      # busybox date cannot parse RFC3339 with -d, so compare lexically against
      # a formatted cutoff instead. Both are UTC and zero-padded, so string
      # order is time order.
      CUT_STR="$(date -u -d "@$CUTOFF" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || echo '')"
      if [ -n "$CUT_STR" ] && [ "$AT" \< "$CUT_STR" ]; then
        fail "$VOL last backed up $AT, older than ${MAX_BACKUP_AGE_HOURS}h"
        STALE=$((STALE + 1))
      fi
    done < /tmp/bvs
    log "longhorn backups checked=$CHECKED stale=$STALE"

    # ---------------------------------------------------------------
    # 2. The backups actually read, right now.
    # ---------------------------------------------------------------
    # Runs backup-verify rather than trusting its last scheduled result. The
    # point of the gate is the state at THIS moment: a verify that passed eight
    # hours ago says nothing about a chunk lost since.
    JOB="upgrade-gate-verify-$(date -u +%Y%m%d%H%M)"
    log "running $JOB"
    if kubectl create job -n longhorn-system "$JOB" --from=cronjob/backup-verify >/dev/null 2>&1; then
      i=0
      STATE=""
      while [ "$i" -lt 90 ]; do
        if kubectl get job -n longhorn-system "$JOB" -o jsonpath='{.status.succeeded}' 2>/dev/null | grep -q 1; then
          STATE=ok; break
        fi
        if kubectl get job -n longhorn-system "$JOB" -o jsonpath='{.status.failed}' 2>/dev/null | grep -q '[1-9]'; then
          STATE=failed; break
        fi
        i=$((i + 1)); sleep 10
      done
      case "$STATE" in
        ok)     log "backup-verify passed" ;;
        failed) fail "backup-verify reported unreadable or mismatched objects" ;;
        *)      fail "backup-verify did not finish within 15m" ;;
      esac
      # The Job controller deletes the pod on BackoffLimitExceeded and takes the
      # logs with it, so capture them before cleaning up.
      kubectl logs -n longhorn-system "job/$JOB" --tail=25 2>/dev/null | sed 's/^/    /' || true
      kubectl delete job -n longhorn-system "$JOB" --wait=false >/dev/null 2>&1 || true
    else
      fail "could not create the backup-verify job"
    fi

    # ---------------------------------------------------------------
    # 3. Record the verdict.
    # ---------------------------------------------------------------
    # Every node, not just the one this pod landed on. The verdict is about the
    # cluster's backups, which are cluster-wide, so it applies to every node
    # equally. Labelling only the local node would work by accident on one node
    # and silently leave the other two unupgradeable on three -- the kind of
    # difference that does not appear until the overlay changes.
    NODES="$(kubectl get nodes -o name 2>/dev/null | sed 's|^node/||')"
    if [ -z "$NODES" ]; then
      fail "could not list nodes to record the verdict"
    fi

    if [ -z "$FAILURES" ]; then
      for N in $NODES; do
        kubectl label node "$N" "$LABEL=true" --overwrite >/dev/null 2>&1 \
          && log "GATE PASSED -- $N labelled $LABEL=true" \
          || { log "GATE PASSED but labelling $N failed"; FAILURES="label write failed on $N; "; }
      done
    fi

    # Not an else. If labelling failed above, the verdict is now a refusal and
    # every label must come off -- otherwise a partial pass leaves some nodes
    # authorised on a run that did not actually succeed.
    if [ -n "$FAILURES" ]; then
      for N in $NODES; do
        # Removing beats leaving it stale: a label from last week would
        # authorise an upgrade on this week's unexamined state.
        kubectl label node "$N" "${LABEL}-" >/dev/null 2>&1 || true
      done
      log "GATE REFUSED -- $LABEL removed from all nodes"
      log "reasons: $FAILURES"
    fi

    PASS=0
    [ -z "$FAILURES" ] && PASS=1
    {
      echo "upgrade_gate_pass $PASS"
      echo "upgrade_gate_last_run_timestamp $(date -u +%s)"
      echo "upgrade_gate_stale_backup_volumes $STALE"
    } | wget -q -O /dev/null --post-file=- "$VM_IMPORT_URL" || log "WARN: metric push failed"

    [ -z "$FAILURES" ] || exit 1
    log "GATE_OK"
