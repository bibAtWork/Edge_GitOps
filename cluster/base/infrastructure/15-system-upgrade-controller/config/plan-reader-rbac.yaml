# Lets talos-version-gate read the desired version from the Plan SUC will
# actually act on.
#
# The gate exists to answer one question: does the cluster match what is
# declared? It used to answer it against a copy of the declared version baked
# into its own manifest at build time -- which is a second copy of the same
# fact, and one that could disagree with the Plan if a `replacements` target
# were ever dropped. A gate comparing against the wrong desired value passes
# when it should refuse, which is the one failure mode a gate must not have.
#
# Reading spec.version instead means it compares against the exact object SUC
# resolves its latestHash from, so the two cannot diverge. (The pre-upgrade
# gate read Plans too, until it moved to proving recovery points instead.)
#
# A Role in cattle-system with a RoleBinding that names the ServiceAccount,
# rather than a ClusterRole: this grants read on Plans in THIS namespace only,
# instead of on Plans everywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: plan-reader
  namespace: cattle-system
rules:
  - apiGroups: ["upgrade.cattle.io"]
    resources: ["plans"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: talos-version-gate-plan-reader
  namespace: cattle-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: plan-reader
subjects:
  - kind: ServiceAccount
    name: talos-version-gate
    namespace: cattle-system
