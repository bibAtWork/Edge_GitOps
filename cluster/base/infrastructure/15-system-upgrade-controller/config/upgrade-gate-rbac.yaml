# Permissions for the pre-upgrade gate.
#
# The gate is a CronJob rather than a Plan's spec.prepare step, and that choice
# is forced: SUC Plans can mount secrets but not ConfigMaps, so a prepare script
# would have to be inlined into the Plan's args. This repo already refuses that
# for the restore-test -- "every backslash in it is one more chance for the
# escaping to be silently wrong in a way no validator catches" -- and a gate
# whose failure mode is a quoting bug is worse than no gate.
#
# Running it as a CronJob that sets a node label, with the Plans requiring that
# label via nodeSelector, uses SUC exactly as designed and keeps the script in a
# ConfigMap where it can be reviewed.
#
# Least privilege: this account can read Workflows and CronWorkflows in
# backup-system, read one named ConfigMap there (the policy, so it knows which
# applications to prove rather than deriving that list from whichever
# CronWorkflows happen to exist -- found on code review), and read and label
# nodes, and nothing else. It is NOT the system-upgrade-controller account,
# which is bound to cluster-admin -- the gate would have inherited all of it
# by running inside the upgrade Job. It cannot create Workflows either: a
# Workflow runs as backup-workflow, which holds every backup-store credential,
# so the gate reads the recovery system's verdicts and never submits work of
# its own.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: upgrade-backup-gate
  namespace: longhorn-system
---
# A Role in backup-system with a RoleBinding that names the ServiceAccount in
# longhorn-system: read on this namespace's Workflows only, rather than on
# Workflows everywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: upgrade-gate-reader
  namespace: backup-system
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows", "cronworkflows"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["recovery-policy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: upgrade-gate-reader
  namespace: backup-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: upgrade-gate-reader
subjects:
  - kind: ServiceAccount
    name: upgrade-backup-gate
    namespace: longhorn-system
---
# Nodes are cluster-scoped, so labelling one needs a ClusterRole. Scoped to
# nodes only, and to the verbs required to read and label them -- notably NOT
# delete, and nothing outside the core API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: upgrade-backup-gate-node-labeller
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: upgrade-backup-gate-node-labeller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: upgrade-backup-gate-node-labeller
subjects:
  - kind: ServiceAccount
    name: upgrade-backup-gate
    namespace: longhorn-system
