# Runs before the Sunday upgrade windows and decides whether they may proceed.
#
# Order of the whole chain, which is the point:
#   01:00 daily  recovery points: backup, restore test, VALIDATED (ADR-012)
#   03:00 daily  promotion: copied to AWS and verified there
#   11:00 Sun    THIS -- proves every application has a validated recovery
#                point under 26h old with a verified AWS copy, then labels the
#                nodes talos.homelab/upgrade-ready=true
#   12:00 Sun    talos-controlplane   (requires the label)
#   14:00 Sun    talos-worker         (requires the label)
#   16:00 Sun    talos-kubernetes     (requires the label)
#
# It fails CLOSED. If the gate cannot establish that every application is
# recoverable, the label is removed and no Plan acts. A missed upgrade window
# costs a week; an upgrade with no working recovery point can cost the cluster
# -- and this one reboots a single node with no HA to absorb it.
#
# Why the label rather than spec.prepare: SUC Plans can mount secrets but not
# ConfigMaps, so a prepare step would have to inline this script into the Plan's
# args. This repo already refuses that for the restore-test, on the grounds that
# every backslash is a chance for the escaping to be silently wrong. nodeSelector
# is what SUC provides for exactly this, and it keeps the script reviewable.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: upgrade-backup-gate
  namespace: longhorn-system
spec:
  schedule: "0 11 * * 0"
  suspend: false
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # No retry. A refusal is a decision, not a transient error: a second run
      # reads the same Workflows and reaches the same answer.
      backoffLimit: 0
      template:
        metadata:
          labels:
            # Selects upgrade-gate-egress (upgrade-gate-netpol.yaml), for the
            # metrics push. Without it the pod inherits longhorn-restrict, which
            # does not permit it.
            backup.homelab/egress: "true"
        spec:
          restartPolicy: Never
          serviceAccountName: upgrade-backup-gate
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gate
              # kubectl baked in, rather than alpine + `apk add kubectl`: apk
              # needs root, and the first version of this job died on "Unable
              # to lock database: Permission denied" as uid 1000. This image
              # runs as uid 1000, carries kubectl v1.36 matching the cluster,
              # and ships wget for the metric push, so the gate keeps
              # runAsNonRoot and does not depend on a package mirror being
              # reachable at the moment an upgrade is being decided. SUC already
              # pulls this image for its own Jobs, so it is present on the node.
              image: docker.io/rancher/kuberlr-kubectl:v8.1.2
              command: ["/bin/sh", "/scripts/gate.sh"]
              env:
                - name: VM_IMPORT_URL
                  value: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428/api/v1/import/prometheus # nosonar
                # A newest validated recovery point older than this refuses the
                # upgrade. Points are made daily at 01:00, so at 11:00 the newest
                # should be about 10 hours old; 26h allows one late night but not
                # a missed one.
                - name: MAX_POINT_AGE_HOURS
                  value: "26"
                # kuberlr (this image's kubectl wrapper, picking the binary that
                # matches the server) and kubectl's own discovery cache both
                # write under $HOME by default -- /home/kuberlr, which
                # readOnlyRootFilesystem below makes unwritable. Redirecting
                # HOME at the emptyDir already mounted at /tmp for the script's
                # own /tmp/points and /tmp/promotions avoids adding a second
                # volume for the same purpose.
                - name: HOME
                  value: /tmp
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                # kubectl needs about 260 MB with the ~200 CRDs this cluster
                # serves, above the 256Mi that this namespace's LimitRange gives
                # a container with no limit.
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: scripts
              configMap:
                name: upgrade-backup-gate-script
            - name: tmp
              emptyDir: {}
