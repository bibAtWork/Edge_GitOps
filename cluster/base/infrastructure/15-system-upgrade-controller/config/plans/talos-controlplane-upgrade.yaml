# Automated Talos upgrade for control-plane nodes.
#
# ── Why this lives in cattle-system ──────────────────────────────────────────
# system-upgrade-controller only reads Plans from its OWN namespace
# (SYSTEM_UPGRADE_CONTROLLER_NAMESPACE is a downward-API fieldRef to
# metadata.namespace, so it cannot be pointed elsewhere), and the Rancher chart
# hardcodes `namespace: cattle-system` as a literal in every template -- there is
# no namespace key in its values.yaml to override.
#
# So the controller is pinned to cattle-system and the Plans have to follow it.
# The `system-upgrade` namespace still exists next door and holds only the
# HelmRelease. That emptiness is the trap: these Plans sat there for 44 days
# looking correct and were never once read, which is why the node stayed on an
# old release while every version pin in the repo said otherwise.
#
# Verify with `kubectl get plans -n cattle-system`, never by reading this file.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-controlplane
  namespace: cattle-system
spec:
  # Pinned, never a channel. Upgrading Talos requires a Factory image whose
  # schematic matches the extensions below, and a channel would move the version
  # without anyone regenerating that schematic.
  #
  # This value, and the talosctl image tag below, are overwritten at build time
  # by the `replacements` block in ../kustomization.yaml, sourced from
  # ../versions.env's TALOS_VERSION. The literal here is a placeholder kept
  # valid so `kustomize build` still produces a sane Plan if replacements were
  # ever removed -- edit versions.env, not this field.
  version: v1.13.9
  exclusive: true
  # Without this, SUC applies the Plan to at most ZERO nodes.
  #
  # The CRD defines no default for concurrency, so an unset field is 0, and
  # "the maximum number of concurrent nodes to apply this update on" is
  # therefore none. The Plan then reports Complete=True because there is
  # genuinely nothing left to do, creates no Job, and logs nothing -- which is
  # exactly the state all three Plans sat in for this cluster's entire life
  # while the node stayed on an old Talos release.
  #
  # Upstream's own examples all set it. Nothing about a missing field surfaces
  # as an error: the Plan validates, resolves its version, and reports success.
  concurrency: 1
  # Required by system-upgrade-controller to run the upgrade pod, and absent
  # from every Plan here until now. Upstream's own examples all set it.
  #
  # Adding it did NOT by itself make SUC act, so it is a necessary fix rather
  # than the whole story. The open problem is recorded in docs/backlog.md:
  # zero Job events have ever been recorded in cattle-system, for any of the
  # three Plans, across the cluster's entire life -- while every status field
  # reads Validated=True, LatestResolved=True, Complete=True. A Plan can be
  # completely valid and still never do anything, which is why the node sat on
  # v1.13.6 against a v1.13.9 pin with nothing indicating a problem.
  serviceAccountName: system-upgrade-controller
  # A Talos upgrade reboots the node. On the 1-node profile that is a full
  # cluster outage for the duration, so it happens inside a window rather than
  # whenever a version pin changes.
  #
  # Sunday midday, because it is a cadence that misses every backup job. The
  # daily schedules cluster in the small hours -- staging 01:00, snapshot
  # 02:00, the three database dumps 02:40-02:50, the weekly tier Sunday 03:00,
  # monthly 04:00, relay 05:00, probe 06:00, restore-test 07:00, reconciler
  # 09:00 -- plus three hourly jobs at :17, :25 and :40. Nothing at all runs
  # between 09:00 and 01:00 except those hourly three, so anywhere in that gap
  # works; 12:00 is chosen within it rather than the evening end, so the whole
  # Sunday maintenance sequence (control-plane, worker, then the Kubernetes
  # upgrade -- see plans/talos-kubernetes-upgrade.yaml) finishes by mid
  # afternoon instead of running up against midnight. Rebooting mid-backup
  # leaves a partial artefact that restore-test then has to catch.
  #
  # The cost of weekly is latency: a merged version bump waits until the next
  # Sunday before it is eligible. That is the accepted trade -- an unattended
  # reboot landing on top of a database dump is worse than an upgrade applying
  # a few days later.
  #
  # timeZone is UTC, not Europe/Berlin as it was originally. Every CronJob in
  # this cluster schedules in UTC (none sets spec.timeZone), so a Berlin window
  # drifted an hour against all of them twice a year at the DST boundaries --
  # meaning a slot picked to sit clear of the backup jobs quietly stopped doing
  # that for half the year. The gap here is wide enough that an hour either way
  # would not have collided, but the drift is silent and there is no reason to
  # keep it.
  window:
    days: ["su"]
    startTime: "12:00"
    endTime: "14:00"
    timeZone: UTC
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  secrets:
    # Mounted into the upgrade Job, which the controller creates in its own
    # namespace -- so this Secret must exist in cattle-system too.
    - name: talos-credentials
      path: /var/run/secrets/talos
  cordon: true
  upgrade:
    # Tag overwritten at build time from ../versions.env's TALOS_VERSION -- see
    # the note on spec.version above. talosctl and the target OS version have
    # no independent Renovate manager anymore; they are the same field now, so
    # they cannot drift the way they used to.
    image: ghcr.io/siderolabs/talosctl:v1.13.9
    # No `command:`. The image's entrypoint is /talosctl and it contains no
    # shell -- confirmed from the image config on ghcr.io: Entrypoint
    # ["/talosctl"], Cmd null. The previous `command: [/bin/sh, -c, ...]` could
    # never have run:
    #
    #   exec: "/bin/sh": stat /bin/sh: no such file or directory
    #
    # That went unnoticed because concurrency: 0 meant no Job was ever created
    # to fail. Two independent faults, the first hiding the second.
    envs:
      # talosctl needs the node's Talos API address, and SUC does not provide
      # one. It injects SYSTEM_UPGRADE_NODE_NAME, POD_NAME, POD_UID, PLAN_NAME,
      # PLAN_LATEST_HASH and PLAN_LATEST_VERSION -- there is no
      # SYSTEM_UPGRADE_NODE_IP, which is what the old command interpolated. It
      # would have expanded to an empty string even with a shell present.
      #
      # status.hostIP is the node this Job was scheduled onto, so each node
      # upgrades itself rather than whatever the talosconfig happens to name.
      # That matters the moment there is more than one node.
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      # Sourced live from the talos-versions ConfigMap (../versions.env), not a
      # `replacements`-patched literal like the fields above -- envs support
      # configMapKeyRef directly, so there is no need to touch this file at all
      # when only the schematic changes independently of a version bump.
      - name: SCHEMATIC_ID
        valueFrom:
          configMapKeyRef:
            name: talos-versions
            key: SCHEMATIC_ID
    args:
      # Global flags precede the subcommand; $(VAR) is expanded by Kubernetes
      # from the container's own env, which is why NODE_IP above is required.
      - --talosconfig=/var/run/secrets/talos/talosconfig
      - --nodes=$(NODE_IP)
      - upgrade
      # The Factory installer, NOT ghcr.io/siderolabs/installer.
      #
      # This node runs an Image Factory build carrying siderolabs/iscsi-tools
      # and siderolabs/util-linux-tools, both required by Longhorn V1. Talos is
      # immutable and extensions exist only inside the installer image, so
      # upgrading through the stock installer silently drops both and Longhorn
      # loses iSCSI attach on the next boot.
      #
      # SCHEMATIC_ID must match talos-machineconfigs/schematic.yaml and the
      # installer pin in controlplane.yaml -- the CI workflow verifies this.
      - --image=factory.talos.dev/installer/$(SCHEMATIC_ID):$(SYSTEM_UPGRADE_PLAN_LATEST_VERSION)
      - --preserve=true
      - --wait=true
