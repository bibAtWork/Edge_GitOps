# Automated Talos upgrade for control-plane nodes.
#
# ── Why this lives in cattle-system ──────────────────────────────────────────
# system-upgrade-controller only reads Plans from its OWN namespace
# (SYSTEM_UPGRADE_CONTROLLER_NAMESPACE is a downward-API fieldRef to
# metadata.namespace, so it cannot be pointed elsewhere), and the Rancher chart
# hardcodes `namespace: cattle-system` as a literal in every template -- there is
# no namespace key in its values.yaml to override.
#
# So the controller is pinned to cattle-system and the Plans have to follow it.
# The `system-upgrade` namespace still exists next door and holds only the
# HelmRelease. That emptiness is the trap: these Plans sat there for 44 days
# looking correct and were never once read, which is why the node stayed on an
# old release while every version pin in the repo said otherwise.
#
# Verify with `kubectl get plans -n cattle-system`, never by reading this file.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-controlplane
  namespace: cattle-system
spec:
  # Pinned, never a channel. Upgrading Talos requires a Factory image whose
  # schematic matches the extensions below, and a channel would move the version
  # without anyone regenerating that schematic.
  version: v1.13.9
  exclusive: true
  # A Talos upgrade reboots the node. On the 1-node profile that is a full
  # cluster outage for the duration, so it happens inside a window rather than
  # whenever a version pin changes.
  #
  # Daily, not weekly. The window is an opportunity, not a schedule: SUC only
  # acts when a node's running version differs from the `version` pin above, so
  # a daily window means a merged version bump is picked up the next night
  # instead of waiting up to seven days. On every other night it is a no-op.
  #
  # timeZone is UTC deliberately. Every CronJob in this cluster schedules in UTC
  # (none sets spec.timeZone), and the previous Europe/Berlin window drifted an
  # hour against all of them twice a year at the DST boundaries -- so a window
  # picked to sit between two backup jobs quietly stopped doing that for half
  # the year.
  #
  # 02:00-04:00 was requested. It is worth being honest that it does not avoid
  # the backup jobs the way the old Sunday-evening window did:
  #
  #   02:00  longhorn snapshot            <- collides at the window boundary
  #   02:17  seaweedfs filer dump         (hourly at :17)
  #   02:25  volume backup policy         (hourly at :25)
  #   02:40  immich postgres dump
  #   02:45  paperless sqlite dump
  #   02:50  keycloak postgres dump
  #   03:00  weekly backup tier (Sundays)
  #
  # A daily window cannot avoid all of these -- three of them run hourly, so no
  # daily two-hour slot is ever clear. The exposure is bounded by how rarely
  # this actually fires: only on the night after a Talos version bump merges. If
  # a reboot does land mid-dump, the artefact is partial and backup-restore-test
  # at 07:00 is what catches it.
  window:
    days: ["su", "mo", "tu", "we", "th", "fr", "sa"]
    startTime: "02:00"
    endTime: "04:00"
    timeZone: UTC
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  secrets:
    # Mounted into the upgrade Job, which the controller creates in its own
    # namespace -- so this Secret must exist in cattle-system too.
    - name: talos-credentials
      path: /var/run/secrets/talos
  cordon: true
  upgrade:
    image: ghcr.io/siderolabs/talosctl:v1.13.9
    command:
      - /bin/sh
      - -c
      - |
        # The Factory installer, NOT ghcr.io/siderolabs/installer.
        #
        # This node runs an Image Factory build carrying siderolabs/iscsi-tools
        # and siderolabs/util-linux-tools, both required by Longhorn V1. Talos is
        # immutable and extensions exist only inside the installer image, so
        # upgrading through the stock installer silently drops both and Longhorn
        # loses iSCSI attach on the next boot. The plan used to name the stock
        # image; it never ran, which is the only reason that was never discovered
        # the hard way.
        #
        # The schematic ID must match talos-machineconfigs/schematic.yaml and the
        # installer pin in controlplane.yaml. Regenerate it whenever the
        # extension list changes:
        #   curl -X POST --data-binary @schematic.yaml https://factory.talos.dev/schematics
        talosctl upgrade \
          --talosconfig /var/run/secrets/talos/talosconfig \
          --nodes "${SYSTEM_UPGRADE_NODE_IP}" \
          --image "factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:${SYSTEM_UPGRADE_PLAN_LATEST_VERSION}" \
          --preserve=true \
          --wait=true
