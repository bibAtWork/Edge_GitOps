# Automated Talos upgrade for worker nodes.
#
# Runs after the control-plane plan. On the 1-node profile this selects zero
# nodes and is a no-op; it exists so the 3-node profile needs no new manifest.
#
# Lives in cattle-system for the same reason as the control-plane plan -- see the
# note there.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-worker
  namespace: cattle-system
spec:
  # Pinned to match the control-plane plan, talos-image.env and the installer in
  # controlplane.yaml.
  #
  # This was `channel: .../releases/latest`, which is wrong here in two ways. It
  # would upgrade workers to whatever Talos ships next, while the repo's stated
  # policy is that Talos is never auto-merged because a human has to regenerate
  # the Factory schematic first -- and a schematic is built per version, so a
  # channel move can land on an image whose extensions were never rebuilt. It
  # also resolved through the unauthenticated GitHub API, which is rate-limited
  # and has already caused flakiness elsewhere in this repo.
  version: v1.13.9
  exclusive: true
  # Two hours after the control-plane window, so workers only start once the
  # control plane is back. `exclusive: true` on both plans keeps SUC to one
  # upgrade at a time regardless, but the offset means a worker never waits on a
  # control plane that is still rebooting.
  #
  # Daily and UTC, tracking the control-plane plan -- see the longer note there
  # for why the timezone changed and which backup jobs this window overlaps.
  window:
    days: ["su", "mo", "tu", "we", "th", "fr", "sa"]
    startTime: "04:00"
    endTime: "06:00"
    timeZone: UTC
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  secrets:
    - name: talos-credentials
      path: /var/run/secrets/talos
  cordon: true
  prepare:
    image: ghcr.io/siderolabs/talosctl:v1.13.9
    command:
      - /bin/sh
      - -c
      - |
        talosctl version \
          --talosconfig /var/run/secrets/talos/talosconfig \
          --nodes "${SYSTEM_UPGRADE_NODE_IP}"
  upgrade:
    image: ghcr.io/siderolabs/talosctl:v1.13.9
    command:
      - /bin/sh
      - -c
      - |
        # Factory installer, not the stock one -- workers need the same
        # iscsi-tools and util-linux-tools extensions as the control plane,
        # because Longhorn schedules replicas on them. See the control-plane
        # plan for the full reasoning.
        talosctl upgrade \
          --talosconfig /var/run/secrets/talos/talosconfig \
          --nodes "${SYSTEM_UPGRADE_NODE_IP}" \
          --image "factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:${SYSTEM_UPGRADE_PLAN_LATEST_VERSION}" \
          --preserve=true \
          --wait=true
