# On-demand Talos upgrade, triggered by labelling a node.
#
# ── What this is for ─────────────────────────────────────────────────────────
# talos-controlplane-upgrade.yaml and talos-worker-upgrade.yaml both carry a
# window, so they can only act on Sunday evening. That is the right default for
# an unattended reboot, and the wrong one when you actually want the upgrade
# now: to verify the mechanism works, or because an advisory landed and waiting
# until Sunday is not acceptable.
#
# The alternative people reach for -- suspending Flux and hand-editing a Plan --
# is a workaround, not a mechanism. It drifts from git, it is easy to leave
# half-undone, and it does not exercise the same code path the scheduled
# upgrade uses. This Plan is that same path, with the window removed and a
# deliberate trigger in its place.
#
# ── How to use it ────────────────────────────────────────────────────────────
#   kubectl label node <node> talos.homelab/upgrade-now=""     # arm and run
#   kubectl label node <node> talos.homelab/upgrade-now-       # disarm
#
# Watch it with:
#   kubectl get jobs -n cattle-system -w
#   kubectl logs -n cattle-system -l upgrade.cattle.io/plan=talos-on-demand -f
#
# ── Why it cannot install the wrong thing ────────────────────────────────────
# `version` is the same pin as the scheduled Plans, and Renovate's managers key
# on any .yaml in this directory, so all three files move together in one
# grouped PR. Triggering this therefore performs exactly the upgrade Sunday
# would have performed -- just now. Pointing it at some other version means
# editing this file and going through review, which is deliberate.
#
# `exclusive: true` matches the scheduled Plans, so SUC will never run this
# concurrently with them.
#
# ── The one footgun ──────────────────────────────────────────────────────────
# REMOVE THE LABEL WHEN YOU ARE DONE. This Plan has no window, so a node left
# labelled will take the *next* version bump the moment Renovate's grouped PR
# merges, instead of waiting for Sunday. That is simultaneously the point of
# the label and the risk of forgetting it. It is inert while no node carries
# it, which is the state this repo ships in.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-on-demand
  namespace: cattle-system
spec:
  version: v1.13.9
  exclusive: true
  # Without this, SUC applies the Plan to at most ZERO nodes.
  #
  # The CRD defines no default for concurrency, so an unset field is 0, and
  # "the maximum number of concurrent nodes to apply this update on" is
  # therefore none. The Plan then reports Complete=True because there is
  # genuinely nothing left to do, creates no Job, and logs nothing -- which is
  # exactly the state all three Plans sat in for this cluster's entire life
  # while the node stayed on an old Talos release.
  #
  # Upstream's own examples all set it. Nothing about a missing field surfaces
  # as an error: the Plan validates, resolves its version, and reports success.
  concurrency: 1
  # Required by system-upgrade-controller to run the upgrade pod, and absent
  # from every Plan here until now. Upstream's own examples all set it.
  #
  # Adding it did NOT by itself make SUC act, so it is a necessary fix rather
  # than the whole story. The open problem is recorded in docs/backlog.md:
  # zero Job events have ever been recorded in cattle-system, for any of the
  # three Plans, across the cluster's entire life -- while every status field
  # reads Validated=True, LatestResolved=True, Complete=True. A Plan can be
  # completely valid and still never do anything, which is why the node sat on
  # v1.13.6 against a v1.13.9 pin with nothing indicating a problem.
  serviceAccountName: system-upgrade-controller
  # No `window` -- that is the entire difference from the scheduled Plans.
  nodeSelector:
    matchExpressions:
      - key: talos.homelab/upgrade-now
        operator: Exists
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - operator: Exists
  secrets:
    - name: talos-credentials
      path: /var/run/secrets/talos
  cordon: true
  upgrade:
    image: ghcr.io/siderolabs/talosctl:v1.13.9
    # No `command:`. The image's entrypoint is /talosctl and it contains no
    # shell -- confirmed from the image config on ghcr.io: Entrypoint
    # ["/talosctl"], Cmd null. The previous `command: [/bin/sh, -c, ...]` could
    # never have run:
    #
    #   exec: "/bin/sh": stat /bin/sh: no such file or directory
    #
    # That went unnoticed because concurrency: 0 meant no Job was ever created
    # to fail. Two independent faults, the first hiding the second.
    envs:
      # talosctl needs the node's Talos API address, and SUC does not provide
      # one. It injects SYSTEM_UPGRADE_NODE_NAME, POD_NAME, POD_UID, PLAN_NAME,
      # PLAN_LATEST_HASH and PLAN_LATEST_VERSION -- there is no
      # SYSTEM_UPGRADE_NODE_IP, which is what the old command interpolated. It
      # would have expanded to an empty string even with a shell present.
      #
      # status.hostIP is the node this Job was scheduled onto, so each node
      # upgrades itself rather than whatever the talosconfig happens to name.
      # That matters the moment there is more than one node.
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    args:
      # Global flags precede the subcommand; $(VAR) is expanded by Kubernetes
      # from the container's own env, which is why NODE_IP above is required.
      - --talosconfig=/var/run/secrets/talos/talosconfig
      - --nodes=$(NODE_IP)
      - upgrade
      # The Factory installer, NOT ghcr.io/siderolabs/installer.
      #
      # This node runs an Image Factory build carrying siderolabs/iscsi-tools
      # and siderolabs/util-linux-tools, both required by Longhorn V1. Talos is
      # immutable and extensions exist only inside the installer image, so
      # upgrading through the stock installer silently drops both and Longhorn
      # loses iSCSI attach on the next boot.
      #
      # The schematic ID must match talos-machineconfigs/schematic.yaml and the
      # installer pin in controlplane.yaml.
      - --image=factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:$(SYSTEM_UPGRADE_PLAN_LATEST_VERSION)
      - --preserve=true
      - --wait=true
