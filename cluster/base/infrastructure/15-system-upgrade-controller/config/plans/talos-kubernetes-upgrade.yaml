# Automated Kubernetes version upgrade, independent of the Talos OS upgrade.
#
# ── Why this is a separate Plan, not folded into the OS upgrade ─────────────
# Talos bundles a default Kubernetes version per release, but `talosctl
# upgrade-k8s` lets that move on its own schedule. Coupling the two silently
# would mean nobody can bump Kubernetes without also rebooting every node for
# a Talos OS change, or vice versa -- so ../versions.env tracks
# KUBERNETES_VERSION as its own field, Renovate watches it as its own grouped
# PR, and this Plan applies it as its own upgrade.
#
# ── Why this matches every control-plane node, not one dedicated node ───────
# `upgrade-k8s` is not a per-node operation: pointed at any one control-plane
# node's Talos API, it orchestrates the rolling upgrade of every control-plane
# and worker component in the cluster itself -- staged, health-checked, one
# node at a time -- via the Talos API, not via Kubernetes scheduling. An
# earlier version of this Plan tried to get "run exactly once" out of that by
# matching a dedicated `talos.homelab/k8s-upgrade-runner` label placed by hand
# on a single node. That is exactly the shape of failure this repo already
# hit once with `concurrency` (bug#376): a static precondition nothing
# reconciles, with no error anywhere if it silently stops holding -- if that
# one labelled node is ever drained, replaced, or simply down when the window
# opens, the Plan matches zero nodes, reports Complete=True because there is
# genuinely nothing to do, and the Kubernetes version quietly stops moving
# with no signal that anything is wrong.
#
# So this instead matches every control-plane node, same selector as the OS
# control-plane Plan. `concurrency: 1` + `exclusive: true` still serialise SUC
# to one Job at a time for this Plan, so on a 3-node control plane it runs
# `upgrade-k8s` up to three times in sequence rather than once -- each run
# after the first is expected to be a fast no-op, since upgrade-k8s diffs the
# running component versions against the target and only touches what
# differs. That reasoning is documented Talos behaviour, not something
# verified against a live multi-control-plane cluster here (this repo runs
# single-node today, where it only ever matches one node regardless). Worth
# confirming empirically the day this cluster actually runs 3-node.
#
# cordon is deliberately NOT set, unlike the OS Plans: upgrade-k8s does not
# reboot the node the Job pod happens to land on -- the reboot-worthy
# disruption (if any) happens to the cluster's control-plane components via
# the Talos API, not to this node's own workloads, so there is nothing here
# that needs evacuating first.
apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: talos-kubernetes
  namespace: cattle-system
spec:
  # Overwritten at build time from ../versions.env's KUBERNETES_VERSION -- edit
  # that file, not this field. Note this is the Kubernetes version, not the
  # Talos version; the talosctl tool image below still tracks TALOS_VERSION,
  # since talosctl is what runs the upgrade regardless of what it upgrades.
  version: v1.32.3
  exclusive: true
  concurrency: 1
  serviceAccountName: system-upgrade-controller
  # Sunday, starting the instant the worker OS window closes -- last in the
  # sequence: control-plane (12:00-14:00), worker (14:00-16:00), then this
  # (16:00-17:00).
  #
  # This Plan and the OS windows have moved three times. Originally
  # control-plane and worker ran 20:00-23:59 with this Plan at 23:00-23:59 --
  # which round 3 code review found was fully NESTED inside the worker
  # window (22:00-23:59), not after it: both Plans are exclusive:true, so a
  # worker OS upgrade still in flight at 23:00 held SUC's one exclusive slot
  # for the rest of the window, and this Plan silently got no turn that week
  # -- an exclusive Plan that never runs is not an error condition. With no
  # room to move later (23:59 was the last minute of the day), it was moved
  # BEFORE the OS windows instead, on the reasoning that Talos-OS-vs-
  # Kubernetes ordering is not load-bearing (the two are decoupled by
  # design) and running the non-disruptive change (upgrade-k8s does not
  # reboot anything) ahead of the reboot-heavy OS cycle is a defensible
  # default.
  #
  # Moved again, to run after both OS windows as originally intended: the
  # whole Sunday sequence shifted from evening to midday (see the
  # control-plane Plan's note on why noon still clears every backup job),
  # which freed enough room in the day that this no longer needs to compete
  # with the OS windows for the same few hours before midnight.
  #
  # Moved a third time -- briefly -- to add a 30-minute buffer before it,
  # on a round 5 finding that a worker Job overrunning past 16:00 could hold
  # SUC's one exclusive slot into this window and delay it. Round 6 traced
  # `exclusive: true` to its actual implementation
  # (pkg/upgrade/job/job.go in rancher/system-upgrade-controller): it compiles
  # to a pod anti-affinity term with `TopologyKey: kubernetes.io/hostname`,
  # which blocks two exclusive Jobs' pods from landing on the SAME node --
  # not a cluster-wide mutex or "slot" that one Plan's overrun can hold
  # against another's. A worker Job already running is unaffected by this
  # window closing (SUC does not kill in-flight Jobs when a window ends),
  # and this Plan's own Job would only ever contend with a worker Job still
  # occupying the exact node it lands on, which clears itself the moment
  # that pod finishes -- there is no scenario here where the buffer
  # prevented a real failure. Reverted back to starting immediately when the
  # worker window closes.
  window:
    days: ["su"]
    startTime: "16:00"
    endTime: "17:00"
    timeZone: UTC
  # Requires the pre-upgrade backup gate.
  #
  # upgrade-backup-gate (11:00 Sunday, longhorn-system) proves the Longhorn
  # backups are recent AND that every SeaweedFS backup object actually reads,
  # then sets this label. It removes it whenever it cannot establish both, so
  # an absent label means "not proven this week", never "not checked".
  #
  # Fails closed by construction: no label, no matching node, no upgrade. That
  # is the intended behaviour on a single-node cluster that reboots to apply
  # this -- a missed window costs a week, an upgrade with no working backup can
  # cost the cluster. "There is a backup" was true for four days here while 584
  # backup objects were unreadable, which is why the gate reads them rather
  # than counting them.
  #
  # The manual override is talos-on-demand, which is label-triggered and
  # deliberately NOT gated -- see that file.
  # Requires talos.homelab/talos-version-ready in addition to
  # talos.homelab/upgrade-ready.
  #
  # upgrade-ready proves the backups are good; it says nothing about whether
  # Talos itself reached its target version. The three scheduled Plans are
  # independently time-windowed (12:00/14:00/16:00) with no dependency between
  # them -- confirmed against the Plan CRD directly, which has no such field --
  # so without this, talos-kubernetes would attempt to run at 16:00 regardless
  # of whether the Talos leg succeeded, failed, or never finished.
  #
  # talos-version-gate sets this label at 15:55, after both Talos-affecting
  # windows have had their full span, by checking status.nodeInfo.osImage
  # against the same TALOS_VERSION this repo declares. It reads the same
  # either way Talos can legitimately already be correct: a successful
  # controlplane upgrade brought it there, or it was already there and that
  # Plan had nothing to do -- both leave running equal to desired, which is
  # the only fact this checks.
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: ""
      talos.homelab/upgrade-ready: "true"
      talos.homelab/talos-version-ready: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  secrets:
    - name: talos-credentials
      path: /var/run/secrets/talos
  upgrade:
    # Tag overwritten at build time from ../versions.env's TALOS_VERSION -- the
    # talosctl tool version, not the Kubernetes target (spec.version above).
    image: ghcr.io/siderolabs/talosctl:v1.13.9
    # No `command:` -- same reasoning as the OS Plans: this image's entrypoint
    # is /talosctl and it has no shell.
    envs:
      - name: NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
    args:
      - --talosconfig=/var/run/secrets/talos/talosconfig
      - --nodes=$(NODE_IP)
      - upgrade-k8s
      # SYSTEM_UPGRADE_PLAN_LATEST_VERSION resolves from spec.version above,
      # i.e. KUBERNETES_VERSION -- upgrade-k8s takes the Kubernetes version
      # directly, with no installer image or schematic involved at all.
      - --to=$(SYSTEM_UPGRADE_PLAN_LATEST_VERSION)
