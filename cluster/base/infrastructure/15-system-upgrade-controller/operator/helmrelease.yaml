apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: system-upgrade-controller
  namespace: system-upgrade
spec:
  interval: 30m
  chart:
    spec:
      chart: system-upgrade-controller
      # Reads as a downgrade from 110.0.0 and is not one: 110.0.0 has been
      # WITHDRAWN from https://rancher.github.io/charts. The index carries 17
      # versions and the newest is 109.0.2. Do not "restore" the higher number.
      #
      # 110.0.0 was published once -- Helm history shows it applied as .v3 --
      # and pulled afterwards. Flux kept the cached artifact, so the controller
      # kept running and nothing looked wrong, while the HelmChart sat Stalled:
      #
      #   no 'system-upgrade-controller' chart with version matching '110.0.0'
      #
      # A stalled chart cannot re-render, so every change to this HelmRelease
      # was silently inert -- values, postRenderers, all of it applied to the
      # object and never reached the cluster. Found while adding a job-deadline
      # patch that rendered correctly, applied cleanly, and changed nothing.
      #
      # It also meant this component could not be reinstalled from its own
      # source: had that cache been evicted, the controller responsible for
      # upgrading the cluster would have been unrecoverable from git.
      #
      # The cost is real and accepted: 109.0.2 ships appVersion v0.19.1 against
      # the v0.20.1 currently running, so the controller itself moves back one
      # minor. A component that cannot be rebuilt from its declared source is
      # not under GitOps control at all, which is the worse of the two.
      version: 109.0.2
      sourceRef:
        kind: HelmRepository
        name: rancher
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    global:
      cattle:
        systemDefaultRegistry: ""
  # The chart writes its controller settings into a ConfigMap consumed via
  # envFrom, and exposes no values for them, so they are patched post-render --
  # the same approach 05-cilium and 07-velero use for chart fields with no
  # values path.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ConfigMap
              name: system-upgrade-controller-config
            patch: |
              apiVersion: v1
              kind: ConfigMap
              metadata:
                name: system-upgrade-controller-config
              data:
                # 900s (the chart default) is not enough once a Plan does more
                # than call talosctl.
                #
                # The deadline covers the WHOLE Job, prepare included. A Plan
                # that verifies backups before upgrading spends most of its
                # budget before the upgrade starts: the restore-test needs
                # ~3 min for this cluster's four real volumes, a Longhorn
                # backup round is ~40s, and `talosctl upgrade --wait=true`
                # holds through a reboot for 10-15 min. That is ~25 min of
                # real work against a 15-minute deadline.
                #
                # 2700s is that estimate plus ~80%. Erring long is the correct
                # direction: overshooting means a stuck upgrade holds a
                # cordoned node for longer, while undershooting means the Job
                # is killed MID-UPGRADE -- on a single-node cluster, during a
                # reboot, which is how a node is left unbootable.
                SYSTEM_UPGRADE_JOB_ACTIVE_DEADLINE_SECONDS: "2700"
                # Was 900. A Job that ran overnight was deleted fifteen minutes
                # after finishing, taking its pod and logs with it -- so the
                # only record of why an unattended upgrade failed was gone by
                # morning. This cluster has already lost the logs of two failed
                # runs that way. 24h keeps a failed overnight upgrade
                # inspectable at breakfast; successful Jobs are equally cheap
                # to keep at this volume (one Plan fires per week at most).
                SYSTEM_UPGRADE_JOB_TTL_SECONDS_AFTER_FINISH: "86400"
                # Chart default is 99, and until now this was never overridden.
                # backoffLimit bounds retries of the JOB, not of talosctl's own
                # internal waits, so 99 never meant "99 genuine attempts" -- it
                # meant nothing stopped a systemically broken upgrade from
                # retrying dozens of times before ACTIVE_DEADLINE_SECONDS cut
                # it off. That is exactly what happened 2026-09-03: the
                # --drain=true default cascaded into a cluster-wide admission
                # outage (Kyverno's webhook fails closed), and the Job retried
                # 14 times -- each retry re-running the same cordon+evict+
                # outage cycle -- before it was caught and stopped by hand.
                #
                # The one genuine transient seen so far (a kube-scheduler
                # config-propagation timeout during the Kubernetes leg of the
                # 2026-09-04 rehearsal) needed exactly one retry. 5 gives that
                # several times over while still failing fast enough that a
                # systemically broken upgrade surfaces as a failed Job -- and
                # trips StuckUpgradeJob (04-grafana/helmrelease.yaml) -- well
                # before it can repeat a costly failure mode 14 times over.
                SYSTEM_UPGRADE_JOB_BACKOFF_LIMIT: "5"
