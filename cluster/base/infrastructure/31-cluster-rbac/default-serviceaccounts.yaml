# Stop the `default` ServiceAccount handing out an API token nobody asked for.
#
# Kubernetes creates a `default` ServiceAccount in every namespace and mounts
# its token into any pod that does not name a ServiceAccount of its own. That
# is a credential granted by omission: a workload gets cluster API access
# because nobody said it should not, and the pod spec gives no hint that it
# happened.
#
# Six pods run on a `default` SA with a token mounted. Three are Talos-managed
# static pods in kube-system and are not ours. The others are ordinary
# workloads that never call the API:
#
#   paperless/paperless-ngx      an internet-adjacent document processor with a
#                                large parsing surface -- the most exposed
#                                application in the cluster, holding a valid
#                                API credential it has no use for
#   paperless/paperless-valkey   a cache
#   monitoring/otel-collector-gateway
#
# Setting automountServiceAccountToken: false on the namespace's `default` SA
# closes it for every current AND future pod that forgets to specify one, which
# is the case worth defending against -- a pod that names its own SA has had
# the thought.
#
# These objects already exist; Kubernetes creates them. Declaring them here
# does not create anything, it takes ownership of one field so Flux can hold it.
# A workload that genuinely needs API access is unaffected: it names its own
# ServiceAccount, and this changes nothing about that.
#
# monitoring is deliberately NOT included. otel-collector-gateway runs on the
# default SA there and does need to be looked at, but that namespace also holds
# the VictoriaMetrics operator and its CRs, several of which do use the default
# SA legitimately. Narrowing it is a separate change with its own verification.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: paperless
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: immich
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: zot
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: security
automountServiceAccountToken: false
