# Credential the ADR-005 reconciler uses to read Inventory and tag objects for
# pruning (Task 11).
#
# GENERATED by scripts/make-relay-credential.sh. Re-run it after rotating the
# key rather than editing this file.
#
# This identity can read Inventory reports, list the bucket, and write exactly
# one tag key -- lifecycle -- on the two data prefixes. It holds no delete verb
# of any kind. The tag is what a Lifecycle rule acts on, so the deletion is
# performed by AWS itself and no cluster credential ever needs the permission.
#
# The tagging grant is condition-limited to that single key. Without the
# condition this credential could write arbitrary tags and so satisfy any future
# tag-filtered rule, which would quietly widen its blast radius every time
# someone added one.
