# Single source of truth for every backup schedule and retention count in the
# cluster (ADR-005 Task 2).
#
# ADR-005 requires these be configuration rather than manifest literals, so that
# tuning retention never means editing a workload. Two mechanisms carry them:
#
#   - Structural fields (a RecurringJob's cron/retain, a CronJob's schedule) are
#     injected at build time by the Kustomize `replacements` block in
#     kustomization.yaml. Kustomize resolves them locally, within this directory.
#   - Values read by job scripts arrive at runtime via `envFrom`, so a change
#     takes effect on the next run with no rebuild.
#
# Flux's postBuild.substituteFrom would have been the obvious alternative and is
# deliberately NOT used. This repo has a single cluster-wide Flux Kustomization,
# and postBuild substitutes across everything it renders -- including the eight
# existing manifests whose shell scripts contain ${VAR}. It would silently blank
# ${SIZE} in the filer dump guard, which is the check that stops a truncated dump
# being uploaded as if it were good. A retention knob is not worth breaking the
# integrity guards to get.
#
# Schedules are ordered so each stage sees the previous one's output:
# backups (02-04) -> relay (05) -> restore-test (07) -> reconcile (09).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-retention-config
  namespace: longhorn-system
data:
  # Longhorn snapshots: same-disk, cheap, fine-grained rollback. Chains are kept
  # short on purpose -- snapshots live on the replica disk, and a long chain
  # costs both space and read performance.
  snapshot_cron: "0 2 * * *"
  snapshot_retain: "7"

  # Longhorn backups to the local SeaweedFS target. The tiers deduplicate against
  # each other, so 11 retained backups cost far less than 11 full copies.
  backup_weekly_cron: "0 3 * * 0"
  backup_weekly_retain: "5"
  backup_monthly_cron: "0 4 1 * *"
  backup_monthly_retain: "6"

  # SeaweedFS live-bucket staging (distinct from the Longhorn backup target).
  #
  # 03:00, NOT 01:00, and the ordering against the database dumps is the whole
  # point. The dumps run at 02:40 (immich), 02:45 (paperless) and 02:50
  # (keycloak); the relay copies these buckets from the STAGED snapshot rather
  # than live, so a dump only reaches the vault via a staging pass that ran
  # after it.
  #
  # Staging at 01:00 ran BEFORE every one of them. A dump written at 02:40 was
  # therefore not staged until 01:00 the following day and not relayed until
  # 05:00 the following day -- roughly 26 hours of existing only on the same
  # SeaweedFS that the vault exists to insure against.
  #
  # That window is not theoretical. immich-20260826T024002Z.sql.gz was written
  # at 02:40 on 2026-08-26, destroyed by the incident hours later, and had
  # never been relayed: the repair pass found it unreadable locally with no
  # offsite copy to restore from. It is the one object from that incident that
  # is permanently gone, and it was lost to this ordering rather than to the
  # incident itself.
  #
  # 03:00 is ten minutes after the last dump, which cuts the exposure for the
  # most valuable artefacts in the cluster from ~26h to ~2h20m.
  seaweed_staging_cron: "0 3 * * *"
  seaweed_staging_retain: "14"

  # Left at 05:00 deliberately. It is late enough to follow the 03:00 staging
  # pass with two hours of margin, and it still precedes nothing that needs it
  # earlier -- while moving it earlier would push it in front of the 04:00
  # monthly Longhorn backup on the 1st, which the relay copies directly from
  # the live backupstore rather than from staging. Pulling the relay forward to
  # shave the remaining ~2h off the dumps would cost a full month of exposure
  # on the monthly tier, which is the worse trade.
  relay_cron: "0 5 * * *"
  restore_test_cron: "0 7 * * *"
  reconcile_cron: "0 9 * * *"
  remote_probe_cron: "0 6 1 * *"

  # An object must be absent locally this long before the reconciler will tag it
  # prunable. The cap is a circuit breaker: a large eligible set means the diff
  # or local storage is broken, never that pruning should be aggressive.
  prune_grace_days: "14"
  prune_tag_cap: "5000"
