apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - retention-config.yaml
  - longhorn-recurring-jobs.yaml
  - longhorn-backup-target.yaml
  - longhorn-backup-credential.yaml
  - seaweedfs-staging.yaml
  - backup-relay.yaml
  - backup-relay-credential.yaml
  - networkpolicy.yaml
  - restore-test-rbac.yaml
  - restore-test-script.yaml
  - restore-test-cronjob.yaml
  - reconciler-script.yaml
  - reconciler-cronjob.yaml
  - remote-probe-script.yaml
  - remote-probe-cronjob.yaml
  - volume-backup-policy.yaml
  - backup-auditor-credential.yaml

# Schedules and retain counts are injected from backup-retention-config so the
# manifests above hold no retention literals (ADR-005 Task 2). See the ConfigMap
# for why Flux postBuild.substituteFrom is not used instead.
replacements:
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.snapshot_cron}
    targets:
      - select: {kind: RecurringJob, name: snapshot}
        fieldPaths: [spec.cron]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.snapshot_retain}
    targets:
      - select: {kind: RecurringJob, name: snapshot}
        fieldPaths: [spec.retain]
        options: {create: true}
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.backup_weekly_cron}
    targets:
      - select: {kind: RecurringJob, name: backup-weekly}
        fieldPaths: [spec.cron]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.backup_weekly_retain}
    targets:
      - select: {kind: RecurringJob, name: backup-weekly}
        fieldPaths: [spec.retain]
        options: {create: true}
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.backup_monthly_cron}
    targets:
      - select: {kind: RecurringJob, name: backup-monthly}
        fieldPaths: [spec.cron]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.backup_monthly_retain}
    targets:
      - select: {kind: RecurringJob, name: backup-monthly}
        fieldPaths: [spec.retain]
        options: {create: true}
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.seaweed_staging_cron}
    targets:
      - select: {kind: CronJob, name: seaweedfs-staging}
        fieldPaths: [spec.schedule]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.relay_cron}
    targets:
      - select: {kind: CronJob, name: backup-relay}
        fieldPaths: [spec.schedule]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.restore_test_cron}
    targets:
      - select: {kind: CronJob, name: backup-restore-test}
        fieldPaths: [spec.schedule]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.reconcile_cron}
    targets:
      - select: {kind: CronJob, name: backup-reconciler}
        fieldPaths: [spec.schedule]
  - source: {kind: ConfigMap, name: backup-retention-config, fieldPath: data.remote_probe_cron}
    targets:
      - select: {kind: CronJob, name: backup-remote-probe}
        fieldPaths: [spec.schedule]
