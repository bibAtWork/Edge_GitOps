# The local restore-test script (ADR-005 Task 10), held in a ConfigMap rather
# than inline in the CronJob.
#
# Two reasons. It is long enough that a YAML block scalar becomes hard to review,
# and every backslash in it -- awk field separators, printf formats, find
# patterns -- is one more chance for the escaping to be silently wrong in a way
# no validator catches. Three separate defects in the relay came from exactly
# that, and each one reported success while doing nothing.
#
# Mounted read-only and executed by restore-test-cronjob.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-restore-test-script
  namespace: longhorn-system
data:
  restore-test.sh: |
    #!/bin/sh
    # Restores real backups and reads them back. Everything here is local: the
    # Longhorn backups live on the in-cluster SeaweedFS target and the staged
    # SeaweedFS copy is on a Longhorn PVC, so this costs no AWS egress. That is
    # exactly the property the two-stage architecture exists to buy.
    set -u

    NOW="$(date -u +%s)"
    STAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    LH_TESTED=0
    LH_SKIPPED=0
    FAILURES=""

    log()  { echo "[$(date -u +%H:%M:%S)] $*"; }
    fail() { FAILURES="${FAILURES}${1}; "; log "FAIL: $1"; }

    # No package installation. The image carries kubectl, which is now the only
    # tool this pod needs -- dropping the SeaweedFS half took aws-cli, gzip and
    # sqlite with it.
    #
    # That is not tidiness. `apk add` writes new executables into a running
    # container and executes them, which is exactly what Falco's "Executing
    # binary not part of base image" rule exists to catch, at Critical. This job
    # runs daily, so it produced a Critical every day -- steadily teaching
    # everyone to ignore the one channel that would report an actual container
    # compromise. An alert that fires on normal operation is not a detection,
    # and the right fix is to stop doing the suspicious thing rather than to
    # tell Falco to look away.
    #
    # It also drops a dependency on the alpine mirrors being reachable at the
    # moment a backup is being verified.
    command -v kubectl >/dev/null 2>&1 || {
      echo "FATAL: kubectl is missing from the image" >&2
      exit 1
    }

    # ------------------------------------------------------------------
    # Longhorn: volume-level, every volume, never sampled.
    #
    # A block device's integrity is not meaningfully assessed by sampling files
    # inside it. A corrupt superblock or a truncated replica appears nowhere in
    # a file listing, so each volume that has a backup is restored in full.
    # ------------------------------------------------------------------
    # Sweep scratch left by a previous run before starting. Per-volume cleanup at
    # the end of each iteration is not enough on its own: a crash, an OOM, or a
    # failed delete strands a restored volume, and a stranded volume consumes the
    # same Longhorn provisioning budget the real volumes need. Observed on the
    # first live run, which left rt-e4b652ebd5 behind. Sweeping at the start is
    # more reliable than trying to make every exit path clean up after itself.
    # Enumerate scratch across ALL FOUR kinds, not just Longhorn volumes.
    #
    # The names are deterministic and the four objects are created together, but
    # they do not necessarily DIE together: deleting the Longhorn volume alone
    # leaves the PV, PVC and pod behind, and a sweep that lists only volumes
    # then finds nothing to sweep, waits for nothing, and walks straight into a
    # name collision on the create.
    #
    # Seen on 2026-08-31, caused by a hand-deletion of exactly that one object.
    # The run reported "could not create the PV/PVC pair" and then reported the
    # volume OK anyway, because it went on to read a verify pod left by the
    # PREVIOUS run -- a stale pass presented as a fresh one, which is worse than
    # the failure it replaced.
    # The pattern is ANCHORED to rt- plus exactly ten hex characters, which is
    # what RT is built from ("rt-" + the first 10 chars of an md5). A bare
    # grep "/rt-" looks equivalent and is not: it also matches this job's own
    # pods whenever the Job is named rt-something, and the sweep then deletes
    # the pod it is running in. Done twice on 2026-08-31 -- once in the wait
    # loop, fixed, and then reintroduced here when the sweep was broadened from
    # volumes to all four kinds. The scheduled Jobs are called
    # backup-restore-test-<n> and never collide, which is exactly what lets this
    # survive review and only fire for whoever runs it by hand.
    SWEPT=""
    for STALE in $( { kubectl get volumes.longhorn.io,pvc,pod -n longhorn-system -o name 2>/dev/null;
                      kubectl get pv -o name 2>/dev/null; } | grep -E "/rt-[0-9a-f]{10}$" || true); do
      N="${STALE##*/}"
      # The same name arrives once per kind; sweep it once.
      case " $SWEPT " in *" $N "*) continue;; esac
      SWEPT="$SWEPT $N"
      log "sweeping stale scratch $N"
      kubectl delete pod -n longhorn-system "$N" --wait=false >/dev/null 2>&1 || true
      kubectl delete pvc -n longhorn-system "$N" --wait=false >/dev/null 2>&1 || true
      kubectl delete pv "$N" --wait=false >/dev/null 2>&1 || true
      kubectl delete volumes.longhorn.io -n longhorn-system "$N" --wait=false >/dev/null 2>&1 || true
    done

    # Wait for the sweep to actually complete before recreating anything.
    #
    # The deletes above are deliberately --wait=false so a stuck Longhorn volume
    # cannot block the whole run. That makes them asynchronous, and the scratch
    # names are deterministic -- rt-<md5 of the backup volume> -- so the loop
    # below recreates the SAME names the sweep is still tearing down.
    #
    # Losing that race is silent. `kubectl create` fails with AlreadyExists,
    # every create here sends stderr to /dev/null, and the run continues against
    # whichever half-deleted objects survived: the verify pod binds a PVC that
    # is Terminating and stays Pending until the 450s poll gives up, reporting
    # `e2fsck rc=none` -- a restore failure for a backup that is perfectly fine.
    #
    # This is the intermittent failure seen on 2026-08-31, on the same
    # rt-e4b652ebd5 the comment above records from the first live run. It only
    # bites after a run that left scratch behind, which is why it looks random
    # and why it clusters after failures -- the worst possible time to start
    # reporting phantom restore failures.
    #
    # 300s is generous: a detached Longhorn volume goes in seconds, and the
    # budget only matters when something is genuinely stuck, in which case
    # saying so and carrying on is better than blocking the whole run.
    #
    # Waits on the EXACT names that were swept, never on a `grep "/rt-"` across
    # every pod. That shortcut looks equivalent and is not: this job's own pod
    # can match it. Caught while testing this fix -- a manual run named
    # rt-racefix-NNNN sat in the wait loop watching for itself to disappear
    # until the budget expired. The scheduled Jobs are named
    # backup-restore-test-<n> so they would not have collided, which is exactly
    # what makes it the kind of thing that survives review and fires later.
    LEFT=0
    if [ -n "$SWEPT" ]; then
      s=0
      while [ "$s" -lt 60 ]; do
        LEFT=0
        for N in $SWEPT; do
          kubectl get volumes.longhorn.io -n longhorn-system "$N" >/dev/null 2>&1 && LEFT=$(( LEFT + 1 ))
          kubectl get pvc -n longhorn-system "$N" >/dev/null 2>&1 && LEFT=$(( LEFT + 1 ))
          kubectl get pod -n longhorn-system "$N" >/dev/null 2>&1 && LEFT=$(( LEFT + 1 ))
          kubectl get pv "$N" >/dev/null 2>&1 && LEFT=$(( LEFT + 1 ))
        done
        [ "$LEFT" -eq 0 ] && break
        s=$(( s + 1 ))
        sleep 5
      done
    fi
    if [ "$LEFT" -ne 0 ]; then
      # Not fatal on its own -- the creates below now report their own failures --
      # but worth saying out loud, because a sweep that cannot finish means
      # Longhorn is still holding something.
      log "WARN: $LEFT scratch object(s) still present after 300s; name collisions are likely"
    fi
    
    DEADLINE=$(( NOW + LONGHORN_BUDGET_SECONDS ))

    # Written to a file and read by redirect, NOT piped into the loop. A pipe
    # puts the loop body in a subshell, so every counter it increments and every
    # failure it records is discarded when the loop ends -- the run would report
    # zero tested and zero failed, which reads exactly like a clean pass.
    kubectl get backupvolumes.longhorn.io -n longhorn-system -o custom-columns=A:.metadata.name,B:.status.lastBackupName --no-headers > /tmp/bvs 2>/dev/null

    while read -r BV LASTBACKUP; do
      [ -z "${BV:-}" ] && continue
      if [ -z "${LASTBACKUP:-}" ] || [ "$LASTBACKUP" = "<none>" ]; then
        log "skip $BV: no backups yet"
        continue
      fi

      if [ "$(date -u +%s)" -ge "$DEADLINE" ]; then
        # Logged, never silent. A capped run that still reports success reads as
        # full coverage, which is worse than an obviously partial one.
        log "BUDGET EXHAUSTED before $BV -- NOT verified this run"
        LH_SKIPPED=$(( LH_SKIPPED + 1 ))
        continue
      fi

      URL="$(kubectl get backups.longhorn.io -n longhorn-system "$LASTBACKUP" -o jsonpath='{.status.url}' 2>/dev/null)"
      SIZE="$(kubectl get backups.longhorn.io -n longhorn-system "$LASTBACKUP" -o jsonpath='{.status.volumeSize}' 2>/dev/null)"
      if [ -z "$URL" ] || [ -z "$SIZE" ]; then
        fail "$BV: backup $LASTBACKUP exposes no restore URL or size"
        continue
      fi

      RT="rt-$(echo "$BV" | md5sum | cut -c1-10)"
      log "restoring $BV from $LASTBACKUP into $RT"

      printf '%s\n' \
        "apiVersion: longhorn.io/v1beta2" \
        "kind: Volume" \
        "metadata:" \
        "  name: $RT" \
        "  namespace: longhorn-system" \
        "spec:" \
        "  fromBackup: \"$URL\"" \
        "  numberOfReplicas: 1" \
        "  size: \"$SIZE\"" \
        "  frontend: blockdev" \
        | kubectl create -f - >/dev/null 2>&1 || fail "$BV: could not create the restore volume (name collision with scratch still terminating, or the API rejected it)"

      # Wait for the restore to finish. restoreRequired flipping false is the
      # signal every block was fetched and checksummed, which is the part that
      # actually exercises the backup rather than the metadata around it.
      RESTORED=""
      i=0
      while [ "$i" -lt 120 ]; do
        ST="$(kubectl get volumes.longhorn.io -n longhorn-system "$RT" -o jsonpath='{.status.state}' 2>/dev/null)"
        RS="$(kubectl get volumes.longhorn.io -n longhorn-system "$RT" -o jsonpath='{.status.restoreRequired}' 2>/dev/null)"
        if [ "$ST" = "detached" ] && [ "$RS" != "true" ]; then
          RESTORED=yes
          break
        fi
        i=$(( i + 1 ))
        sleep 5
      done

      if [ -z "$RESTORED" ]; then
        fail "$BV: restore did not complete (state=${ST:-none})"
        kubectl delete volumes.longhorn.io -n longhorn-system "$RT" --wait=false >/dev/null 2>&1
        continue
      fi

      # Bound as a raw block device. Block mode rather than filesystem so e2fsck
      # reads the device directly -- a filesystem mount would have kubelet check
      # and possibly repair it first, destroying the evidence this test exists
      # to collect.
      printf '%s\n' \
        "apiVersion: v1" \
        "kind: PersistentVolume" \
        "metadata:" \
        "  name: $RT" \
        "spec:" \
        "  capacity:" \
        "    storage: $SIZE" \
        "  accessModes: [ReadWriteOnce]" \
        "  volumeMode: Block" \
        "  persistentVolumeReclaimPolicy: Delete" \
        "  storageClassName: longhorn-static" \
        "  csi:" \
        "    driver: driver.longhorn.io" \
        "    volumeHandle: $RT" \
        "    fsType: ext4" \
        "---" \
        "apiVersion: v1" \
        "kind: PersistentVolumeClaim" \
        "metadata:" \
        "  name: $RT" \
        "  namespace: longhorn-system" \
        "spec:" \
        "  accessModes: [ReadWriteOnce]" \
        "  volumeMode: Block" \
        "  storageClassName: longhorn-static" \
        "  volumeName: $RT" \
        "  resources:" \
        "    requests:" \
        "      storage: $SIZE" \
        | kubectl create -f - >/dev/null 2>&1 || { fail "$BV: could not create the PV/PVC pair (name collision with scratch still terminating, or the API rejected it)"; kubectl delete volumes.longhorn.io -n longhorn-system "$RT" --wait=false >/dev/null 2>&1; continue; }

      sed -e "s|RTNAME|$RT|g" /scripts/verify-pod.yaml.tmpl | kubectl create -f - >/dev/null 2>&1 || { fail "$BV: could not create the verify pod (name collision with scratch still terminating, or the API rejected it)"; kubectl delete pvc -n longhorn-system "$RT" --wait=false >/dev/null 2>&1; kubectl delete pv "$RT" --wait=false >/dev/null 2>&1; kubectl delete volumes.longhorn.io -n longhorn-system "$RT" --wait=false >/dev/null 2>&1; continue; }

      j=0
      while [ "$j" -lt 90 ]; do
        PH="$(kubectl get pod -n longhorn-system "$RT" -o jsonpath='{.status.phase}' 2>/dev/null)"
        if [ "$PH" = "Succeeded" ] || [ "$PH" = "Failed" ]; then
          break
        fi
        j=$(( j + 1 ))
        sleep 5
      done

      OUT="$(kubectl logs -n longhorn-system "$RT" 2>/dev/null)"
      echo "$OUT" | sed 's/^/      /'

      # e2fsck: 0 clean, 4 uncorrected errors. With -n nothing can be repaired,
      # so any non-zero result means the restored filesystem is damaged.
      RC="$(echo "$OUT" | sed -n 's/^e2fsck_rc=//p' | head -1)"
      MOUNTED="$(echo "$OUT" | sed -n 's/^mount_ok=//p' | head -1)"
      INTEG="$(echo "$OUT" | sed -n 's/^sqlite_integrity=//p' | head -1)"
      PGCTL="$(echo "$OUT" | sed -n 's/^pg_control=//p' | head -1)"

      if [ "${RC:-9}" != "0" ]; then
        fail "$BV: e2fsck rc=${RC:-none} on the restored volume"
      elif [ "${MOUNTED:-0}" != "1" ]; then
        fail "$BV: restored volume would not mount"
      elif [ -n "$INTEG" ] && [ "$INTEG" != "ok" ]; then
        fail "$BV: sqlite integrity_check said '$INTEG'"
      elif [ "${PGCTL:-}" = "MISSING" ]; then
        fail "$BV: postgres data directory has no pg_control"
      else
        LH_TESTED=$(( LH_TESTED + 1 ))
        log "OK $BV"
      fi

      kubectl delete pod -n longhorn-system "$RT" --wait=false >/dev/null 2>&1
      kubectl delete pvc -n longhorn-system "$RT" --wait=false >/dev/null 2>&1
      kubectl delete pv "$RT" --wait=false >/dev/null 2>&1
      kubectl delete volumes.longhorn.io -n longhorn-system "$RT" --wait=false >/dev/null 2>&1
    done < /tmp/bvs

      # ------------------------------------------------------------------
      # SeaweedFS object checking lives in backup-verify, not here.
      #
      # This job used to sample ~458 objects and compare each against the
      # staged snapshot. backup-verify now reads EVERY object daily and
      # checksums it against the offsite vault, which is strictly stronger:
      # full coverage instead of a sample, and compared against the copy that
      # would actually be restored from rather than against another local one.
      #
      # Removing it also removed this job's need for aws-cli, gzip and sqlite,
      # which is what let the whole thing stop installing packages at runtime.
      # See the image note at the top of restore-test-cronjob.yaml.
      #
      # The sampling maths is not lost, only unnecessary: n = ln(1-confidence)
      # / ln(1-fraction) gave ~458 for 99% confidence of catching 1% uniformly
      # distributed corruption. It assumed uniform distribution, which
      # clustered damage violates -- reading everything has no such assumption.
      # ------------------------------------------------------------------

    # ------------------------------------------------------------------
    # Result. Task 11 gates on this: a stalled or failing restore-test must stop
    # pruning rather than permit it, so both the verdict and its age have to be
    # readable by another job.
    # ------------------------------------------------------------------
    if [ -n "$FAILURES" ]; then RESULT=fail; else RESULT=pass; fi
    log "result=$RESULT longhorn_tested=$LH_TESTED longhorn_skipped=$LH_SKIPPED"

    kubectl create configmap backup-restore-test-result -n longhorn-system \
      --from-literal=result="$RESULT" \
      --from-literal=timestamp="$STAMP" \
      --from-literal=epoch="$NOW" \
      --from-literal=longhorn_tested="$LH_TESTED" \
      --from-literal=longhorn_skipped="$LH_SKIPPED" \
      --from-literal=failures="${FAILURES:-none}" \
      --dry-run=client -o yaml | kubectl apply -f - >/dev/null 2>&1

    {
      echo "backup_restore_test_last_run_timestamp $NOW"
      if [ "$RESULT" = pass ]; then echo "backup_restore_test_pass 1"; else echo "backup_restore_test_pass 0"; fi
      echo "backup_restore_test_longhorn_volumes_tested $LH_TESTED"
      echo "backup_restore_test_longhorn_volumes_skipped $LH_SKIPPED"
    } | wget -q -O /dev/null --post-file=- "$VM_IMPORT_URL" || log "WARN: metric push failed"

    [ "$RESULT" = pass ] || exit 1
    echo "RESTORE_TEST_OK"

  # The pod that reads the restored device. Kept as a template rather than a
  # heredoc inside the loop: a heredoc nested in a shell that is itself inside a
  # YAML block scalar needs two layers of escaping, and that is precisely the
  # construction that produced silent no-ops elsewhere in this directory.
  verify-pod.yaml.tmpl: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: RTNAME
      namespace: longhorn-system
    spec:
      restartPolicy: Never
      containers:
        - name: check
          # longhorn-engine, not alpine + `apk add e2fsprogs sqlite`.
          #
          # instance-manager, NOT longhorn-engine. Both are already on the node,
          # both have e2fsck and mount -- and only instance-manager has python3
          # with a working sqlite3 module.
          #
          # longhorn-engine was tried first and failed on exactly that. It ships
          # python3, so `command -v python3` said yes, but the base is SLE 15 and
          # SUSE packages the stdlib sqlite3 module separately, so `import
          # sqlite3` died with a command-not-found suggestion. The check reported
          # `sqlite integrity_check said 'to install it.'` -- the tail of a
          # package-manager hint, parsed as a database verdict. "python3 exists"
          # and "python3 can do what I need" are different claims; probing for
          # the binary answered the wrong one.
          #
          # Verified on the running node: e2fsck, mount, umount, find, python3,
          # and sqlite3 module 3.53.2.
          #
          # The point is that nothing is installed at runtime. `apk add` writes
          # new executables into a running container and executes them, which
          # trips Falco's "Executing binary not part of base image" at Critical
          # -- once per volume, every day. Silencing that rule would have meant
          # giving up the detection that would report a genuinely compromised
          # container; the workload was the thing worth changing.
          image: docker.io/longhornio/longhorn-instance-manager:v1.12.1
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              e2fsck -n -f /dev/rtdev
              echo "e2fsck_rc=$?"
              mkdir -p /mnt/v
              if mount -o ro /dev/rtdev /mnt/v 2>&1; then
                echo "mount_ok=1"
              else
                echo "mount_ok=0"
              fi
              echo "files=$(find /mnt/v -type f 2>/dev/null | wc -l)"
              if [ -f /mnt/v/PG_VERSION ]; then
                echo "content=postgres"
                echo "pg_version=$(cat /mnt/v/PG_VERSION 2>/dev/null)"
                if [ -s /mnt/v/global/pg_control ]; then
                  echo "pg_control=present"
                else
                  echo "pg_control=MISSING"
                fi
              elif ls /mnt/v/*.sqlite3 >/dev/null 2>&1; then
                echo "content=sqlite"
                # python3's stdlib sqlite3, because this image has no sqlite3
                # CLI. Opened read-only through a file: URI so the check cannot
                # create a journal beside the backup it is inspecting -- the
                # mount is already ro, but relying on that would put the
                # command's safety in a flag several lines away.
                echo "sqlite_integrity=$(python3 -c 'import sqlite3,glob;f=glob.glob("/mnt/v/*.sqlite3")[0];print(sqlite3.connect("file:"+f+"?mode=ro",uri=True).execute("PRAGMA integrity_check").fetchone()[0])' 2>&1 | tail -1)"
              else
                echo "content=generic"
              fi
              umount /mnt/v 2>/dev/null
          volumeDevices:
            - name: v
              devicePath: /dev/rtdev
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: v
          persistentVolumeClaim:
            claimName: RTNAME
