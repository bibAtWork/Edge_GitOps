# Which Longhorn volumes are worth backing up (ADR-005 Task 3, exclusions).
#
# RecurringJobs join the `default` group, which Longhorn applies to any volume
# carrying no recurring-job label. That default is deliberate and fails safe: a
# new volume is protected without anyone remembering to opt it in. The cost is
# that everything is protected, including things that should not be.
#
# Measured 2026-08-24, actual sizes: 14.5GB across all volumes, of which 10.8GB
# (73%) is VictoriaMetrics and VictoriaLogs. Backing those up weekly would make
# metrics history the dominant ongoing cost of the entire backup system, and
# they churn constantly so each delta stays large. Losing them costs
# observability history, not function -- the stack rebuilds and starts recording
# again.
#
# Longhorn has no declarative per-volume exclusion: Volume resources are created
# by the CSI driver at provisioning time, so they cannot be labelled from Git.
# This job reconciles the labels from the list below, which keeps the decision
# reviewable in a PR even though the mechanism is imperative.
#
# Exclusion means REMOVING recurring-job-group.longhorn.io/default, not adding
# some other group label. Longhorn's documented rule is that a volume with no
# recurring-job-group label joins `default`, but it materialises that rule as a
# real label stamped on every volume at creation. Membership is additive, so a
# volume carrying both `default` and `ephemeral` is in both groups and is still
# backed up.
#
# The first version of this job added `ephemeral` and left `default` alone. It
# reported volumes as excluded on every run, for its entire life, while
# excluding nothing -- established 2026-08-25 by running the snapshot job and
# finding all three VictoriaMetrics volumes snapshotted along with everything
# else, then re-running it with `default` removed from one and watching that
# one alone be skipped.
#
# Judge this job by which volumes are in the `default` group, never by what it
# says it did. The closing lines of the script print exactly that.
apiVersion: v1
kind: ConfigMap
metadata:
  name: volume-backup-policy
  namespace: longhorn-system
data:
  # PVCs excluded from Longhorn backups, with the reason. Anything not listed
  # here is backed up, so forgetting an entry costs storage rather than data.
  ephemeral-pvcs: |
    # Metrics and logs: 10.8GB of the 14.5GB total, high churn, and expendable.
    # Losing them costs history, not capability.
    vlsingle-vmstack-victoria-metrics-k8s-stack
    vmsingle-vmstack-victoria-metrics-k8s-stack
    vtsingle-vmstack-victoria-metrics-k8s-stack

    # The staging copy of SeaweedFS. Backing this up is circular -- it would
    # store a Longhorn backup of a copy of SeaweedFS, inside SeaweedFS.
    seaweedfs-staging

    # Caches and spools. Reconstructible by the applications that own them:
    # Immich re-downloads its models, valkey is a cache, and the paperless
    # consume directory is a transient ingest spool whose contents are moved
    # into paperless-media almost immediately.
    immich-ml-cache-lh
    immich-valkey-lh
    paperless-valkey-lh
    paperless-consume-lh

    # Postgres WAL volumes. A WAL backup is only meaningful alongside its data
    # volume captured at the same instant, which independent volume backups do
    # not guarantee. The coherent artefact for these databases is the hourly
    # logical dump in the db-backups bucket, which the restore-test verifies by
    # replaying the gzip stream and checking the dump header.
    keycloak-pg-1-wal
    filer-meta-pg-1-wal

    # Postgres DATA volumes. Every database here already produces a logical
    # dump on its own schedule, into the db-backups bucket, and that dump is
    # the artefact the nightly restore-test actually replays. The volume copy
    # was verified by nothing.
    #
    # keycloak-pg-1 was never a second path to begin with. CNPG puts its WAL on
    # a separate volume (excluded just above) and Longhorn snapshots volumes
    # independently, so what was being kept was a data volume at one instant
    # paired with a WAL volume at another -- a combination Postgres cannot
    # replay. Dropping it removes a copy that could not have been restored,
    # not a copy that could.
    #
    # data-immich-postgresql-0 is the honest case: Immich runs a plain
    # StatefulSet with pg_wal inside the data directory, so a single-volume
    # snapshot is crash-consistent and genuinely restorable. It is dropped
    # anyway, to hold one mechanism per database rather than two -- 485MB in
    # every weekly tier to duplicate what a 247KB dump already covers.
    #
    # The cost is real and worth stating: restoring Immich now means creating
    # the database and replaying a dump rather than attaching a volume, and
    # the dump excludes the geodata tables, so reverse geocoding stays
    # degraded until Immich re-imports them. See docs/runbooks/backup-recovery.md.
    keycloak-pg-1
    data-immich-postgresql-0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volume-backup-policy
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volume-backup-policy
  namespace: longhorn-system
rules:
  # Label volumes, and nothing else. No create, no delete: this job decides what
  # is backed up, so it must never be able to remove a volume it decided not to
  # back up.
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Triggers backup-weekly on demand for a volume that has never had a backup,
  # mirroring upgrade-gate-rbac.yaml's identical grant for the same pattern.
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volume-backup-policy
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: volume-backup-policy
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: volume-backup-policy
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: volume-backup-policy
  namespace: longhorn-system
spec:
  # Hourly, and well before the 02:00 snapshot tier. Volumes are created at
  # provisioning time, so a volume created after the last run would otherwise be
  # backed up once before the label caught up -- harmless, but it would put a
  # copy of a cache in the backupstore.
  schedule: "25 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Selected by 34-backup/networkpolicy.yaml. Still required after
            # dropping apk -- not for package mirrors, but for the wget metrics
            # push to vmsingle further down. Cilium is default-deny egress, so
            # without this the push hangs until it times out and the run loses
            # its metrics while still reporting POLICY_OK.
            backup.homelab/egress: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: volume-backup-policy
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: policy
              # kubectl baked in, nothing installed at runtime.
              #
              # This pod used to be alpine plus `apk add kubectl`, which is all
              # it ever needed. Installing packages at runtime writes new
              # executables into a running container and executes them --
              # Falco's "Executing binary not part of base image", at Critical,
              # once per HOURLY run. That made this job the single largest
              # source of Critical Falco events on the cluster, roughly 24 a
              # day on its own. The options were to silence the rule or to stop
              # doing the thing it detects; silencing it would have cost the
              # detection that reports a genuinely compromised container.
              #
              # This image is already pulled on the node -- SUC uses it for its
              # own Jobs -- and it runs as a non-root user. Same swap as
              # restore-test-cronjob.yaml, which carries the fuller reasoning.
              image: docker.io/rancher/kuberlr-kubectl:v8.1.1
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  NOW="$(date -u +%s)"
                  LABELLED=0
                  CLEARED=0
                  VOLS_TOTAL=0
                  EXPECTED_EXCLUDED=0

                  # Strip comments and blanks so the ConfigMap can carry the
                  # reasoning alongside the list.
                  sed 's/#.*//' /policy/ephemeral-pvcs | tr -d ' \t' | grep -v '^$' > /tmp/ephemeral

                  echo "excluded PVCs: $(wc -l < /tmp/ephemeral)"

                  kubectl get volumes.longhorn.io -n longhorn-system \
                    -o custom-columns=V:.metadata.name,P:.status.kubernetesStatus.pvcName --no-headers > /tmp/vols

                  while read -r VOL PVC; do
                    [ -z "${VOL:-}" ] && continue
                    [ -z "${PVC:-}" ] && continue
                    [ "$PVC" = "<none>" ] && continue
                    VOLS_TOTAL=$((VOLS_TOTAL + 1))
                    grep -qx "$PVC" /tmp/ephemeral && EXPECTED_EXCLUDED=$((EXPECTED_EXCLUDED + 1)) || true

                    EPH="$(kubectl get volumes.longhorn.io -n longhorn-system "$VOL" \
                      -o jsonpath='{.metadata.labels.recurring-job-group\.longhorn\.io/ephemeral}' 2>/dev/null || true)"
                    DEF="$(kubectl get volumes.longhorn.io -n longhorn-system "$VOL" \
                      -o jsonpath='{.metadata.labels.recurring-job-group\.longhorn\.io/default}' 2>/dev/null || true)"

                    if grep -qx "$PVC" /tmp/ephemeral; then
                      if [ -n "$DEF" ] || [ "$EPH" != "enabled" ]; then
                        # Removing `default` is what excludes the volume.
                        # Adding `ephemeral` does not: Longhorn stamps
                        # recurring-job-group.longhorn.io/default=enabled on
                        # every volume at creation, membership is additive, and
                        # a volume carrying both labels is in both groups and
                        # still backed up.
                        #
                        # `ephemeral` is kept alongside as a marker, so this job
                        # can tell a volume it deliberately excluded from one
                        # Longhorn has simply not labelled yet.
                        kubectl label volumes.longhorn.io -n longhorn-system "$VOL" \
                          "recurring-job-group.longhorn.io/default-" \
                          "recurring-job-group.longhorn.io/ephemeral=enabled" --overwrite >/dev/null
                        echo "  excluded $PVC"
                        LABELLED=$((LABELLED + 1))
                      fi
                    elif [ "$EPH" = "enabled" ] || [ -z "$DEF" ]; then
                      # Removed from the list, or never labelled at all: put it
                      # back under `default` so an entry deleted in a PR
                      # actually restores protection.
                      kubectl label volumes.longhorn.io -n longhorn-system "$VOL" \
                        "recurring-job-group.longhorn.io/ephemeral-" \
                        "recurring-job-group.longhorn.io/default=enabled" --overwrite >/dev/null
                      echo "  re-included $PVC"
                      CLEARED=$((CLEARED + 1))
                    fi
                  done < /tmp/vols

                  # Report the set that will actually be backed up, rather than
                  # the set this job believes it acted on. Those two disagreed
                  # for the whole life of the previous version and nothing said
                  # so: it printed "excluded" on every run while every volume
                  # stayed in `default`.
                  kubectl get volumes.longhorn.io -n longhorn-system \
                    -l "recurring-job-group.longhorn.io/default=enabled" \
                    -o custom-columns=P:.status.kubernetesStatus.pvcName --no-headers \
                    | grep -v '^<none>' | sort > /tmp/in_default

                  echo "in the default group, and so backed up:"
                  sed 's/^/  /' /tmp/in_default

                  # ---------------------------------------------------------
                  # A volume newly in the default group otherwise waits for
                  # the next scheduled weekly/monthly tier -- up to a week --
                  # before it has any backup at all. That gap is exactly what
                  # left immich-library-lh uncovered for ten days spanning
                  # both the 2026-08-24 storage migration and the 2026-08-26
                  # incident, discovered 2026-09-04 when its actual photos
                  # turned out to be gone (docs/backlog.md). This job already
                  # runs hourly and already has the full VOL/PVC list from
                  # the loop above, so checking each in-scope volume's own
                  # status.lastBackupAt -- exposed directly on the Volume,
                  # no separate BackupVolume lookup needed -- costs nothing
                  # extra to compute, and closes the gap to about an hour
                  # instead of up to a week.
                  NEVER_BACKED_UP=""
                  UNBACKABLE=""
                  while read -r VOL PVC; do
                    [ -z "${VOL:-}" ] && continue
                    [ -z "${PVC:-}" ] && continue
                    [ "$PVC" = "<none>" ] && continue
                    grep -qx "$PVC" /tmp/in_default || continue
                    LB="$(kubectl get volumes.longhorn.io -n longhorn-system "$VOL" \
                      -o jsonpath='{.status.lastBackupAt}' 2>/dev/null)"
                    [ -n "$LB" ] && continue
                    # A DETACHED volume is skipped by the recurring backup job --
                    # Longhorn cannot snapshot one without attaching it first. So
                    # triggering for one does not merely waste a run: it can never
                    # satisfy its own condition. lastBackupAt stays empty, this
                    # job fires again next hour, and backup-weekly then runs
                    # HOURLY against every other volume, churning their backups
                    # through the retain policy. Caught 2026-09-04, in the first
                    # hour this trigger existed, against a scratch PVC whose only
                    # pod had already exited.
                    #
                    # Reported instead of triggered. A detached in-scope volume
                    # with no backup is a real gap that no trigger can close --
                    # which is what LonghornVolumeNeverBackedUp is for, now that
                    # it pages at critical.
                    ST="$(kubectl get volumes.longhorn.io -n longhorn-system "$VOL" \
                      -o jsonpath='{.status.state}' 2>/dev/null)"
                    if [ "$ST" != "attached" ]; then
                      UNBACKABLE="$UNBACKABLE $PVC($ST)"
                      continue
                    fi
                    NEVER_BACKED_UP="$NEVER_BACKED_UP $PVC"
                  done < /tmp/vols

                  if [ -n "$UNBACKABLE" ]; then
                    echo "in scope, never backed up, and NOT attached -- nothing can back these up until something mounts them:$UNBACKABLE"
                  fi

                  if [ -n "$NEVER_BACKED_UP" ]; then
                    echo "never backed up yet, triggering backup-weekly now:$NEVER_BACKED_UP"
                    BJOB="volume-backup-policy-firstrun-$(date -u +%Y%m%d%H%M)"
                    if kubectl create job -n longhorn-system "$BJOB" --from=cronjob/backup-weekly >/dev/null 2>&1; then
                      # backup-weekly backs up every default-group volume, not
                      # only the new one -- the same trade this job already
                      # makes elsewhere, favouring one simple, proven trigger
                      # over a volume-scoped one. Budget matches
                      # upgrade-gate-script.yaml's wait_for_job: 600s.
                      i=0
                      while [ "$i" -lt 60 ]; do
                        kubectl get job -n longhorn-system "$BJOB" -o jsonpath='{.status.succeeded}' 2>/dev/null | grep -q 1 && break
                        kubectl get job -n longhorn-system "$BJOB" -o jsonpath='{.status.failed}' 2>/dev/null | grep -q '[1-9]' && break
                        i=$((i + 1)); sleep 10
                      done
                      kubectl logs -n longhorn-system "job/$BJOB" --tail=15 2>/dev/null | sed 's/^/    /' || true
                      kubectl delete job -n longhorn-system "$BJOB" --wait=false >/dev/null 2>&1 || true
                    else
                      echo "WARN: could not create $BJOB"
                    fi
                  fi

                  IN_DEFAULT="$(wc -l < /tmp/in_default)"
                  EXPECTED="$((VOLS_TOTAL - EXPECTED_EXCLUDED))"
                  DRIFT="$((IN_DEFAULT - EXPECTED))"

                  # Metrics, so this is visible without reading pod logs that age
                  # out after three runs.
                  #
                  # backup_volume_policy_drift is the one that matters and the one
                  # alerted on. It is the difference between the volumes actually
                  # in `default` and the number the list says should be, so it is
                  # self-adjusting: adding an app adds a volume to both sides and
                  # nothing fires, while an exclusion that stops taking effect
                  # moves only one side. The previous version of this job would
                  # have reported drift=10 from its first run.
                  #
                  # backup_volume_policy_in_scope carries a pvc label so the
                  # Longhorn backup-age rules can be scoped to volumes that are
                  # supposed to have backups. Without it they count the deliberate
                  # exclusions too and alert forever about volumes nobody intends
                  # to back up.
                  {
                    echo "backup_volume_policy_last_run_timestamp $NOW"
                    echo "backup_volume_policy_in_default $IN_DEFAULT"
                    echo "backup_volume_policy_expected_in_default $EXPECTED"
                    echo "backup_volume_policy_drift $DRIFT"
                    echo "backup_volume_policy_volumes_total $VOLS_TOTAL"
                    echo "backup_volume_policy_excluded $LABELLED"
                    echo "backup_volume_policy_reincluded $CLEARED"
                    while read -r P; do
                      [ -z "$P" ] && continue
                      echo "backup_volume_policy_in_scope{pvc=\"$P\"} 1"
                    done < /tmp/in_default
                  } | wget -q -O /dev/null --post-file=- "$VM_IMPORT_URL" \
                    || echo "WARN: metric push failed"

                  echo "POLICY_OK excluded=$LABELLED re-included=$CLEARED in_default=$IN_DEFAULT expected=$EXPECTED drift=$DRIFT"
              env:
                - name: VM_IMPORT_URL
                  value: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428/api/v1/import/prometheus
              volumeMounts:
                - name: policy
                  mountPath: /policy
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: policy
              configMap:
                name: volume-backup-policy
