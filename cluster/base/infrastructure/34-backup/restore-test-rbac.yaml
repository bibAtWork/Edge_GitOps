# RBAC for the local restore-test (ADR-005 Task 10).
#
# This is the only job here that creates and destroys storage objects, because
# verifying a backup means actually restoring it. That makes it the most
# privileged thing in this directory, so the permissions are enumerated rather
# than taken from a convenience role.
#
# Deliberately absent: delete on longhorn.io/backups. This job exists to prove
# backups are restorable and must never be able to remove one -- a verifier that
# can destroy what it verifies is a single bug away from deleting the backup set
# it was meant to protect. Retention is Longhorn's own RecurringJob concern.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-restore-test
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-restore-test
  namespace: longhorn-system
rules:
  # Read the backup inventory to decide what to restore.
  - apiGroups: ["longhorn.io"]
    resources: ["backups", "backupvolumes", "backuptargets"]
    verbs: ["get", "list", "watch"]
  # Scratch volumes restored from those backups, removed afterwards.
  - apiGroups: ["longhorn.io"]
    resources: ["volumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
  # The short-lived pod that actually reads the restored filesystem.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Result written back for the reconciler's gate (Task 11) to read.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-restore-test
  namespace: longhorn-system
subjects:
  - kind: ServiceAccount
    name: backup-restore-test
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: backup-restore-test
---
# PersistentVolumes are cluster-scoped, so binding a restored Longhorn volume to
# a claim needs a ClusterRole. Scoped to PVs alone; this grants nothing about any
# other cluster-scoped resource.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-restore-test-pv
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backup-restore-test-pv
subjects:
  - kind: ServiceAccount
    name: backup-restore-test
    namespace: longhorn-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-restore-test-pv
