# Local restore-test (ADR-005 Task 10).
#
# Restores real backups and reads them back. This is the check that would have
# caught the five damaged objects found on 2026-08-24 proactively, rather than
# by accident during a staging run: every other signal in the chain -- job exit
# codes, object listings, sizes, timestamps -- reported those as healthy, and
# only consuming the artefact reveals them.
#
# Runs entirely locally. The Longhorn backups live on the in-cluster SeaweedFS
# target and the staged SeaweedFS copy sits on a Longhorn PVC, so verification
# costs no AWS egress. Earlier revisions of this design could not have this:
# with the backup target on AWS, restoring anything meant paying to read it.
#
# Result is written to the backup-restore-test-result ConfigMap, which the
# reconciler (Task 11) gates on. A stalled or failing restore-test must stop
# remote pruning rather than permit it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-restore-test
  namespace: longhorn-system
spec:
  # Injected from backup-retention-config. 07:00, after the 05:00 relay, so the
  # staged snapshot it samples is the same one the relay mirrored.
  schedule: "PLACEHOLDER"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            # Needed for apk (package mirrors) and for pushing metrics.
            backup.homelab/egress: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: backup-restore-test
          # Non-root. Root was only ever needed so `apk add` could write to the
          # package database, and nothing is installed at runtime any more.
          #
          # The comment this replaces argued that no candidate image carried
          # both e2fsck and the aws CLI, so a runtime install was the lesser
          # evil against "putting an image registry in the recovery path of the
          # thing that verifies recovery". That reasoning was sound; its premise
          # is now false in both halves. The aws CLI is not needed at all, since
          # the SeaweedFS comparison moved to backup-verify. The e2fsck side is
          # served by longhornio/longhorn-engine, which is already on this node
          # because Longhorn runs it -- so no registry enters the recovery path:
          # if that image were unavailable, Longhorn itself would be down.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-test
              # kubectl baked in, nothing installed at runtime.
              #
              # This pod used to be alpine plus
              # `apk add aws-cli e2fsprogs sqlite gzip kubectl`. Two changes made
              # that unnecessary: the SeaweedFS half of the script moved to
              # backup-verify, which reads every object rather than sampling, and
              # what remained needs only kubectl.
              #
              # Installing packages at runtime writes new executables into a
              # running container and executes them -- Falco's "Executing binary
              # not part of base image", at Critical, once per daily run. The
              # options were to silence the rule or to stop doing the thing it
              # detects; silencing it would have cost the detection that reports
              # a genuinely compromised container.
              #
              # This image is already pulled on the node -- SUC uses it for its
              # own Jobs -- and it runs as a non-root user.
              image: docker.io/rancher/kuberlr-kubectl:v8.1.1
              command: ["/bin/sh", "/scripts/restore-test.sh"]
              env:
                - name: S3_ENDPOINT
                  value: http://seaweedfs-s3.seaweedfs.svc:8333
                - name: VM_IMPORT_URL
                  value: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428/api/v1/import/prometheus
                # ~458 gives 99% confidence of catching 1% uniformly distributed
                # corruption, independent of dataset size: n = ln(1-0.99)/ln(1-0.01).
                # Rounded up.
                - name: SAMPLE_SIZE
                  value: "460"
                # Volume restores are sequential and each one copies real blocks,
                # so an unbounded run could still be going when the next stage is
                # due. Volumes not reached are logged and counted, never silently
                # dropped -- see backup_restore_test_longhorn_volumes_skipped.
                - name: LONGHORN_BUDGET_SECONDS
                  value: "3600"
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-s3-backup-credential
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: longhorn-s3-backup-credential
                      key: AWS_SECRET_ACCESS_KEY
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  # Explicit: ten namespaces carry a LimitRange defaulting
                  # limit-less containers to 256Mi, which would OOM this
                  # mid-restore and leave scratch volumes behind.
                  memory: 1Gi
          volumes:
            - name: scripts
              configMap:
                name: backup-restore-test-script
