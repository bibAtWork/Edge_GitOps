# Egress for the ADR-005 backup jobs (Tasks 4, 9, 11, 12).
#
# The selector label is `backup.homelab/egress`. It names what the label is for,
# not the document that introduced it -- it was `adr002.backup/egress`, which was
# both wrong (that decision is ADR-005) and the wrong kind of name: an ADR number
# describes where a choice was written down, which is of no use to someone
# reading a policy to find out what it does.
#
# Renaming it meant changing this selector and every job's pod label in one
# change, since a job starting between the two would match neither and lose
# egress. Applied with no backup job running.
#
# Cilium is default-deny in both directions here, and the existing
# longhorn-restrict policy in 32-longhorn/ covers what Longhorn itself needs:
# intra-namespace, host, kube-apiserver, DNS, and SeaweedFS S3 on :8333. The
# backup jobs run in this namespace and inherit all of that. Two things they
# need that Longhorn does not:
#
#   - the public internet on 443, to reach the AWS vault
#   - VictoriaMetrics on 8428, to push per-run metrics
#
# Scoped to pods carrying backup.homelab/egress=true rather than the whole
# namespace. Longhorn's storage components have no business reaching the
# internet, and this namespace runs with enforce: privileged, so the blast
# radius of a compromise here is already large -- granting it blanket outbound
# access would make an exfiltration path out of a backup job.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backup-jobs-egress
  namespace: longhorn-system
spec:
  endpointSelector:
    matchLabels:
      backup.homelab/egress: "true"
  egress:
    # AWS S3. toFQDNs would be tighter, but it requires the DNS proxy to be in
    # the request path for every lookup, and S3 resolves to a wide and shifting
    # address set -- a stale entry there fails a backup rather than a page load.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # VictoriaMetrics ingestion, so a job's success or failure is visible as a
    # metric rather than only in pod logs that age out.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
# vmsingle's own ingress is restricted to an explicit allowlist, so the egress
# rule above is only half the path.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-backup-jobs-to-vmsingle
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: longhorn-system
            backup.homelab/egress: "true"
        # velero-backup-retry (07-velero/backup-retry.yaml) pushes from the
        # velero namespace. The egress half alone is not enough -- vmsingle's
        # ingress is an explicit allowlist, so a rule added only on the sending
        # side fails with a connection timeout rather than a policy error.
        - matchLabels:
            io.kubernetes.pod.namespace: velero
            backup.homelab/egress: "true"
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
