# Credential Longhorn uses for its LOCAL backup target (ADR-002 Task 1).
#
# Encrypt with SOPS before committing:
#   sops --encrypt --in-place longhorn-backup-credential.yaml
#
# This is the SeaweedFS admin credential, reused rather than a new per-bucket
# identity, because CLAUDE.md fixes that as an architecture decision: SeaweedFS
# S3 uses one admin credential plus a Cilium policy restricting :8333 to
# authorised pods. ADR-002 Task 1 asks for credentials with full read/write/
# delete on longhorn-backups, which the admin credential satisfies.
#
# Full delete rights here are correct and load-bearing, not an oversight. This
# credential never leaves the cluster and never touches AWS. Longhorn needs
# delete locally to run its lock protocol and enforce its own retention -- the
# reason ADR-002 revision 3 moved the backup target off AWS entirely. The
# no-delete rule applies strictly to the AWS credentials in Task 7.
apiVersion: v1
kind: Secret
metadata:
    name: longhorn-s3-backup-credential
    namespace: longhorn-system
