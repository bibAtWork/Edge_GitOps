---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-setup-script
  namespace: keycloak
data:
  setup.py: |
    #!/usr/bin/env python3
    """
    Idempotent Keycloak setup via Admin REST API.
    Fixes the Grafana and Paperless-ngx client secrets (literal placeholders
    from realm import), ensures the shared "groups" client scope exists and
    is linked to both clients, creates the homelab admin user, promotes the
    same identity to a permanent master-realm admin, and deletes the
    temporary bootstrap admin so only one admin credential pair remains.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    KC_URL = "http://keycloak.keycloak.svc.cluster.local"
    REALM = "homelab"

    KEYCLOAK_ADMIN = os.environ["KEYCLOAK_ADMIN"]
    KEYCLOAK_ADMIN_PASSWORD = os.environ["KEYCLOAK_ADMIN_PASSWORD"]
    GRAFANA_CLIENT_SECRET = os.environ["GRAFANA_CLIENT_SECRET"]
    PAPERLESS_CLIENT_SECRET = os.environ["PAPERLESS_CLIENT_SECRET"]
    HUBBLE_CLIENT_SECRET = os.environ["HUBBLE_CLIENT_SECRET"]
    KUBEOPENCODE_CLIENT_SECRET = os.environ["KUBEOPENCODE_CLIENT_SECRET"]
    ADMIN_USER_EMAIL = os.environ.get("ADMIN_USER_EMAIL", "admin@homelab.internal")
    ADMIN_USER_PASSWORD = os.environ["ADMIN_USER_PASSWORD"]


    def api(method, path, data=None, token=None, form=False):
        url = f"{KC_URL}{path}"
        headers = {}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        body = None
        if data and form:
            body = urllib.parse.urlencode(data).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        elif data is not None:
            body = json.dumps(data).encode()
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raw = e.read()
            return e.code, json.loads(raw) if raw else None


    def try_login(username, password):
        status, body = api("POST", "/realms/master/protocol/openid-connect/token", data={
            "client_id": "admin-cli",
            "username": username,
            "password": password,
            "grant_type": "password",
        }, form=True)
        return body["access_token"] if status == 200 else None


    def get_token():
        # Prefer the permanent master admin so reruns keep working after the
        # bootstrap admin below is deleted; fall back to it for the first run.
        tok = try_login(ADMIN_USER_EMAIL, ADMIN_USER_PASSWORD)
        if tok:
            return tok
        tok = try_login(KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD)
        if tok:
            return tok
        print("ERROR: auth failed with both permanent and bootstrap admin credentials", file=sys.stderr)
        sys.exit(1)


    tok = get_token()
    print("✓ Authenticated to Keycloak")

    def ensure_client(client_def, secret):
        # Realm import only runs once (--import-realm skips an existing
        # realm), so clients added to homelab.json after the first deploy
        # never get created on their own — and even for clients that DID
        # come from the import, the secret is stored as the literal
        # placeholder string, not the real value. Handle both here.
        client_id_str = client_def["clientId"]
        status, clients = api("GET", f"/admin/realms/{REALM}/clients?clientId={client_id_str}", token=tok)
        if not clients:
            status, _ = api("POST", f"/admin/realms/{REALM}/clients", data=client_def, token=tok)
            assert status == 201, f"{client_id_str} client creation failed: {status}"
            print(f"✓ {client_id_str} client created")
            status, clients = api("GET", f"/admin/realms/{REALM}/clients?clientId={client_id_str}", token=tok)
        uuid = clients[0]["id"]
        # fetch full representation so PUT doesn't drop fields
        status, full_client = api("GET", f"/admin/realms/{REALM}/clients/{uuid}", token=tok)
        full_client["secret"] = secret
        # merge client_def's attributes on top of Keycloak's own (preserves
        # internal bookkeeping keys); a pkce requirement is explicitly
        # cleared (empty string, not just omitted -- Keycloak's client PUT
        # merges the attributes map rather than replacing it, so removing
        # the key entirely from the payload doesn't unset it server-side)
        # rather than merged, since client_def omitting the key means
        # "don't require PKCE", not "leave whatever's there"
        full_client.setdefault("attributes", {}).update(client_def.get("attributes", {}))
        if "pkce.code.challenge.method" not in client_def.get("attributes", {}):
            full_client["attributes"]["pkce.code.challenge.method"] = ""
        status, _ = api("PUT", f"/admin/realms/{REALM}/clients/{uuid}", data=full_client, token=tok)
        assert status == 204, f"{client_id_str} client update failed: {status}"
        print(f"✓ {client_id_str} client secret updated")
        return uuid

    grafana_uuid = ensure_client({
        "clientId": "grafana",
        "enabled": True,
        "name": "Grafana",
        "protocol": "openid-connect",
        "publicClient": False,
        "standardFlowEnabled": True,
        "implicitFlowEnabled": False,
        "directAccessGrantsEnabled": False,
        "serviceAccountsEnabled": False,
        "authorizationServicesEnabled": False,
        "attributes": {"pkce.code.challenge.method": "S256"},
        "redirectUris": ["https://grafana.homelab.data-harness.org/*"],
        "webOrigins": ["https://grafana.homelab.data-harness.org"],
    }, GRAFANA_CLIENT_SECRET)

    paperless_uuid = ensure_client({
        # No PKCE requirement: django-allauth's openid_connect provider
        # doesn't send a code_challenge, unlike Grafana which explicitly
        # enables PKCE (use_pkce: true). Not a security gap here since
        # paperless is a confidential client with its own secret — PKCE is
        # primarily for public clients that can't hold one securely.
        "clientId": "paperless",
        "enabled": True,
        "name": "Paperless-ngx",
        "protocol": "openid-connect",
        "publicClient": False,
        "standardFlowEnabled": True,
        "implicitFlowEnabled": False,
        "directAccessGrantsEnabled": False,
        "serviceAccountsEnabled": False,
        "authorizationServicesEnabled": False,
        "attributes": {},
        "redirectUris": ["https://paperless.homelab.data-harness.org/accounts/oidc/keycloak/login/callback/"],
        "webOrigins": ["https://paperless.homelab.data-harness.org"],
    }, PAPERLESS_CLIENT_SECRET)

    # Hubble UI and KubeOpenCode have no native OIDC of their own. Envoy
    # Gateway's SecurityPolicy.oidc performs the browser login on their behalf
    # at the edge and forwards the access token upstream, where OPA's
    # admin_only_apps rule authorizes it. Both are confidential clients, so
    # PKCE is not the primary protection (same reasoning as paperless above).
    # redirectUris must match the /oauth2/callback path Envoy Gateway uses by
    # default — it is not configurable per app without setting redirectURL.
    ensure_client({
        "clientId": "hubble",
        "enabled": True,
        "name": "Hubble UI",
        "protocol": "openid-connect",
        "publicClient": False,
        "standardFlowEnabled": True,
        "implicitFlowEnabled": False,
        "directAccessGrantsEnabled": False,
        "serviceAccountsEnabled": False,
        "authorizationServicesEnabled": False,
        "attributes": {},
        "redirectUris": ["https://hubble.homelab.data-harness.org/oauth2/callback"],
        "webOrigins": ["https://hubble.homelab.data-harness.org"],
    }, HUBBLE_CLIENT_SECRET)

    ensure_client({
        "clientId": "kubeopencode",
        "enabled": True,
        "name": "KubeOpenCode",
        "protocol": "openid-connect",
        "publicClient": False,
        "standardFlowEnabled": True,
        "implicitFlowEnabled": False,
        "directAccessGrantsEnabled": False,
        "serviceAccountsEnabled": False,
        "authorizationServicesEnabled": False,
        "attributes": {},
        "redirectUris": ["https://kubeopencode.homelab.data-harness.org/oauth2/callback"],
        "webOrigins": ["https://kubeopencode.homelab.data-harness.org"],
    }, KUBEOPENCODE_CLIENT_SECRET)

    # --- Ensure a realm-level "groups" client scope exists (idempotent) ---
    # Client scopes are realm-wide reusable objects. Keycloak rejects any
    # authorization request naming a scope that isn't defined at the realm
    # level (e.g. Grafana requesting scope=...+groups fails with invalid_scope
    # until this exists and is linked to the client). Every OIDC client that
    # wants group membership in its token reuses this same scope.
    def ensure_client_scope(name, mapper):
        status, scopes = api("GET", f"/admin/realms/{REALM}/client-scopes", token=tok)
        existing = next((s for s in scopes if s["name"] == name), None)
        if existing:
            return existing["id"]
        status, _ = api("POST", f"/admin/realms/{REALM}/client-scopes", data={
            "name": name,
            "protocol": "openid-connect",
            "attributes": {
                "include.in.token.scope": "true",
                "display.on.consent.screen": "false",
            },
            "protocolMappers": [mapper],
        }, token=tok)
        assert status == 201, f"Client scope '{name}' creation failed: {status}"
        status, scopes = api("GET", f"/admin/realms/{REALM}/client-scopes", token=tok)
        return next(s["id"] for s in scopes if s["name"] == name)

    def link_optional_scope(client_uuid, scope_id):
        status, _ = api("PUT", f"/admin/realms/{REALM}/clients/{client_uuid}/optional-client-scopes/{scope_id}", token=tok)
        assert status == 204, f"Optional scope link failed: {status}"

    groups_scope_id = ensure_client_scope("groups", {
        "name": "groups",
        "protocol": "openid-connect",
        "protocolMapper": "oidc-group-membership-mapper",
        "consentRequired": False,
        "config": {
            "full.path": "false",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "groups",
            "userinfo.token.claim": "true",
        },
    })
    print("✓ Realm 'groups' client scope ensured")

    link_optional_scope(grafana_uuid, groups_scope_id)
    link_optional_scope(paperless_uuid, groups_scope_id)
    print("✓ 'groups' scope linked to grafana and paperless clients")

    # --- Ensure the realm has a UserProfileProvider component (idempotent) ---
    # Partial realm import (--import-realm with no "components" section) never
    # creates this, unlike Keycloak's internally-bootstrapped master realm which
    # always has one. Without it, Keycloak 26's declarative user profile can't
    # resolve required actions during login, and ALL password-grant logins in
    # this realm fail with invalid_grant "Account is not fully set up" —
    # regardless of which user, confirmed with a fresh throwaway account.
    status, profile_comps = api(
        "GET", f"/admin/realms/{REALM}/components?type=org.keycloak.userprofile.UserProfileProvider", token=tok
    )
    if not profile_comps:
        status, realm_rep = api("GET", f"/admin/realms/{REALM}", token=tok)
        profile_config = {
            "attributes": [
                {"name": "username", "displayName": "${username}",
                 "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {}, "up-username-not-idn-homograph": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "email", "displayName": "${email}",
                 "validations": {"email": {}, "length": {"max": 255}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "firstName", "displayName": "${firstName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "lastName", "displayName": "${lastName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
            ],
            "groups": [
                {"name": "user-metadata", "displayHeader": "User metadata", "displayDescription": "Attributes, which refer to user metadata"}
            ],
        }
        status, _ = api("POST", f"/admin/realms/{REALM}/components", data={
            "providerId": "declarative-user-profile",
            "providerType": "org.keycloak.userprofile.UserProfileProvider",
            "parentId": realm_rep["id"],
            "config": {"kc.user.profile.config": [json.dumps(profile_config)]},
        }, token=tok)
        assert status == 201, f"UserProfileProvider creation failed: {status}"
        print("✓ UserProfileProvider component created")
    else:
        print("✓ UserProfileProvider component already exists")

    # --- Create admin user (idempotent) ---
    status, existing = api("GET", f"/admin/realms/{REALM}/users?username=admin&exact=true", token=tok)
    if not existing:
        status, _ = api("POST", f"/admin/realms/{REALM}/users", data={
            "username": "admin",
            "email": ADMIN_USER_EMAIL,
            "enabled": True,
            "emailVerified": True,
        }, token=tok)
        assert status == 201, f"User creation failed: {status}"
        print("✓ User 'admin' created")
        status, existing = api("GET", f"/admin/realms/{REALM}/users?username=admin&exact=true", token=tok)
    else:
        print("✓ User 'admin' already exists")

    user_id = existing[0]["id"]

    # --- Set/sync password (always update to stay in sync with secret) ---
    status, _ = api("PUT", f"/admin/realms/{REALM}/users/{user_id}/reset-password", data={
        "type": "password",
        "value": ADMIN_USER_PASSWORD,
        "temporary": False,
    }, token=tok)
    assert status == 204, f"Password reset failed: {status}"
    print("✓ Password set")

    # --- Assign admin group (PUT is idempotent — 204 whether new or existing) ---
    status, groups = api("GET", f"/admin/realms/{REALM}/groups?search=admin&exact=true", token=tok)
    if not groups:
        print("ERROR: admin group not found in realm", file=sys.stderr)
        sys.exit(1)
    group_id = groups[0]["id"]
    status, _ = api("PUT", f"/admin/realms/{REALM}/users/{user_id}/groups/{group_id}", token=tok)
    assert status == 204, f"Group assignment failed: {status}"
    print("✓ User assigned to 'admin' group")

    # --- Create permanent master-realm admin with the same identity (idempotent) ---
    status, existing_master = api("GET", f"/admin/realms/master/users?username={ADMIN_USER_EMAIL}&exact=true", token=tok)
    if not existing_master:
        status, _ = api("POST", "/admin/realms/master/users", data={
            "username": ADMIN_USER_EMAIL,
            "email": ADMIN_USER_EMAIL,
            "enabled": True,
            "emailVerified": True,
        }, token=tok)
        assert status == 201, f"Master admin creation failed: {status}"
        print("✓ Permanent master admin created")
        status, existing_master = api("GET", f"/admin/realms/master/users?username={ADMIN_USER_EMAIL}&exact=true", token=tok)
    else:
        print("✓ Permanent master admin already exists")

    master_admin_id = existing_master[0]["id"]

    status, _ = api("PUT", f"/admin/realms/master/users/{master_admin_id}/reset-password", data={
        "type": "password",
        "value": ADMIN_USER_PASSWORD,
        "temporary": False,
    }, token=tok)
    assert status == 204, f"Master admin password reset failed: {status}"
    print("✓ Master admin password set")

    status, current_roles = api("GET", f"/admin/realms/master/users/{master_admin_id}/role-mappings/realm", token=tok)
    if not any(r["name"] == "admin" for r in current_roles):
        status, admin_role = api("GET", "/admin/realms/master/roles/admin", token=tok)
        assert status == 200, f"Could not fetch master 'admin' role: {status}"
        status, _ = api("POST", f"/admin/realms/master/users/{master_admin_id}/role-mappings/realm", data=[admin_role], token=tok)
        assert status == 204, f"Master admin role assignment failed: {status}"
        print("✓ Master 'admin' role assigned")
    else:
        print("✓ Master 'admin' role already assigned")

    # --- Delete the temporary bootstrap admin now that a permanent one exists ---
    # Safe to rerun: once deleted, this lookup returns nothing and is a no-op.
    status, bootstrap_admins = api("GET", f"/admin/realms/master/users?username={KEYCLOAK_ADMIN}&exact=true", token=tok)
    bootstrap_admins = [u for u in (bootstrap_admins or []) if u["username"] != ADMIN_USER_EMAIL]
    if bootstrap_admins:
        status, _ = api("DELETE", f"/admin/realms/master/users/{bootstrap_admins[0]['id']}", token=tok)
        assert status == 204, f"Bootstrap admin deletion failed: {status}"
        print("✓ Temporary bootstrap admin deleted")
    else:
        print("✓ No temporary bootstrap admin to delete")

    print("\nSetup complete.")
---
apiVersion: batch/v1
kind: Job
metadata:
  # The run-id is embedded in the name, not just carried as an annotation.
  # Job.spec.template is immutable, so if a bump ever changes the pod spec
  # (a new env var, a new secretKeyRef — exactly what added HUBBLE_CLIENT_SECRET
  # and KUBEOPENCODE_CLIENT_SECRET here did) while the previous Job with the
  # same name still exists, kustomize-controller's server-side apply fails
  # outright on the immutable field. That failure blocks the whole flux-system
  # Kustomization, not just this one, since Job/keycloak/keycloak-setup itself
  # is on the reconcile path — confirmed live 2026-08-16, all Flux
  # reconciliation stopped until the stale Job was deleted by hand. Because
  # this Kustomization runs with prune: true, renaming on every bump lets Flux
  # safely garbage-collect the old-named Job instead of trying to patch it in
  # place, so this failure mode can't recur.
  name: keycloak-setup-5
  namespace: keycloak
  annotations:
    # Bump the numeric suffix on metadata.name above (not just here) to
    # re-run the job after merging config changes.
    run-id: "5"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "/scripts/setup.py"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-password
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: grafana-client-secret
            - name: PAPERLESS_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-paperless-oidc
                  key: paperless-client-secret
            - name: HUBBLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-hubble-oidc
                  key: hubble-client-secret
            - name: KUBEOPENCODE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-kubeopencode-oidc
                  key: kubeopencode-client-secret
            - name: ADMIN_USER_EMAIL
              value: admin@homelab.internal
            - name: ADMIN_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-user
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: keycloak-setup-script
