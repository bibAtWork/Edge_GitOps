---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-setup-script
  namespace: keycloak
data:
  setup.py: |
    #!/usr/bin/env python3
    """
    Idempotent Keycloak setup via Admin REST API.
    Fixes the Grafana client secret (literal placeholder from realm import),
    creates the homelab admin user, promotes the same identity to a permanent
    master-realm admin, and deletes the temporary bootstrap admin so only one
    admin credential pair remains.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    KC_URL = "http://keycloak.keycloak.svc.cluster.local"
    REALM = "homelab"

    KEYCLOAK_ADMIN = os.environ["KEYCLOAK_ADMIN"]
    KEYCLOAK_ADMIN_PASSWORD = os.environ["KEYCLOAK_ADMIN_PASSWORD"]
    GRAFANA_CLIENT_SECRET = os.environ["GRAFANA_CLIENT_SECRET"]
    ADMIN_USER_EMAIL = os.environ.get("ADMIN_USER_EMAIL", "admin@homelab.internal")
    ADMIN_USER_PASSWORD = os.environ["ADMIN_USER_PASSWORD"]


    def api(method, path, data=None, token=None, form=False):
        url = f"{KC_URL}{path}"
        headers = {}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        body = None
        if data and form:
            body = urllib.parse.urlencode(data).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        elif data is not None:
            body = json.dumps(data).encode()
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raw = e.read()
            return e.code, json.loads(raw) if raw else None


    def try_login(username, password):
        status, body = api("POST", "/realms/master/protocol/openid-connect/token", data={
            "client_id": "admin-cli",
            "username": username,
            "password": password,
            "grant_type": "password",
        }, form=True)
        return body["access_token"] if status == 200 else None


    def get_token():
        # Prefer the permanent master admin so reruns keep working after the
        # bootstrap admin below is deleted; fall back to it for the first run.
        tok = try_login(ADMIN_USER_EMAIL, ADMIN_USER_PASSWORD)
        if tok:
            return tok
        tok = try_login(KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD)
        if tok:
            return tok
        print("ERROR: auth failed with both permanent and bootstrap admin credentials", file=sys.stderr)
        sys.exit(1)


    tok = get_token()
    print("✓ Authenticated to Keycloak")

    # --- Fix Grafana client secret ---
    # realm import stores the literal placeholder string, not the real value
    status, clients = api("GET", f"/admin/realms/{REALM}/clients?clientId=grafana", token=tok)
    if not clients:
        print("ERROR: grafana client not found in realm", file=sys.stderr)
        sys.exit(1)
    client = clients[0]
    client_id = client["id"]
    # fetch full representation so PUT doesn't drop fields
    status, full_client = api("GET", f"/admin/realms/{REALM}/clients/{client_id}", token=tok)
    full_client["secret"] = GRAFANA_CLIENT_SECRET
    status, _ = api("PUT", f"/admin/realms/{REALM}/clients/{client_id}", data=full_client, token=tok)
    assert status == 204, f"Client update failed: {status}"
    print("✓ Grafana client secret updated")

    # --- Ensure the realm has a UserProfileProvider component (idempotent) ---
    # Partial realm import (--import-realm with no "components" section) never
    # creates this, unlike Keycloak's internally-bootstrapped master realm which
    # always has one. Without it, Keycloak 26's declarative user profile can't
    # resolve required actions during login, and ALL password-grant logins in
    # this realm fail with invalid_grant "Account is not fully set up" —
    # regardless of which user, confirmed with a fresh throwaway account.
    status, profile_comps = api(
        "GET", f"/admin/realms/{REALM}/components?type=org.keycloak.userprofile.UserProfileProvider", token=tok
    )
    if not profile_comps:
        status, realm_rep = api("GET", f"/admin/realms/{REALM}", token=tok)
        profile_config = {
            "attributes": [
                {"name": "username", "displayName": "${username}",
                 "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {}, "up-username-not-idn-homograph": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "email", "displayName": "${email}",
                 "validations": {"email": {}, "length": {"max": 255}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "firstName", "displayName": "${firstName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "lastName", "displayName": "${lastName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
            ],
            "groups": [
                {"name": "user-metadata", "displayHeader": "User metadata", "displayDescription": "Attributes, which refer to user metadata"}
            ],
        }
        status, _ = api("POST", f"/admin/realms/{REALM}/components", data={
            "providerId": "declarative-user-profile",
            "providerType": "org.keycloak.userprofile.UserProfileProvider",
            "parentId": realm_rep["id"],
            "config": {"kc.user.profile.config": [json.dumps(profile_config)]},
        }, token=tok)
        assert status == 201, f"UserProfileProvider creation failed: {status}"
        print("✓ UserProfileProvider component created")
    else:
        print("✓ UserProfileProvider component already exists")

    # --- Create admin user (idempotent) ---
    status, existing = api("GET", f"/admin/realms/{REALM}/users?username=admin&exact=true", token=tok)
    if not existing:
        status, _ = api("POST", f"/admin/realms/{REALM}/users", data={
            "username": "admin",
            "email": ADMIN_USER_EMAIL,
            "enabled": True,
            "emailVerified": True,
        }, token=tok)
        assert status == 201, f"User creation failed: {status}"
        print("✓ User 'admin' created")
        status, existing = api("GET", f"/admin/realms/{REALM}/users?username=admin&exact=true", token=tok)
    else:
        print("✓ User 'admin' already exists")

    user_id = existing[0]["id"]

    # --- Set/sync password (always update to stay in sync with secret) ---
    status, _ = api("PUT", f"/admin/realms/{REALM}/users/{user_id}/reset-password", data={
        "type": "password",
        "value": ADMIN_USER_PASSWORD,
        "temporary": False,
    }, token=tok)
    assert status == 204, f"Password reset failed: {status}"
    print("✓ Password set")

    # --- Assign admin group (PUT is idempotent — 204 whether new or existing) ---
    status, groups = api("GET", f"/admin/realms/{REALM}/groups?search=admin&exact=true", token=tok)
    if not groups:
        print("ERROR: admin group not found in realm", file=sys.stderr)
        sys.exit(1)
    group_id = groups[0]["id"]
    status, _ = api("PUT", f"/admin/realms/{REALM}/users/{user_id}/groups/{group_id}", token=tok)
    assert status == 204, f"Group assignment failed: {status}"
    print("✓ User assigned to 'admin' group")

    # --- Create permanent master-realm admin with the same identity (idempotent) ---
    status, existing_master = api("GET", f"/admin/realms/master/users?username={ADMIN_USER_EMAIL}&exact=true", token=tok)
    if not existing_master:
        status, _ = api("POST", "/admin/realms/master/users", data={
            "username": ADMIN_USER_EMAIL,
            "email": ADMIN_USER_EMAIL,
            "enabled": True,
            "emailVerified": True,
        }, token=tok)
        assert status == 201, f"Master admin creation failed: {status}"
        print("✓ Permanent master admin created")
        status, existing_master = api("GET", f"/admin/realms/master/users?username={ADMIN_USER_EMAIL}&exact=true", token=tok)
    else:
        print("✓ Permanent master admin already exists")

    master_admin_id = existing_master[0]["id"]

    status, _ = api("PUT", f"/admin/realms/master/users/{master_admin_id}/reset-password", data={
        "type": "password",
        "value": ADMIN_USER_PASSWORD,
        "temporary": False,
    }, token=tok)
    assert status == 204, f"Master admin password reset failed: {status}"
    print("✓ Master admin password set")

    status, current_roles = api("GET", f"/admin/realms/master/users/{master_admin_id}/role-mappings/realm", token=tok)
    if not any(r["name"] == "admin" for r in current_roles):
        status, admin_role = api("GET", "/admin/realms/master/roles/admin", token=tok)
        assert status == 200, f"Could not fetch master 'admin' role: {status}"
        status, _ = api("POST", f"/admin/realms/master/users/{master_admin_id}/role-mappings/realm", data=[admin_role], token=tok)
        assert status == 204, f"Master admin role assignment failed: {status}"
        print("✓ Master 'admin' role assigned")
    else:
        print("✓ Master 'admin' role already assigned")

    # --- Delete the temporary bootstrap admin now that a permanent one exists ---
    # Safe to rerun: once deleted, this lookup returns nothing and is a no-op.
    status, bootstrap_admins = api("GET", f"/admin/realms/master/users?username={KEYCLOAK_ADMIN}&exact=true", token=tok)
    bootstrap_admins = [u for u in (bootstrap_admins or []) if u["username"] != ADMIN_USER_EMAIL]
    if bootstrap_admins:
        status, _ = api("DELETE", f"/admin/realms/master/users/{bootstrap_admins[0]['id']}", token=tok)
        assert status == 204, f"Bootstrap admin deletion failed: {status}"
        print("✓ Temporary bootstrap admin deleted")
    else:
        print("✓ No temporary bootstrap admin to delete")

    print("\nSetup complete.")
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-setup
  namespace: keycloak
  annotations:
    # Increment this value to re-run the job after merging config changes
    run-id: "3"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "/scripts/setup.py"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-password
            - name: GRAFANA_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: grafana-client-secret
            - name: ADMIN_USER_EMAIL
              value: admin@homelab.internal
            - name: ADMIN_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-user
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: keycloak-setup-script
