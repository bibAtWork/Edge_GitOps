---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-setup-script
  namespace: keycloak
data:
  setup.py: |
    #!/usr/bin/env python3
    """
    Idempotent Keycloak setup via Admin REST API.
    Fixes the Grafana and Paperless-ngx client secrets (literal placeholders
    from realm import), ensures the shared "groups" client scope exists and
    is linked to both clients, creates the homelab admin user, promotes the
    same identity to a permanent master-realm admin, and deletes the
    temporary bootstrap admin so only one admin credential pair remains.
    """
    import json
    import os
    import sys
    import urllib.error
    import urllib.parse
    import urllib.request

    KC_URL = "http://keycloak.keycloak.svc.cluster.local"
    REALM = "homelab"

    KEYCLOAK_ADMIN = os.environ["KEYCLOAK_ADMIN"]
    KEYCLOAK_ADMIN_PASSWORD = os.environ["KEYCLOAK_ADMIN_PASSWORD"]
    ADMIN_USER_EMAIL = os.environ.get("ADMIN_USER_EMAIL", "admin@homelab.internal")
    ADMIN_USER_PASSWORD = os.environ["ADMIN_USER_PASSWORD"]


    def api(method, path, data=None, token=None, form=False):
        url = f"{KC_URL}{path}"
        headers = {}
        if token:
            headers["Authorization"] = f"Bearer {token}"
        body = None
        if data and form:
            body = urllib.parse.urlencode(data).encode()
            headers["Content-Type"] = "application/x-www-form-urlencoded"
        elif data is not None:
            body = json.dumps(data).encode()
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(url, data=body, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req) as resp:
                raw = resp.read()
                return resp.status, json.loads(raw) if raw else None
        except urllib.error.HTTPError as e:
            raw = e.read()
            return e.code, json.loads(raw) if raw else None


    def try_login(username, password):
        status, body = api("POST", "/realms/master/protocol/openid-connect/token", data={
            "client_id": "admin-cli",
            "username": username,
            "password": password,
            "grant_type": "password",
        }, form=True)
        return body["access_token"] if status == 200 else None


    def get_token():
        # Prefer the permanent master admin so reruns keep working after the
        # bootstrap admin below is deleted; fall back to it for the first run.
        tok = try_login(ADMIN_USER_EMAIL, ADMIN_USER_PASSWORD)
        if tok:
            return tok
        tok = try_login(KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD)
        if tok:
            return tok
        print("ERROR: auth failed with both permanent and bootstrap admin credentials", file=sys.stderr)
        sys.exit(1)


    tok = get_token()
    print("✓ Authenticated to Keycloak")

    def client_uuid(client_id_str):
        # Lookup only. Clients are declared in realm-config/homelab.yaml and
        # reconciled hourly by keycloak-config-cli; this Job no longer creates
        # or updates them, it just needs their UUIDs to attach client scopes.
        #
        # Moving creation out is what stops an added app from requiring a
        # change to this Job. Job.spec.template is immutable, so any edit here
        # needs the Job renamed or the whole flux-system Kustomization fails on
        # the immutable field -- which took reconciliation down twice on
        # 2026-08-26. A client declared in YAML costs none of that.
        status, clients = api("GET", f"/admin/realms/{REALM}/clients?clientId={client_id_str}", token=tok)
        assert clients, (
            f"{client_id_str} client not found. It is declared in "
            f"realm-config/homelab.yaml -- check the keycloak-config-cli "
            f"CronJob ran and succeeded."
        )
        return clients[0]["id"]

    grafana_uuid = client_uuid("grafana")
    paperless_uuid = client_uuid("paperless")
    hubble_uuid = client_uuid("hubble")
    kubeopencode_uuid = client_uuid("kubeopencode")
    zot_uuid = client_uuid("zot")
    immich_uuid = client_uuid("immich")
    kubernetes_uuid = client_uuid("kubernetes")
    print("✓ Resolved client UUIDs (clients themselves come from keycloak-config-cli)")

    def ensure_client_scope(name, mapper):
        status, scopes = api("GET", f"/admin/realms/{REALM}/client-scopes", token=tok)
        existing = next((s for s in scopes if s["name"] == name), None)
        if existing:
            return existing["id"]
        status, _ = api("POST", f"/admin/realms/{REALM}/client-scopes", data={
            "name": name,
            "protocol": "openid-connect",
            "attributes": {
                "include.in.token.scope": "true",
                "display.on.consent.screen": "false",
            },
            "protocolMappers": [mapper],
        }, token=tok)
        assert status == 201, f"Client scope '{name}' creation failed: {status}"
        status, scopes = api("GET", f"/admin/realms/{REALM}/client-scopes", token=tok)
        return next(s["id"] for s in scopes if s["name"] == name)

    def link_optional_scope(client_uuid, scope_id):
        status, _ = api("PUT", f"/admin/realms/{REALM}/clients/{client_uuid}/optional-client-scopes/{scope_id}", token=tok)
        assert status == 204, f"Optional scope link failed: {status}"

    def link_default_scope(client_uuid, scope_id):
        # Default (not optional): immich's OAuth config only requests
        # "openid email profile" and isn't being changed here to also ask
        # for a custom scope -- a default scope is included in every token
        # for the client regardless of what scope= the client requests.
        status, _ = api("PUT", f"/admin/realms/{REALM}/clients/{client_uuid}/default-client-scopes/{scope_id}", token=tok)
        assert status == 204, f"Default scope link failed: {status}"

    groups_scope_id = ensure_client_scope("groups", {
        "name": "groups",
        "protocol": "openid-connect",
        "protocolMapper": "oidc-group-membership-mapper",
        "consentRequired": False,
        "config": {
            "full.path": "false",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "groups",
            "userinfo.token.claim": "true",
        },
    })
    print("✓ Realm 'groups' client scope ensured")

    link_optional_scope(grafana_uuid, groups_scope_id)
    link_optional_scope(paperless_uuid, groups_scope_id)
    link_optional_scope(hubble_uuid, groups_scope_id)
    link_optional_scope(kubeopencode_uuid, groups_scope_id)
    link_optional_scope(zot_uuid, groups_scope_id)
    print("✓ 'groups' scope linked to grafana, paperless, hubble, kubeopencode, and zot clients")

    # Default, not optional, for kubernetes specifically: RBAC depends on
    # this claim being present, and a CLI OIDC plugin can't be relied on to
    # always know to request an optional scope the way a purpose-built
    # app's own OAuth config can.
    link_default_scope(kubernetes_uuid, groups_scope_id)
    print("✓ 'groups' scope linked to kubernetes client (default)")

    # immich_role: a plain user attribute, not derived from group
    # membership by Keycloak itself -- Immich's role model is binary
    # (admin/user), so this repo sets the attribute directly wherever it
    # already assigns group membership (below), rather than trying to
    # express a group->literal-string mapping declaratively in Keycloak.
    immich_role_scope_id = ensure_client_scope("immich-role", {
        "name": "immich_role",
        "protocol": "openid-connect",
        "protocolMapper": "oidc-usermodel-attribute-mapper",
        "consentRequired": False,
        "config": {
            "user.attribute": "immich_role",
            "id.token.claim": "true",
            "access.token.claim": "true",
            "claim.name": "immich_role",
            "userinfo.token.claim": "true",
        },
    })
    print("✓ Realm 'immich-role' client scope ensured")

    link_default_scope(immich_uuid, immich_role_scope_id)
    print("✓ 'immich_role' scope linked to immich client (default)")

    # --- ADR-002: Flattened Hierarchical RBAC group foundation (idempotent) ---
    # Level 0 tiers (reader/maintainer/owner) are never assigned to a user
    # directly. Level 1 job-function groups nest exactly one level under one
    # Level 0 group -- the same shape validated in CI by
    # policy/rbac_guardrail.rego against rbac-groups.json (single source of
    # truth, mounted below at /rbac/rbac-groups.json). This stage is additive
    # only: the legacy flat "admin" group is left in place and still assigned
    # below, so no app's existing authorization logic changes yet. Grafana's
    # role_attribute_path and the legacy group's removal land together in the
    # follow-up PR that actually re-points app authorization at these groups.
    def ensure_top_level_group(name):
        status, groups = api("GET", f"/admin/realms/{REALM}/groups?search={name}&exact=true", token=tok)
        existing = next((g for g in (groups or []) if g["name"] == name and g.get("path") == f"/{name}"), None)
        if existing:
            return existing["id"]
        status, _ = api("POST", f"/admin/realms/{REALM}/groups", data={"name": name}, token=tok)
        assert status == 201, f"Group '{name}' creation failed: {status}"
        status, groups = api("GET", f"/admin/realms/{REALM}/groups?search={name}&exact=true", token=tok)
        return next(g["id"] for g in groups if g["name"] == name and g.get("path") == f"/{name}")

    def ensure_subgroup(parent_id, parent_name, name):
        status, children = api("GET", f"/admin/realms/{REALM}/groups/{parent_id}/children", token=tok)
        existing = next((g for g in (children or []) if g["name"] == name), None)
        if existing:
            return existing["id"]
        status, _ = api("POST", f"/admin/realms/{REALM}/groups/{parent_id}/children", data={"name": name}, token=tok)
        assert status == 201, f"Subgroup '{name}' creation under '{parent_name}' failed: {status}"
        status, children = api("GET", f"/admin/realms/{REALM}/groups/{parent_id}/children", token=tok)
        return next(g["id"] for g in children if g["name"] == name)

    with open("/rbac/rbac-groups.json") as f:
        rbac_groups = json.load(f)

    level0_ids = {}
    for name in rbac_groups["level0"]:
        level0_ids[name] = ensure_top_level_group(name)
        print(f"✓ Level 0 group '/{name}' ensured")

    level1_ids = {}
    for role in rbac_groups["level1"]:
        parent_id = level0_ids[role["parent"]]
        level1_ids[role["name"]] = ensure_subgroup(parent_id, role["parent"], role["name"])
        print(f"✓ Level 1 group '/{role['parent']}/{role['name']}' ensured")

    # --- Ensure the realm has a UserProfileProvider component (idempotent) ---
    # Partial realm import (--import-realm with no "components" section) never
    # creates this, unlike Keycloak's internally-bootstrapped master realm which
    # always has one. Without it, Keycloak 26's declarative user profile can't
    # resolve required actions during login, and ALL password-grant logins in
    # this realm fail with invalid_grant "Account is not fully set up" —
    # regardless of which user, confirmed with a fresh throwaway account.
    status, profile_comps = api(
        "GET", f"/admin/realms/{REALM}/components?type=org.keycloak.userprofile.UserProfileProvider", token=tok
    )
    if not profile_comps:
        status, realm_rep = api("GET", f"/admin/realms/{REALM}", token=tok)
        profile_config = {
            "attributes": [
                {"name": "username", "displayName": "${username}",
                 "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {}, "up-username-not-idn-homograph": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "email", "displayName": "${email}",
                 "validations": {"email": {}, "length": {"max": 255}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "firstName", "displayName": "${firstName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
                {"name": "lastName", "displayName": "${lastName}",
                 "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                 "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]}, "multivalued": False},
            ],
            "groups": [
                {"name": "user-metadata", "displayHeader": "User metadata", "displayDescription": "Attributes, which refer to user metadata"}
            ],
        }
        status, _ = api("POST", f"/admin/realms/{REALM}/components", data={
            "providerId": "declarative-user-profile",
            "providerType": "org.keycloak.userprofile.UserProfileProvider",
            "parentId": realm_rep["id"],
            "config": {"kc.user.profile.config": [json.dumps(profile_config)]},
        }, token=tok)
        assert status == 201, f"UserProfileProvider creation failed: {status}"
        print("✓ UserProfileProvider component created")
    else:
        print("✓ UserProfileProvider component already exists")

    # --- Create admin user (idempotent) ---
    status, existing = api("GET", f"/admin/realms/{REALM}/users?username=admin&exact=true", token=tok)
    if not existing:
        status, _ = api("POST", f"/admin/realms/{REALM}/users", data={
            "username": "admin",
            "email": ADMIN_USER_EMAIL,
            "enabled": True,
            "emailVerified": True,
        }, token=tok)
        assert status == 201, f"User creation failed: {status}"
        print("✓ User 'admin' created")
        status, existing = api("GET", f"/admin/realms/{REALM}/users?username=admin&exact=true", token=tok)
    else:
        print("✓ User 'admin' already exists")

    user_id = existing[0]["id"]

    # --- Set/sync password (always update to stay in sync with secret) ---
    status, _ = api("PUT", f"/admin/realms/{REALM}/users/{user_id}/reset-password", data={
        "type": "password",
        "value": ADMIN_USER_PASSWORD,
        "temporary": False,
    }, token=tok)
    assert status == 204, f"Password reset failed: {status}"
    print("✓ Password set")

    # --- Migrate legacy 'admin' group members into /owner/platform-admin, then
    # delete the legacy group. ADR-002's Level 0/Level 1 groups are now what
    # every app checks (see 04-grafana/helmrelease.yaml's role_attribute_path);
    # this closes the additive-only window the previous PR deliberately left
    # open so Grafana's re-point and this removal land in the same change. ---
    status, legacy_groups = api("GET", f"/admin/realms/{REALM}/groups?search=admin&exact=true", token=tok)
    legacy_admin_group = next((g for g in (legacy_groups or []) if g["name"] == "admin" and g.get("path") == "/admin"), None)
    if legacy_admin_group:
        legacy_group_id = legacy_admin_group["id"]
        status, members = api("GET", f"/admin/realms/{REALM}/groups/{legacy_group_id}/members", token=tok)
        for member in members or []:
            status, _ = api("PUT", f"/admin/realms/{REALM}/users/{member['id']}/groups/{level1_ids['platform-admin']}", token=tok)
            assert status == 204, f"Failed to move '{member['username']}' into platform-admin: {status}"
            print(f"✓ Migrated '{member['username']}' from legacy 'admin' group to '/owner/platform-admin'")
        status, _ = api("DELETE", f"/admin/realms/{REALM}/groups/{legacy_group_id}", token=tok)
        assert status == 204, f"Failed to delete legacy 'admin' group: {status}"
        print("✓ Legacy 'admin' group deleted")
    else:
        print("✓ No legacy 'admin' group to migrate")

    # Immich has no group concept of its own -- binary admin/user role,
    # set via the immich_role user attribute (immich-role client scope
    # above). platform-admin -> admin, everything else -> user. Applied
    # wherever this script assigns Level 1 group membership, below.
    IMMICH_ROLE_FOR_GROUP = {
        "platform-admin": "admin",
        "app-operator": "user",
        "viewer": "user",
    }

    def set_immich_role(target_user_id, group_name):
        # Keycloak's user PUT replaces the whole representation, not just
        # the fields given (same gotcha ensure_client works around above)
        # -- fetch first so this doesn't drop email/username/enabled/etc.
        status, full_user = api("GET", f"/admin/realms/{REALM}/users/{target_user_id}", token=tok)
        full_user.setdefault("attributes", {})["immich_role"] = [IMMICH_ROLE_FOR_GROUP[group_name]]
        status, _ = api("PUT", f"/admin/realms/{REALM}/users/{target_user_id}", data=full_user, token=tok)
        assert status == 204, f"Failed to set immich_role for user {target_user_id}: {status}"

    # --- Assign 'admin' user to /owner/platform-admin (PUT is idempotent) ---
    status, _ = api("PUT", f"/admin/realms/{REALM}/users/{user_id}/groups/{level1_ids['platform-admin']}", token=tok)
    assert status == 204, f"platform-admin group assignment failed: {status}"
    set_immich_role(user_id, "platform-admin")
    print("✓ User assigned to '/owner/platform-admin' group (immich_role=admin)")

    # --- Known real users, assigned directly (not bootstrap identities like
    # 'admin' above) -- auto-signup SSO users referenced by their Keycloak
    # username, added here rather than left as a one-off manual change so
    # the assignment survives a realm rebuild. No-op if the user hasn't
    # signed in yet.
    #
    # There is deliberately no "andreas" entry: that name only ever existed
    # as a Django username Paperless derived from the "admin" Keycloak
    # account's profile (allauth's openid_connect provider maps
    # preferred_username, not the Keycloak username field, to the local
    # account) -- confirmed live via a full realm user listing showing only
    # one real Keycloak identity, "admin". A same-named KNOWN_USER_GROUPS
    # entry here would search Keycloak for a username that will never
    # exist; the real person is already covered by the "admin" assignment
    # above. ---
    KNOWN_USER_GROUPS = {}
    for username, group_name in KNOWN_USER_GROUPS.items():
        status, matches = api("GET", f"/admin/realms/{REALM}/users?username={username}&exact=true", token=tok)
        if not matches:
            print(f"✓ '{username}' hasn't signed in yet -- skipping group assignment")
            continue
        target_id = matches[0]["id"]
        status, _ = api("PUT", f"/admin/realms/{REALM}/users/{target_id}/groups/{level1_ids[group_name]}", token=tok)
        assert status == 204, f"Failed to assign '{username}' to '{group_name}': {status}"
        set_immich_role(target_id, group_name)
        print(f"✓ User '{username}' assigned to '{group_name}' group (immich_role={IMMICH_ROLE_FOR_GROUP[group_name]})")

    # --- Create permanent master-realm admin with the same identity (idempotent) ---
    status, existing_master = api("GET", f"/admin/realms/master/users?username={ADMIN_USER_EMAIL}&exact=true", token=tok)
    if not existing_master:
        status, _ = api("POST", "/admin/realms/master/users", data={
            "username": ADMIN_USER_EMAIL,
            "email": ADMIN_USER_EMAIL,
            "enabled": True,
            "emailVerified": True,
        }, token=tok)
        assert status == 201, f"Master admin creation failed: {status}"
        print("✓ Permanent master admin created")
        status, existing_master = api("GET", f"/admin/realms/master/users?username={ADMIN_USER_EMAIL}&exact=true", token=tok)
    else:
        print("✓ Permanent master admin already exists")

    master_admin_id = existing_master[0]["id"]

    status, _ = api("PUT", f"/admin/realms/master/users/{master_admin_id}/reset-password", data={
        "type": "password",
        "value": ADMIN_USER_PASSWORD,
        "temporary": False,
    }, token=tok)
    assert status == 204, f"Master admin password reset failed: {status}"
    print("✓ Master admin password set")

    status, current_roles = api("GET", f"/admin/realms/master/users/{master_admin_id}/role-mappings/realm", token=tok)
    if not any(r["name"] == "admin" for r in current_roles):
        status, admin_role = api("GET", "/admin/realms/master/roles/admin", token=tok)
        assert status == 200, f"Could not fetch master 'admin' role: {status}"
        status, _ = api("POST", f"/admin/realms/master/users/{master_admin_id}/role-mappings/realm", data=[admin_role], token=tok)
        assert status == 204, f"Master admin role assignment failed: {status}"
        print("✓ Master 'admin' role assigned")
    else:
        print("✓ Master 'admin' role already assigned")

    # --- Delete the temporary bootstrap admin now that a permanent one exists ---
    # Safe to rerun: once deleted, this lookup returns nothing and is a no-op.
    status, bootstrap_admins = api("GET", f"/admin/realms/master/users?username={KEYCLOAK_ADMIN}&exact=true", token=tok)
    bootstrap_admins = [u for u in (bootstrap_admins or []) if u["username"] != ADMIN_USER_EMAIL]
    if bootstrap_admins:
        status, _ = api("DELETE", f"/admin/realms/master/users/{bootstrap_admins[0]['id']}", token=tok)
        assert status == 204, f"Bootstrap admin deletion failed: {status}"
        print("✓ Temporary bootstrap admin deleted")
    else:
        print("✓ No temporary bootstrap admin to delete")

    print("\nSetup complete.")
---
apiVersion: batch/v1
kind: Job
metadata:
  # The run-id is embedded in the name, not just carried as an annotation.
  # Job.spec.template is immutable, so if a bump ever changes the pod spec
  # (a new env var, a new secretKeyRef — exactly what added HUBBLE_CLIENT_SECRET
  # and KUBEOPENCODE_CLIENT_SECRET here did) while the previous Job with the
  # same name still exists, kustomize-controller's server-side apply fails
  # outright on the immutable field. That failure blocks the whole flux-system
  # Kustomization, not just this one, since Job/keycloak/keycloak-setup itself
  # is on the reconcile path — confirmed live 2026-08-16, all Flux
  # reconciliation stopped until the stale Job was deleted by hand. Because
  # this Kustomization runs with prune: true, renaming on every bump lets Flux
  # safely garbage-collect the old-named Job instead of trying to patch it in
  # place, so this failure mode can't recur.
  name: keycloak-setup-19
  namespace: keycloak
  annotations:
    # Bump the numeric suffix on metadata.name above (not just here) to
    # re-run the job after merging config changes.
    run-id: "19"
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: setup
          image: docker.io/library/python:3.12-alpine
          command: ["python3", "/scripts/setup.py"]
          env:
            - name: KEYCLOAK_ADMIN
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-secrets
                  key: admin-password
            - name: ADMIN_USER_EMAIL
              value: admin@homelab.internal
            - name: ADMIN_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin-user
                  key: password
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: rbac-groups
              mountPath: /rbac
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: script
          configMap:
            name: keycloak-setup-script
        - name: rbac-groups
          configMap:
            # References the configMapGenerator base name in kustomization.yaml;
            # kustomize rewrites this to the hashed generated name at build time.
            name: keycloak-rbac-groups
