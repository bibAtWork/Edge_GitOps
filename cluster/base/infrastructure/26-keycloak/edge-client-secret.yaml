# Client secret for the shared edge-authentication client.
#
# One client, one secret, for every application gated at the Envoy Gateway
# rather than by its own OIDC integration. Its redirect URI is a wildcard --
# https://*.homelab.data-harness.org/oauth2/callback -- so adding an edge-gated
# app needs no Keycloak change at all: an HTTPRoute and a SecurityPolicy
# referencing this client is the whole cost.
#
# The wildcard is the trade. Keycloak will redirect a token to any host under
# homelab.data-harness.org, so every subdomain sits inside the trust boundary.
# Acceptable because the whole domain is this cluster's Gateway and
# external-dns is the only thing creating records under it -- but it is why
# this client stays edge-only. Apps holding their own user data keep a
# dedicated client with an exact redirect URI, which is what grafana,
# paperless, immich and zot each have.
#
# Rotating:
#   ./bootstrap/scripts/rotate-secrets.py credential #     --file cluster/base/infrastructure/26-keycloak/edge-client-secret.yaml #     --key client-secret
apiVersion: v1
kind: Secret
metadata:
    name: keycloak-edge-oidc
    namespace: keycloak
type: Opaque
