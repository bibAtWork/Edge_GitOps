# Keycloak's PostgreSQL, run by CloudNativePG on Longhorn block storage.
#
# Replaces the bitnami StatefulSet on local-path. Two things change that matter:
# the data now lives on a real block device with ext4 rather than a hostPath
# directory, so it can be backed up and the pod is no longer pinned to one node's
# filesystem layout; and the operator owns failover, switchover and rolling minor
# upgrades instead of leaving them as manual work.
#
# This database is the identity provider. Losing it means losing every user,
# credential, client and group behind OIDC for Grafana, Immich, Paperless, Zot and
# the Kubernetes API. The realm re-imports from Git; users and their credentials
# do not. That is why it is the smallest volume here and still the highest-value.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-pg
  namespace: keycloak
spec:
  # Must match the version being migrated from -- pg_dump refuses to read a
  # server newer than itself, and a restore into an older major fails outright.
  # The bitnami StatefulSet ran postgres:16-alpine.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.15

  # Single instance. This is a one-node cluster: a second replica has nowhere to
  # run, and CNPG would leave it permanently pending. Durability comes from the
  # backups below, not from replication -- see ADR-004.
  instances: 1

  # No PodDisruptionBudget. CNPG creates a <cluster>-primary PDB with
  # minAvailable: 1, which on a single-instance cluster means
  # disruptionsAllowed: 0 permanently -- confirmed live on both clusters.
  #
  # That PDB protects nothing here. Its purpose is to keep a primary available
  # while a replica takes over, and with instances: 1 there is no replica: an
  # eviction is an outage whether the PDB allows it or not. What it does do is
  # block every eviction-based operation -- kubectl drain, a drain-enabled
  # upgrade, node maintenance -- indefinitely and without an obvious cause.
  #
  # Today that is masked: the Talos upgrade Plan runs --drain=false with
  # cordon: true, which is the correct shape for a single node and is why the
  # v1.13.3 drill succeeded. But the mitigation lives in one Plan argument, so
  # anything that drains by another route inherits the hang.
  #
  # The Longhorn PDBs (csi-attacher, csi-provisioner, instance-manager) are
  # deliberately left alone. instance-manager's exists to stop a drain while
  # volumes are attached, which would cost live I/O -- there it is doing its
  # job, and blocking is the correct outcome rather than a defect.
  # Raising instances above 1 is the trigger to remove this line: with a
  # replica present the PDB becomes meaningful and should come back.
  enablePDB: false

  # CNPG's default stopDelay is 1800s. With instances: 1 there is no
  # switchover target, so an image change is a stop-and-start and that
  # default makes the outage window unbounded up to thirty minutes --
  # observed live during the 16.10 -> 16.15 rollout, where the phase read
  # "Primary instance is being restarted without a switchover" and the pod
  # carried deletionGracePeriod 1800.
  #
  # Both rollouts finished in about 2 and 4 minutes, so 1800 was a ceiling
  # rather than the cost. The point is that the ceiling lands on a database
  # nothing can fail over to, and for the filer that database is the index
  # for all object storage including the backup buckets.
  #
  # 300s is chosen against the actual size of these databases: full logical
  # dumps are 66KB and 320KB, so a clean checkpoint takes well under a
  # second and five minutes is already generous. PostgreSQL is crash-safe
  # regardless -- a harder stop replays WAL on start rather than losing
  # data. This bounds the worst case at 5 minutes instead of 30.
  stopDelay: 300

  # Name the database and owner explicitly. CNPG otherwise creates a database
  # called "app" owned by a role called "app", which is functional but obscures
  # what the cluster actually holds -- and this is one of three, so the ambiguity
  # would repeat. Explicit names also mean the JDBC URL in deployment.yaml reads
  # the same as it did against the old StatefulSet.
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak

  storage:
    size: 5Gi
    # longhorn-db, not longhorn: reclaimPolicy Retain so a stray PVC delete cannot
    # destroy PGDATA, and strict-local locality so a commit does not take a
    # network hop. Block replication must not stack on application replication.
    storageClass: longhorn-db

  # Separate volume for the write-ahead log. WAL has a different write pattern
  # from the heap -- sequential, fsync-heavy, and on the critical path of every
  # commit -- so isolating it stops a heap-side burst from stalling commits, and
  # stops WAL growth from filling PGDATA and wedging the database.
  walStorage:
    size: 2Gi
    storageClass: longhorn-db

  # Sized for a homelab identity provider, not a fleet. Keycloak's own load is
  # small; the floor matters more than the ceiling.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  postgresql:
    parameters:
      # Conservative defaults for a small instance sharing a node with everything
      # else. max_connections stays modest because each backend costs memory.
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"
