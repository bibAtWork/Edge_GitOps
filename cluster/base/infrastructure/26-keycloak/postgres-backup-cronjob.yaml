# Logical backup of the Keycloak PostgreSQL database to S3.
#
# This is the only protection this database has. Velero's file-system backup
# does not capture it: data-keycloak-postgresql-0 is a local-path (hostPath)
# volume, and Kopia silently skips hostPath volumes -- no PodVolumeBackup is
# even created, so nothing errors and nothing warns. Verified 2026-08-18 that
# across every backup this cluster has taken, the only volumes ever captured
# were ephemeral (dshm, tmp, empty-dir); not one PVC.
#
# This database is the identity provider. Losing it means losing every user,
# credential, client and group behind the OIDC login for Grafana, Immich,
# Paperless, Zot, kubeopencode and the Kubernetes API itself -- so although it
# is one of the smallest volumes in the cluster, it has the widest blast radius.
# The realm can be re-imported from Git, but users and their credentials cannot.
#
# A logical dump sidesteps the Velero gap entirely: it does not care what kind
# of volume the database sits on, it is consistent by construction, and it
# restores onto any Postgres of the same major version.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-postgres-backup
  namespace: keycloak
spec:
  # Daily, offset from the 02:00 Velero schedule so the two do not contend.
  schedule: "50 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Selected by backup-netpol.yaml. CronJob pods do not inherit an
            # app.kubernetes.io/name label on their own -- they only get
            # job-name/controller-uid, which change every run and so cannot be
            # matched by a static CiliumNetworkPolicy.
            app.kubernetes.io/name: keycloak-postgres-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              # Must match the server's major version -- pg_dump refuses to dump
              # from a newer server than itself.
              # MUST match keycloak-pg's server major (16.15). pg_dump emits SQL
              # for its OWN version -- there is no target-version flag and no
              # down-conversion -- so a dump taken by a newer client can fail
              # to replay into an older server on syntax or catalog constructs
              # that postdate it.
              #
              # Renovate moved all three of these to 18-alpine on 2026-09-05,
              # two majors ahead of this server. The DUMP direction kept
              # working and the read-back checks kept passing, which is why
              # nothing caught it: the failure would have appeared for the
              # first time during an actual restore. renovate.json now blocks
              # major bumps on this image for that reason.
              image: docker.io/library/postgres:16-alpine
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  ( set -o pipefail 2>/dev/null ) && set -o pipefail || true
                  OUT=/work/keycloak.sql.gz

                  pg_dump -h keycloak-pg-rw -U keycloak \
                    -d keycloak --clean --if-exists | gzip -9 > "$OUT"

                  # Refuse to upload a truncated or empty dump. Without this the
                  # job would report success while storing nothing -- exactly the
                  # failure mode that let the Velero backups look healthy for 37
                  # days while holding no PVC data at all.
                  SIZE="$(stat -c %s "$OUT")"
                  if [ "$SIZE" -lt 1024 ]; then
                    echo "ERROR: dump is only ${SIZE} bytes -- refusing to upload" >&2
                    exit 1
                  fi
                  # Size proves the file is not empty; it cannot tell a complete
                  # dump from a truncated one. Testing the gzip stream does.
                  if ! gzip -t "$OUT"; then
                    echo "ERROR: dump failed gzip integrity check -- refusing to upload" >&2
                    exit 1
                  fi
                  echo "dump ok: ${SIZE} bytes, gzip verified"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      # CNPG-managed credential for the role the operator created,
                      # not the hand-managed password the old StatefulSet used.
                      name: keycloak-pg-app
                      key: password
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: upload
              # The upload half lives in exactly one place:
              # cluster/base/infrastructure/_shared/backup-upload.sh, mounted
              # here from the backup-upload-script ConfigMap that every one of
              # these jobs generates from that same file.
              #
              # Everything that differs between the four backup jobs is passed
              # as env below. If a variable is missing the script refuses
              # before touching the network, rather than uploading to a
              # malformed key and reporting success.
              image: docker.io/amazon/aws-cli:2.36.41
              command:
                - /bin/sh
                - /scripts/upload.sh
              env:
                - name: SRC_FILE
                  value: "/work/keycloak.sql.gz"
                - name: DEST_DIR
                  value: "s3://db-backups/keycloak"
                - name: OBJECT_NAME
                  value: "keycloak"
                - name: OBJECT_EXT
                  value: ".sql.gz"
                - name: S3_ENDPOINT
                  value: http://seaweedfs-s3.seaweedfs.svc:8333
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-backup-credentials
                      key: admin_access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-backup-credentials
                      key: admin_secret_access_key
              volumeMounts:
                - name: work
                  mountPath: /work
                - name: upload-script
                  mountPath: /scripts
                  readOnly: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: work
              emptyDir: {}
            - name: upload-script
              configMap:
                name: backup-upload-script
