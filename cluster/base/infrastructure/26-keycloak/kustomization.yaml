apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - realm-configmap.yaml
  - keycloak-secret.yaml
  - keycloak-admin-user-secret.yaml
  - paperless-client-secret.yaml
  - zot-client-secret.yaml
  - immich-client-secret.yaml
  - securitypolicy-referencegrant.yaml
  - setup-job.yaml
  - config-cli-job.yaml
  - google-idp-secret.yaml
  - edge-client-secret.yaml
  - cilium-policy.yaml
  - postgres-backup-cronjob.yaml
  - postgres-cluster.yaml
  - backup-s3-secret.yaml
  - backup-netpol.yaml

configMapGenerator:
  # Standalone ConfigMap (not folded into keycloak-setup-script) so
  # rbac-groups.json stays a real, independently lintable file --
  # .github/workflows/rbac-guardrail.yml evaluates it directly against
  # policy/rbac_guardrail.rego on every PR that touches it.
  #
  # disableNameSuffixHash: kustomize's nameReference rewrite doesn't reach
  # into a Job's spec.template.spec.volumes[].configMap.name (confirmed via
  # a local kustomize build -- the hashed name propagated to the generated
  # ConfigMap but setup-job.yaml's volume reference stayed unhashed,
  # which would 404 at apply time). A content change re-running the setup
  # Job is already handled by the existing run-id-bump convention
  # (setup-job.yaml's own comment), so the hash suffix's usual
  # rollout-triggering purpose isn't needed here anyway.
  - name: keycloak-rbac-groups
    namespace: keycloak
    files:
      - rbac-groups.json
    options:
      disableNameSuffixHash: true

  # The declarative realm state keycloak-config-cli applies. Same
  # disableNameSuffixHash reasoning as above: the CronJob's volume reference
  # would not be rewritten to a hashed name.
  - name: keycloak-realm-config
    namespace: keycloak
    files:
      - realm-config/homelab.yaml
      - realm-config/master.yaml
    options:
      disableNameSuffixHash: true
  # The upload half of this namespace's database backup. Generated from the
  # single shared script rather than copied: cluster/base/infrastructure/
  # _shared/backup-upload.sh is the only implementation, and all four backup
  # jobs generate their own namespaced ConfigMap from that one file.
  #
  # disableNameSuffixHash for the reason already recorded above -- kustomize's
  # nameReference rewrite does not reach into a Job's
  # spec.template.spec.volumes[].configMap.name, so a hashed name would 404 at
  # apply time.
  - name: backup-upload-script
    namespace: keycloak
    files:
      - upload.sh=../_shared/backup-upload.sh
    options:
      disableNameSuffixHash: true
