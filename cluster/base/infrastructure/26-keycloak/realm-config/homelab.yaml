# Declarative realm state, applied by keycloak-config-cli.
#
# ── What this file is for ────────────────────────────────────────────────────
# setup-job.yaml creates things and never removes them. Every ensure_* function
# in it is create-if-missing, so a group added by hand in the admin console
# survives every run for ever, and the CI rego cannot see it either -- that
# check reads rbac-groups.json, not Keycloak. This file closes that gap: what is
# declared here is what the realm converges to.
#
# ── Scope, deliberately partial ──────────────────────────────────────────────
# Only realm-level login settings and the group tree are declared. Clients,
# client scopes and protocol mappers stay with setup-job.yaml for now, because
# moving eight working OIDC clients in the same change that enables public
# registration is two risks wearing one coat. The config-cli Job sets
# import.managed.client=no-delete so it cannot touch them regardless.
#
# The safety property this introduction leans on is documented upstream: with
# import.remote-state.enabled (the default), keycloak-config-cli "purges only
# resources they created before". On a first run it has created nothing, so it
# can delete nothing.
realm: homelab
enabled: true

# ── Self-registration ────────────────────────────────────────────────────────
# registrationAllowed puts a "Register" link on the login page of a realm that
# is reachable from the public internet. Anyone who finds it can create a
# working account.
#
# That is acceptable only because of where those accounts land: defaultGroups
# drops every new registration into /self-service, which grants read-only
# access to Paperless and Immich and nothing else -- and in Paperless that
# resolves to the documents they own, which for a new account is none.
#
# verifyEmail is FALSE, and not by choice. The realm has no smtpServer
# configured, so Keycloak cannot send a verification mail; setting it true would
# leave every registration stranded awaiting an email that is never sent.
# resetPasswordAllowed is false for the same reason -- a reset link needs SMTP.
#
# Configure SMTP and both should be turned on. Until then registration is
# unverified, which means an address nobody owns can hold an account.
registrationAllowed: false
registrationEmailAsUsername: false
loginWithEmailAllowed: true
verifyEmail: false
resetPasswordAllowed: false

defaultGroups:
  - /self-service

# ── Federated registration ───────────────────────────────────────────────────
# Signing up happens through Google, not through a local Register form.
#
# This is what makes registrationAllowed: false above tolerable rather than a
# regression. Local registration was open and unverifiable -- the realm has no
# smtpServer, so Keycloak could not send a confirmation mail, and anyone finding
# the login page could create an account against an address they did not own.
# Federating hands verification to a party that already did it, and removes the
# need for outbound mail from this cluster entirely.
#
# There is no OAuth provider that avoids registering a client first; that is
# inherent to OAuth, not a Google quirk. The client id below is public by
# design. The secret is not, and arrives via var substitution from a SOPS-backed
# environment variable on the config-cli Job.
#
# trustEmail is true because Google verifies addresses before it will assert
# them. Leaving it false makes Keycloak demand its own verification -- by email
# -- which is the exact dependency this design exists to remove.
identityProviders:
  - alias: google
    displayName: Google
    providerId: google
    enabled: true
    trustEmail: true
    storeToken: false
    addReadTokenRoleOnCreate: false
    linkOnly: false
    firstBrokerLoginFlowAlias: first broker login
    config:
      clientId: $(env:GOOGLE_CLIENT_ID)
      clientSecret: $(env:GOOGLE_CLIENT_SECRET)
      defaultScope: openid email profile
      syncMode: IMPORT
      useJwksUrl: "true"

# Every account arriving through Google is put in /self-service, explicitly.
#
# defaultGroups above would probably cover it -- Keycloak applies default groups
# when the broker creates the local user -- but "probably" is not a basis for a
# privilege boundary. This mapper states it outright, so the group assignment
# does not depend on which code path created the account.
#
# syncMode INHERIT follows the provider's IMPORT above: group membership is set
# when the account is first created and not rewritten on later logins, so an
# admin who later promotes someone to a real tier does not have that undone by
# their next sign-in.
identityProviderMappers:
  - name: self-service-group
    identityProviderAlias: google
    identityProviderMapper: oidc-hardcoded-group-idp-mapper
    config:
      group: /self-service
      syncMode: INHERIT

# ── Groups ───────────────────────────────────────────────────────────────────
# The three ADR-002 tiers with their level-1 job functions, exactly as
# rbac-groups.json declares them and the CI rego validates them, plus the flat
# self-service group.
#
# self-service is deliberately NOT part of the ADR-002 hierarchy and not in
# rbac-groups.json. That file describes the depth-1 privilege tiers; a group for
# unvetted public signups is not a privilege tier, and adding it would make the
# guardrail assert a parent for something that must never inherit one.
groups:
  - name: reader
    subGroups:
      - name: viewer
  - name: maintainer
    subGroups:
      - name: app-operator
  - name: owner
    subGroups:
      - name: platform-admin
  - name: self-service
    attributes:
      description:
        - "Public self-registration. Read-only, own content only. Never grant this group anything by adding permissions to it -- add a real tier instead."

# ── Clients ──────────────────────────────────────────────────────────────────
# Declared here rather than created by setup-job.yaml's Python.
#
# The Job creates clients imperatively, one ensure_client() call plus one env
# var plus one SOPS secret each, and Job.spec.template is immutable -- so every
# client change needs the Job renamed or the whole flux-system Kustomization
# fails on the immutable field. That failure took the cluster's reconciliation
# down twice on 2026-08-26 while an application was being removed. Declaring
# clients here removes the Job from the path entirely for the common case of
# adding or changing an app.
#
# ── What is deliberately NOT declared ────────────────────────────────────────
# defaultClientScopes and optionalClientScopes are omitted on purpose. Live,
# they hold Keycloak's builtins -- web-origins, acr, profile, roles, basic,
# email -- plus `groups` as optional. Listing them here means listing them
# exhaustively, and any omission silently strips the builtins, taking the email
# and profile claims with them. Scope linkage stays with setup-job.yaml, which
# adds `groups` to the builtins rather than replacing them. Scopes change
# rarely; clients change per app, which is the whole point of moving these.
clients:
  - clientId: grafana
    name: Grafana
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - https://grafana.homelab.data-harness.org/*
    webOrigins:
      - https://grafana.homelab.data-harness.org
    secret: $(env:GRAFANA_CLIENT_SECRET)
  - clientId: paperless
    name: Paperless-ngx
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - https://paperless.homelab.data-harness.org/accounts/oidc/keycloak/login/callback/
    webOrigins:
      - https://paperless.homelab.data-harness.org
    secret: $(env:PAPERLESS_CLIENT_SECRET)
  # ── Shared edge-authentication client ──────────────────────────────────────
  # One client for every app gated at the Gateway rather than by its own OIDC
  # integration. hubble and kubeopencode both use it; anything added later that
  # needs a login but has no native SSO uses it too, with no Keycloak change --
  # an HTTPRoute and a SecurityPolicy referencing this client is the whole cost.
  #
  # The wildcard redirect is what makes that work, and it is the trade being
  # made: Keycloak will send a token to any host under the domain, so every
  # subdomain sits inside this client's trust boundary. Acceptable because the
  # whole domain is this cluster's Gateway and external-dns is the only thing
  # creating records under it.
  #
  # It is also why this client stays edge-only. Apps holding their own user
  # data keep a dedicated client with an exact redirect URI -- grafana,
  # paperless, immich and zot all do -- so a wildcard match can never land a
  # token meant for one of them somewhere else.
  - clientId: homelab-edge
    name: Homelab Edge Auth
    description: Shared client for Gateway-level OIDC. Wildcard redirect; edge-gated apps only.
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    # Each edge-gated host listed explicitly. A wildcard was tried first and
    # does not work: Keycloak matches `*` only as a trailing wildcard in the
    # PATH, not in the host. `https://*.homelab.data-harness.org/oauth2/callback`
    # was accepted by the admin API without complaint and then rejected every
    # authorization request with "Invalid parameter: redirect_uri".
    #
    # grafana's `https://grafana.homelab.data-harness.org/*` looks like a
    # counter-example but is not -- that is a path wildcard on a fixed host,
    # which is the supported form.
    #
    # So adding an edge-gated app costs one line here. That is still the point
    # of this client: one line in a list that config-cli reconciles hourly,
    # rather than a new client, a new secret, a new env var and a rename of an
    # immutable Job.
    redirectUris:
      - https://hubble.homelab.data-harness.org/oauth2/callback
      - https://kubeopencode.homelab.data-harness.org/oauth2/callback
    webOrigins:
      - https://hubble.homelab.data-harness.org
      - https://kubeopencode.homelab.data-harness.org
    secret: $(env:EDGE_CLIENT_SECRET)
  - clientId: hubble
    name: Hubble UI
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - https://hubble.homelab.data-harness.org/oauth2/callback
    webOrigins:
      - https://hubble.homelab.data-harness.org
    secret: $(env:HUBBLE_CLIENT_SECRET)
  - clientId: kubeopencode
    name: KubeOpenCode
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - https://kubeopencode.homelab.data-harness.org/oauth2/callback
    webOrigins:
      - https://kubeopencode.homelab.data-harness.org
    secret: $(env:KUBEOPENCODE_CLIENT_SECRET)
  - clientId: zot
    name: zot
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - https://zot.homelab.data-harness.org/zot/auth/callback/oidc
    webOrigins:
      - https://zot.homelab.data-harness.org
    secret: $(env:ZOT_CLIENT_SECRET)
  - clientId: immich
    name: Immich
    enabled: true
    protocol: openid-connect
    publicClient: false
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - https://immich.homelab.data-harness.org/auth/login
      - https://immich.homelab.data-harness.org/user-settings
    webOrigins:
      - https://immich.homelab.data-harness.org
    secret: $(env:IMMICH_CLIENT_SECRET)
  - clientId: kubernetes
    name: Kubernetes
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    authorizationServicesEnabled: false
    redirectUris:
      - http://localhost:8000/callback
      - http://localhost:18000
      - http://localhost:8000
    webOrigins:
      - http://localhost:18000
      - http://localhost:8000
