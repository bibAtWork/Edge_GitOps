# Google OAuth client credentials for federated registration.
#
# Consumed by config-cli-job.yaml as environment variables and substituted into
# identityProviders.google.config in realm-config/homelab.yaml via $(env:...),
# so neither value ever appears in the realm file.
#
# ── Reconfiguring ────────────────────────────────────────────────────────────
# The client lives in Google Cloud project homelab-506705, under
# https://console.cloud.google.com/apis/credentials
#
#   Application type:         Web application
#   Authorised redirect URI:  https://keycloak.homelab.data-harness.org/realms/homelab/broker/google/endpoint
#
# The redirect URI must match exactly, including the realm name. Google rejects
# a mismatch with redirect_uri_mismatch on its own page, so nothing appears in
# Keycloak's logs and the failure looks like Keycloak's fault.
#
# ── Consent screen publishing status ─────────────────────────────────────────
# The OAuth consent screen must be "In production", not "Testing". In Testing
# only explicitly listed test users can sign in, capped at 100, and refresh
# tokens expire after 7 days -- so federation appears to work for whoever set it
# up and silently refuses everyone else.
#
# Publishing needs no Google review here: verification is required only for
# sensitive or restricted scopes, and this client requests openid, email and
# profile, all of which are non-sensitive.
#
# ── Rotating ─────────────────────────────────────────────────────────────────
#   ./bootstrap/scripts/rotate-secrets.py credential \
#     --file cluster/base/infrastructure/26-keycloak/google-idp-secret.yaml \
#     --key GOOGLE_CLIENT_SECRET
#
# The client id is not secret -- Google publishes it in the authorisation
# redirect -- but it lives here so both halves rotate together rather than being
# split between an encrypted file and a plain manifest.
