# Google OAuth client credentials for federated registration.
#
# ── You must fill these in before federation works ───────────────────────────
# Create an OAuth 2.0 Client ID at https://console.cloud.google.com/apis/credentials
#
#   Application type:            Web application
#   Authorised redirect URI:     https://keycloak.homelab.data-harness.org/realms/homelab/broker/google/endpoint
#
# The redirect URI must match exactly, including the realm name and the trailing
# path. Google rejects the sign-in with redirect_uri_mismatch otherwise, and the
# error surfaces on Google's page rather than in Keycloak's logs.
#
# Then replace both values and re-encrypt:
#
#   ./bootstrap/scripts/rotate-secrets.py credential \
#     --file cluster/base/infrastructure/26-keycloak/google-idp-secret.yaml \
#     --key GOOGLE_CLIENT_ID
#   ./bootstrap/scripts/rotate-secrets.py credential \
#     --file cluster/base/infrastructure/26-keycloak/google-idp-secret.yaml \
#     --key GOOGLE_CLIENT_SECRET
#
# Until then the Google button appears on the login page and fails on click.
# Nothing else breaks: existing accounts still sign in with username and
# password, because registrationAllowed only governs the Register link, not
# login. What is unavailable in the meantime is new signups.
#
# The client id is not secret -- Google publishes it in the authorisation
# redirect -- but it lives here anyway so both halves rotate together and
# neither is split between an encrypted file and a plain manifest.
apiVersion: v1
kind: Secret
metadata:
    name: keycloak-google-idp
    namespace: keycloak
type: Opaque
stringData:
    GOOGLE_CLIENT_ID: ENC[AES256_GCM,data:OCHyfuA8ruf7oUxFY0QtDfOScM8MbAuRfiO/Tf4=,iv:n3TmK2JCGvqF8g5EOXBdAHbNlEn9OWabEb8hRRuq7SM=,tag:z3u2/etlmuCc9RZGhDOwQw==,type:str]
