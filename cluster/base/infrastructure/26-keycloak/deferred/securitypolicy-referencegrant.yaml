# Allows SecurityPolicy.oidc (kube-system/hubble-oidc, kubeopencode-system/
# kubeopencode-oidc) to reference the keycloak
# Service here as their provider.backendRef. Required for any cross-namespace
# backendRef per the Gateway API spec — same requirement
# 24-opa/referencegrant.yaml satisfies for OPA's own cross-namespace
# ext_authz backendRef.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-securitypolicy-oidc
  namespace: keycloak
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kube-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: kubeopencode-system
  to:
    - group: ""
      kind: Service
      name: keycloak
