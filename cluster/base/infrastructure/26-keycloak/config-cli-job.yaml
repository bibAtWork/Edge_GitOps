# keycloak-config-cli — converges the realm onto realm-config/homelab.yaml.
#
# Runs hourly rather than once. The point of adopting this tool is not that the
# config is declarative -- setup-job.yaml is already idempotent -- it is that a
# change made by hand in the admin console does not survive. Detecting drift and
# removing it are different guarantees, and only the second is worth having when
# the thing drifting is an identity provider.
#
# Image tag pairs the tool version with the Keycloak it targets (a.b.c-x.y.z).
# keycloak-config-cli supports roughly the latest four Keycloak releases, so this
# must move with the Keycloak image in deployment.yaml, not independently.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: keycloak-config-cli
  namespace: keycloak
spec:
  schedule: "40 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: keycloak-config-cli
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: config-cli
              image: docker.io/adorsys/keycloak-config-cli:6.4.1-26.0.5
              env:
                - name: KEYCLOAK_URL
                  value: http://keycloak.keycloak.svc
                # The permanent realm admin, not the bootstrap KEYCLOAK_ADMIN.
                # setup-job.yaml creates it and then deletes the bootstrap
                # account, so this is the credential that keeps working.
                - name: KEYCLOAK_USER
                  value: admin@homelab.internal
                - name: KEYCLOAK_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-admin-user
                      key: password
                - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
                  value: "true"
                - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
                  value: 120s
                - name: IMPORT_FILES_LOCATIONS
                  value: /config/homelab.yaml
                # Purge only what this tool created. Documented upstream as the
                # default; set explicitly because the alternative -- deleting
                # every realm entity absent from the import file -- would remove
                # all eight OIDC clients on the first run and take down every
                # login in the cluster.
                - name: IMPORT_REMOTESTATE_ENABLED
                  value: "true"
                # Belt and braces on top of remote-state. Clients are owned by
                # setup-job.yaml during this transition and this tool must not
                # delete them even if it somehow adopts them.
                - name: IMPORT_MANAGED_CLIENT
                  value: no-delete
                - name: IMPORT_VARSUBSTITUTION_ENABLED
                  value: "true"
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  # JVM. 256Mi is not enough to start it, and the namespace
                  # carries no LimitRange to catch that for us.
                  memory: 768Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: realm-config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: realm-config
              configMap:
                name: keycloak-realm-config
            - name: tmp
              emptyDir: {}
