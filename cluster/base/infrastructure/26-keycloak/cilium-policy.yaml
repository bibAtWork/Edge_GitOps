---
# Allow Keycloak and PostgreSQL to communicate within the namespace.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace-egress
  namespace: keycloak
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
# Companion ingress rule for the above: now that allow-gateway-ingress below
# actually matches the real Keycloak pod (see its note), Keycloak's ingress
# is genuinely restricted for the first time. Same-namespace callers — e.g.
# the keycloak-setup Job, which talks to Keycloak over internal service DNS —
# need an explicit allow or they'd be newly blocked by this fix.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace-ingress
  namespace: keycloak
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
---
# allow-gateway-ingress (fromEntities: [ingress]) removed 2026-08-17: that Cilium reserved
# entity stopped matching anything once the Gateway moved off Cilium's own embedded
# GatewayClass onto Envoy Gateway (2026-08-16, ADR-001) -- this rule had already gone back
# to being a silent no-op (Keycloak's actual gateway reachability was carried entirely by
# allow-cluster-internal since the cutover). Now covered by the new clusterwide
# allow-gateway-ingress (10-network-policies/allow-gateway-ingress.yaml) -- NOT the same as
# this file's own allow-envoy-gateway-ingress below, which is a different, OIDC-specific
# rule (SecurityPolicy.oidc token/JWKS calls) that was already correct and untouched here.
---
# Allow OPA to reach Keycloak directly for JWKS fetches (Bearer token
# verification in 24-opa/configmap.yaml). Direct pod-to-pod, not via gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-opa-ingress
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      app: keycloak
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: opa
            io.kubernetes.pod.namespace: security
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Allow Paperless-ngx to reach Keycloak directly (internal service DNS) for
# its OIDC discovery/token/userinfo calls. Needed because Paperless can't
# reach Keycloak's external hostname through the gateway — same unresolved
# issue documented in project_opa_hubble_ui_broken.md's sibling finding:
# some source namespaces (paperless, security) get a 403 "Access denied"
# from Cilium's gateway listener that others (monitoring) don't, for
# reasons not yet root-caused. Direct pod-to-pod sidesteps it entirely,
# matching the same pattern already proven for OPA above.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-paperless-ingress
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      app: keycloak
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: paperless-ngx
            io.kubernetes.pod.namespace: paperless
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# Allow Envoy Gateway's data-plane pod to reach Keycloak directly for OIDC
# discovery, token exchange, and JWKS (SecurityPolicy.oidc, added 2026-08-16
# for hubble-ui and kubeopencode).
#
# Deliberately scoped to the whole envoy-gateway-system namespace rather than
# one rule per app, unlike allow-opa-ingress/allow-paperless-ingress above:
# every app that adopts SecurityPolicy.oidc calls Keycloak through this same
# pod regardless of which HTTPRoute triggered it, so one rule covers all
# current and future apps using this pattern — no new CiliumNetworkPolicy
# needed here when the next app gets Keycloak login this way. Contrast with
# Paperless and OPA above, which each call Keycloak directly from their own
# namespace and therefore do need their own rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-gateway-ingress
  namespace: keycloak
spec:
  endpointSelector:
    matchLabels:
      app: keycloak
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
