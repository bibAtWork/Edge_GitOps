apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argo-workflows
  namespace: backup-system
  annotations:
    # How this route authenticates -- checked against Keycloak, the
    # SecurityPolicies and OPA by scripts/check-platform-contracts.py.
    gitops.homelab/auth: native-oidc
    gitops.homelab/auth-client: argo-workflows
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - argo.homelab.data-harness.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argo-workflows-server
          port: 2746
