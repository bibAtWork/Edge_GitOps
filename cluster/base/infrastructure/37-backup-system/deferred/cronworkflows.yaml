# A recovery point per application, daily (ADR-012).
#
# 01:00: chosen to run clear of the old pipeline's 02:00-09:00 chain, back
# when both ran side by side. The old pipeline is gone (#617, #621), but
# 01:00 is still a reasonable slot on its own merits -- before promotion
# (03:00) and local retention (04:00), which both depend on the night's
# points already existing.
#
# startingDeadlineSeconds is what makes "offline is not failure" true here: when
# the node comes back after missing the slot, the run happens once, then, and
# missed slots are not replayed. Unlike the old pipeline's independent CronJobs,
# a late run is still in order -- clone, back up, restore-test and record are
# one DAG.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: recovery-point-immich
  namespace: backup-system
spec:
  schedules:
    - "0 1 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  workflowSpec:
    workflowTemplateRef:
      name: recovery-point
    arguments:
      parameters:
        - name: application
          value: immich
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: recovery-point-paperless
  namespace: backup-system
spec:
  schedules:
    - "0 1 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  workflowSpec:
    workflowTemplateRef:
      name: recovery-point
    arguments:
      parameters:
        - name: application
          value: paperless
---
# Promotion to AWS, daily at 03:00, two hours after the recovery points. It only
# takes points that are already VALIDATED, so a recovery point still running at
# 03:00 is promoted the next day. Both applications start together; the promote
# template's mutex runs them one after the other.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: promote-immich
  namespace: backup-system
spec:
  schedules:
    - "0 3 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  workflowSpec:
    workflowTemplateRef:
      name: promote
    arguments:
      parameters:
        - name: application
          value: immich
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: promote-paperless
  namespace: backup-system
spec:
  schedules:
    - "0 3 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  workflowSpec:
    workflowTemplateRef:
      name: promote
    arguments:
      parameters:
        - name: application
          value: paperless
---
# Retention. Local daily at 04:00, after the recovery points (01:00) and their
# promotion (03:00), so a point is offered to AWS before local retention can
# touch it. AWS weekly, Sundays at 04:30: every prune there leaves the replaced
# packs behind as noncurrent versions for 45 days, so thinning less often costs
# less. Each run waits for a promotion or backup still running, by mutex and by
# restic's lock.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: retention-local
  namespace: backup-system
spec:
  schedules:
    - "0 4 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  workflowSpec:
    workflowTemplateRef:
      name: retention
    arguments:
      parameters:
        - name: repository
          value: local
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: retention-aws
  namespace: backup-system
spec:
  schedules:
    - "30 4 * * 0"
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 86400
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  workflowSpec:
    workflowTemplateRef:
      name: retention
    arguments:
      parameters:
        - name: repository
          value: aws
---
# The PostgreSQL applications (ADR-012): a recovery point and its promotion on
# the same schedule as the others. Keycloak's point is its database; the
# SeaweedFS point is the filer's metadata database, without which every object
# in the store is an anonymous chunk.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: recovery-point-keycloak
  namespace: backup-system
spec:
  schedules:
    - "0 1 * * *"
  timezone: UTC
  concurrencyPolicy: Forbid
