# The local restic repository (ADR-012): where it is, and the key to it.
#
# RESTIC_PASSWORD encrypts every snapshot in the repository. It is NOT
# recoverable from anything else: lose it and every restic backup here and in
# the AWS repository is unreadable. Keep a copy outside the cluster with the
# age key, in the operator's password manager -- the cluster that holds this
# secret is the thing the backups exist to outlive.
#
# The S3 keys are the SeaweedFS admin credential, reused as CLAUDE.md requires
# (one credential, with 10-network-policies/allow-seaweedfs-internal.yaml as
# the authorisation boundary). Encrypted with SOPS; edit with `sops`.
