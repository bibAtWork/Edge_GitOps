# The recovery system's policy (ADR-012): what has to be recoverable, how well,
# and how each dataset is protected.
#
# Same shape as 34-backup/backup-policy.yaml, which describes the current
# pipeline and is removed with it at cutover. Plain whitespace tables, `#` to end
# of line is a comment; read by busybox shell in the workflows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recovery-policy
  namespace: backup-system
data:
  # Unchanged from the architecture: RPO 24h; RTO 4h critical, 8h important;
  # restore test at least weekly / monthly; offsite required; local 7/3/3, AWS 1/3.
  profiles: |
    # profile        rpo  rto  restore_test  offsite  local  remote
    critical         24h  4h   7d            48h      7/3/3  1/3
    important        24h  8h   31d           48h      7/3/3  1/3
    reconstructable  -    -    -             -        -      -

  applications: |
    # application  criticality      profile
    immich         critical         critical
    keycloak       critical         critical
    paperless      important        important
    seaweedfs      important        important

  # adapter
  #   restic-volume  snapshot clone of the volume -> restic, file level
  #   sqlite-volume  snapshot clone -> SQLite online backup of one file -> restic
  #   cnpg           CNPG barman-cloud: WAL archiving + base backups (follows)
  # paths
  #   restic-volume  comma-separated directories on the volume; everything else
  #                  on it is derived and deliberately left out (see below)
  #   sqlite-volume  the database file
  datasets: |
    # dataset          application  adapter        source                            paths
    immich-media       immich       restic-volume  pvc:immich/immich-library-lh      upload,library,profile
    paperless-media    paperless    restic-volume  pvc:paperless/paperless-media-lh  documents/originals,documents/archive
    paperless-db       paperless    sqlite-volume  pvc:paperless/paperless-data-lh   db.sqlite3

  # Beyond "the file opened and integrity_check said ok": one read-only query per
  # row against the restored copy, result at least `min`.
  restore-checks: |
    # dataset         min   query
    paperless-db      60    select count(*) from sqlite_master where type = 'table'
    paperless-db      1     select count(*) from auth_user
    paperless-db      1     select count(*) from documents_document

  # Derived data inside the datasets' volumes, left out on purpose. A cache that
  # can hold unique user state is not a cache; these cannot.
  #   immich-library-lh   thumbs/, encoded-video/   regenerated by Immich's jobs
  #                       backups/                  Immich's own database dumps;
  #                                                 the database is its own dataset
  #   paperless-media-lh  documents/thumbnails/     regenerated from the originals
  #   paperless-data-lh   index/                    rebuilt by document_index reindex
  #                       log/, celerybeat-schedule.db, migration_lock
  derived: |
    immich-library-lh   thumbs encoded-video backups
    paperless-media-lh  documents/thumbnails
    paperless-data-lh   index log celerybeat-schedule.db migration_lock
