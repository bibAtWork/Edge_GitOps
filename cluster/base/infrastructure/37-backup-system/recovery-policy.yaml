# The recovery system's policy (ADR-012): what has to be recoverable, how well,
# and how each dataset is protected.
#
# Plain whitespace tables, `#` to end of line is a comment; read by busybox
# shell in the workflows.
apiVersion: v1
kind: ConfigMap
metadata:
  name: recovery-policy
  namespace: backup-system
data:
  # Unchanged from the architecture: RPO 24h; RTO 4h critical, 8h important;
  # restore test at least weekly / monthly; offsite required; local 7/3/3, AWS 1/3.
  profiles: |
    # profile        rpo  rto  restore_test  offsite  local  remote
    critical         24h  4h   7d            48h      7/3/3  1/3
    important        24h  8h   31d           48h      7/3/3  1/3
    reconstructable  -    -    -             -        -      -

  applications: |
    # application  criticality      profile
    immich         critical         critical
    keycloak       critical         critical
    paperless      important        important
    seaweedfs      important        important

  # adapter
  #   restic-volume  snapshot clone of the volume -> restic, file level
  #   sqlite-volume  snapshot clone -> SQLite online backup of one file -> restic
  #   cnpg           a CNPG cluster's base backup and the WAL that makes it
  #                  consistent, from its barman archive into restic
  # source
  #   pvc:<namespace>/<claim> for the volume adapters, cnpg:<namespace>/<cluster>
  # paths
  #   restic-volume  comma-separated directories on the volume; everything else
  #                  on it is derived and deliberately left out (see below)
  #   sqlite-volume  the database file
  #   cnpg           - (the whole database)
  datasets: |
    # dataset          application  adapter        source                            paths
    immich-media       immich       restic-volume  pvc:immich/immich-library-lh      upload,library,profile
    paperless-media    paperless    restic-volume  pvc:paperless/paperless-media-lh  documents/originals,documents/archive
    paperless-db       paperless    sqlite-volume  pvc:paperless/paperless-data-lh   db.sqlite3
    keycloak-db        keycloak     cnpg           cnpg:keycloak/keycloak-pg         -
    filer-db           seaweedfs    cnpg           cnpg:seaweedfs/filer-meta-pg      -
    immich-db          immich       cnpg           cnpg:immich/immich-pg             -

  # Ceilings, so no mistake -- a bug that re-uploads, a backup pointed at the
  # wrong volume, files rewritten wholesale -- turns into an unbounded bill or a
  # full disk. Units: KiB, MiB, GiB, TiB; growth-percent is a plain number.
  #
  #   aws-repository    ENFORCED: promotion refuses to push the AWS repository
  #                     past it. 60 GiB is about EUR 1.50 a month in S3
  #                     Standard, well inside the ~EUR 10 budget with room for
  #                     pruned versions held 45 days and for requests.
  #   local-repository  ALERT: the local repository always holds everything the
  #                     AWS one does plus more history (7/3/3 against 1/3), so it
  #                     must be allowed to be larger, and never a blocker -- a
  #                     full local repository must not mean no backups.
  #
  #                     Both caps are sized to the SeaweedFS partition the local
  #                     repository actually lives on -- 120 GiB, not the whole
  #                     460 GiB NVMe -- because SeaweedFS and Longhorn are two
  #                     partitions of that one disk (controlplane.yaml), so
  #                     losing it loses production data too, not only backups.
  #                     That partition also holds Zot's registry blobs and every
  #                     barman WAL archive, so 80 GiB for the repository (never
  #                     reached at anything close to today's usage) leaves real
  #                     headroom for both rather than assuming the repository
  #                     can grow into space those already claim. Found on code
  #                     review: the previous 300/250 GiB pair both individually
  #                     exceeded the 120 GiB partition, so local always filled
  #                     first and neither cap could ever fire.
  #   growth-*          ALERT: a single backup adding more than growth-bytes, or
  #                     more than growth-percent of the dataset once that exceeds
  #                     growth-floor. Bulk imports trip it legitimately; so does
  #                     every file being rewritten at once, which is what
  #                     ransomware looks like to a backup. The floor keeps one
  #                     new document in a small library from counting as 50%.
  #   forget-*          ENFORCED by retention, on its dry run, before anything is
  #                     deleted: one run may remove at most forget-max snapshots
  #                     from a dataset, and release at most forget-loss-percent of
  #                     its repository's data once that exceeds forget-loss-floor.
  #                     A schedule typo, a clock gone wrong, or photos deleted
  #                     months ago leaving the last monthly snapshot all show up
  #                     as a run that thins far more than usual. Letting one
  #                     through is a reviewed change to these numbers, not a
  #                     decision retention makes.
  limits: |
    # limit             value
    aws-repository      60GiB
    local-repository    80GiB
    growth-bytes        5GiB
    growth-percent      50
    growth-floor        100MiB
    forget-max          10
    forget-loss-percent 20
    forget-loss-floor   1GiB

  # Beyond "the file opened and integrity_check said ok": one read-only query per
  # row against the restored copy, result at least `min`.
  restore-checks: |
    # dataset         min   query
    paperless-db      60    select count(*) from sqlite_master where type = 'table'
    paperless-db      1     select count(*) from auth_user
    paperless-db      1     select count(*) from documents_document
    keycloak-db       2     select count(*) from realm
    keycloak-db       1     select count(*) from user_entity
    keycloak-db       10    select count(*) from client
    filer-db          1000  select count(*) from filemeta
    immich-db         1     select count(*) from asset
    immich-db         1     select count(*) from "user"
    immich-db         1     select count(*) from smart_search

  # Derived data inside the datasets' volumes, left out on purpose. A cache that
  # can hold unique user state is not a cache; these cannot.
  #   immich-library-lh   thumbs/, encoded-video/   regenerated by Immich's jobs
  #                       backups/                  Immich's own database dumps;
  #                                                 the database is its own dataset
  #   paperless-media-lh  documents/thumbnails/     regenerated from the originals
  #   paperless-data-lh   index/                    rebuilt by document_index reindex
  #                       log/, celerybeat-schedule.db, migration_lock
  derived: |
    immich-library-lh   thumbs encoded-video backups
    paperless-media-lh  documents/thumbnails
    paperless-data-lh   index log celerybeat-schedule.db migration_lock
