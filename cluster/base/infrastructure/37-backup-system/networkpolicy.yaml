# Network reach of the recovery system (ADR-012).
#
# The cluster-wide defaults already give every pod the API server, DNS and the
# internet on 443 -- which is also how the AWS repository is reached. What this
# namespace adds is exactly three things: its own pods (the Argo controller and
# the workflow pods it runs), the local backup target, and the metrics push.
#
# Deliberately NOT here: any path to an application's pods or databases. Data is
# read from Longhorn snapshot clones mounted as volumes, and PostgreSQL is
# archived from inside the database pods by CNPG, so nothing in this namespace
# ever connects to an application.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: backup-system
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - {}
---
# argo-server authenticates nothing (authModes: [server], argo-workflows.yaml)
# -- every caller acts with the server's own namespaced Role, which can
# create, update and delete Workflows, WorkflowTemplates and CronWorkflows.
# It's meant to be reached only by a human via `kubectl port-forward
# svc/argo-workflows-server 2746`, which enters through the kubelet and does
# not cross the CNI datapath Cilium enforces -- but allow-intra-namespace
# above also lets every OTHER pod in this namespace reach it over the pod
# network, which was never the intent, and this namespace also runs scratch
# PostgreSQL restored from production data. Found on code review.
#
# ingressDeny overrides any Allow for the same endpoint (unlike two Allow
# policies, which OR) -- see restrict-vmsingle-ingress in
# 10-network-policies/allow-monitoring.yaml for the same pattern -- so this
# closes the pod-network path regardless of what allow-intra-namespace grants,
# without narrowing what allow-intra-namespace does for anything else.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: deny-argo-server-ingress
  namespace: backup-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: argo-workflows-server
  ingressDeny:
    - fromEndpoints:
        - {}
---
# The local repository. S3 on the filer, and nothing else in SeaweedFS. The
# matching ingress side is in 10-network-policies/allow-seaweedfs-internal.yaml,
# which is the S3 authorisation boundary (CLAUDE.md).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-seaweedfs-s3-egress
  namespace: backup-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/component: filer
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
---
# Workflows push their evidence to VictoriaMetrics' import endpoint. Both
# directions are needed: default-deny applies to vmsingle's ingress too.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-vmsingle-egress
  namespace: backup-system
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: monitoring
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-backup-system-to-vmsingle
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: backup-system
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
