# Argo Workflows: the recovery system's execution engine (ADR-012).
#
# Argo executes; it does not decide. What should be protected and how well is
# the policy's job, and what a backup is made of is the adapters'. Argo supplies
# what CronJobs could not: order (validate after the backup, promote after the
# validation), retries, timeouts and a history of every run.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: argo
  namespace: flux-system
spec:
  interval: 12h
  url: https://argoproj.github.io/argo-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argo-workflows
  namespace: backup-system
spec:
  interval: 30m
  chart:
    spec:
      chart: argo-workflows
      version: "2.0.6"
      sourceRef:
        kind: HelmRepository
        name: argo
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  # The recovery system runs on this release (ADR-012, F5). An object of it that
  # is deleted or edited by hand is put back on the next reconcile; to change one
  # by hand, suspend the HelmRelease first.
  driftDetection:
    mode: enabled
  values:
    # One controller, one namespace. singleNamespace swaps every ClusterRole for
    # a Role in backup-system and starts the controller with --namespaced, so
    # the engine that runs backups can touch nothing outside the namespace that
    # holds them. It is not a general-purpose workflow platform for the
    # cluster, and should not quietly become one.
    singleNamespace: true
    crds:
      install: true
      # Deleting the CRDs deletes every Workflow and its history with them.
      keep: true
    createAggregateRoles: false
    images:
      pullPolicy: IfNotPresent

    # The identity workflow pods run as. Its permissions beyond running
    # workflows (snapshots, clones) are granted where they are needed, next to
    # the templates that use them, so each grant sits beside its reason.
    workflow:
      serviceAccount:
        create: true
        name: backup-workflow
      rbac:
        create: true

    controller:
      clusterWorkflowTemplates:
        enabled: false
      # Unset by default: a Workflow may then define its own inline
      # `templates:`, submit an arbitrary pod spec, and override fields like
      # serviceAccountName and volumes freely. Strict requires
      # workflowTemplateRef -- an inline Workflow is rejected outright -- and
      # narrows what a workflowTemplateRef submission may itself override to
      # a fixed allow-list that does not include serviceAccountName,
      # podSpecPatch or volumes. (Corrected on code review: the previous
      # version of this comment described Strict as being about templates
      # being "embedded" or, under Secure, "signed" -- neither is what these
      # modes actually check; see docs/workflow-restrictions.md upstream.)
      #
      # Closes the path where recovery-reconciler's narrow "create workflows"
      # grant (rbac-reconciler.yaml) could otherwise submit a Workflow that
      # points at an attacker-controlled template or pod spec. Doesn't close
      # the argo-server path (deny-argo-server-ingress, networkpolicy.yaml,
      # covers that): the server can edit templates and WorkflowTemplates
      # directly, which this setting does not restrict.
      #
      # Every Workflow this repo submits itself already fits: the reconciler
      # and every CronWorkflow use workflowTemplateRef with only `arguments`
      # alongside it (both on the allow-list). The four A9 drills
      # (docs/runbooks/recovery/, workflow-templates/drill-*.yaml) did not --
      # they were standalone inline Workflows until Strict started rejecting
      # every submission of them ("workflows must use workflowTemplateRef to
      # be executed when the controller is in reference mode"), found on
      # code review after this setting had already merged. Restructured into
      # a WorkflowTemplate plus a minimal referencing Workflow, matching
      # every other template in this namespace, rather than loosening Strict.
      workflowRestrictions:
        templateReferencing: Strict
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      # Applied to every Workflow unless it says otherwise. The namespace
      # enforces the restricted pod-security level; these defaults are what
      # let workflow pods pass it without every template repeating them.
      workflowDefaults:
        spec:
          serviceAccountName: backup-workflow
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          # Successful pods go at once; failed ones stay so their logs can be
          # read. The Workflow objects -- the run history -- go after a week,
          # two if they failed.
          podGC:
            strategy: OnPodSuccess
          ttlStrategy:
            secondsAfterSuccess: 604800
            secondsAfterFailure: 1209600

    # The init and wait containers Argo injects into every workflow pod. 128Mi
    # OOM-killed the init container on the first run; 256Mi is what it needs.
    executor:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
    mainContainer:
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL

    # The UI and API, for reading run history. Routed at
    # https://argo.homelab.data-harness.org (config/httproute.yaml) behind
    # Keycloak SSO -- previously ClusterIP-only, reached by `kubectl
    # port-forward -n backup-system svc/argo-workflows-server 2746`, which
    # already required cluster access and made a login redundant. Once routed
    # through the Gateway that stops being true: the Gateway itself is
    # allowed into every namespace (10-network-policies/allow-gateway-
    # ingress.yaml), so "reachable from cluster access" no longer holds and
    # authModes: [server] (no login, UI acts with the server's own
    # permissions) would mean anyone on the LAN gets full read access to
    # every workflow's history and logs.
    server:
      enabled: true
      authModes:
        - sso
      sso:
        enabled: true
        # Plain external issuer -- no issuerAlias trick. An earlier version of
        # this pinned issuer at Keycloak's internal Service instead, to dodge
        # `dial tcp 192.168.178.200:443: i/o timeout` fetching discovery over
        # the external hostname. That masked a bigger problem: go-oidc takes
        # every endpoint (authURL, tokenURL, userInfoURL, jwksURL) verbatim
        # from the discovery document (oidc.go's NewProvider: `tokenURL:
        # p.TokenURL`, no rewriting) -- and Keycloak's KC_HOSTNAME pins ALL of
        # them to the external hostname regardless of how discovery itself
        # was reached. issuerAlias only relaxes the issuer STRING check
        # (oidc.InsecureIssuerURLContext); it does nothing for tokenURL, so
        # the token exchange after login still tried the external hostname
        # and hung -- confirmed live as the "upstream request timeout" 504
        # right after a successful Keycloak sign-in.
        #
        # The actual fix is hostAliases below: keycloak.homelab.data-harness.org
        # resolves, from this pod only, straight to the Gateway's own
        # ClusterIP rather than through DNS to its external LAN IP. Every
        # endpoint above keeps using that one hostname either way, so this
        # fixes discovery, token exchange and userinfo/jwks in one place
        # instead of needing a workaround per endpoint -- and the request
        # still goes through the real Gateway (TLS termination, routing to
        # Keycloak's HTTPRoute), it just skips whatever makes the external,
        # LAN-announced IP specifically unreachable from inside the cluster
        # (confirmed live: same request against the Gateway's ClusterIP,
        # correct Host header, real backend port 10443 -- see the Service's
        # own port mapping, not 443 -- returns 200 with Keycloak's normal
        # discovery document).
        issuer: https://keycloak.homelab.data-harness.org/realms/homelab
        clientId:
          name: argo-workflows-sso
          key: client-id
        clientSecret:
          name: argo-workflows-sso
          key: client-secret
        redirectUrl: https://argo.homelab.data-harness.org/oauth2/callback
        scopes:
          - groups
        # rbac.enabled maps OIDC claims to per-user ServiceAccounts via
        # workflows.argoproj.io/rbac-rule annotations (sso-rbac.yaml), one
        # per ADR-002 tier -- platform-admin, app-operator, viewer -- the
        # same tiers every other app with a native OIDC role mapping in this
        # cluster already uses (Grafana's role_attribute_path). Was
        # explicitly disabled when SSO first landed here: enabling it with
        # no matching ServiceAccounts would have denied every SSO login
        # outright (Argo's own behavior when no rbac-rule matches), a silent
        # regression from what authModes: [server] granted everyone before.
        # Deliberately no catch-all rule for anyone outside those three
        # tiers (see sso-rbac.yaml) -- this is backup/recovery
        # infrastructure, not a surface the public-registration
        # /self-service tier should reach at all.
        rbac:
          enabled: true
      # Makes every one of the sso.issuer endpoints above (discovery, token,
      # userinfo, jwks) resolve straight to the Gateway's own ClusterIP
      # instead of through DNS to its externally-announced LAN IP -- see the
      # sso block's comment for why that specific address is unreachable
      # from this pod and confirmed reachable via this one instead.
      #
      # A ClusterIP, not a DNS name: Kubernetes hostAliases only accepts a
      # literal IP. It's stable for the life of the Service object (Envoy
      # Gateway's own, auto-created per Gateway resource) but would go stale
      # if that Service were ever deleted and recreated -- checked live
      # (kubectl get svc -n envoy-gateway-system) at merge time, not copied
      # from an old value.
      hostAliases:
        - ip: 10.110.52.100
          hostnames:
            - keycloak.homelab.data-harness.org
      # On by default, and the one grant singleNamespace does not scope: a
      # ClusterRoleBinding for cluster-wide workflow templates, which this
      # namespace-bound engine does not use.
      clusterWorkflowTemplates:
        enabled: false
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
