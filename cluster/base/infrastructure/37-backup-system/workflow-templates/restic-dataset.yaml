# File datasets into restic, and proof they come back (ADR-012).
#
#   backup        back up the policy's paths from a snapshot clone, then judge
#                 the result plausible or not
#   restore-test  restore that snapshot and compare every file's SHA-256 with the
#                 clone it was taken from
#
# Both read the clone as uid 1000 with NO fsGroup. With an fsGroup, kubelet
# re-owns and re-modes every file on mount, and restic would record the damage.
# Every file on these volumes is readable by uid 1000 as it is (checked
# 2026-09-12). If that ever stops being true, restic exits 3 ("some files could
# not be read"), and that fails the backup rather than passing as partial.
#
# restic is always given an explicit region: without one it asks SeaweedFS for
# the bucket's location, is told the bucket does not exist, and retries for
# about fifteen minutes.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: restic-dataset
  namespace: backup-system
spec:
  templates:
    - name: backup
      inputs:
        parameters:
          - name: dataset
          - name: claim
          - name: paths
          - name: recovery-point
      outputs:
        parameters:
          - name: snapshot
            valueFrom:
              path: /tmp/out/snapshot
          - name: files
            valueFrom:
              path: /tmp/out/files
          - name: bytes
            valueFrom:
              path: /tmp/out/bytes
      activeDeadlineSeconds: 7200
      retryStrategy:
        limit: 1
        retryPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: clone
          persistentVolumeClaim:
            claimName: "{{inputs.parameters.claim}}"
        - name: tmp
          emptyDir: {}
        - name: policy
          configMap:
            name: recovery-policy
      container:
        image: docker.io/restic/restic:0.19.1
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            DS="{{inputs.parameters.dataset}}"
            RP="{{inputs.parameters.recovery-point}}"
            R="restic -o s3.bucket-lookup=path -o s3.region=us-east-1"
            mkdir -p /tmp/out
            cd /data
            set --
            for P in $(echo "{{inputs.parameters.paths}}" | tr ',' ' '); do
              [ -e "$P" ] || { echo "path $P is missing on the volume"; exit 1; }
              set -- "$@" "$P"
            done

            # --host groups a dataset's snapshots for retention; the tags tie
            # each one to its dataset and recovery point.
            # restic never passes a stale lock by itself: a lock left by a process that
            # died -- a prune cut off by a power loss -- fails every later backup until
            # `restic unlock` removes it, which it does once the lock is 30 minutes old.
            # So: clear stale locks, wait up to 40 minutes for a live one, and if a dead
            # one went stale meanwhile, clear it and try once more.
            bk() { $R backup --retry-lock 40m --host "$DS" --tag "dataset=$DS" --tag "rp=$RP" --json "$@" > /tmp/backup.json; }
            $R unlock > /dev/null 2>&1 || true
            bk "$@" || { $R unlock && bk "$@"; }
            SNAP="$(grep -o '"snapshot_id":"[0-9a-f]*"' /tmp/backup.json | tail -n 1 | cut -d'"' -f4)"
            FILES="$(grep -o '"total_files_processed":[0-9]*' /tmp/backup.json | tail -n 1 | cut -d: -f2)"
            BYTES="$(grep -o '"total_bytes_processed":[0-9]*' /tmp/backup.json | tail -n 1 | cut -d: -f2)"
            [ -n "$SNAP" ] || { echo "restic reported no snapshot"; exit 1; }
            echo "snapshot $SNAP: $FILES files, $BYTES bytes"

            # Plausibility. A backup that succeeds is not yet a backup that is
            # right: an empty mount, a wiped directory or a clone of the wrong
            # volume all back up without complaint. The previous snapshot of
            # this dataset is the yardstick -- a collapse to under half its file
            # count, or to nothing, fails here, before the point can be called
            # validated. Growth is never suspicious.
            $R snapshots --host "$DS" --json --no-lock > /tmp/snapshots.json
            # Counted, not inferred: on a dataset's first backup there is no
            # previous snapshot, and "the second-to-last" is the new one itself.
            COUNT="$(grep -o '"short_id"' /tmp/snapshots.json | wc -l | tr -d ' ')"
            PREV=""
            if [ "$COUNT" -ge 2 ]; then
              PREV="$(grep -o '"total_files_processed":[0-9]*' /tmp/snapshots.json | tail -n 2 | head -n 1 | cut -d: -f2)"
            fi
            [ "${FILES:-0}" -gt 0 ] || { echo "PLAUSIBILITY: no files at all"; exit 1; }
            if [ -n "$PREV" ] && [ "$PREV" -ge 10 ] && [ "$FILES" -lt $((PREV / 2)) ]; then
              echo "PLAUSIBILITY: $FILES files, down from $PREV in the previous snapshot"
              exit 1
            fi
            echo "$SNAP" > /tmp/out/snapshot
            echo "$FILES" > /tmp/out/files
            echo "$BYTES" > /tmp/out/bytes

            # Growth and size against the policy's limits -- alerts, never a
            # failed backup. A backup that grew too much is still a backup.
            lim() { sed 's/#.*//' /policy/limits | awk -v k="$1" '
              function bytes(v,   n, u) { n = v + 0; u = v; sub(/^[0-9.]+/, "", u)
                if (u == "KiB") return n * 1024; if (u == "MiB") return n * 1048576
                if (u == "GiB") return n * 1073741824; if (u == "TiB") return n * 1099511627776
                return n }
              $1 == k { printf "%.0f", bytes($2); found = 1 } END { if (!found) exit 1 }'; }
            ADDED="$(grep -o '"data_added":[0-9]*' /tmp/backup.json | tail -n 1 | cut -d: -f2)"
            UNUSUAL=0
            if awk -v a="${ADDED:-0}" -v t="${BYTES:-0}" -v c="$COUNT" -v b="$(lim growth-bytes)" \
                   -v r="$(lim growth-percent)" -v f="$(lim growth-floor)" \
                   'BEGIN { if (c < 2) exit 1; if (a > b) exit 0; if (a > f && a * 100 > t * r) exit 0; exit 1 }'; then
              UNUSUAL=1
              echo "GROWTH: this backup added $ADDED bytes to a $BYTES-byte dataset -- alerting, not failing"
            fi
            REPO="$($R stats --mode raw-data --json --no-lock | grep -o '"total_size":[0-9]*' | cut -d: -f2)"
            CAP="$(lim local-repository)"
            OVER=0
            [ -n "$REPO" ] && [ "$REPO" -gt "$CAP" ] && OVER=1
            echo "local repository: $REPO bytes of a $CAP-byte cap"
            {
              echo "recovery_dataset_data_added_bytes{dataset=\"$DS\"} ${ADDED:-0}"
              echo "recovery_dataset_bytes{dataset=\"$DS\"} ${BYTES:-0}"
              echo "recovery_dataset_growth_unusual{dataset=\"$DS\"} $UNUSUAL"
              echo "recovery_repository_bytes{repository=\"local\"} ${REPO:-0}"
              echo "recovery_repository_cap_bytes{repository=\"local\"} $CAP"
              echo "recovery_repository_over_cap{repository=\"local\"} $OVER"
            } | wget -q -O /dev/null --post-file=- http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428/api/v1/import/prometheus \
              || echo "WARN: metric push failed"
        envFrom:
          - secretRef:
              name: restic-local
        env:
          - name: RESTIC_CACHE_DIR
            value: /tmp/cache
          - name: HOME
            value: /tmp
        volumeMounts:
          - name: clone
            mountPath: /data
          - name: tmp
            mountPath: /tmp
          - name: policy
            mountPath: /policy
            readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

    - name: restore-test
      # A pod lost to a restart, an eviction or a power cut ends in Error (the pod
      # is gone) or exits 137/143 (killed). Only those are retried: this step is
      # safe to run again, and any other exit is a real failure that must stand.
      retryStrategy:
        limit: 2
        retryPolicy: Always
        expression: "lastRetry.status == 'Error' || lastRetry.exitCode == '137' || lastRetry.exitCode == '143'"
        backoff:
          duration: 30s
          factor: "2"
      inputs:
        parameters:
          - name: dataset
          - name: claim
          - name: paths
          - name: snapshot
          - name: restore-size
      outputs:
        parameters:
          - name: verified
            valueFrom:
              path: /tmp/out/verified
      activeDeadlineSeconds: 7200
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: clone
          persistentVolumeClaim:
            claimName: "{{inputs.parameters.claim}}"
        - name: tmp
          emptyDir: {}
        # A generic ephemeral volume, not emptyDir: emptyDir is node-local
        # storage, which on this node's Talos machine config means sda -- the
        # disk Longhorn was deliberately moved OFF of, for etcd's fsync
        # latency (controlplane.yaml). The 20Gi emptyDir this replaced was
        # also a hard ceiling on any dataset: past it the kubelet evicts the
        # pod on every run, every restore test FAILED, and nothing was
        # promoted -- immich-library-lh alone is already 30Gi. Found on code
        # review; not yet hit in practice (the vault holds under 100MiB
        # today), but both problems are latent in every run regardless.
        #
        # longhorn-scratch (32-longhorn/storageclass.yaml) lands this on the
        # NVMe instead, with reclaimPolicy Delete meaning the PVC this
        # generates is fully gone -- volume included, no manual cleanup --
        # once this pod is, unlike the Retain classes used for real data.
        #
        # Sized to the source volume (restore-size, in bytes -- from
        # volume-clone.yaml's clone step, which already reads it off
        # Longhorn), not a flat guess. A fixed 100Gi here, round 1's fix,
        # was itself found on round-2 code review to risk overcommitting
        # Longhorn's scheduling budget: overprovisioning is 100% on this
        # cluster (32-longhorn/helmrelease.yaml), so it counts requested
        # size, not actual usage, and recovery points have no mutex against
        # each other -- two datasets' restore tests landing in the same
        # 01:00 run could together request 200Gi against a 340Gi partition
        # already carrying the real Longhorn volumes and snapshot clones.
        # Sizing to the actual source, typically far under 100Gi, removes
        # that risk without reintroducing a ceiling below any real dataset.
        - name: restore
          ephemeral:
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                storageClassName: longhorn-scratch
                resources:
                  requests:
                    storage: "{{inputs.parameters.restore-size}}"
      container:
        image: docker.io/restic/restic:0.19.1
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            SNAP="{{inputs.parameters.snapshot}}"
            R="restic -o s3.bucket-lookup=path -o s3.region=us-east-1"
            mkdir -p /tmp/out
            PATHS="$(echo "{{inputs.parameters.paths}}" | tr ',' ' ')"

            # --verify re-reads every restored file against the blob hashes in
            # the repository: the restore itself proves the stored data intact.
            $R restore "$SNAP" --target /restore --verify --no-lock

            # And the restored data must be the data: every file's SHA-256 against
            # the clone it was taken from, which has not changed since.
            ( cd /data && find $PATHS -type f -exec sha256sum {} + | sort -k 2 ) > /tmp/source.sha
            ( cd /restore && find $PATHS -type f -exec sha256sum {} + | sort -k 2 ) > /tmp/restored.sha
            N="$(wc -l < /tmp/source.sha | tr -d ' ')"
            if ! cmp -s /tmp/source.sha /tmp/restored.sha; then
              echo "RESTORE TEST: restored files differ from the source"
              diff /tmp/source.sha /tmp/restored.sha | head -n 20
              exit 1
            fi
            [ "$N" -gt 0 ] || { echo "RESTORE TEST: nothing restored"; exit 1; }
            echo "restore test: $N files restored, every SHA-256 matches the source"
            echo "$N" > /tmp/out/verified
        envFrom:
          - secretRef:
              name: restic-local
        env:
          - name: RESTIC_CACHE_DIR
            value: /tmp/cache
          - name: HOME
            value: /tmp
        volumeMounts:
          - name: clone
            mountPath: /data
          - name: tmp
            mountPath: /tmp
          - name: restore
            mountPath: /restore
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 1Gi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
