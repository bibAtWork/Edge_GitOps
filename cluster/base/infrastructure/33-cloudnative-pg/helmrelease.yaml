apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  url: https://cloudnative-pg.github.io/charts
---
# CloudNativePG operator. Chosen over the bitnami PostgreSQL StatefulSets this
# cluster ran previously for one reason above all: continuous WAL archiving with
# point-in-time recovery.
#
# The daily logical dumps already in place give a 24-hour RPO -- lose a day and
# you lose a day of Immich uploads and Paperless metadata. WAL archiving drops
# that to the last archived segment, and makes "restore to 14:31, just before the
# bad migration" a supported operation rather than a wish. That is the difference
# between a backup and a recovery capability.
#
# The operator also owns failover, switchover and rolling minor-version upgrades,
# which the StatefulSets left as manual work.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: cnpg-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: "0.26.0"
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
