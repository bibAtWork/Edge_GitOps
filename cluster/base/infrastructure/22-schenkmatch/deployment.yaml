apiVersion: apps/v1
kind: Deployment
metadata:
  name: schenkmatch
  namespace: schenkmatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: schenkmatch
  template:
    metadata:
      labels:
        app: schenkmatch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: schenkmatch
          image: ghcr.io/bibatwork/schenkmatch:latest
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
