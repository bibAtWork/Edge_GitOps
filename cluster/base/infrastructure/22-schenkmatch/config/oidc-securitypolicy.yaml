# ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): schenkmatch had no
# auth at all -- fully open to anyone who could reach the Gateway. This adds
# real per-user Keycloak login, same rationale/mechanism as
# 05-cilium/config/hubble-securitypolicy.yaml -- see that file's comment for
# the full explanation of forwardAccessToken and why extAuth is mandatory
# here (Envoy Gateway's SecurityPolicy attachment is REPLACE not MERGE per
# route).
#
# Unlike Hubble UI/KubeOpenCode, schenkmatch is NOT added to OPA's
# admin_only_apps set: it's a low-risk personal app with no in-app
# permission concept of its own (stateless, no accounts -- see the app
# research this PR is based on), so OPA's default "valid JWT, no special
# restriction -> allow" rule is the right fit here. Any of the three
# ADR-002 tiers (viewer/app-operator/platform-admin) is sufficient --
# this is only about requiring a real login, not about which tier.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: schenkmatch-oidc
  namespace: schenkmatch
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: schenkmatch
  oidc:
    provider:
      issuer: https://keycloak.homelab.data-harness.org/realms/homelab
      authorizationEndpoint: https://keycloak.homelab.data-harness.org/realms/homelab/protocol/openid-connect/auth
      tokenEndpoint: http://keycloak.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/token
      backendRefs:
        - group: ""
          kind: Service
          name: keycloak
          namespace: keycloak
          port: 80
    clientID: schenkmatch
    clientSecret:
      name: schenkmatch-oidc-client-secret
    forwardAccessToken: true
    scopes:
      - openid
      - email
  extAuth:
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: opa
          namespace: security
          port: 9191
