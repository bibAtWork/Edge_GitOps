apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: backup-system-clone-scope
  annotations:
    policies.kyverno.io/title: Recovery clones only
    policies.kyverno.io/category: Backup
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      RBAC cannot distinguish recovery clones from production volumes. Restrict
      the backup-workflow identity to rpc-* recovery resources, ensure cloned
      PVs mount rpc-* volumes, and require cloned Longhorn volumes to originate
      from a snapshot. This protects the restore-drill production-state boundary.
spec:
  validationActions: [Deny]
  # The requesting ServiceAccount is not available to a background scan.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [persistentvolumes]
      - apiGroups: [longhorn.io]
        apiVersions: [v1beta2]
        operations: [CREATE, UPDATE, DELETE]
        resources: [volumes, snapshots]
  matchConditions:
    - name: backup-workflow-only
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:backup-system:backup-workflow'
  validations:
    # During DELETE, object is absent; request.name identifies the target.
    - message: The recovery system may only create, change, or delete rpc-* recovery resources.
      expression: >-
        request.operation == 'DELETE' ? request.name.startsWith('rpc-') :
        object.metadata.name.startsWith('rpc-')
    - message: Recovery PersistentVolumes must mount an rpc-* clone.
      expression: >-
        request.operation != 'CREATE' || request.kind.kind != 'PersistentVolume' ||
        (has(object.spec.csi) && object.spec.csi.volumeHandle.startsWith('rpc-'))
    - message: Recovery Longhorn Volumes must clone a snapshot.
      expression: >-
        request.operation != 'CREATE' || request.kind.kind != 'Volume' ||
        (has(object.spec.dataSource) && object.spec.dataSource.startsWith('snap://'))
