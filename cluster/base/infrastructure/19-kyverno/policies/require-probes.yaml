apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require Liveness or Readiness Probe
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: Long-running containers should declare at least
      one probe. Without one, Kubernetes treats "the process has not exited" as "the
      workload is healthy", so a deadlocked or wedged container keeps receiving traffic
      and is never restarted.
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - flux-system
        - kyverno
    resourceRules:
    - apiGroups:
      - apps
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - deployments
      - statefulsets
      - daemonsets
  validations:
  - message: Long-running containers should declare a livenessProbe or readinessProbe.
    expression: object.spec.template.spec.containers.all(c, has(c.livenessProbe) ||
      has(c.readinessProbe))
