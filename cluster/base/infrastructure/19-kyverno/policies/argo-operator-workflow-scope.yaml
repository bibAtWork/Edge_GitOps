apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: argo-operator-workflow-scope
  annotations:
    policies.kyverno.io/title: Argo operators may only start recovery points
    policies.kyverno.io/category: Backup
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      The app-operator tier may create Workflows, but may only submit the
      recovery-point template for a declared application. Arbitrary templates,
      extra arguments, and entrypoint overrides can reach backup credentials.
spec:
  validationActions: [Deny]
  # This policy judges the requesting identity, so existing-object scans have
  # no useful identity to evaluate.
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [argoproj.io]
        apiVersions: [v1alpha1]
        operations: [CREATE]
        resources: [workflows]
  matchConditions:
    - name: argo-operator-only
      expression: >-
        request.userInfo.username ==
        'system:serviceaccount:backup-system:argo-operator'
  variables:
    # scripts/check-platform-contracts.py compares this list to recovery-policy.
    - name: allowedApplications
      expression: "['immich', 'keycloak', 'paperless', 'seaweedfs']"
  validations:
    - message: Operators may only start the recovery-point WorkflowTemplate.
      expression: >-
        has(object.spec.workflowTemplateRef) &&
        object.spec.workflowTemplateRef.name == 'recovery-point'
    - message: Operators must supply exactly one approved application argument.
      expression: >-
        has(object.spec.arguments) &&
        has(object.spec.arguments.parameters) &&
        object.spec.arguments.parameters.size() == 1 &&
        object.spec.arguments.parameters[0].name == 'application' &&
        has(object.spec.arguments.parameters[0].value) &&
        object.spec.arguments.parameters[0].value in variables.allowedApplications
    - message: Operators may not add spec fields, template options, or argument sources.
      expression: >-
        object.spec.all(k, v, k in ['workflowTemplateRef', 'arguments']) &&
        object.spec.workflowTemplateRef.all(k, v, k == 'name') &&
        object.spec.arguments.all(k, v, k == 'parameters') &&
        object.spec.arguments.parameters[0].all(k, v, k in ['name', 'value'])
---
# Kyverno's reports controller needs read-only access to the CRD matched above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:reports-controller:argo-workflows
  labels:
    rbac.kyverno.io/aggregate-to-reports-controller: "true"
rules:
  - apiGroups: [argoproj.io]
    resources: [workflows]
    verbs: [get, list, watch]
