apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: set-revision-history-limit
  annotations:
    policies.kyverno.io/title: Set Revision History Limit
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: low
    policies.kyverno.io/description: >-
      Keep at most three superseded ReplicaSets when a Deployment uses the
      Kubernetes revisionHistoryLimit default of ten.
spec:
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, flux-system, kyverno]
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
  # The API server applies its default of ten before the webhook runs. A
  # Deployment that explicitly asks for ten is indistinguishable at admission.
  matchConditions:
    - name: uses-kubernetes-default
      expression: >-
        has(object.spec.revisionHistoryLimit) &&
        object.spec.revisionHistoryLimit == 10
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          [JSONPatch{
            op: 'replace',
            path: '/spec/revisionHistoryLimit',
            value: 3
          }]
