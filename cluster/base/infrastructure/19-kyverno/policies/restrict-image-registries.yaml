apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict Image Registries
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: Images must be pulled from approved registries.
      This prevents workloads from pulling images from untrusted sources that could
      introduce malware or bypass the Trivy vulnerability scanning pipeline in Zot.
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - flux-system
        - kyverno
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  variables:
  - name: containers
    expression: object.spec.containers + object.spec.?initContainers.orValue([])
  validations:
  - message: Pod images must come from an approved registry.
    expression: "variables.containers.all(c,\n      ['docker.io/', 'ghcr.io/', 'registry.k8s.io/',\
      \ 'quay.io/',\n       'gcr.io/', 'mirror.gcr.io/', 'reg.kyverno.io/', 'zot.zot.svc',\n\
      \       'public.ecr.aws/', 'amazon/', 'chrislusf/', 'openpolicyagent/',\n  \
      \     'otel/', 'rancher/', 'tailscale/', 'victoriametrics/'].exists(p,\n   \
      \      c.image.startsWith(p)) ||\n      c.image.split('/')[0].endsWith('.azurecr.io'))"
