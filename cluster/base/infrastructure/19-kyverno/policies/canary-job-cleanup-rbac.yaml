apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kyverno-canary-job-cleanup
  namespace: platform-canary
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kyverno-canary-job-cleanup
  namespace: platform-canary
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kyverno-canary-job-cleanup
subjects:
  - kind: ServiceAccount
    name: kyverno-cleanup-controller
    namespace: kyverno
