apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-fsgroup-for-ephemeral-volumes
  annotations:
    policies.kyverno.io/title: Require fsGroup for Generic Ephemeral Volumes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: A pod that runs as non-root and mounts a generic
      ephemeral volume (spec.volumes[].ephemeral) must set securityContext.fsGroup.
      A freshly provisioned Longhorn volume behind a generic ephemeral volume is root-owned;
      a non-root process has no write permission on it at all without fsGroup.
spec:
  validationActions:
  - Deny
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - kube-system
        - flux-system
        - kyverno
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  matchConditions:
  - name: non-root-generic-ephemeral-volume
    expression: object.spec.?volumes.orValue([]).exists(v, has(v.ephemeral)) && has(object.spec.securityContext)
      && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot
  validations:
  - message: Non-root pods mounting generic ephemeral volumes must set securityContext.fsGroup.
    expression: has(object.spec.securityContext) && has(object.spec.securityContext.fsGroup)
