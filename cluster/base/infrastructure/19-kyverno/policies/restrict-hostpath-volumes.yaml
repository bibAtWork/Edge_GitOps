apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-hostpath-volumes
  annotations:
    policies.kyverno.io/title: Restrict hostPath Volumes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: 'Application workloads must not mount host filesystem
      paths. A hostPath volume escapes the container boundary: it can read host state
      a pod has no business seeing, and a writable one can modify the node itself.'
spec:
  validationActions:
  - Audit
  evaluation:
    background:
      enabled: true
  matchConstraints:
    namespaceSelector:
      matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
        - longhorn-system
        - kube-system
        - falco
        - monitoring-agents
        - cattle-system
        - tailscale
        - seaweedfs
        - flux-system
        - kyverno
    resourceRules:
    - apiGroups:
      - ''
      apiVersions:
      - v1
      operations:
      - CREATE
      - UPDATE
      resources:
      - pods
  validations:
  - message: hostPath volumes are not permitted in application namespaces.
    expression: object.spec.?volumes.orValue([]).all(v, !has(v.hostPath))
