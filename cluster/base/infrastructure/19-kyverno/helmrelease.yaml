apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno
      version: 3.9.1
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Images pinned per ADR-009, at the versions already running. These move
    # as one group -- they are a single product release, and bumping one
    # alone would put mismatched components in the same deployment.
    admissionController:
      container:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyverno
          tag: v1.19.0
      initContainer:
        image:
          registry: reg.kyverno.io
          repository: kyverno/kyvernopre
          tag: v1.19.0
      replicas: 1
      # Must be able to run on a cordoned node.
      #
      # A Deployment does not tolerate node.kubernetes.io/unschedulable; a
      # DaemonSet does, automatically. That difference took this cluster down
      # for nine hours on 2026-08-30.
      #
      # A system-upgrade-controller Job cordons the node before upgrading it.
      # The Job failed and left the cordon in place. This pod could then not be
      # scheduled, and because its webhook is failurePolicy: Fail, every pod
      # creation in the cluster was rejected -- including the one that would
      # have replaced this pod. Nothing could recover without a manual
      # uncordon.
      #
      # On a single-node cluster a cordon is not a safety mechanism, it is an
      # outage: there is nowhere to drain to, so the only thing it achieves is
      # preventing the node from running what it needs to run. Anything the
      # node itself depends on has to survive one.
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    backgroundController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/background-controller
        tag: v1.19.0
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    cleanupController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/cleanup-controller
        tag: v1.19.0
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi

    reportsController:
      image:
        registry: reg.kyverno.io
        repository: kyverno/reports-controller
        tag: v1.19.0
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
