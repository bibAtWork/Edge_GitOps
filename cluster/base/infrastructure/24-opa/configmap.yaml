apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: security
data:
  main.rego: |
    package envoy.authz

    import rego.v1
    import input.attributes.request.http as req_http

    # ── JWT verification ─────────────────────────────────────────────────────
    # No Envoy jwt_authn filter is wired up on the ExternalAuth path, so OPA
    # verifies the raw Authorization header itself against Keycloak's JWKS,
    # fetched directly (internal service DNS, not through the gateway).
    keycloak_issuer := "https://keycloak.homelab.data-harness.org/realms/homelab"

    jwks_response := http.send({
        "url": "http://keycloak.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/certs",
        "method": "GET",
        "force_cache": true,
        "force_cache_duration_seconds": 300,
    })

    bearer_token := t if {
        startswith(req_http.headers.authorization, "Bearer ")
        t := substring(req_http.headers.authorization, count("Bearer "), -1)
    }

    # Signature, issuer and expiry are checked separately rather than via
    # io.jwt.decode_verify's constraints. decode_verify treats a missing "aud"
    # constraint as "the token must have NO aud claim" — so with no aud listed
    # here it rejects every token that HAS one. Keycloak stamps aud on any
    # access token issued through a client (aud: "account" by default), so the
    # previous decode_verify form rejected every real client token with
    # "Invalid or expired token", while a raw signature check on the identical
    # token passed. Proven 2026-08-16: same token, verify_rs256 -> true,
    # decode_verify without aud -> false; a token with no aud claim passed both.
    #
    # Pinning a literal aud here instead would be brittle — each client gets a
    # different audience, and this gate fronts every app. Verifying the
    # signature and then asserting issuer and expiry explicitly is both robust
    # across clients and easier to audit. exp is seconds, time.now_ns() is
    # nanoseconds, hence the scaling.
    jwt_payload := payload if {
        bearer_token
        io.jwt.verify_rs256(bearer_token, jwks_response.raw_body)
        [_, payload, _] := io.jwt.decode(bearer_token)
        payload.iss == keycloak_issuer
        time.now_ns() < payload.exp * 1000000000
    }

    # ── Role mapping ──────────────────────────────────────────────────────────
    # Roles are mapped by email rather than the "groups" claim, since not every
    # client that can issue a Bearer token necessarily requests the groups scope.
    # To add an admin, append their Keycloak email to this set.
    admin_emails := {"admin@homelab.internal"}

    # Apps that require an admin JWT even for browser (non-Bearer) access.
    # These have no native OIDC integration, so OPA is the only auth layer.
    admin_only_apps := {
        "hubble.homelab.data-harness.org",
        "kubeopencode.homelab.data-harness.org",
    }

    # ── Helpers ───────────────────────────────────────────────────────────────

    # Request carries an Authorization: Bearer header (API client, not browser OIDC flow).
    has_bearer if {
        startswith(req_http.headers.authorization, "Bearer ")
    }

    is_admin if {
        jwt_payload.email in admin_emails
    }

    # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): admin_only_apps
    # now accepts Maintainer-or-above (app-operator/platform-admin), not just
    # the hardcoded admin_emails allowlist. Unlike the generic Bearer-token
    # case admin_emails exists for (arbitrary API clients that may not
    # request the groups scope), both hubble-ui and kubeopencode's
    # SecurityPolicy.oidc explicitly request it, so jwt_payload.groups is
    # reliably present here. Viewer is deliberately excluded: unlike
    # Grafana/Paperless, these two expose live cluster internals
    # (Hubble UI) or arbitrary code execution in-cluster (KubeOpenCode),
    # not read-only-safe surfaces.
    admin_only_apps_allowed_groups := {"platform-admin", "app-operator"}

    has_operator_or_above if {
        some g in jwt_payload.groups
        g in admin_only_apps_allowed_groups
    }

    # Grafana admin API — requires admin role regardless of call type.
    is_grafana_admin_path if {
        req_http.host == "grafana.homelab.data-harness.org"
        startswith(req_http.path, "/api/admin/")
    }

    identity_headers := {
        "x-authenticated-user": jwt_payload.email,
        "x-authenticated-sub":  jwt_payload.sub,
    }

    # ── Policy (else-chain = priority order) ─────────────────────────────────
    #
    # 1. Invalid Bearer token: Authorization header present but JWT validation failed
    #    (bad signature, expired, wrong issuer). → 401. Client should re-authenticate.
    #
    # 2. Valid JWT on a Grafana admin path without admin role → 403.
    #
    # 3. Valid JWT on an admin-only app (hubble-ui, kubeopencode), neither admin_emails
    #    nor Maintainer-or-above (platform-admin/app-operator, ADR-002) → 403.
    #    Browser requests to admin-only apps with no JWT also hit this rule because
    #    neither app has native OIDC — restrict at the OPA layer.
    #
    # 4. Valid JWT, no special restriction → allow + inject identity headers.
    #
    # 5. Default: no Authorization header → browser OIDC flow.
    #    Apps (Grafana, Immich, Paperless) handle their own session auth natively.
    #    Allow through.

    allow := {
        "allowed": false,
        "http_status": 401,
        "body": "{\"error\":\"Invalid or expired token\"}",
        "headers": {"content-type": "application/json"},
    } if {
        has_bearer
        not jwt_payload.sub
    } else := {
        "allowed": false,
        "http_status": 403,
        "body": "{\"error\":\"Forbidden\"}",
        "headers": {"content-type": "application/json"},
    } if {
        jwt_payload.sub
        is_grafana_admin_path
        not is_admin
    } else := {
        "allowed": false,
        "http_status": 403,
        "body": "{\"error\":\"Forbidden\"}",
        "headers": {"content-type": "application/json"},
    } if {
        req_http.host in admin_only_apps
        not is_admin
        not has_operator_or_above
    } else := {
        "allowed": true,
        "headers": identity_headers,
    } if {
        jwt_payload.sub
    } else := {"allowed": true}
