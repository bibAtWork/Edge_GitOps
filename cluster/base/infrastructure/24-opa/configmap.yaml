apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: security
data:
  main.rego: |
    package envoy.authz

    import rego.v1
    import input.attributes.request.http as req_http

    # ── JWT verification ─────────────────────────────────────────────────────
    # No Envoy jwt_authn filter is wired up on the ExternalAuth path, so OPA
    # verifies the raw Authorization header itself against Keycloak's JWKS,
    # fetched directly (internal service DNS, not through the gateway).
    keycloak_issuer := "https://keycloak.homelab.data-harness.org/realms/homelab"

    jwks_response := http.send({
        "url": "http://keycloak.keycloak.svc.cluster.local/realms/homelab/protocol/openid-connect/certs",
        "method": "GET",
        "force_cache": true,
        "force_cache_duration_seconds": 300,
    })

    bearer_token := t if {
        startswith(req_http.headers.authorization, "Bearer ")
        t := substring(req_http.headers.authorization, count("Bearer "), -1)
    }

    jwt_payload := payload if {
        bearer_token
        [valid, _, payload] := io.jwt.decode_verify(bearer_token, {
            "cert": jwks_response.raw_body,
            "iss": keycloak_issuer,
        })
        valid == true
    }

    # ── Role mapping ──────────────────────────────────────────────────────────
    # Roles are mapped by email rather than the "groups" claim, since not every
    # client that can issue a Bearer token necessarily requests the groups scope.
    # To add an admin, append their Keycloak email to this set.
    admin_emails := {"admin@homelab.internal"}

    # Apps that require an admin JWT even for browser (non-Bearer) access.
    # These have no native OIDC integration, so OPA is the only auth layer.
    admin_only_apps := {"hubble.homelab.data-harness.org"}

    # ── Helpers ───────────────────────────────────────────────────────────────

    # Request carries an Authorization: Bearer header (API client, not browser OIDC flow).
    has_bearer if {
        startswith(req_http.headers.authorization, "Bearer ")
    }

    is_admin if {
        jwt_payload.email in admin_emails
    }

    # Grafana admin API — requires admin role regardless of call type.
    is_grafana_admin_path if {
        req_http.host == "grafana.homelab.data-harness.org"
        startswith(req_http.path, "/api/admin/")
    }

    identity_headers := {
        "x-authenticated-user": jwt_payload.email,
        "x-authenticated-sub":  jwt_payload.sub,
    }

    # ── Policy (else-chain = priority order) ─────────────────────────────────
    #
    # 1. Invalid Bearer token: Authorization header present but JWT validation failed
    #    (bad signature, expired, wrong issuer). → 401. Client should re-authenticate.
    #
    # 2. Valid JWT on a Grafana admin path without admin role → 403.
    #
    # 3. Valid JWT on an admin-only app (hubble-ui) without admin role → 403.
    #    Browser requests to admin-only apps with no JWT also hit this rule because
    #    hubble-ui has no native OIDC — restrict at the OPA layer.
    #
    # 4. Valid JWT, no special restriction → allow + inject identity headers.
    #
    # 5. Default: no Authorization header → browser OIDC flow.
    #    Apps (Grafana, Immich, Paperless) handle their own session auth natively.
    #    Allow through.

    allow := {
        "allowed": false,
        "http_status": 401,
        "body": "{\"error\":\"Invalid or expired token\"}",
        "headers": {"content-type": "application/json"},
    } if {
        has_bearer
        not jwt_payload.sub
    } else := {
        "allowed": false,
        "http_status": 403,
        "body": "{\"error\":\"Forbidden\"}",
        "headers": {"content-type": "application/json"},
    } if {
        jwt_payload.sub
        is_grafana_admin_path
        not is_admin
    } else := {
        "allowed": false,
        "http_status": 403,
        "body": "{\"error\":\"Forbidden\"}",
        "headers": {"content-type": "application/json"},
    } if {
        req_http.host in admin_only_apps
        not is_admin
    } else := {
        "allowed": true,
        "headers": identity_headers,
    } if {
        jwt_payload.sub
    } else := {"allowed": true}
