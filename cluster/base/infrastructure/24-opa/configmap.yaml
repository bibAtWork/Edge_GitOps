apiVersion: v1
kind: ConfigMap
metadata:
  name: opa-policies
  namespace: security
data:
  main.rego: |
    package envoy.authz

    import rego.v1
    import input.attributes.request.http as http

    # JWT claims injected into filter metadata by Cilium's jwt_authn filter.
    # Present only when the request carried a valid JWT from Dex.
    jwt := input.attributes.metadata_context.filter_metadata["envoy.filters.http.jwt_authn"]["verified_jwt"]

    # ── Role mapping ──────────────────────────────────────────────────────────
    # Dex staticPasswords do not support groups, so roles are mapped by email here.
    # To add an admin, append their Dex email to this set.
    admin_emails := {"admin@homelab.internal"}

    # Apps that require an admin JWT even for browser (non-Bearer) access.
    # These have no native OIDC integration, so OPA is the only auth layer.
    admin_only_apps := {"hubble.homelab.data-harness.org"}

    # ── Helpers ───────────────────────────────────────────────────────────────

    # Request carries an Authorization: Bearer header (API client, not browser OIDC flow).
    has_bearer if {
        startswith(http.headers.authorization, "Bearer ")
    }

    is_admin if {
        jwt.email in admin_emails
    }

    # Grafana admin API — requires admin role regardless of call type.
    is_grafana_admin_path if {
        http.host == "grafana.homelab.data-harness.org"
        startswith(http.path, "/api/admin/")
    }

    identity_headers := {
        "x-authenticated-user": jwt.email,
        "x-authenticated-sub":  jwt.sub,
    }

    # ── Policy (else-chain = priority order) ─────────────────────────────────
    #
    # 1. Invalid Bearer token: Authorization header present but JWT validation failed.
    #    → 401. Client sent a bad/expired token; they should re-authenticate.
    #
    # 2. Valid JWT on a Grafana admin path without admin role → 403.
    #
    # 3. Valid JWT on an admin-only app (hubble-ui) without admin role → 403.
    #    Browser requests to admin-only apps with no JWT also hit this rule because
    #    hubble-ui has no native OIDC — restrict at the OPA layer.
    #
    # 4. Valid JWT, no special restriction → allow + inject identity headers.
    #
    # 5. Default: no Authorization header → browser OIDC flow.
    #    Apps (Grafana, Immich, Paperless) handle their own session auth natively.
    #    Allow through; jwt_authn already passed with allow_missing_or_failed.

    default allow := {"allowed": true}

    allow := {
        "allowed": false,
        "http_status": 401,
        "body": "{\"error\":\"Invalid or expired token\"}",
        "headers": {"content-type": "application/json"},
    } if {
        has_bearer
        not jwt.sub
    } else := {
        "allowed": false,
        "http_status": 403,
        "body": "{\"error\":\"Forbidden\"}",
        "headers": {"content-type": "application/json"},
    } if {
        jwt.sub
        is_grafana_admin_path
        not is_admin
    } else := {
        "allowed": false,
        "http_status": 403,
        "body": "{\"error\":\"Forbidden\"}",
        "headers": {"content-type": "application/json"},
    } if {
        http.host in admin_only_apps
        not is_admin
    } else := {
        "allowed": true,
        "headers": identity_headers,
    } if {
        jwt.sub
    }
