apiVersion: apps/v1
kind: Deployment
metadata:
  name: opa
  namespace: security
  annotations:
    # OPA loads /policies once at startup — no built-in ConfigMap watch (no -w flag).
    # Reloader restarts the pod whenever opa-policies changes so Rego edits take effect.
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opa
    spec:
      serviceAccountName: opa
      containers:
        - name: opa
          image: openpolicyagent/opa:0.67.1-envoy
          args:
            - run
            - --server
            - --log-level=info
            - --log-format=json
            - --addr=localhost:8181
            - --diagnostic-addr=0.0.0.0:8282
            # gRPC ext_authz listener (called by Cilium's Envoy per request)
            - --set=plugins.envoy_ext_authz_grpc.addr=:9191
            - --set=plugins.envoy_ext_authz_grpc.path=envoy/authz/allow
            - --set=plugins.envoy_ext_authz_grpc.enable-reflection=true
            - --set=decision_logs.console=true
            - /policies
          volumeMounts:
            - name: policies
              mountPath: /policies
              readOnly: true
          ports:
            - name: grpc-authz
              containerPort: 9191
              protocol: TCP
            - name: diagnostics
              containerPort: 8282
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health?plugins
              port: 8282
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8282
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: policies
          configMap:
            name: opa-policies
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opa
  namespace: security
