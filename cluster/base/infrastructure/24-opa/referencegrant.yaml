# Allows the ExternalAuth filter on each app's HTTPRoute (different namespace
# from OPA's) to reference the opa Service here. Required for any cross-namespace
# backendRef per the Gateway API spec.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-external-auth
  namespace: security
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: immich
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: paperless
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: schenkmatch
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: zot
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
  to:
    - group: ""
      kind: Service
      name: opa
