# Allows the ExternalAuth filter on each app's HTTPRoute (different namespace
# from OPA's) to reference the opa Service here. Required for any cross-namespace
# backendRef per the Gateway API spec.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-gateway-external-auth
  namespace: security
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: monitoring
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: immich
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: paperless
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: schenkmatch
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: zot
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kube-system
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: kubeopencode-system
    # Envoy Gateway's SecurityPolicy carries the same cross-namespace backendRef
    # to this Service, and is subject to the same ReferenceGrant requirement —
    # without this entry it reconciles as
    # `Accepted=False (Invalid): ExtAuth: backend ref to Service security/opa not
    # permitted by any ReferenceGrant`. One entry covers every app, since the
    # policy attaches to the Gateway rather than to each route.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: gateway-system
  to:
    - group: ""
      kind: Service
      name: opa
