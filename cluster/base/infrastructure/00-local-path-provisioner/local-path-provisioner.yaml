apiVersion: v1
kind: Namespace
metadata:
  name: local-path-storage
  labels:
    # local-path-provisioner creates busybox helper pods that mount hostPath volumes.
    # The provisioner IS the storage layer and cannot meet baseline/restricted PSS.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: local-path-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
  - kind: ServiceAccount
    name: local-path-provisioner-service-account
    namespace: local-path-storage
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: local-path-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      serviceAccountName: local-path-provisioner-service-account
      containers:
        - name: local-path-provisioner
          image: docker.io/rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          # Measured, not guessed: 7-day peak working set is 96Mi. This was one
          # of 24 containers on this node carrying no memory limit at all.
          #
          # It is not the worst of those 24 -- the Longhorn and Cilium ones are
          # deliberately unbounded, because an OOM kill there costs live I/O or
          # cluster networking -- but this one has no such argument for it, and
          # a runaway here would compete with workloads that do matter.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
            - name: config-rev
              mountPath: /etc/config-rev/
              readOnly: true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
      volumes:
        # The provisioner's configuration, found by name (--configmap-name
        # defaults to local-path-config), so that name must stay stable. See
        # kustomization.yaml, which generates it from config/.
        - name: config-volume
          configMap:
            name: local-path-config
        # A content-hashed copy of the same files, mounted and never read. It
        # exists to roll this Deployment whenever the configuration changes:
        # kustomize renames it with every content change, which changes this
        # pod template.
        #
        # Without it, a configuration change reached the ConfigMap and not the
        # provisioner, which reads helperPod.yaml only at start. On 2026-09-07
        # #507 pinned the helper image that way; the running provisioner kept
        # the old bare `busybox`, Kyverno rejected every helper pod, and no
        # local-path volume could be created or deleted for six days, reported
        # by nothing but ProvisioningFailed events.
        - name: config-rev
          configMap:
            name: local-path-config-rev
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  # Deliberately NOT the default any more. As the default, any PVC that
  # named no class landed on unreplicated, unsnapshotted, node-local storage
  # with reclaimPolicy Delete -- and nothing reported it. zot's cache got
  # here that way; nobody chose it. Longhorn is the default now, so this
  # class is reached only by naming it, which today means exactly one
  # volume: the SeaweedFS filer metadata database, which may live on neither
  # Longhorn nor SeaweedFS (see 01-seaweedfs/filer-metadata-pg-cluster.yaml).
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
