apiVersion: v1
kind: Pod
metadata:
  name: helper-pod
spec:
  containers:
  - name: helper-pod
    # Pinned. This was a bare `busybox`, which Kubernetes resolves to
    # busybox:latest -- the only untagged image in either overlay, and
    # invisible to the :latest CI gate precisely because it never says
    # "latest". It is also nested inside a ConfigMap, so it is a manifest
    # no schema validation reaches either. Same tag already used by
    # 01-seaweedfs/bucket-init-job.yaml.
    #
    # The provisioner reads this template only when it starts. A change here
    # therefore only takes effect because kustomization.yaml rolls the
    # Deployment whenever this file changes -- see the config-rev volume.
    image: docker.io/library/busybox:1.38
    imagePullPolicy: IfNotPresent
