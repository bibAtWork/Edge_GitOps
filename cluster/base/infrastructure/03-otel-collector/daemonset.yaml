# The OTel agent runs in monitoring-agents, not monitoring, while the gateway in
# this same directory stays in monitoring.
#
# The split is on host access, not on component. This DaemonSet hostPath-mounts
# /var/log/pods and /var/log/audit/kube to read container and audit logs
# off the node; hostPath is forbidden by PSS baseline, so wherever it runs is
# pinned to privileged. The gateway is an ordinary Deployment that receives OTLP
# over the network and needs nothing from the host, so it stays with the rest of
# the observability stack.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  namespace: monitoring-agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "nodes/metrics", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
subjects:
  - kind: ServiceAccount
    name: otel-agent
    namespace: monitoring-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-agent
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  namespace: monitoring-agents
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-agent
    spec:
      serviceAccountName: otel-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        supplementalGroups: [0]
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: otel-agent
          image: otel/opentelemetry-collector-contrib:0.160.0
          args: ["--config=/conf/config.yaml"]
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "300Mi"
              cpu: "200m"
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: config
              mountPath: /conf
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: varlogkubeaudit
              mountPath: /var/log/audit/kube
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - containerPort: 4317
              protocol: TCP
            - containerPort: 4318
              protocol: TCP
      volumes:
        - name: config
          configMap:
            name: otel-agent-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: varlogkubeaudit
          hostPath:
            path: /var/log/audit/kube
        - name: tmp
          emptyDir: {}
