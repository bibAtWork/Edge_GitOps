apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  namespace: monitoring-agents
data:
  config.yaml: |
    receivers:
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}
          filesystem: {}
          load: {}
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        include_file_path: true
        operators:
          - type: regex_parser
            parse_from: attributes["log.file.path"]
            regex: '^/var/log/pods/(?P<kubernetes_namespace_name>[^_/]+)_(?P<kubernetes_pod_name>[^_/]+)_[^/]+/(?P<kubernetes_container_name>[^/]+)/'
          - type: json_parser
            if: 'body matches "^{"'
          - type: regex_parser
            regex: '^(?P<time>[^ ^Z]+Z) (?P<stream>stdout|stderr) (?P<logtag>[^ ]*) ?(?P<log>.*)$'
            if: 'body matches "^[^ ]+ (stdout|stderr)"'
            timestamp:
              parse_from: attributes.time
              layout: '%Y-%m-%dT%H:%M:%S.%LZ'
      filelog/audit:
        # /var/log/audit/kube/, not /var/log/kubernetes/audit/.
        #
        # The kube-apiserver's --audit-log-path writes to the former; this
        # receiver watched the latter, which has been empty since 2026-08-09.
        # The pipeline was wired end to end, reported healthy, and moved
        # nothing: VictoriaLogs held zero audit records while the node held a
        # live 100MB kube-apiserver.log.
        #
        # The rotated siblings (kube-apiserver-<timestamp>.log) are deliberately
        # NOT matched. The collector tails the active file and follows it across
        # rotation; including the rotated copies would re-ingest ~1GB of history
        # on every restart.
        include:
          - /var/log/audit/kube/kube-apiserver.log
        include_file_path: true
        operators:
          - type: json_parser
            timestamp:
              parse_from: attributes.requestReceivedTimestamp
              layout_type: strptime
              layout: '%Y-%m-%dT%H:%M:%S.%fZ'
          # json_parser retains every audit field in attributes while leaving
          # the original JSON in body. VictoriaLogs otherwise stores each
          # event twice: structured fields and the full JSON as _msg. Keep all
          # attributes and use the request URI as a concise, readable message.
          # If parsing fails or requestURI is absent, copy sends the original
          # body onward rather than dropping the event.
          - type: copy
            from: attributes.requestURI
            to: body
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      prometheus:
        config:
          scrape_configs:
            - job_name: "cilium-hubble"
              static_configs:
                - targets: ["hubble-metrics.kube-system.svc:9965"]

    processors:
      # The filter sees only parsed API audit records in logs/audit. Successful
      # Lease reads and report reads are repetitive. Keep every Lease write:
      # a successful update to an unexpected Lease must remain visible in
      # VictoriaLogs, along with failures, report writes and container logs.
      filter/audit-routine:
        error_mode: ignore
        log_conditions:
          - >-
            log.attributes["apiVersion"] == "audit.k8s.io/v1" and
            log.attributes["stage"] == "ResponseComplete" and
            log.attributes["responseStatus"]["code"] == 200 and
            log.attributes["objectRef"]["apiGroup"] == "coordination.k8s.io" and
            log.attributes["objectRef"]["resource"] == "leases" and
            log.attributes["verb"] == "get" and
            (
              IsMatch(log.attributes["user"]["username"], "^system:serviceaccount:kyverno:kyverno-(admission|background|cleanup|reports)-controller$") or
              IsMatch(log.attributes["user"]["username"], "^system:serviceaccount:longhorn-system:longhorn-(csi-)?service-account$")
            )
          - >-
            log.attributes["apiVersion"] == "audit.k8s.io/v1" and
            log.attributes["stage"] == "ResponseComplete" and
            log.attributes["responseStatus"]["code"] == 200 and
            log.attributes["user"]["username"] == "system:serviceaccount:kyverno:kyverno-reports-controller" and
            (
              (log.attributes["verb"] == "get" and log.attributes["objectRef"]["apiGroup"] == "wgpolicyk8s.io" and log.attributes["objectRef"]["resource"] == "policyreports") or
              (log.attributes["verb"] == "list" and log.attributes["objectRef"]["apiGroup"] == "reports.kyverno.io" and log.attributes["objectRef"]["resource"] == "ephemeralreports")
            )
      batch:
        timeout: 10s
        send_batch_size: 1024
      memory_limiter:
        limit_mib: 200
        spike_limit_mib: 50
        check_interval: 5s
      resource:
        attributes:
          - action: insert
            key: cluster
            value: homelab

    exporters:
      prometheusremotewrite:
        endpoint: http://vmsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:8428/api/v1/write
      otlp/gateway:
        endpoint: otel-collector-gateway.monitoring.svc:4317
        tls:
          insecure: true

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
                    without_type_suffix: true
                    without_units: true
      pipelines:
        metrics:
          receivers: [hostmetrics, prometheus, otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [filelog, otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/gateway]
        logs/audit:
          receivers: [filelog/audit]
          processors: [memory_limiter, filter/audit-routine, batch, resource]
          exporters: [otlp/gateway]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/gateway]
