apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      memory_limiter:
        limit_mib: 150
        spike_limit_mib: 40
        check_interval: 5s
      resource:
        attributes:
          - action: insert
            key: cluster
            value: homelab

    exporters:
      otlphttp/victorialogs:
        endpoint: http://vlsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:9428/insert/opentelemetry
      otlphttp/victoriatraces:
        endpoint: http://vtsingle-vmstack-victoria-metrics-k8s-stack.monitoring.svc:10428/insert/opentelemetry

    service:
      pipelines:
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlphttp/victorialogs]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlphttp/victoriatraces]
