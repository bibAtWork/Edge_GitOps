# CiliumClusterwideEnvoyConfig: injects an HTTP filter chain into Cilium's Envoy
# for traffic to every service listed in spec.services.
#
# Filter chain (per request):
#   local_ratelimit → ext_authz(OPA) → cilium.l7policy → router
#
# Design notes:
#   · local_ratelimit: per-node token bucket (60 req/min); no external call.
#     Scales horizontally — each node independently enforces 60 req/min.
#   · ext_authz(OPA): enforces Rego policies from 24-opa/configmap.yaml.
#     failure_mode_allow: if OPA is unavailable, native app auth still applies.
#   · cilium.l7policy: auto-injected by Cilium for L7 network policy enforcement.
#   · router: forwards to the ORIGINAL_DST cluster which reads the original
#     ClusterIP from socket metadata. Cilium's BPF applies normal LB DNAT for
#     Envoy's outgoing connections (no L7 re-intercept); no routing loop.
#
# Routing: inline route_config inside the listener — bypasses RDS/xDS.
# Cilium's xDS does not serve RouteConfiguration resources from CCEC spec.resources
# (RDS always returns 0 successes for custom listener names). Inline config works.
# ORIGINAL_DST cluster forwards each request back to its original ClusterIP;
# Cilium's BPF LB then DNATs that to the backend pod without L7 re-redirect.
#
# Note: jwt_authn omitted — Cilium 1.20's Go proto registry does not include
# envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication, causing proto
# parse failure ("unexpected token {"). OPA receives raw Authorization headers.
#
# CLUSTER DNS LIMITATION: Cilium's Envoy runs on host network and uses host DNS,
# which cannot resolve *.svc.cluster.local. The OPA cluster uses its stable
# ClusterIP (Cilium's BPF LB handles the DNAT). If OPA service is recreated,
# update the address below.
#
# Future — Coraza WAF:
#   Add envoy.filters.http.wasm (before local_ratelimit) with coraza-proxy-wasm.
apiVersion: cilium.io/v2
kind: CiliumClusterwideEnvoyConfig
metadata:
  name: gateway-authz
spec:
  services:
    - name: grafana
      namespace: monitoring
    - name: immich-server
      namespace: immich
    - name: paperless-ngx
      namespace: paperless
    - name: schenkmatch
      namespace: schenkmatch
    - name: zot
      namespace: zot
    - name: hubble-ui
      namespace: kube-system

  resources:
    # ── Listener ────────────────────────────────────────────────────────────
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: gateway-authz
      filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: gateway_authz

              route_config:
                name: gateway-authz
                virtual_hosts:
                  - name: all
                    domains: ["*"]
                    routes:
                      - match:
                          prefix: /
                        route:
                          cluster: original-dst
                          timeout: 60s

              http_filters:
                # 1. Local rate limit: token bucket, 60 req/min per Envoy instance.
                - name: envoy.filters.http.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: gateway_authz_rl
                    token_bucket:
                      max_tokens: 60
                      tokens_per_fill: 60
                      fill_interval: 60s
                    filter_enabled:
                      default_value:
                        numerator: 100
                        denominator: HUNDRED
                    filter_enforced:
                      default_value:
                        numerator: 100
                        denominator: HUNDRED

                # 2. OPA ext_authz: enforces Rego policies in 24-opa/configmap.yaml.
                #    failure_mode_allow: if OPA is unavailable, requests pass through
                #    (native app auth and Cilium network policies still apply).
                - name: envoy.filters.http.ext_authz
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                    grpc_service:
                      envoy_grpc:
                        cluster_name: opa_authz
                      timeout: 5s
                    transport_api_version: V3
                    metadata_context_namespaces:
                      - envoy.filters.http.jwt_authn
                    failure_mode_allow: true

                # 3. Router (must be last; Cilium injects cilium.l7policy before it).
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ── Upstream clusters ────────────────────────────────────────────────────

    # Forward to the original ClusterIP destination preserved by Cilium's BPF
    # socket-level redirect. Cilium's BPF LB DNAT's the ClusterIP to the backend
    # pod IP for Envoy's outgoing connections without re-triggering L7 redirect.
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: original-dst
      type: ORIGINAL_DST
      connect_timeout: 5s
      lb_policy: CLUSTER_PROVIDED

    # OPA gRPC ext_authz. STATIC + ClusterIP: Cilium Envoy runs on host network
    # and cannot resolve *.svc.cluster.local via host DNS; Cilium's BPF LB DNAT's
    # the ClusterIP to the pod. ClusterIPs are stable for the service lifetime.
    # If OPA's ClusterIP changes (service recreate), update this address.
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: opa_authz
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa_authz
        endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    # kubectl get svc -n security opa -o jsonpath='{.spec.clusterIP}'
                    address: 10.102.123.91
                    port_value: 9191
