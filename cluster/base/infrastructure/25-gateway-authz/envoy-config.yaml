# CiliumClusterwideEnvoyConfig: injects an HTTP filter chain into Cilium's Envoy
# for traffic to every service listed in spec.services.
#
# Filter chain (per request):
#   local_ratelimit → ext_authz(OPA) → cilium.l7policy → router
#
# Design notes:
#   · local_ratelimit: per-node token bucket (60 req/min); no external call.
#     Scales horizontally — each node independently enforces 60 req/min.
#   · ext_authz(OPA): enforces Rego policies from 24-opa/configmap.yaml.
#     failure_mode_allow: if OPA is unavailable, native app auth still applies.
#   · cilium.l7policy: auto-injected by Cilium for L7 network policy enforcement.
#   · router: Cilium's xDS provides per-service route configs (RDS).
#
# Note: jwt_authn omitted — Cilium 1.20's Go proto registry does not include
# envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication and the config
# fails with "unexpected token {" during deserialization. OPA receives raw headers
# (x-jwt-sub, x-jwt-email) and the Authorization header for policy evaluation.
#
# CLUSTER DNS LIMITATION: Cilium's Envoy runs on host network and uses host DNS,
# which cannot resolve *.svc.cluster.local names. Clusters for OPA and OTel use
# their stable ClusterIPs directly (Cilium's BPF LB handles the DNAT to pod IPs).
# The dex cluster reuses the gateway's existing EDS cluster to avoid duplication.
#
# Future — Coraza WAF:
#   Add envoy.filters.http.wasm (before local_ratelimit) with coraza-proxy-wasm.
apiVersion: cilium.io/v2
kind: CiliumClusterwideEnvoyConfig
metadata:
  name: gateway-authz
spec:
  services:
    - name: grafana
      namespace: monitoring
    - name: immich-server
      namespace: immich
    - name: paperless-ngx
      namespace: paperless
    - name: schenkmatch
      namespace: schenkmatch
    - name: zot
      namespace: zot
    - name: hubble-ui
      namespace: kube-system

  resources:
    # ── Listener ────────────────────────────────────────────────────────────
    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: gateway-authz
      filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: gateway_authz

              rds:
                config_source:
                  resource_api_version: V3
                  api_config_source:
                    api_type: GRPC
                    transport_api_version: V3
                    grpc_services:
                      - envoy_grpc:
                          cluster_name: xds-grpc-cilium
                route_config_name: gateway-authz

              http_filters:
                # 1. Local rate limit: token bucket, 60 req/min per Envoy instance.
                - name: envoy.filters.http.local_ratelimit
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                    stat_prefix: gateway_authz_rl
                    token_bucket:
                      max_tokens: 60
                      tokens_per_fill: 60
                      fill_interval: 60s
                    filter_enabled:
                      default_value:
                        numerator: 100
                        denominator: HUNDRED
                    filter_enforced:
                      default_value:
                        numerator: 100
                        denominator: HUNDRED

                # 2. OPA ext_authz: enforces Rego policies in 24-opa/configmap.yaml.
                #    failure_mode_allow: if OPA is unavailable, requests pass through
                #    (native app auth and Cilium network policies still apply).
                - name: envoy.filters.http.ext_authz
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                    grpc_service:
                      envoy_grpc:
                        cluster_name: opa_authz
                      timeout: 5s
                    transport_api_version: V3
                    metadata_context_namespaces:
                      - envoy.filters.http.jwt_authn
                    failure_mode_allow: true

                # 4. Router (must be last).
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ── Upstream clusters ────────────────────────────────────────────────────

    # OPA gRPC ext_authz. STATIC + ClusterIP: Cilium Envoy runs on host network
    # and cannot resolve *.svc.cluster.local via host DNS; Cilium's BPF LB DNAT's
    # the ClusterIP to the pod. ClusterIPs are stable for the service lifetime.
    # If OPA's ClusterIP changes (service recreate), update this address.
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: opa_authz
      connect_timeout: 5s
      type: STATIC
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: opa_authz
        endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    # kubectl get svc -n security opa -o jsonpath='{.spec.clusterIP}'
                    address: 10.102.123.91
                    port_value: 9191
