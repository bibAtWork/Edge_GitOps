apiVersion: apps/v1
kind: Deployment
metadata:
  name: ratelimit
  namespace: security
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ratelimit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ratelimit
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ratelimit
          # renovate: datasource=docker depName=envoyproxy/ratelimit
          image: docker.io/envoyproxy/ratelimit:master
          env:
            - name: REDIS_SOCKET_TYPE
              value: tcp
            - name: REDIS_URL
              value: valkey.security.svc.cluster.local:6379
            - name: RUNTIME_ROOT
              value: /data
            - name: RUNTIME_SUBDIRECTORY
              value: ratelimit
            - name: RUNTIME_WATCH_ROOT
              value: "false"
            - name: LOG_LEVEL
              value: warn
            - name: LOG_FORMAT
              value: json
            - name: USE_STATSD
              value: "false"
          ports:
            - name: grpc
              containerPort: 8081
            - name: http
              containerPort: 8080
            - name: debug
              containerPort: 6070
          volumeMounts:
            - name: config
              mountPath: /data/ratelimit/config
              readOnly: true
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
              ephemeral-storage: 10Mi
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: ratelimit-config
---
apiVersion: v1
kind: Service
metadata:
  name: ratelimit
  namespace: security
spec:
  selector:
    app.kubernetes.io/name: ratelimit
  ports:
    - name: grpc
      port: 8081
      targetPort: 8081
    - name: http
      port: 8080
      targetPort: 8080
