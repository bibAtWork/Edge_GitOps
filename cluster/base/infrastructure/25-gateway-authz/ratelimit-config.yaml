apiVersion: v1
kind: ConfigMap
metadata:
  name: ratelimit-config
  namespace: security
data:
  config.yaml: |
    domain: gateway
    descriptors:
      # Default: 60 req/min per client IP (applies to all services unless overridden below)
      - key: client_ip
        rate_limit:
          unit: MINUTE
          requests_per_unit: 60
        descriptors:
          # Higher limit for Grafana — dashboard panels fire many parallel datasource queries
          - key: host
            value: grafana.homelab.data-harness.org
            rate_limit:
              unit: MINUTE
              requests_per_unit: 120
          # Higher limit for Immich — media API issues many sub-requests per page load
          - key: host
            value: immich.homelab.data-harness.org
            rate_limit:
              unit: MINUTE
              requests_per_unit: 300
          # Tighter limit for Hubble UI — sensitive cluster view, low expected traffic
          - key: host
            value: hubble.homelab.data-harness.org
            rate_limit:
              unit: MINUTE
              requests_per_unit: 30
