# Credentials for the Signal alertmanager bridge.
# SIGNAL_SENDER:               phone number of the linked Signal account
# SIGNAL_RECIPIENTS:           optional — comma-separated phone numbers
# SIGNAL_RECIPIENT_USERNAMES:  optional — comma-separated Signal aliases (alias.XX)
# To update: sops -d -i <file>, edit, sops -e -i <file>
# To link device (one-time after deploy):
#   kubectl port-forward -n monitoring svc/signal-alertmanager 8080:8080
#   Open http://localhost:8080/v1/qrcodelink?device_name=homelab
#   Scan QR in Signal → Settings → Linked Devices → Link New Device
