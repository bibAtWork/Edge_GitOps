# SETUP REQUIRED before committing real values:
# 1. Fill in your credentials below.
#    SIGNAL_SENDER:               phone number of the linked Signal account (always required)
#    SIGNAL_RECIPIENTS:           optional — comma-separated phone numbers (+49123456789,+49987654321)
#    SIGNAL_RECIPIENT_USERNAMES:  optional — comma-separated Signal aliases (alice.42,bob.07)
#    At least one of SIGNAL_RECIPIENTS or SIGNAL_RECIPIENT_USERNAMES must be non-empty.
# 2. Encrypt before committing:
#    sops -e -i cluster/base/infrastructure/18-signal-alertmanager/secret.yaml
# 3. After initial deploy, link the Signal account (one-time):
#    kubectl port-forward -n monitoring svc/signal-alertmanager 8080:8080
#    Open http://localhost:8080/v1/qrcodelink?device_name=homelab in a browser
#    Scan the QR code: Signal app → Settings → Linked Devices → Link New Device
