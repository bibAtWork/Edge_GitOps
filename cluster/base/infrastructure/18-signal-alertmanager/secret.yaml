# SETUP REQUIRED before committing:
# 1. Replace the placeholder values below with your real Signal phone numbers.
#    SIGNAL_SENDER:     the number you linked as a device (e.g. +49123456789)
#    SIGNAL_RECIPIENTS: comma-separated list of numbers to notify (can be same or different)
# 2. Encrypt with SOPS before committing:
#    sops -e -i cluster/base/infrastructure/18-signal-alertmanager/secret.yaml
# 3. After initial deploy, link the Signal account (one-time manual step):
#    kubectl port-forward -n monitoring deploy/signal-alertmanager 8080:8080
#    Open http://localhost:8080/v1/qrcodelink?device_name=homelab in a browser
#    Scan the QR code in Signal app → Settings → Linked Devices → Link New Device
apiVersion: v1
kind: Secret
metadata:
  name: signal-credentials
  namespace: monitoring
stringData:
  SIGNAL_SENDER: "+10000000000"
  SIGNAL_RECIPIENTS: "+10000000000"
