apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: signal-alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-alertmanager
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: signal-cli
          # Bundles signal-cli natively; exposes REST API on :8080.
          # Pin to a specific digest via Renovate once deployed.
          image: bbernhard/signal-cli-rest-api:0.93
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: MODE
              value: native
          volumeMounts:
            - name: signal-data
              mountPath: /home/.local/share/signal-cli
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 100Mi
            limits:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 500Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

        - name: webhook-adapter
          image: python:3.12-alpine
          command: [python, /scripts/adapter.py]
          ports:
            - containerPort: 9093
              name: webhook
          env:
            - name: SIGNAL_SENDER
              valueFrom:
                secretKeyRef:
                  name: signal-credentials
                  key: SIGNAL_SENDER
            - name: SIGNAL_RECIPIENTS
              valueFrom:
                secretKeyRef:
                  name: signal-credentials
                  key: SIGNAL_RECIPIENTS
            - name: SIGNAL_RECIPIENT_USERNAMES
              valueFrom:
                secretKeyRef:
                  name: signal-credentials
                  key: SIGNAL_RECIPIENT_USERNAMES
            - name: SIGNAL_API_URL
              value: http://localhost:8080 # nosonar
          volumeMounts:
            - name: adapter-script
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 100Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health
              port: 9093
            initialDelaySeconds: 5
            periodSeconds: 30

      volumes:
        - name: signal-data
          persistentVolumeClaim:
            claimName: signal-cli-data
        - name: adapter-script
          configMap:
            name: signal-webhook-adapter
            defaultMode: 493  # 0755 octal
