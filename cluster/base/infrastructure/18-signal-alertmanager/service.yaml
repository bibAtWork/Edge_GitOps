apiVersion: v1
kind: Service
metadata:
  name: signal-alertmanager
  namespace: monitoring
  labels:
    app.kubernetes.io/name: signal-alertmanager
spec:
  selector:
    app.kubernetes.io/name: signal-alertmanager
  ports:
    # Grafana webhook contact point points here
    - name: webhook
      port: 9093
      targetPort: webhook
    # Exposed for initial account linking: kubectl port-forward -n monitoring svc/signal-alertmanager 8080:8080
    # then open http://localhost:8080/v1/qrcodelink?device_name=homelab
    - name: signal-api
      port: 8080
      targetPort: http
