# Hub-and-spoke migration (2026-08-17): the S3 API (:8333) ingress used to be any-pod
# (fromEndpoints: [{}]), which is what CLAUDE.md's SeaweedFS architecture note assumed was
# "the primary auth boundary" for S3 access but wasn't actually enforcing anything -- see
# docs/network-architecture.md section 3. Replaced with the explicit, confirmed-live caller
# list: velero (allow-velero-egress) and zot (allow-zot-egress), which already egress to
# this port today. talos-backup was on this list until 2026-08-25, when its CronJob was
# removed for never having uploaded anything. The kube-system grant is dropped entirely:
# it was written for a SeaweedFS CSI driver (allow-csi-seaweedfs-egress's own comment)
# that a live audit confirmed does not exist in this cluster -- `kubectl get csidrivers`
# returns nothing.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-seaweedfs-internal
  namespace: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  ingress:
    # Whole namespace, not just app.kubernetes.io/name=seaweedfs -- found live (2026-08-17,
    # PR 6/6) right after deleting allow-cluster-internal entirely: seaweedfs-bucket-init
    # and seaweedfs-collection-routing Job pods (seaweedfs-collection-routing-job.yaml, a
    # sibling resource in this overlay) carry only batch.kubernetes.io/job-name-style
    # labels, no app.kubernetes.io/name -- the label-scoped version of this rule never
    # covered them. They'd been silently relying on allow-cluster-internal this whole time,
    # same story as every other gap this migration surfaced. Confirmed live: both Jobs were
    # stuck retrying (Init:0/1, POLICY_DENIED on :8333) until this widened.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: seaweedfs
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: velero
        - matchLabels:
            app.kubernetes.io/name: zot
            io.kubernetes.pod.namespace: zot
        # Longhorn's backup target is this endpoint (ADR-002 Task 1). Whole
        # namespace rather than a pod selector: the backup data path is the
        # instance-manager pods, while backup-target polling and validation come
        # from longhorn-manager, and both must reach S3 or backups fail in ways
        # that present as a storage fault rather than a policy drop.
        - matchLabels:
            io.kubernetes.pod.namespace: longhorn-system
        # Database backup CronJobs. Each dumps its own database and uploads the
        # artifact to the db-backups bucket; they need nothing from SeaweedFS
        # beyond S3 on 8333. Added 2026-08-18 alongside the jobs themselves --
        # without an entry here the upload hangs and the job eventually fails,
        # since the drop is on SeaweedFS's ingress side, not the caller's
        # egress (confirmed via hubble: "policy-verdict:none INGRESS DENIED").
        #
        # Selected by an explicit app.kubernetes.io/name label set on each
        # CronJob's pod template: Job pods otherwise only carry job-name and
        # controller-uid, which change every run and cannot be matched here.
        - matchLabels:
            app.kubernetes.io/name: immich-postgres-backup
            io.kubernetes.pod.namespace: immich
        - matchLabels:
            app.kubernetes.io/name: keycloak-postgres-backup
            io.kubernetes.pod.namespace: keycloak
        - matchLabels:
            app.kubernetes.io/name: paperless-sqlite-backup
            io.kubernetes.pod.namespace: paperless
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
