# Hub-and-spoke migration (2026-08-17): the S3 API (:8333) ingress used to be any-pod
# (fromEndpoints: [{}]), which is what CLAUDE.md's SeaweedFS architecture note assumed was
# "the primary auth boundary" for S3 access but wasn't actually enforcing anything -- see
# docs/network-architecture.md section 3. Replaced with the explicit, confirmed-live caller
# list. The kube-system grant is dropped entirely: it was written for a SeaweedFS CSI driver
# (allow-csi-seaweedfs-egress's own comment) that a live audit confirmed does not exist in
# this cluster -- `kubectl get csidrivers` returns nothing.
#
# The ADR-012 cutover (2026-09-13) removed the old backup pipeline's callers: Velero,
# Longhorn's backup target in longhorn-system, and the per-namespace database dump jobs.
# What remains is Zot, the recovery system, and the CNPG WAL archivers.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-seaweedfs-internal
  namespace: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  ingress:
    # Whole namespace, not just app.kubernetes.io/name=seaweedfs -- found live (2026-08-17,
    # PR 6/6) right after deleting allow-cluster-internal entirely: seaweedfs-bucket-init
    # and seaweedfs-collection-routing Job pods (seaweedfs-collection-routing-job.yaml, a
    # sibling resource in this overlay) carry only batch.kubernetes.io/job-name-style
    # labels, no app.kubernetes.io/name -- the label-scoped version of this rule never
    # covered them. They'd been silently relying on allow-cluster-internal this whole time,
    # same story as every other gap this migration surfaced. Confirmed live: both Jobs were
    # stuck retrying (Init:0/1, POLICY_DENIED on :8333) until this widened.
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: seaweedfs
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: zot
            io.kubernetes.pod.namespace: zot
        # The recovery system (ADR-012). Its local repository is the
        # `recovery` bucket; every backup-store credential lives in this one
        # namespace, and application namespaces hold none.
        - matchLabels:
            io.kubernetes.pod.namespace: backup-system
        # CNPG's WAL archivers (ADR-012): the barman-cloud plugin's sidecar,
        # running inside each database pod. filer-meta-pg needs no entry here;
        # it lives in this namespace.
        - matchLabels:
            cnpg.io/cluster: keycloak-pg
            io.kubernetes.pod.namespace: keycloak
        - matchLabels:
            cnpg.io/cluster: immich-pg
            io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
