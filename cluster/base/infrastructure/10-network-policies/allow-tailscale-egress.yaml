# Tailscale subnet router requires WireGuard UDP (41641), STUN UDP (3478) for NAT
# traversal, and ICMP for latency probing / DERP server selection.
# HTTPS egress to the Tailscale control plane is already covered by
# allow-internet-egress-https-only (TCP 443 to world, all pods).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-tailscale-wireguard-egress
  namespace: tailscale
spec:
  endpointSelector:
    matchLabels:
      tailscale.com/parent-resource: homelab-subnet-router
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "41641"
              protocol: UDP
            - port: "3478"
              protocol: UDP
    - toEntities:
        - world
      icmps:
        - fields:
            - type: 8
              family: IPv4
