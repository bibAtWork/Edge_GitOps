apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-internet-egress-https-only
spec:
  # TCP/443 internet egress. The historical resource name is retained for migration.
  # This L4 rule does not validate TLS or restrict external destinations.
  # Pods needing plain HTTP to public endpoints must use an explicit per-namespace policy.
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
