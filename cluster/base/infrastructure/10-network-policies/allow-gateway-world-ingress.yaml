apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-world-ingress
spec:
  # The Cilium gateway proxy (reserved:ingress) needs ingress policies that include
  # the world entity so that cilium.l7policy allows connections whose source identity
  # resolves to world (2) via ipcache. Without this, the NPDS entry has no rules
  # (deny-all) even though the bpf_metadata filter has enforce_policy_on_l7lb=true.
  endpointSelector:
    matchLabels:
      reserved.ingress: ""
  ingress:
    - fromEntities:
        - all
