apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-world-ingress
spec:
  # matchLabels with the colon form correctly targets reserved:ingress.
  # matchExpressions with key: reserved.ingress and operator: Exists also works but requires
  # a full policy reconciliation cycle; matchLabels is more reliable.
  endpointSelector:
    matchLabels:
      reserved:ingress: ""
  ingress:
    - fromEntities:
        - world
        - host
        - cluster
