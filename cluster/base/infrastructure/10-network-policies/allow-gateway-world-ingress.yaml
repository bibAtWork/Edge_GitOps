apiVersion: "cilium.io/v2"
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-world-ingress
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: Exists
  ingress:
    - fromEntities:
        - world
        - host
        - cluster
    - fromCIDRSet:
        - cidr: 192.168.0.0/16   # RFC 1918 LAN access
        - cidr: 100.64.0.0/10   # Tailscale CGNAT
