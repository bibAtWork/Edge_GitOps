apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-gateway-world-ingress
spec:
  # Target the Cilium gateway proxy endpoint (reserved:ingress identity).
  # Without this, default-deny-ingress blocks world entity from reaching
  # the gateway before routing to backends even begins.
  endpointSelector:
    matchLabels:
      reserved.ingress: ""
  ingress:
    - fromEntities:
        - world
        - host
        - cluster
