apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-dns-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
      # Lakehouse has an L7 DNS rule so Cilium can learn the IPs for its
      # Gemini-only toFQDNs egress policy. An overlapping L4 DNS rule would
      # bypass that DNS proxy.
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values: [lakehouse]
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
