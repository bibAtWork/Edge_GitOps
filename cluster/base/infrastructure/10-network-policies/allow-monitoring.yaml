---
# otel-agent lives in monitoring-agents now, so this policy follows it there --
# a CiliumNetworkPolicy only selects endpoints in its own namespace, and left in
# `monitoring` it would have silently stopped matching anything, taking the
# agent's egress with it.
#
# The targets are named explicitly rather than the previous `toEndpoints: [{}]`
# on :8428. That wildcard was writing a cluster-wide allowance to reach anything
# on the VictoriaMetrics port; there is exactly one such thing and it is below.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-agent-egress
  namespace: monitoring-agents
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: otel-agent
  egress:
    # Logs and traces, forwarded to the gateway for enrichment.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: otel-collector-gateway
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
    # Hubble flow metrics, remote-written straight to vmsingle by the agent's
    # prometheusremotewrite exporter -- it does not route these via the gateway.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
            io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    # ...which it first has to scrape off each cilium-agent.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: cilium
      toPorts:
        - ports:
            - port: "9965"
              protocol: TCP
---
# Hub-and-spoke migration (2026-08-17): covers otel-collector-gateway's ingress (from
# otel-agent on :4317), vlsingle's and vtsingle's ingress (from otel-collector-gateway on
# :9428/:10428) -- none of which had a dedicated rule before this, silently relying on
# allow-cluster-internal. vmsingle doesn't need this fallback -- restrict-vmsingle-ingress
# below already has its own precise, explicit caller list.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace-ingress
  namespace: monitoring
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
---
# allow-grafana-ingress (fromEntities: [ingress]) removed 2026-08-17: that Cilium reserved
# entity stopped matching anything once the Gateway moved off Cilium's own embedded
# GatewayClass onto Envoy Gateway (2026-08-16, ADR-001) -- Grafana's actual gateway
# reachability has been carried entirely by allow-cluster-internal since then, same as
# immich/paperless/schenkmatch. Now covered by the clusterwide allow-gateway-ingress.
---
# Restrict vmsingle (VictoriaMetrics query/write API on :8428) to authorized consumers.
# Deny-list: kube-state-metrics, node-exporter, and otel-agent push data to vmagent/
# otel-gateway respectively; they have no legitimate reason to call vmsingle directly.
# The cluster-wide allow-cluster-internal ingress still allows all other monitoring pods.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: restrict-vmsingle-ingress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  ingressDeny:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-node-exporter
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: kube-state-metrics
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: otel-agent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: vmagent
        - matchLabels:
            app.kubernetes.io/name: vmalert
        - matchLabels:
            app.kubernetes.io/name: victoria-metrics-operator
        - matchLabels:
            app.kubernetes.io/name: otel-collector-gateway
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
# Grafana -> the Gateway, for the OIDC token exchange.
#
# Symptom this fixes: after a successful Keycloak login the callback hung for 15
# seconds and Envoy returned "upstream request timeout", while Paperless and
# Immich SSO kept working. Grafana logs showed
# `path=/login/generic_oauth ... duration=15.009s`, which is the server-side
# token exchange stalling, not the browser redirect.
#
# Grafana's reachability to Keycloak used to ride on the clusterwide
# allow-cluster-internal, which granted any pod ingress from any other. Removing
# that was correct -- it made every narrower rule in this repo a no-op -- but it
# took this path with it, and nothing failed until someone logged in.
#
# This targets the Envoy pod on container port 10443, NOT the VIP on 443. Cilium
# evaluates in-cluster pod-to-VIP traffic against the VIP's resolved backend, and
# ADR-001 remaps the listener ports to 10080/10443. Writing 443 here yields a
# policy that reads correctly and matches nothing -- the same trap already hit
# for zot, immich and paperless.
#
# No internal-DNS rule accompanies this one, unlike Paperless. Grafana is
# configured with explicit auth_url/token_url/api_url, all public, so it never
# fetches the discovery document and never dials keycloak.keycloak.svc. A rule
# for that path would also not work: Keycloak's own ingress allowlist admits
# opa, paperless and envoy only. Better absent than present-and-inert.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-keycloak-gateway-egress
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
# The ingress half of allow-config-cli-metrics-egress. vmsingle's ingress is an
# explicit allowlist, so an egress rule alone reaches a closed door.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-keycloak-config-cli-to-vmsingle
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: keycloak
            app.kubernetes.io/name: keycloak-config-cli
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
