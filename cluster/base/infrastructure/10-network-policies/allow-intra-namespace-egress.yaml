# Per-namespace egress policies allowing pods to reach peers in the same namespace.
# toEndpoints: [{}] in a namespace-scoped CiliumNetworkPolicy selects only endpoints
# within that namespace, providing isolation while keeping same-namespace communication.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace-egress
  namespace: monitoring
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
