---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  # Exclude reserved:ingress — the gateway proxy has its own dedicated ingress policy
  # (allow-gateway-world-ingress). The default-deny must not overlap with it.
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
  ingress:
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
  egress:
    - toEntities:
        - host
        - kube-apiserver
