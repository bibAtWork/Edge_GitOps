---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  # Exclude reserved:ingress so the Cilium gateway proxy has zero ingress policies,
  # which sets enforce_policy_on_l7lb=false in the bpf_metadata listener filter.
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
  ingress:
    - fromEntities:
        - host
---
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny-egress
spec:
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
  egress:
    - toEntities:
        - host
        - kube-apiserver
