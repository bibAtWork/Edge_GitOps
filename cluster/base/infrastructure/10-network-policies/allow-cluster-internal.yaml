apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cluster-internal
spec:
  # Allow all intra-cluster traffic (pod-to-pod, pod-to-service).
  # The default-deny policies cover external (world) traffic; this rule
  # restores cluster-internal communication that default-deny blocks.
  # External access is still controlled by allow-internet-egress-https-only
  # and namespace-specific ingress policies.
  # Allow ingress from any cluster endpoint (pods + nodes).
  # This is intentionally kept broad on the ingress side: it prevents traffic from
  # the internet but allows all intra-cluster services to reach any pod.
  # Per-namespace and cross-namespace EGRESS policies live in separate files.
  # Exclude reserved:ingress (Cilium gateway proxy). It has its own dedicated ingress policy
  # (allow-gateway-world-ingress) that explicitly allowlists world, host, and cluster identities
  # in the NPDS so cilium.l7policy permits external traffic through the gateway.
  #
  # Security review 2026-08-14, finding M4: also exclude cattle-system. Its only
  # workload (system-upgrade-controller) holds a cluster-admin ClusterRoleBinding
  # and exposes zero ports/probes (verified live — no ports, no liveness/readiness
  # probe on its container, no Service in the namespace at all), so nothing
  # legitimately needs pod-network ingress to it. Cilium policies are additive —
  # a narrower namespace-scoped policy can't override this cluster-wide allow, so
  # the exclusion has to live here. cattle-system falls back to default-deny-ingress
  # (host only, i.e. kubelet), which is all it has ever actually used.
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - cattle-system
  ingress:
    - fromEntities:
        - cluster
