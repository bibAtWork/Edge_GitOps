apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-cluster-internal
spec:
  # Allow all intra-cluster traffic (pod-to-pod, pod-to-service).
  # The default-deny policies cover external (world) traffic; this rule
  # restores cluster-internal communication that default-deny blocks.
  # External access is still controlled by allow-internet-egress-https-only
  # and namespace-specific ingress policies.
  # Allow ingress from any cluster endpoint (pods + nodes).
  # This is intentionally kept broad on the ingress side: it prevents traffic from
  # the internet but allows all intra-cluster services to reach any pod.
  # Per-namespace and cross-namespace EGRESS policies live in separate files.
  # Exclude reserved:ingress (Cilium gateway proxy). It has its own dedicated ingress policy
  # (allow-gateway-world-ingress) that explicitly allowlists world, host, and cluster identities
  # in the NPDS so cilium.l7policy permits external traffic through the gateway.
  #
  # Security review 2026-08-14, finding M4: also exclude cattle-system. Its only
  # workload (system-upgrade-controller) holds a cluster-admin ClusterRoleBinding
  # and exposes zero ports/probes (verified live — no ports, no liveness/readiness
  # probe on its container, no Service in the namespace at all), so nothing
  # legitimately needs pod-network ingress to it. Cilium policies are additive —
  # a narrower namespace-scoped policy can't override this cluster-wide allow, so
  # the exclusion has to live here. cattle-system falls back to default-deny-ingress
  # (host only, i.e. kubelet), which is all it has ever actually used.
  #
  # Hub-and-spoke migration (2026-08-17), PR 2/6 -- see docs/network-architecture.md
  # section 3 and PR #177: staged narrowing of this policy toward zero exclusions,
  # namespace-by-namespace, each verified live before merging. This batch was the
  # low-risk set -- single-purpose or single/zero-pod namespaces with no identified
  # cross-namespace ingress need beyond what PR #177's new rules already cover
  # (schenkmatch: single pod, no peer; falco: DaemonSet pods DO have a same-namespace
  # peer, k8s-metacollector on :45000 -- missed in the initial audit, caught live via
  # Hubble right after this exclusion landed, fixed with a same-namespace ingress rule
  # in allow-intra-namespace-ingress.yaml, PR #178; trivy-system, zot: ingress only
  # from callers now explicitly granted -- allow-seaweedfs-internal, allow-trivy-zot-
  # egress's matching allow-trivy-ingress (also added in PR #178, a real gap that
  # predated this migration), or the gateway hub rule; external-dns,
  # local-path-storage, cilium-secrets, kubescape, system-upgrade, gateway-system:
  # zero or near-zero live pods, no in-namespace peer traffic).
  #
  # PR 3/6: the medium-risk batch, each with a new dedicated rule from PR #177 or
  # already covered by an existing per-app rule -- immich, paperless (own
  # allow-intra-namespace-ingress); monitoring, flux-system, kube-system (own
  # allow-intra-namespace-ingress, all added in PR #177); velero, talos-backup
  # (K8s-API/CRD coordination only, confirmed no pod-to-pod need); tailscale
  # (operator and hostNetwork subnet-router don't talk to each other); cert-manager
  # (webhook is API-server-initiated, not called by the other components); kyverno
  # (confirmed twice via live Hubble, 132-flow full-buffer sample: zero
  # kyverno-to-kyverno flows, only host healthchecks and monitoring's scrape).
  #
  # PR 4/6: seaweedfs -- the concrete gap that started this whole migration
  # (docs/network-architecture.md section 3): CLAUDE.md's claim that the Cilium policy
  # is "the primary auth boundary" for S3 access wasn't true until this line landed.
  # Ingress now covered exclusively by allow-seaweedfs-internal's explicit caller list
  # (velero, talos-backup, zot -- PR #177) plus its own same-namespace rule
  # (master/volume/filer talking to each other). Verified live before applying: a
  # 1000-flow Hubble sample as destination showed only same-namespace traffic, velero
  # on :8333, and host-identity health probes (unaffected by this exclusion regardless).
  #
  # Falls back to default-deny-ingress (host only) for each, same as cattle-system,
  # unless covered by a more specific rule as noted above.
  endpointSelector:
    matchExpressions:
      - key: reserved.ingress
        operator: DoesNotExist
      - key: io.kubernetes.pod.namespace
        operator: NotIn
        values:
          - cattle-system
          - schenkmatch
          - falco
          - trivy-system
          - zot
          - external-dns
          - local-path-storage
          - cilium-secrets
          - kubescape
          - system-upgrade
          - gateway-system
          - immich
          - paperless
          - monitoring
          - flux-system
          - kube-system
          - velero
          - talos-backup
          - tailscale
          - cert-manager
          - kyverno
          - seaweedfs
  ingress:
    - fromEntities:
        - cluster
