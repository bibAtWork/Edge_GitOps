apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-zot-egress
  namespace: zot
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: seaweedfs
            io.kubernetes.pod.namespace: seaweedfs
      toPorts:
        - ports:
            - port: "8333"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # ADR-002: zot's own OIDC client (config-configmap.yaml) fetches the
    # discovery document from its configured issuer
    # (keycloak.homelab.data-harness.org) at startup -- unlike every other
    # OIDC integration in this repo, zot has no separate internal-service
    # override for that call (Issuer doubles as the discovery URL in
    # zot's config schema), so it resolves and dials the Gateway VIP like
    # a browser would, not keycloak's internal Service directly.
    #
    # Confirmed live via Hubble that this is NOT "reach the internet" and
    # a toCIDR rule for the VIP doesn't work: docs/network-architecture.md's
    # documented gotcha (cilium/cilium#47617) applies here too -- Cilium
    # evaluates egress from an in-cluster pod against the VIP's REAL
    # resolved backend (the envoy-gateway-system pod on its container port
    # 10443, per ADR-001's useListenerPortAsContainerPort: false), not the
    # VIP address itself. The flow that was actually being dropped was
    # zot -> envoy-gateway-system pod :10443, not zot -> 192.168.178.200.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: envoy
            io.kubernetes.pod.namespace: envoy-gateway-system
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
# Hub-and-spoke migration (2026-08-17), PR 2/6: Trivy's own egress rule
# (allow-trivy-zot-egress, allow-cross-namespace-egress.yaml) has existed for a while, but
# there was never a matching ingress rule on Zot's side -- found while excluding the zot
# namespace from allow-cluster-internal, which would otherwise have silently broken Trivy's
# registry scans the moment this landed. allow-trivy-zot-egress scopes its source as
# endpointSelector: {} (every pod in trivy-system, not just a specific label), so this
# mirrors that same whole-namespace scope on the ingress side.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-trivy-ingress
  namespace: zot
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zot
  ingress:
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: trivy-system
      toPorts:
        - ports:
            - port: "5000"
              protocol: TCP
