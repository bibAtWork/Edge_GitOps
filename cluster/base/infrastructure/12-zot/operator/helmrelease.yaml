apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: zot
      version: ">=0.1.0 <1.0.0"
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  # The zot chart (v0.1.x) has no configFiles/secretFiles template support.
  # postRenderers patches the StatefulSet to mount the config ConfigMap and
  # htpasswd Secret that are deployed alongside this HelmRelease.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: StatefulSet
              name: zot
            patch: |
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: zot-config
                  configMap:
                    name: zot-config
              - op: add
                path: /spec/template/spec/volumes/-
                value:
                  name: zot-auth
                  secret:
                    secretName: zot-htpasswd
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: zot-config
                  mountPath: /etc/zot
                  readOnly: true
              - op: add
                path: /spec/template/spec/containers/0/volumeMounts/-
                value:
                  name: zot-auth
                  mountPath: /secret
                  readOnly: true
  values:
    replicaCount: 1

    image:
      repository: ghcr.io/project-zot/zot-linux-amd64
      tag: ""

    persistence:
      # zot stores image data in SeaweedFS S3; local persistence is only a cache
      enabled: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
