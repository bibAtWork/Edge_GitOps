apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: zot
      version: 0.1.124
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  # The zot chart (v0.1.x) has no configFiles/secretFiles template support.
  # postRenderers patches the StatefulSet to mount the config ConfigMap and
  # htpasswd Secret that are deployed alongside this HelmRelease.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: zot
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: zot
              spec:
                ports:
                  - name: zot
                    port: 5000
                    protocol: TCP
                    appProtocol: kubernetes.io/http
          - target:
              kind: StatefulSet
              name: zot
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: zot
              spec:
                template:
                  spec:
                    volumes:
                      - name: zot-config
                        configMap:
                          name: zot-config
                      - name: zot-auth
                        secret:
                          secretName: zot-htpasswd
                      - name: zot-oidc-auth
                        # ADR-002: separate from zot-auth above so the new
                        # secret doesn't need to touch (and re-encrypt) the
                        # existing SOPS-encrypted zot-htpasswd file.
                        secret:
                          secretName: zot-oidc-credentials
                    containers:
                      - name: zot
                        env:
                          - name: AWS_ACCESS_KEY_ID
                            valueFrom:
                              secretKeyRef:
                                name: zot-s3-credentials
                                key: access_key_id
                          - name: AWS_SECRET_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: zot-s3-credentials
                                key: secret_access_key
                        volumeMounts:
                          - name: zot-config
                            mountPath: /etc/zot
                            readOnly: true
                          - name: zot-auth
                            mountPath: /secret
                            readOnly: true
                          - name: zot-oidc-auth
                            mountPath: /secret-oidc
                            readOnly: true
  values:
    replicaCount: 1

    # The chart defaults to NodePort, which had zot answering on a high port on
    # the node address, outside the Gateway and therefore outside its OIDC and
    # OPA path. Nothing referenced that port -- the HTTPRoute is the intended
    # way in -- so it was reachable without being used, which is the worst of
    # both.
    #
    # Worth knowing for the next chart that does this: the Service was never in
    # this repository as a NodePort, because the chart chose the type and the
    # values said nothing. Grepping the manifests for NodePort finds nothing;
    # only asking the cluster does.
    service:
      type: ClusterIP

    image:
      repository: ghcr.io/project-zot/zot-linux-amd64
      # Was `tag: ""`, which reads as a pin and is not one -- an empty string
      # overrides the chart's own default tag and falls through to
      # .Chart.AppVersion, so the running version was decided by chart
      # metadata while this file appeared to decide it. Renovate saw nothing
      # to track.
      #
      # Set to the version that was already running, so this changes no image
      # and starts being true. zot is one of the charts whose appVersion
      # trails upstream (v2.1.18 here against v2.1.21 released), so a real
      # pin is also what lets that gap surface as a PR.
      tag: v2.1.18

    # S3 storage initialization can be slow; give Zot 5 minutes before giving up
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      initialDelaySeconds: 10

    # `persistence` is a plain bool in this chart, not a map. Setting
    # `persistence.enabled: false` made it a non-empty map, which Helm
    # evaluates as truthy -- so this said "off" and meant "on" for the life
    # of the file, and the PVC it was supposed to suppress has existed all
    # along. On is the correct answer anyway: image blobs live in SeaweedFS
    # S3 (storageDriver: s3, bucket zot-registry), but the volume still holds
    # zot's cache.db, meta.db and its bundled Trivy vulnerability databases.
    # Losing it costs a Trivy DB re-download, not images.
    persistence: true
    pvc:
      create: true
      storage: 8Gi
      # Named explicitly rather than inheriting the cluster default. This
      # volume landed on local-path only because nothing pinned it, which is
      # exactly the accident the default is being moved away from.
      storageClassName: longhorn

    # Pod-level, and distinct from the container `securityContext` below --
    # the chart renders this one at spec.template.spec.securityContext and
    # that one at the container. fsGroup is only meaningful here.
    #
    # Without it the Longhorn volume (ext4, root-owned at format time) is
    # unwritable by uid 1000 and zot exits immediately with
    # "open /var/lib/registry/cache.db: permission denied".
    #
    # This was not needed while the volume came from local-path, whose setup
    # script does `mkdir -m 0777` -- any uid could write. Moving to real block
    # storage is what exposed the missing field, not what broke it.
    podSecurityContext:
      fsGroup: 1000
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
