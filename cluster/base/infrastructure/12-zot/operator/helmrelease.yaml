apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zot
  namespace: zot
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: zot
      version: 0.1.122
      sourceRef:
        kind: HelmRepository
        name: zot
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  # The zot chart (v0.1.x) has no configFiles/secretFiles template support.
  # postRenderers patches the StatefulSet to mount the config ConfigMap and
  # htpasswd Secret that are deployed alongside this HelmRelease.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Service
              name: zot
            patch: |
              apiVersion: v1
              kind: Service
              metadata:
                name: zot
              spec:
                ports:
                  - name: zot
                    port: 5000
                    protocol: TCP
                    appProtocol: kubernetes.io/http
          - target:
              kind: StatefulSet
              name: zot
            patch: |
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                name: zot
              spec:
                template:
                  spec:
                    volumes:
                      - name: zot-config
                        configMap:
                          name: zot-config
                      - name: zot-auth
                        secret:
                          secretName: zot-htpasswd
                      - name: zot-oidc-auth
                        # ADR-002: separate from zot-auth above so the new
                        # secret doesn't need to touch (and re-encrypt) the
                        # existing SOPS-encrypted zot-htpasswd file.
                        secret:
                          secretName: zot-oidc-credentials
                    containers:
                      - name: zot
                        env:
                          - name: AWS_ACCESS_KEY_ID
                            valueFrom:
                              secretKeyRef:
                                name: zot-s3-credentials
                                key: access_key_id
                          - name: AWS_SECRET_ACCESS_KEY
                            valueFrom:
                              secretKeyRef:
                                name: zot-s3-credentials
                                key: secret_access_key
                        volumeMounts:
                          - name: zot-config
                            mountPath: /etc/zot
                            readOnly: true
                          - name: zot-auth
                            mountPath: /secret
                            readOnly: true
                          - name: zot-oidc-auth
                            mountPath: /secret-oidc
                            readOnly: true
  values:
    replicaCount: 1

    # The chart defaults to NodePort, which had zot answering on a high port on
    # the node address, outside the Gateway and therefore outside its OIDC and
    # OPA path. Nothing referenced that port -- the HTTPRoute is the intended
    # way in -- so it was reachable without being used, which is the worst of
    # both.
    #
    # Worth knowing for the next chart that does this: the Service was never in
    # this repository as a NodePort, because the chart chose the type and the
    # values said nothing. Grepping the manifests for NodePort finds nothing;
    # only asking the cluster does.
    service:
      type: ClusterIP

    image:
      repository: ghcr.io/project-zot/zot-linux-amd64
      tag: ""

    # S3 storage initialization can be slow; give Zot 5 minutes before giving up
    startupProbe:
      failureThreshold: 30
      periodSeconds: 10
      initialDelaySeconds: 10

    persistence:
      # zot stores image data in SeaweedFS S3; local persistence is only a cache
      enabled: false

    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
