apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: gateway-system
  annotations:
    # How this route authenticates -- checked against Keycloak, the
    # SecurityPolicies and OPA by scripts/check-platform-contracts.py.
    gitops.homelab/auth: redirect
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: gateway-system
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
