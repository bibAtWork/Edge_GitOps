# Replace yourdomain.com with your actual domain.
# Uses letsencrypt-prod ClusterIssuer with Cloudflare DNS-01.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard-tls
  namespace: gateway-system
spec:
  secretName: homelab-wildcard-tls
  commonName: "*.REPLACE_WITH_DOMAIN"
  dnsNames:
    - REPLACE_WITH_DOMAIN
    - "*.REPLACE_WITH_DOMAIN"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
