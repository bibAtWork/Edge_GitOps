# Replace yourdomain.com with your actual domain.
# Uses letsencrypt-prod ClusterIssuer with Cloudflare DNS-01.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-wildcard-tls
  namespace: gateway-system
spec:
  secretName: homelab-wildcard-tls
  commonName: "*.data-harness.org"
  dnsNames:
    - data-harness.org
    - "*.data-harness.org"
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
