# Referenced by the velero Deployment via
# --repo-maintenance-job-configmap=velero-repo-maintenance (chart-generated
# arg; this ConfigMap itself is not templated by the chart and was previously
# only applied live, never committed — undoing that here).
#
# The "global" key's podResources block is the actual fix. It was absent
# entirely, so every Kopia repository-maintenance Job silently ran under
# Velero's built-in default of a 128Mi memory limit. Confirmed live
# 2026-08-17: with 20 BackupRepository objects (2 backends x 10 app
# namespaces) all running Kopia maintenance under that limit, jobs were
# OOMKilled continuously — 60+ failures over 7+ hours, a fresh attempt
# roughly every 5 minutes per repository, no end in sight since nothing about
# the limit was changing between attempts. The resulting churn (dozens of
# pods created and OOM-killed in a tight loop) is the leading explanation for
# a node NotReady blip and a keycloak crash-loop (SandboxChanged event) in
# the same window — not confirmed as the sole cause, but the timing and the
# sheer volume of failing pods point at it.
#
# 1Gi/256Mi chosen as a generous-but-cheap bump: the node has 32Gi total and
# was sitting at 27% of memory *requests* allocated (92% was *limits*, which
# is expected to be overcommitted and isn't what OOM-kills a container) —
# there was no real capacity pressure, just a limit that was too tight for
# Kopia's actual maintenance workload at this data volume. Revisit downward
# only with evidence from actual usage, not by guessing.
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-repo-maintenance
  namespace: velero
data:
  global: |
    {
      "podResources": {
        "cpuRequest": "100m",
        "cpuLimit": "500m",
        "memoryRequest": "256Mi",
        "memoryLimit": "1Gi"
      },
      "keepLatestMaintenanceJobs": 3
    }
