apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: velero
      version: 12.1.0
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    configuration:
      # Velero's built-in default is 1h, which on this cluster meant 20
      # BackupRepository objects (2 backends x 10 app namespaces) each spawning
      # a Kopia maintenance Job every hour -- ~480 Job pods/day, each pulling an
      # image and doing S3 I/O, on a homelab whose backups run *daily*. Kopia
      # maintenance compacts repository metadata; running it 24x more often than
      # anything is written to the repository is pure churn. Measured 2026-08-17:
      # this was the single largest source of pod churn on the cluster and the
      # main contributor to the 65 stale Completed pods sitting in this namespace.
      #
      # Note this only sets the default applied to *newly created*
      # BackupRepository objects -- the 20 that already exist carry their own
      # spec.maintenanceFrequency and are patched separately (they're created by
      # Velero at runtime, not GitOps-managed, so they can't be fixed from here).
      defaultRepoMaintainFrequency: 24h

      # This block replaces the standalone repo-maintenance-config.yaml that used
      # to live in this directory. That file's own comment asserted the
      # velero-repo-maintenance ConfigMap "is not templated by the chart" -- that
      # is false for chart 12.1.0, which renders it from
      # configuration.repositoryMaintenanceJob.repositoryConfigData. Confirmed the
      # hard way 2026-08-17: reconciling this HelmRelease re-rendered the ConfigMap
      # from chart defaults and silently wiped the podResources block, dropping
      # Kopia maintenance Jobs back to Velero's built-in 128Mi limit and
      # reproducing the exact OOMKill the earlier fix (#138) existed to stop --
      # caught live within a minute, on a Job that OOMKilled with limits
      # {memory: 128Mi} while sibling Jobs created before the reconcile still had
      # 1Gi. Keeping these values here, chart-owned, means a reconcile reasserts
      # them instead of erasing them.
      #
      # podResources rationale (carried over from #138): 1Gi/256Mi is a
      # generous-but-cheap bump. Velero's 128Mi default OOM-killed every Kopia
      # maintenance Job continuously -- 60+ failures over 7+ hours -- with no
      # capacity pressure on a 32Gi node to justify the tight limit. Revisit
      # downward only with evidence from actual usage, not by guessing.
      #
      # keepLatestMaintenanceJobs is per-repository, so the chart default of 3
      # pinned 60 completed Job pods across 20 repositories permanently (measured:
      # 65 of the cluster's 114 stale Completed pods were these). One kept Job per
      # repository is still enough to read the last run's logs after a failure.
      repositoryMaintenanceJob:
        repositoryConfigData:
          name: velero-repo-maintenance
          global:
            keepLatestMaintenanceJobs: 1
            podResources:
              cpuRequest: 100m
              cpuLimit: 500m
              memoryRequest: 256Mi
              memoryLimit: 1Gi

      # The chart creates an invalid "default" VSL when this list is empty.
      # Retain seaweedfs-csi as a placeholder to satisfy the template; it is
      # never used because all schedules set snapshotVolumes: false.
      volumeSnapshotLocation:
        - name: seaweedfs-csi
          provider: csi
      backupStorageLocation:
        - name: seaweedfs-local
          provider: aws
          bucket: velero-backups
          default: true
          credential:
            name: velero-seaweedfs-credentials
            key: cloud
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: http://seaweedfs-s3.seaweedfs.svc:8333
        - name: aws-s3
          provider: aws
          bucket: homelab-velero-backups-offsite
          credential:
            name: velero-aws-credentials
            key: cloud
          config:
            region: eu-central-1

    credentials:
      useSecret: false

    # Kopia writes its repository config/cache to $HOME. UID 65534 has HOME=/nonexistent
    # (which doesn't exist), so Kopia fails. /scratch is an existing emptyDir in the pod.
    extraEnvVars:
      - name: HOME
        value: /scratch

    # node-agent DaemonSet reads PV data from /var/lib/kubelet/pods for Kopia
    # file system backup. Runs as root with privileged: true (velero namespace
    # PSS is set to privileged). deployNodeAgent is the top-level enable switch;
    # the nodeAgent block holds pod configuration.
    deployNodeAgent: true
    nodeAgent:
      podVolumePath: /var/lib/kubelet/pods
      privileged: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.2
        volumeMounts:
          - mountPath: /target
            name: plugins
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
    # velero-plugin-for-csi removed: velero v1.14+ has built-in CSI support;
    # loading the external plugin causes a duplicate-registration crash.

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Flux manages CRDs via install.crds: CreateReplace above.
    # The chart's pre-install hook job runs as root and violates restricted PSS — skip it.
    upgradeCRDs: false

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false

  # velero and node-agent both use kopia, which tries to create $HOME/.config/kopia.
  # uid 65534 (nobody) has HOME=/nonexistent in the distroless image — unwritable.
  # Patch both the Deployment and DaemonSet since chart v12.1.0 ignores extraEnvVars
  # for these components (extraEnvVars expects a map but helm silently drops lists).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: velero
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: velero
              spec:
                template:
                  spec:
                    containers:
                      - name: velero
                        env:
                          - name: HOME
                            value: /scratch
          - target:
              kind: DaemonSet
              name: node-agent
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: node-agent
              spec:
                template:
                  spec:
                    containers:
                      - name: node-agent
                        env:
                          - name: HOME
                            value: /scratch
