apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  dependsOn:
    - name: seaweedfs
      namespace: seaweedfs
  chart:
    spec:
      chart: velero
      version: 8.7.2
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    configuration:
      backupStorageLocation:
        - name: seaweedfs-local
          provider: aws
          bucket: velero-backups
          default: true
          credential:
            name: velero-seaweedfs-credentials
            key: cloud
          config:
            region: us-east-1
            s3ForcePathStyle: "true"
            s3Url: http://seaweedfs-s3.seaweedfs.svc:8333
        - name: aws-s3
          provider: aws
          bucket: homelab-velero-backups-offsite
          credential:
            name: velero-aws-credentials
            key: cloud
          config:
            region: eu-central-1

    credentials:
      useSecret: false

    # node-agent runs as root with privileged: true so it can traverse
    # /var/lib/kubelet/pods and read PV data for Kopia file system backup.
    # The velero namespace PSS is set to privileged to allow this.
    nodeAgent:
      enabled: true
      podVolumePath: /var/lib/kubelet/pods
      privileged: true
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi

    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.10.0
        volumeMounts:
          - mountPath: /target
            name: plugins
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
    # velero-plugin-for-csi removed: velero v1.14+ has built-in CSI support;
    # loading the external plugin causes a duplicate-registration crash.

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi

    # Flux manages CRDs via install.crds: CreateReplace above.
    # The chart's pre-install hook job runs as root and violates restricted PSS — skip it.
    upgradeCRDs: false

    metrics:
      enabled: true
      serviceMonitor:
        enabled: false
