# Encrypt with SOPS before committing
# Get values from: terraform output -json velero_access_key_id velero_secret_access_key
apiVersion: v1
kind: Secret
metadata:
  name: velero-aws-credentials
  namespace: velero
stringData:
  cloud: |
    [default]
    aws_access_key_id=REPLACE_WITH_ACCESS_KEY
    aws_secret_access_key=REPLACE_WITH_SECRET_KEY
