apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 30m
  chart:
    spec:
      chart: falco
      version: 9.1.0
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    driver:
      kind: modern_ebpf

    collectors:
      enabled: true
      kubernetes:
        enabled: true

    falco:
      json_output: true
      log_level: info
      webserver:
        enabled: true
        listen_port: 8765

    metrics:
      enabled: true
      interval: 15m
      outputRule: true
      resourceUtilizationEnabled: true

    # Cilium's CNI binary is legitimately invoked with a writable-upper-layer
    # execve pattern during pod network setup, which the stock "Drop and
    # execute new binary in container" rule can't distinguish from a real
    # malware drop. Without this exception it fires on effectively every
    # pod scheduling event (~1993/2000 recent Falco log lines), drowning out
    # the FalcoCriticalEvent alert with noise instead of real findings.
    customRules:
      cilium-cni-exception.yaml: |-
        - rule: Drop and execute new binary in container
          override:
            condition: append
          condition: and not (proc.exe = "/opt/cni/bin/cilium-cni")

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    # The two sidecar charts ship with no memory limit at all, which made them
    # 2 of the 24 unbounded containers on this node. Both numbers below are
    # measured, not guessed: the limit is roughly 2.5-5x each container's
    # observed 7-day peak working set.
    #
    # Measuring first is the whole point. This cluster has already had a
    # limit-less container silently capped at 256Mi by a namespace LimitRange
    # and OOM-killed for it, so a blanket default is the failure mode being
    # avoided here rather than the fix. Explicit beats implicit: a limit
    # written next to the workload is visible in review, whereas a LimitRange
    # default applies invisibly to anything that forgets to set one.
    falcoctl:
      artifact:
        follow:
          # 7-day peak 45Mi.
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi

    k8s-metacollector:
      # 7-day peak 143Mi.
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 384Mi
