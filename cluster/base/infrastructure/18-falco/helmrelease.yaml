apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
  namespace: falco
spec:
  interval: 30m
  chart:
    spec:
      chart: falco
      version: 9.1.0
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    driver:
      kind: modern_ebpf

    collectors:
      enabled: true
      kubernetes:
        enabled: true

    falco:
      json_output: true
      log_level: info
      webserver:
        enabled: true
        listen_port: 8765

    metrics:
      enabled: true
      interval: 15m
      outputRule: true
      resourceUtilizationEnabled: true

    # Cilium's CNI binary is legitimately invoked with a writable-upper-layer
    # execve pattern during pod network setup, which the stock "Drop and
    # execute new binary in container" rule can't distinguish from a real
    # malware drop. Without this exception it fires on effectively every
    # pod scheduling event (~1993/2000 recent Falco log lines), drowning out
    # the FalcoCriticalEvent alert with noise instead of real findings.
    customRules:
      cilium-cni-exception.yaml: |-
        - rule: Drop and execute new binary in container
          override:
            condition: append
          condition: and not (proc.exe = "/opt/cni/bin/cilium-cni")

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
