# Cilium is bootstrapped in the Talos machineconfig inline manifest.
# This HelmRelease manages the full configuration after initial cluster bootstrap.
# Flux reconciles this after Cilium is already running, so there is no chicken-and-egg.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: cilium
      version: 1.19.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # kube-proxy replacement — requires Talos to boot with no kube-proxy
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    ipam:
      mode: kubernetes

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Gateway API support
    gatewayAPI:
      enabled: true
      enableAlpn: true

    # Hubble — network observability
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction

    # Enable L7 proxy for service mesh capabilities
    l7Proxy: true

    # Native routing: disables VXLAN tunnel and attaches cil_from_netdev TC hook to
    # the physical NIC (enp2s0). This is required for the Cilium Gateway API L7LB to
    # correctly identify external connections. In tunnel mode, cil_from_netdev never
    # runs on the physical NIC, so external packets have no Cilium metadata when they
    # arrive at the iptables TPROXY rule — the per-session identity map is not
    # populated, and bpf_metadata reads identity 0. With native routing, cil_from_netdev
    # fires on enp2s0, looks up the source IP in ipcache (world=2), writes the identity
    # to the per-session map, sets the proxy mark, and TPROXY fires correctly.
    routingMode: native
    ipv4NativeRoutingCIDR: 10.244.0.0/24

    # Host firewall: enforces Cilium network policies on host-level traffic.
    hostFirewall:
      enabled: true

    # Encryption — WireGuard encrypts inter-node traffic at the kernel level.
    # SPIRE mTLS disabled: single-node cluster has no inter-node traffic to encrypt,
    # and SPIRE StatefulSet startup races with Cilium agent, causing install timeouts.
    encryption:
      enabled: true
      type: wireguard

    # BPF masquerade required by egressGateway (otherwise cilium-agent refuses to start).
    bpf:
      masquerade: true

    # L2 announcements — ARP-based IP announcement for LB services on the LAN.
    # Required for CiliumL2AnnouncementPolicy to work.
    l2announcements:
      enabled: true

    # Egress Gateway routes internet-bound traffic through a dedicated node.
    # Pair with a CiliumClusterwideNetworkPolicy to enforce HTTPS-only egress.
    egressGateway:
      enabled: true

    prometheus:
      enabled: true
      port: 9962
      serviceMonitor:
        enabled: false

    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
