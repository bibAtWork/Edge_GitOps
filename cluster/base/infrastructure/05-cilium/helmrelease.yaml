# Cilium is bootstrapped in the Talos machineconfig inline manifest.
# This HelmRelease manages the full configuration after initial cluster bootstrap.
# Flux reconciles this after Cilium is already running, so there is no chicken-and-egg.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: cilium
      version: ">=1.16.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # kube-proxy replacement — requires Talos to boot with no kube-proxy
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    ipam:
      mode: kubernetes

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Gateway API support
    gatewayAPI:
      enabled: true

    # Hubble — network observability
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction

    # Enable L7 proxy for service mesh capabilities
    l7Proxy: true

    # Encryption — wireguard in-cluster
    encryption:
      enabled: true
      type: wireguard

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
