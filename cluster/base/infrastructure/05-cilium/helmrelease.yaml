# Cilium is bootstrapped in the Talos machineconfig inline manifest.
# This HelmRelease manages the full configuration after initial cluster bootstrap.
# Flux reconciles this after Cilium is already running, so there is no chicken-and-egg.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: cilium
      version: 1.19.6
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # kube-proxy replacement — requires Talos to boot with no kube-proxy
    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    ipam:
      mode: kubernetes

    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE

    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Gateway API support
    gatewayAPI:
      enabled: true

    # Hubble — network observability
    hubble:
      enabled: true
      relay:
        enabled: true
      ui:
        enabled: true
      metrics:
        enabled:
          - dns
          - drop
          - tcp
          - flow
          - port-distribution
          - icmp
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction

    # Enable L7 proxy for service mesh capabilities
    l7Proxy: true

    # Host Firewall — required for the Cilium Gateway API L7LB to correctly identify
    # the source security identity of external (non-pod) connections. Without this,
    # the BPF NIC ingress hook does not set socket marks for external traffic, so
    # cilium.bpf_metadata gets identity 0 (unknown) and cilium.l7policy denies it.
    hostFirewall:
      enabled: true

    # Encryption — WireGuard encrypts inter-node traffic at the kernel level.
    # SPIRE mTLS disabled: single-node cluster has no inter-node traffic to encrypt,
    # and SPIRE StatefulSet startup races with Cilium agent, causing install timeouts.
    encryption:
      enabled: true
      type: wireguard

    # BPF masquerade required by egressGateway (otherwise cilium-agent refuses to start).
    bpf:
      masquerade: true

    # L2 announcements — ARP-based IP announcement for LB services on the LAN.
    # Required for CiliumL2AnnouncementPolicy to work.
    l2announcements:
      enabled: true

    # Egress Gateway routes internet-bound traffic through a dedicated node.
    # Pair with a CiliumClusterwideNetworkPolicy to enforce HTTPS-only egress.
    egressGateway:
      enabled: true

    prometheus:
      enabled: true
      port: 9962
      serviceMonitor:
        enabled: false

    operator:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: false

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
