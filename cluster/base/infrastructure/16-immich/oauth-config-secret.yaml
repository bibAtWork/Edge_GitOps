# Immich runtime configuration, mounted as IMMICH_CONFIG_FILE.
#
# Holds the Keycloak OIDC client settings and the backup block.
#
# backup.database.keepLastAmount MUST be >= 1 even though
# backup.database.enabled is false. Immich validates the whole SystemConfigDto
# on startup with isPositive on that field, regardless of whether the feature
# is switched on, so a 0 there stops the server booting outright:
#
#   Error: Invalid value(s) in file: An instance of SystemConfigDto has failed
#   the validation: property backup.database.keepLastAmount has failed the
#   following constraints: isPositive
#
# It crash-looped on exactly that for days. Immich's own database dump stays
# disabled -- postgres-backup-cronjob.yaml owns that, and having both would
# write two copies of the same data to two places. The 1 here is a value the
# validator accepts for a feature that never runs, not a retention policy.
