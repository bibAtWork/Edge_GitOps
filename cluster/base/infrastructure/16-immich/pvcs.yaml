# Immich's pre-created volumes. All three are referenced by helmrelease.yaml via
# existingClaim, so they must exist before the chart renders -- the chart does not
# provision them.
#
# On Longhorn since 2026-08-24. They previously sat on SeaweedFS CSI, whose mount
# service is documented upstream as not resilient to its own restarts: one OOM of
# that daemon returned EIO to every SeaweedFS volume on the node simultaneously,
# which surfaced as application faults rather than as a storage problem. Longhorn
# gives each volume a real block device with ext4 and no shared userspace daemon
# in the I/O path.
#
# Sizes are deliberate. Longhorn reserves 30% of the disk, so a 340GiB disk yields
# only ~238GiB of provisioning budget, and an oversized claim reserves capacity it
# never uses -- the previous 100Gi library claim held 405MB and, together with a
# 50Gi paperless claim, consumed enough budget that new volumes could not schedule
# at all. Expansion is enabled and shrinking is not, so these are sized to
# observed usage plus real headroom and grown when needed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-lh
  namespace: immich
  labels:
    velero.io/backup: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # 405MB of photos today. This is the volume that grows without bound, so it
      # gets the most headroom of the three -- but 30Gi, not 100Gi.
      storage: 30Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-valkey-lh
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache-lh
  namespace: immich
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Downloaded ML models. Empty today because it was migrated without copying
      # -- Immich re-fetches on demand -- but sized for a populated model cache.
      storage: 10Gi
