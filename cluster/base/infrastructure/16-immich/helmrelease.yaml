apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  dependsOn:
    - name: immich-postgresql
      namespace: immich
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Top-level controllers block is shared by all immich components (bjw-s v5 pattern).
    # DB_* env vars must go here — this is where the chart comment says to add them.
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgresql
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: db-password

    immich:
      persistence:
        library:
          # Pre-created PVC required by chart checks.yaml; chart does not provision it.
          existingClaim: immich-library

    # The chart auto-sets REDIS_HOSTNAME=immich-valkey; enable the bundled Valkey.
    valkey:
      enabled: true
      defaultPodOptions:
        annotations:
          backup.velero.io/excluded-volumes: data
      persistence:
        data:
          type: persistentVolumeClaim
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 1Gi

    # Efficiency review 2026-08-17: these resources blocks were previously set at
    # the component top level (server.resources / machine-learning.resources) —
    # silently ignored by the chart, exactly like the trivy-operator key-name bug
    # (#143). Confirmed live: both Deployments rendered `resources: {}`, which made
    # every immich pod BestEffort QoS — first in line for eviction under node
    # memory pressure, despite immich-server being the largest non-system memory
    # consumer on the cluster (1451Mi peak over 24h). This is a bjw-s
    # app-template chart, so resources belong under
    # <component>.controllers.main.containers.main, mirroring the shared
    # top-level controllers block above. Path confirmed against the chart's own
    # values.yaml at the pinned version, not guessed.
    #
    # Requests sized from measured 24h peaks (server 1451Mi, ML 736Mi) rounded
    # down to a steady-state floor rather than the peak — a request is a
    # reservation, not a cap, and over-reserving on a single node just starves
    # everything else. Limits kept at their previously-intended values.
    server:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi

    machine-learning:
      enabled: true
      defaultPodOptions:
        annotations:
          backup.velero.io/excluded-volumes: cache
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 10Gi
