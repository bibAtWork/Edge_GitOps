apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  dependsOn:
    - name: immich-postgresql
      namespace: immich
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    immich:
      configuration:
        database:
          host: immich-postgresql
          port: 5432
          name: immich
          username: immich
        redis:
          host: immich-redis-master
          port: 6379
      persistence:
        library:
          # Pre-created PVC required by chart checks.yaml; chart does not provision it.
          existingClaim: immich-library

    server:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      extraEnvVars:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db-secret
              key: db-password

    machine-learning:
      enabled: true
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      persistence:
        cache:
          enabled: true
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 10Gi

    redis:
      enabled: true
      architecture: standalone
      auth:
        enabled: false
      master:
        persistence:
          storageClass: local-path
          size: 1Gi
