apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  dependsOn:
    - name: immich-postgresql
      namespace: immich
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Top-level controllers block is shared by all immich components (bjw-s v5 pattern).
    # DB_* env vars must go here — this is where the chart comment says to add them.
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgresql
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: db-password

    immich:
      persistence:
        library:
          # Pre-created PVC required by chart checks.yaml; chart does not
          # provision it -- so unlike the Grafana case, pointing this at a
          # different claim does NOT cause Helm to prune the old one. The
          # original immich-library PVC survives as the soak copy.
          #
          # Migrated to SeaweedFS 2026-08-18 while the library was still only
          # 370MB / 154 files. This is the volume that most needs to be shared
          # for immich to move between nodes, and it is the one that grows
          # without bound -- doing it now costs minutes, doing it at 100GB
          # would be an outage. Verified by content: identical file list,
          # identical per-file md5s, 388,089,828 bytes on both sides.
          existingClaim: immich-library-swfs

    # The chart auto-sets REDIS_HOSTNAME=immich-valkey; enable the bundled Valkey.
    valkey:
      enabled: true
      defaultPodOptions:
        annotations:
          backup.velero.io/excluded-volumes: data
      persistence:
        data:
          # Migrated to SeaweedFS CSI (2026-08-18). Pure cache (valkey), so a
          # loss costs a warm-up, not data.
          #
          # An earlier version of this comment claimed existingClaim "keeps the
          # old local-path PVC intact for rollback". That is FALSE and worth
          # stating plainly: pointing the chart at an existingClaim removes the
          # chart-templated PVC from the rendered manifest, so Helm PRUNES it on
          # the next upgrade, and local-path's Delete reclaim policy wipes the
          # directory. The old "immich-valkey" PVC was destroyed this way
          # (local-path-provisioner logged the delete). The same mistake cost
          # Grafana its volume the same day -- see 04-grafana/helmrelease.yaml.
          # There is no rollback here; the copy-out is the only safety net.
          #
          # `type` is required. Without it this chart defaults the volume to
          # emptyDir and silently ignores existingClaim -- the pod comes up
          # healthy on scratch space and nothing reports a problem. Dropping
          # `type` when this block was first rewritten is exactly what happened,
          # and it went unnoticed because a write test against the mount path
          # succeeds just as well on emptyDir.
          type: persistentVolumeClaim
          existingClaim: immich-valkey-swfs

    # Efficiency review 2026-08-17: these resources blocks were previously set at
    # the component top level (server.resources / machine-learning.resources) —
    # silently ignored by the chart, exactly like the trivy-operator key-name bug
    # (#143). Confirmed live: both Deployments rendered `resources: {}`, which made
    # every immich pod BestEffort QoS — first in line for eviction under node
    # memory pressure, despite immich-server being the largest non-system memory
    # consumer on the cluster (1451Mi peak over 24h). This is a bjw-s
    # app-template chart, so resources belong under
    # <component>.controllers.main.containers.main, mirroring the shared
    # top-level controllers block above. Path confirmed against the chart's own
    # values.yaml at the pinned version, not guessed.
    #
    # Requests sized from measured 24h peaks (server 1451Mi, ML 736Mi) rounded
    # down to a steady-state floor rather than the peak — a request is a
    # reservation, not a cap, and over-reserving on a single node just starves
    # everything else. Limits kept at their previously-intended values.
    server:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md):
              # Keycloak OIDC login via a declarative partial config file
              # (oauth-config-secret.yaml), not the runtime admin API --
              # confirmed against Immich's own source that this is
              # deep-merged on top of hardcoded defaults, not the DB, and
              # that setting this env var makes the file authoritative.
              env:
                IMMICH_CONFIG_FILE: /run/secrets/immich-oauth/config.json
      persistence:
        oauth-config:
          type: secret
          name: immich-oauth-config
          globalMounts:
            - path: /run/secrets/immich-oauth/config.json
              subPath: config.json
              readOnly: true

    machine-learning:
      enabled: true
      defaultPodOptions:
        annotations:
          backup.velero.io/excluded-volumes: cache
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
      persistence:
        cache:
          enabled: true
          # Migrated to SeaweedFS CSI (2026-08-18) as an EMPTY volume rather
          # than copying the old contents. This holds downloaded ML models --
          # pure cache that Immich re-fetches on demand, so copying ~10GB
          # buys nothing. It also sidesteps a real problem: HuggingFace's
          # .cache/huggingface/download/*.lock and *.metadata files did not
          # survive cp -a, which the content verification correctly caught.
          # Expect a one-off model re-download on first use after this.
          #
          # `type` is required here for the same reason as the valkey volume
          # above -- without it the chart falls back to emptyDir and ignores
          # existingClaim.
          type: persistentVolumeClaim
          existingClaim: immich-machine-learning-swfs
