apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  chart:
    spec:
      chart: immich
      # Pinned. Every other HelmRelease in this repo names a version; these two
      # did not, which meant Flux resolved `*` and would take whatever the
      # index offered -- including a major app version -- with no PR, no
      # review and no major-update checklist.
      #
      # Corrected 2026-09-19: this comment previously claimed chart 0.13.1
      # (appVersion v3.0.0) had been published since 2026-07-03. Checked
      # against the real index (immich-app.github.io/immich-charts/index.yaml,
      # parsed directly, not summarised) -- that chart version does not exist.
      # 0.12.0 (appVersion v2.6.3) is and has always been the newest chart the
      # immich-charts repo has ever published; that repo's own git tags do
      # include a later 0.12.1 (appVersion v3.0.0), but it was tagged and
      # never packaged to the index, so Flux/Renovate can never see it through
      # this HelmRepository. See docs/backlog.md for the full trail.
      #
      # Pinned to what is actually running, so this commit changes nothing at
      # runtime. Renovate reads this field, so the upgrade becomes a reviewable
      # PR -- which is what a major version with a database migration needs.
      version: 0.12.0
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Top-level controllers block is shared by all immich components (bjw-s v5 pattern).
    # DB_* env vars must go here — this is where the chart comment says to add them.
    controllers:
      main:
        containers:
          main:
            # Chart 0.12.0's own default here is v2.6.3 (its Chart.yaml appVersion),
            # which this overrides. v2.6.3 was never the last v2.x release: upstream
            # kept shipping bugfix-only 2.x releases after it -- v2.7.0 through
            # v2.7.5 (2026-04-07 to 2026-04-13) -- before jumping to v3.0.0. The chart
            # simply never got a release in between to carry that forward; nothing
            # about the chart's own version needs to move for this, since this field
            # is a plain image tag, read by both server and machine-learning below
            # (bjw-s's shared top-level image default -- same mechanism as the DB_*
            # env vars above).
            #
            # v2.7.5 checked against every 2.7.x release's notes: bugfixes and
            # translations only (rate-limited version check, a library-import batch
            # size fix, mobile image-loading fixes, an ML-container CPU-compat fix
            # that only helps, not hurts). No schema change, no config change that
            # touches anything this HelmRelease sets (OAuth config file, CNPG DB
            # connection, resource sizing). Does not touch the version: pin above,
            # or the v2 -> v3 decision in docs/backlog.md -- that is still a
            # separate, deliberate call.
            image:
              tag: v2.7.5
            env:
              # The CloudNativePG cluster (postgres-cluster.yaml), since the
              # migration of 2026-09-13.
              DB_HOSTNAME: immich-pg-rw
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: db-password

    immich:
      persistence:
        library:
          # Pre-created PVC required by chart checks.yaml; the chart does not
          # provision it, so pointing at another claim does NOT prune the old
          # one -- the SeaweedFS PVC survives as the soak copy.
          #
          # On Longhorn since 2026-08-24. It previously sat on SeaweedFS CSI,
          # whose mount service is documented upstream as not resilient to its
          # own restarts -- one OOM of that daemon returned EIO to every
          # SeaweedFS volume on the node at once. Copy verified by content:
          # 155 files, identical md5s, 405,203,043 bytes, fuse.seaweedfs -> ext4.
          existingClaim: immich-library-lh

    # The chart auto-sets REDIS_HOSTNAME=immich-valkey; enable the bundled Valkey.
    valkey:
      enabled: true
      persistence:
        data:
          # Pure cache, so a loss costs a warm-up rather than data -- which is
          # why it moved with no copy at all.
          #
          # `type` is required. Without it the chart silently falls back to
          # emptyDir and ignores existingClaim: the pod comes up healthy on
          # scratch space and nothing reports a problem. That happened once,
          # and went unnoticed because writing a file to the mount path
          # succeeds just as well on emptyDir. Check filesystem type, not
          # writability.
          type: persistentVolumeClaim
          existingClaim: immich-valkey-lh

    # Efficiency review 2026-08-17: these resources blocks were previously set at
    # the component top level (server.resources / machine-learning.resources) —
    # silently ignored by the chart, exactly like the trivy-operator key-name bug
    # (#143). Confirmed live: both Deployments rendered `resources: {}`, which made
    # every immich pod BestEffort QoS — first in line for eviction under node
    # memory pressure, despite immich-server being the largest non-system memory
    # consumer on the cluster (1451Mi peak over 24h). This is a bjw-s
    # app-template chart, so resources belong under
    # <component>.controllers.main.containers.main, mirroring the shared
    # top-level controllers block above. Path confirmed against the chart's own
    # values.yaml at the pinned version, not guessed.
    #
    # Requests sized from measured 24h peaks (server 1451Mi, ML 736Mi) rounded
    # down to a steady-state floor rather than the peak — a request is a
    # reservation, not a cap, and over-reserving on a single node just starves
    # everything else. Limits kept at their previously-intended values.
    server:
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
              # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md):
              # Keycloak OIDC login via a declarative partial config file
              # (oauth-config-secret.yaml), not the runtime admin API --
              # confirmed against Immich's own source that this is
              # deep-merged on top of hardcoded defaults, not the DB, and
              # that setting this env var makes the file authoritative.
              env:
                IMMICH_CONFIG_FILE: /run/secrets/immich-oauth/config.json
      persistence:
        oauth-config:
          type: secret
          name: immich-oauth-config
          globalMounts:
            - path: /run/secrets/immich-oauth/config.json
              subPath: config.json
              readOnly: true

    machine-learning:
      enabled: true
      controllers:
        main:
          containers:
            main:
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
      persistence:
        cache:
          enabled: true
          # Downloaded ML models -- pure cache Immich re-fetches on demand, so
          # this moves as an EMPTY volume rather than being copied. That also
          # sidesteps a real problem found earlier: HuggingFace's
          # .cache/huggingface/download/*.lock and *.metadata files did not
          # survive cp -a, which content verification correctly caught. Expect
          # one model re-download on first use.
          #
          # `type` is required here for the same reason as the valkey volume.
          type: persistentVolumeClaim
          existingClaim: immich-ml-cache-lh
