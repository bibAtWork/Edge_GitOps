apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: immich
  namespace: immich
spec:
  interval: 30m
  dependsOn:
    - name: immich-postgresql
      namespace: immich
  chart:
    spec:
      chart: immich
      sourceRef:
        kind: HelmRepository
        name: immich
        namespace: flux-system
      interval: 12h
  install:
    timeout: 15m
    remediation:
      retries: 3
  upgrade:
    timeout: 15m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    # Top-level controllers block is shared by all immich components (bjw-s v5 pattern).
    # DB_* env vars must go here — this is where the chart comment says to add them.
    controllers:
      main:
        containers:
          main:
            env:
              DB_HOSTNAME: immich-postgresql
              DB_PORT: "5432"
              DB_DATABASE_NAME: immich
              DB_USERNAME: immich
              DB_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: immich-db-secret
                    key: db-password

    immich:
      persistence:
        library:
          # Pre-created PVC required by chart checks.yaml; chart does not provision it.
          existingClaim: immich-library

    # The chart auto-sets REDIS_HOSTNAME=immich-valkey; enable the bundled Valkey.
    valkey:
      enabled: true
      defaultPodOptions:
        annotations:
          backup.velero.io/excluded-volumes: data
      persistence:
        data:
          type: persistentVolumeClaim
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 1Gi

    server:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi

    machine-learning:
      enabled: true
      defaultPodOptions:
        annotations:
          backup.velero.io/excluded-volumes: cache
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      persistence:
        cache:
          enabled: true
          type: persistentVolumeClaim
          storageClass: local-path
          accessMode: ReadWriteOnce
          size: 10Gi
