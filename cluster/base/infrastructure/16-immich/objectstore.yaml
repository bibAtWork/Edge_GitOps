# Where immich-pg's WAL and base backups go (ADR-012): the local object store's
# `recovery` bucket, under postgres/immich-pg/. The plugin's sidecar runs inside
# the database pod and reads this object and its credential from this
# namespace.
#
# retentionPolicy is a RECOVERY WINDOW, not a count: every base backup and all
# WAL of the last 7 days are kept, so any moment of the last week can be
# restored. The longer history is each recovery point's base backup, staged
# into restic. Base backups are stored uncompressed so restic can deduplicate
# them day to day; WAL segments stay gzip-compressed.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: recovery
  namespace: immich
spec:
  retentionPolicy: "7d"
  configuration:
    destinationPath: s3://recovery/postgres/
    endpointURL: http://seaweedfs-s3.seaweedfs.svc:8333 # nosonar
    s3Credentials:
      accessKeyId:
        name: recovery-object-store
        key: admin_access_key_id
      secretAccessKey:
        name: recovery-object-store
        key: admin_secret_access_key
    wal:
      compression: gzip
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
