# Immich's PostgreSQL, run by CloudNativePG (ADR-012).
#
# Replaces the bitnami StatefulSet (postgresql-helmrelease.yaml), which stays
# alongside, untouched, as the rollback until this one has proven itself. This
# cluster starts empty; the data moves in a short migration window, and the app
# switches in a separate change.
#
# The image is the one reason this could not move to CNPG earlier: Immich's
# semantic search needs VectorChord and pgvector, and a stock CNPG image
# imports the data cleanly and then silently breaks search. tensorchord
# publishes CNPG images carrying both; 17-0.3.0 is exactly the VectorChord of
# the database being replaced (PostgreSQL 17, vchord 0.3.0; pgvector 0.8.0
# against 0.8.1 there -- a minor version, same on-disk format). Checked
# 2026-09-13 by listing the image's extension control files.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-pg
  namespace: immich
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:17-0.3.0

  # Single instance and no PDB, for the reasons recorded on keycloak-pg
  # (26-keycloak/postgres-cluster.yaml): one node, so a replica has nowhere to
  # run, and a single-instance PDB only blocks drains. The same bounded
  # stopDelay, so a restart can never hold the database for thirty minutes.
  instances: 1
  enablePDB: false
  stopDelay: 300

  postgresql:
    # VectorChord's index access method must be loaded at server start.
    shared_preload_libraries:
      - vchord.so
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
      effective_cache_size: "512MB"

  # The same database, owner and password the app uses today, so the switch is
  # a hostname change. The extensions are created here, as the superuser, so
  # the restored dump finds them in place.
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-pg-owner
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE
        - CREATE EXTENSION IF NOT EXISTS cube
        - CREATE EXTENSION IF NOT EXISTS earthdistance
        - CREATE EXTENSION IF NOT EXISTS pg_trgm
        - CREATE EXTENSION IF NOT EXISTS unaccent
        - CREATE EXTENSION IF NOT EXISTS "uuid-ossp"

  # Parity with the database being replaced, where immich is a superuser:
  # Immich manages its extensions itself (it updates VectorChord on upgrade),
  # which needs it. Dropping to a plain owner is a separate, later change.
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: true
        passwordSecret:
          name: immich-pg-owner

  # Continuous WAL archiving and base backups (ADR-012) -- see objectstore.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: recovery

  # longhorn-db, as for the StatefulSet: Retain, so a stray PVC delete cannot
  # destroy PGDATA, and strict-local, so a commit takes no network hop.
  storage:
    size: 10Gi
    storageClass: longhorn-db
  walStorage:
    size: 2Gi
    storageClass: longhorn-db

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
