# S3 credentials for this namespace's database backup CronJob.
#
# Same single SeaweedFS admin credential the rest of the cluster uses (see
# CLAUDE.md: one admin credential plus network policy, deliberately not
# per-bucket IAM users), scoped into this namespace the same way
# velero/seaweedfs-secret.yaml and talos-backup already do it. A Secret cannot
# be referenced across namespaces, so the CronJob needs a local copy.
#
# Encrypt with SOPS before committing:
#   sops --encrypt --in-place backup-s3-secret.yaml
