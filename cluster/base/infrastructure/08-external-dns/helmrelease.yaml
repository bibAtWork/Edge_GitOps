apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  chart:
    spec:
      chart: external-dns
      version: ">=1.14.0 <2.0.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    provider:
      name: cloudflare

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-token
            key: api-token

    # Only manage records for services/ingresses with the annotation:
    #   external-dns.alpha.kubernetes.io/hostname: "myapp.yourdomain.com"
    policy: sync
    sources:
      - service
      - gateway-httproute

    # Tailnet IPs (100.x.x.x) are CGNAT — only reachable from inside the tailnet.
    # DNS entries created here resolve publicly but only connect for tailnet members.
    txtOwnerId: homelab-external-dns

    podSecurityContext:
      fsGroup: 65534
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      seccompProfile:
        type: RuntimeDefault

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi
