# Logical backup of the Paperless SQLite database to S3.
#
# Kept after the move to Longhorn, unlike the Postgres data volumes, which were
# dropped from Longhorn's scope precisely because a dump already covered them.
# The asymmetry is deliberate and rests on what each volume holds. Those held a
# database and nothing else, so the dump and the snapshot were two copies of the
# same thing. paperless-data-lh holds more than the database: the Whoosh search
# index, the celerybeat schedule, the log directory. The snapshot covers those
# and the dump does not, so the two are complements rather than duplicates -- at
# 13MB, cheaply.
#
# The dump remains the verified half. It is the artefact the nightly
# restore-test replays, and it carries its own integrity_check; the snapshot is
# a fast path that nothing routinely proves.
#
# Uses SQLite's online backup API rather than copying db.sqlite3. The database
# runs in WAL mode -- db.sqlite3-wal and db.sqlite3-shm sit next to it -- so a
# plain file copy of db.sqlite3 alone can miss every committed transaction
# still living in the WAL, and copying the three files non-atomically while
# paperless is writing can produce an inconsistent set. The backup API takes a
# consistent snapshot of a live database with writers active, which is exactly
# the situation here since paperless is not stopped for this.
#
# Scanned documents live on paperless-media-lh and are NOT in here. This covers
# the database only: document metadata, tags, correspondents, users and the
# search index's source of truth. A restore needs both.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-sqlite-backup
  namespace: paperless
spec:
  schedule: "45 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            # Selected by backup-netpol.yaml. CronJob pods do not inherit an
            # app.kubernetes.io/name label on their own -- they only get
            # job-name/controller-uid, which change every run and so cannot be
            # matched by a static CiliumNetworkPolicy.
            app.kubernetes.io/name: paperless-sqlite-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: dump
              # python:3-alpine ships the sqlite3 module, so no extra install is
              # needed and no package fetch happens at backup time.
              image: docker.io/library/python:3.12-alpine
              command:
                - /usr/local/bin/python
                - -c
                - |
                  import gzip, os, shutil, sqlite3, sys, tempfile

                  SRC = "/data/db.sqlite3"
                  OUT = "/work/paperless-db.sqlite3.gz"

                  # Read-only URI so this job can never write to the live
                  # database. The backup API still produces a consistent
                  # snapshot including anything sitting in the WAL.
                  src = sqlite3.connect(f"file:{SRC}?mode=ro", uri=True)
                  tmp = tempfile.NamedTemporaryFile(suffix=".sqlite3", delete=False)
                  tmp.close()
                  dst = sqlite3.connect(tmp.name)
                  with dst:
                      src.backup(dst)
                  dst.close()
                  src.close()

                  # Prove the snapshot is a valid database before shipping it,
                  # rather than discovering it during a restore.
                  chk = sqlite3.connect(tmp.name)
                  result = chk.execute("PRAGMA integrity_check").fetchone()[0]
                  chk.close()
                  if result != "ok":
                      print(f"ERROR: integrity_check returned {result}", file=sys.stderr)
                      sys.exit(1)

                  with open(tmp.name, "rb") as f_in, gzip.open(OUT, "wb", compresslevel=9) as f_out:
                      shutil.copyfileobj(f_in, f_out)
                  os.unlink(tmp.name)

                  size = os.path.getsize(OUT)
                  if size < 1024:
                      print(f"ERROR: backup is only {size} bytes -- refusing to upload", file=sys.stderr)
                      sys.exit(1)
                  print(f"backup ok: {size} bytes, integrity_check=ok")
              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.36.30
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  KEY="s3://db-backups/paperless/paperless-db-${TS}.sqlite3.gz"
                  aws --endpoint-url "$S3_ENDPOINT" s3 cp /work/paperless-db.sqlite3.gz "$KEY"
                  echo "uploaded paperless-db-${TS}.sqlite3.gz"

                  # A successful PUT is not a readable object. Objects in these
                  # buckets have carried correct metadata and correct sizes while
                  # their chunks were gone, so every listing and every size guard
                  # passed while the object could not be fetched at all.
                  #
                  # The integrity_check above proves the snapshot was a valid
                  # database before upload. It says nothing about what survived
                  # the upload, and those are different claims.
                  #
                  # The Immich, Keycloak and filer-metadata jobs all read their
                  # object back. This one did not, which made it the only database
                  # dump here whose durability was assumed rather than shown.
                  EXPECT="$(stat -c %s /work/paperless-db.sqlite3.gz)"
                  if ! aws --endpoint-url "$S3_ENDPOINT" s3 cp "$KEY" /work/readback --quiet; then
                    echo "ERROR: uploaded object cannot be read back -- not a durable backup" >&2
                    exit 1
                  fi
                  GOT="$(stat -c %s /work/readback)"
                  rm -f /work/readback
                  if [ "$GOT" != "$EXPECT" ]; then
                    echo "ERROR: read-back ${GOT}B vs uploaded ${EXPECT}B -- refusing to report success" >&2
                    exit 1
                  fi
                  echo "read-back verified: ${GOT} bytes"
              env:
                - name: S3_ENDPOINT
                  value: http://seaweedfs-s3.seaweedfs.svc:8333
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-backup-credentials
                      key: admin_access_key_id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: seaweedfs-backup-credentials
                      key: admin_secret_access_key
              volumeMounts:
                - name: work
                  mountPath: /work
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: paperless-data-lh
            - name: work
              emptyDir: {}
