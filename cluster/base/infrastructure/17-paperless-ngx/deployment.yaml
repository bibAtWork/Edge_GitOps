apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  # Recreate avoids two pods competing for the same ReadWriteOnce SQLite PVC.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): ensures the
      # viewer/app-operator/platform-admin Django Groups (and their
      # permissions) exist before the app starts, every pod (re)start.
      # Idempotent (get_or_create + permissions.set()) and safe to rerun --
      # see rbac-groups-configmap.yaml for why this runs here instead of a
      # standalone Job (no external DB to stand up a separate connection to).
      initContainers:
        - name: ensure-rbac-groups
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          command: ["/bin/sh", "-c", "python3 manage.py shell < /scripts/ensure_groups.py"]
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-valkey:6379
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: rbac-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-valkey:6379
            - name: PAPERLESS_URL
              value: https://paperless.homelab.data-harness.org
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_MAIL
              value: bibatwork@gmail.com
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_PASSWORD
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_SECRET_KEY
            # Keycloak SSO (django-allauth openid_connect provider). Native
            # login stays enabled as a fallback — not disabled via
            # PAPERLESS_DISABLE_REGULAR_LOGIN — so PAPERLESS_ADMIN_USER still
            # works if Keycloak is ever unreachable.
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            # Syncs Django group membership from the Keycloak "groups" claim on
            # every login (paperless.signals.handle_social_account_updated) --
            # a destructive full-replace, so group membership is fully owned by
            # Keycloak once this is on. Requires the per-app "scope" key below
            # (lowercase, not "SCOPE"), since "groups" is an optional Keycloak
            # client scope and isn't returned unless explicitly requested.
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: "true"
            - name: PAPERLESS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperless-oidc-secret
                  key: PAPERLESS_CLIENT_SECRET
            # server_url uses internal service DNS, not the external hostname:
            # Paperless's namespace gets a 403 "Access denied" from Cilium's
            # gateway listener that other namespaces (e.g. monitoring) don't,
            # for reasons not yet root-caused (see
            # project_opa_hubble_ui_broken.md's sibling finding). Direct
            # pod-to-pod sidesteps it.
            #
            # Partially re-investigated 2026-09-20 chasing an unrelated Argo
            # Workflows SSO timeout: reaching the Gateway's own ClusterIP
            # (not its external LAN IP) with the right Host header DOES work
            # from a locked-down namespace with no other cross-namespace
            # egress (backup-system) -- confirmed live, 200 OK against
            # Keycloak's discovery endpoint -- once the request targets the
            # https listener's real backend port (10443, the Service's own
            # targetPort) rather than the 443 the Service publishes. Also
            # checked OPA's policy directly (security/opa-policies
            # ConfigMap): the gateway-wide extAuth SecurityPolicy's Rego
            # only returns 403 for a *valid* JWT failing an admin check
            # (Grafana admin paths, admin_only_apps) -- a plain request with
            # no Authorization header, which is what any OIDC discovery/token
            # call is, falls through to the default-allow rule. So OPA's own
            # logic doesn't explain a 403 here, and Envoy calls OPA itself
            # regardless of which namespace originated the client request,
            # which doesn't fit a namespace-dependent symptom either. Neither
            # of those rules out something else entirely (this was reached
            # via Keycloak's route specifically, not Paperless's own, and
            # without an actual repro of the original 403 to compare
            # against) -- left as direct pod-to-pod, which already works and
            # carries no reason to change. Recorded so the next person
            # chasing this starts from what's now actually known rather
            # than re-deriving it.
            #
            # Keycloak's KC_HOSTNAME is a full
            # https:// URL, so the discovery document still returns correct
            # https:// endpoint URLs despite being fetched over plain internal
            # HTTP — required since the authorization_endpoint is handed to
            # the user's browser, and POSTs to token_endpoint would otherwise
            # risk being downgraded to GET on an http->https redirect.
            #
            # "scope" must be lowercase: allauth's OAuth2Provider.get_scope()
            # checks self.app.settings.get("scope") (lowercase) FIRST, and
            # only falls back to a provider-wide (not per-app) "SCOPE" key via
            # self.get_settings() if that's absent -- confirmed against the
            # actual installed allauth source, not assumed. An uppercase
            # "SCOPE" key here is silently ignored: get_scope() falls through
            # both checks and returns get_default_scope() ([openid, profile,
            # email]), meaning "groups" was never actually requested despite
            # looking correctly configured. Root cause of a real live outage:
            # Paperless SSO login itself worked, but every synced user landed
            # in zero Django groups (empty groups claim), so every request
            # after login 403'd -- confirmed via Envoy's own access log
            # showing the literal scope= sent to Keycloak lacked "groups".
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: >-
                {"openid_connect":{"APPS":[{"provider_id":"keycloak","name":"Keycloak","client_id":"paperless","secret":"$(PAPERLESS_OIDC_CLIENT_SECRET)","settings":{"server_url":"http://keycloak.keycloak.svc.cluster.local/realms/homelab/.well-known/openid-configuration","scope":["openid","profile","email","groups"]}}]}}
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng+deu
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            # Trust all proxies — homelab behind Cilium gateway, no external exposure.
            - name: PAPERLESS_TRUSTED_PROXIES
              value: "0.0.0.0/0"
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              # 256Mi -> 640Mi. 7-day p95 is 633Mi, so this ran at 2.5x its
              # request. Document parsing is bursty by nature, and here the
              # burst is the normal case rather than the exception.
              memory: 640Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            failureThreshold: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: export
              mountPath: /usr/src/paperless/export
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: tmp
              mountPath: /tmp
        # Files normally leave consume within minutes. A failed import can
        # leave the only copy here indefinitely, so expose its age for an
        # alert. Keeping this reader in the application pod avoids a second
        # pod contending for the ReadWriteOnce claim.
        - name: consume-monitor
          image: ghcr.io/paperless-ngx/paperless-ngx:3.1.3
          command: ["python3", "/monitor/monitor.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: consume-metrics
              containerPort: 9101
          readinessProbe:
            httpGet:
              path: /metrics
              port: consume-metrics
            initialDelaySeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: consume
              mountPath: /consume
              readOnly: true
            - name: consume-monitor
              mountPath: /monitor
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data-lh
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media-lh
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export-lh
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume-lh
        - name: tmp
          emptyDir: {}
        - name: rbac-script
          configMap:
            name: paperless-rbac-groups-script
        - name: consume-monitor
          configMap:
            name: paperless-consume-monitor
