apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-ngx
  # Recreate avoids two pods competing for the same ReadWriteOnce SQLite PVC.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: paperless-ngx
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): ensures the
      # viewer/app-operator/platform-admin Django Groups (and their
      # permissions) exist before the app starts, every pod (re)start.
      # Idempotent (get_or_create + permissions.set()) and safe to rerun --
      # see rbac-groups-configmap.yaml for why this runs here instead of a
      # standalone Job (no external DB to stand up a separate connection to).
      initContainers:
        - name: ensure-rbac-groups
          image: ghcr.io/paperless-ngx/paperless-ngx:3.0.3
          command: ["/bin/sh", "-c", "python3 manage.py shell < /scripts/ensure_groups.py"]
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-valkey:6379
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: rbac-script
              mountPath: /scripts
              readOnly: true
      containers:
        - name: paperless-ngx
          image: ghcr.io/paperless-ngx/paperless-ngx:3.0.3
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAPERLESS_REDIS
              value: redis://paperless-valkey:6379
            - name: PAPERLESS_URL
              value: https://paperless.homelab.data-harness.org
            - name: PAPERLESS_ADMIN_USER
              value: admin
            - name: PAPERLESS_ADMIN_MAIL
              value: bibatwork@gmail.com
            - name: PAPERLESS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_PASSWORD
            - name: PAPERLESS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_SECRET_KEY
            # Keycloak SSO (django-allauth openid_connect provider). Native
            # login stays enabled as a fallback — not disabled via
            # PAPERLESS_DISABLE_REGULAR_LOGIN — so PAPERLESS_ADMIN_USER still
            # works if Keycloak is ever unreachable.
            - name: PAPERLESS_APPS
              value: allauth.socialaccount.providers.openid_connect
            - name: PAPERLESS_SOCIAL_AUTO_SIGNUP
              value: "true"
            # Syncs Django group membership from the Keycloak "groups" claim on
            # every login (paperless.signals.handle_social_account_updated) --
            # a destructive full-replace, so group membership is fully owned by
            # Keycloak once this is on. Requires the per-app "scope" key below
            # (lowercase, not "SCOPE"), since "groups" is an optional Keycloak
            # client scope and isn't returned unless explicitly requested.
            - name: PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS
              value: "true"
            - name: PAPERLESS_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: paperless-oidc-secret
                  key: PAPERLESS_CLIENT_SECRET
            # server_url uses internal service DNS, not the external hostname:
            # Paperless's namespace gets a 403 "Access denied" from Cilium's
            # gateway listener that other namespaces (e.g. monitoring) don't,
            # for reasons not yet root-caused (see
            # project_opa_hubble_ui_broken.md's sibling finding). Direct
            # pod-to-pod sidesteps it. Keycloak's KC_HOSTNAME is a full
            # https:// URL, so the discovery document still returns correct
            # https:// endpoint URLs despite being fetched over plain internal
            # HTTP — required since the authorization_endpoint is handed to
            # the user's browser, and POSTs to token_endpoint would otherwise
            # risk being downgraded to GET on an http->https redirect.
            #
            # "scope" must be lowercase: allauth's OAuth2Provider.get_scope()
            # checks self.app.settings.get("scope") (lowercase) FIRST, and
            # only falls back to a provider-wide (not per-app) "SCOPE" key via
            # self.get_settings() if that's absent -- confirmed against the
            # actual installed allauth source, not assumed. An uppercase
            # "SCOPE" key here is silently ignored: get_scope() falls through
            # both checks and returns get_default_scope() ([openid, profile,
            # email]), meaning "groups" was never actually requested despite
            # looking correctly configured. Root cause of a real live outage:
            # Paperless SSO login itself worked, but every synced user landed
            # in zero Django groups (empty groups claim), so every request
            # after login 403'd -- confirmed via Envoy's own access log
            # showing the literal scope= sent to Keycloak lacked "groups".
            - name: PAPERLESS_SOCIALACCOUNT_PROVIDERS
              value: >-
                {"openid_connect":{"APPS":[{"provider_id":"keycloak","name":"Keycloak","client_id":"paperless","secret":"$(PAPERLESS_OIDC_CLIENT_SECRET)","settings":{"server_url":"http://keycloak.keycloak.svc.cluster.local/realms/homelab/.well-known/openid-configuration","scope":["openid","profile","email","groups"]}}]}}
            - name: PAPERLESS_OCR_LANGUAGE
              value: eng+deu
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
            # Trust all proxies — homelab behind Cilium gateway, no external exposure.
            - name: PAPERLESS_TRUSTED_PROXIES
              value: "0.0.0.0/0"
            - name: USERMAP_UID
              value: "1000"
            - name: USERMAP_GID
              value: "1000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            failureThreshold: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: export
              mountPath: /usr/src/paperless/export
            - name: consume
              mountPath: /usr/src/paperless/consume
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-media-swfs
        - name: export
          persistentVolumeClaim:
            claimName: paperless-export-swfs
        - name: consume
          persistentVolumeClaim:
            claimName: paperless-consume-swfs
        - name: tmp
          emptyDir: {}
        - name: rbac-script
          configMap:
            name: paperless-rbac-groups-script
