apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  interval: 30m
  chart:
    spec:
      chart: paperless-ngx
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: flux-system
      interval: 12h
  install:
    timeout: 20m
    remediation:
      retries: 3
  upgrade:
    timeout: 20m
    remediation:
      retries: 3
      remediateLastFailure: true
    cleanupOnFail: true
  values:
    env:
      PAPERLESS_URL: https://paperless.homelab.data-harness.org
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_MAIL: bibatwork@gmail.com
      PAPERLESS_OCR_LANGUAGES: eng+deu
      PAPERLESS_TIME_ZONE: Europe/Berlin

    envFrom:
      - secretRef:
          name: paperless-secret

    persistence:
      data:
        enabled: true
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi
        labels:
          velero.io/backup: "true"
      media:
        enabled: true
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 50Gi
        labels:
          velero.io/backup: "true"
      consume:
        enabled: true
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 10Gi
      export:
        enabled: true
        storageClass: local-path
        accessMode: ReadWriteOnce
        size: 5Gi

    redis:
      enabled: true
      # bitnami/redis:7.4.2-debian-12-r0 pinned by chart 20.7.0 doesn't exist on Docker Hub yet.
      # Use latest which is cached on the node and passes bitnami's registry validation.
      image:
        registry: docker.io
        repository: bitnami/redis
        tag: "latest"
      master:
        persistence:
          storageClass: local-path
          size: 1Gi
          accessMode: ReadWriteOnce

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
