apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data
  namespace: paperless
  labels:
    velero.io/backup: "true"
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Document blobs, on SeaweedFS so paperless can be rescheduled onto another
# node. paperless-data is deliberately not here: it holds the SQLite database
# and stays on local-path, because a mount fault costs a blob volume some
# downtime and can cost a database its integrity.
#
# The previous local-path PVCs were removed after the migration soaked. Flux
# pruning them also destroys the underlying directories -- local-path's reclaim
# policy is Delete.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media-swfs
  namespace: paperless
  labels:
    velero.io/backup: "true"
spec:
  storageClassName: seaweedfs-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-export-swfs
  namespace: paperless
  labels:
    velero.io/backup: "true"
spec:
  storageClassName: seaweedfs-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-swfs
  namespace: paperless
  labels:
    velero.io/backup: "true"
spec:
  storageClassName: seaweedfs-storage
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
