# Paperless volumes.
#
# All four are on Longhorn. paperless-data was the last holdout on local-path,
# kept there while the only alternative was the SeaweedFS CSI driver -- a FUSE
# mount, which SQLite has real reasons to distrust. Longhorn is not that: it
# presents an ordinary ext4 block device, so SQLite behaves exactly as it does
# on a local disk.
#
# Staying on local-path had two costs that are now gone. A hostPath volume
# cannot be captured by anything that reads volumes -- the recovery system
# (ADR-012) backs these up from Longhorn snapshot clones, which a hostPath volume
# does not have. And a hostPath volume pins the pod to one node, which matters
# the moment this cluster has more than one.
#
# On longhorn-db rather than longhorn: Retain reclaim, so a pruned or renamed
# claim cannot take the database with it, and strict-local data locality, so
# reads and writes stay on the node holding the replica.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-lh
  namespace: paperless
spec:
  storageClassName: longhorn-db
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 13MB in use at migration. 5Gi carried forward from the local-path claim
      # -- Longhorn reserves 30% of the disk, so headroom here is not free, and
      # expansion is enabled if the index grows.
      storage: 5Gi
---
# Document blobs, on Longhorn since 2026-08-24 -- a real block device with ext4
# rather than the SeaweedFS FUSE mount, whose shared mount daemon returned EIO to
# every volume it served when it was OOMKilled.
#
# Sized to observed usage plus headroom rather than copied forward. The previous
# 50Gi claim held 144KB, and Longhorn reserves 30% of the disk, so oversized
# claims consume a provisioning budget that is much smaller than the disk implies.
# Expansion is enabled; shrinking is not.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-media-lh
  namespace: paperless
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-export-lh
  namespace: paperless
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Ingest directory -- transient by nature, files are consumed and removed.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-lh
  namespace: paperless
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
