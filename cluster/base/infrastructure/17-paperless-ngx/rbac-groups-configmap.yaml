apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-rbac-groups-script
  namespace: paperless
data:
  ensure_groups.py: |
    # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): idempotent
    # Django Group + permission setup for Paperless's three job-function
    # groups. Runs as an initContainer on every pod (re)start rather than a
    # one-shot Job -- Paperless has no external DB (SQLite on the same PVC
    # the main container uses), so there's no separate connection to stand
    # up, and get_or_create + permissions.set() are naturally idempotent.
    #
    # Group *names* must match the Keycloak groups' leaf names exactly --
    # PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS (PR #186) looks up Django Groups
    # by the "groups" claim's leaf names and does NOT create missing ones,
    # so a user in a Keycloak group with no matching Django Group here ends
    # up in no group at all after sync.
    #
    # No auth.* (Django's own user/group) permissions anywhere, including
    # for platform-admin: Keycloak is the source of truth for group
    # membership, and the sync is a destructive clear=True full-replace on
    # every login, so granting Django-side group-editing permissions here
    # would just get silently overwritten -- there's nothing for a "Django
    # IAM" permission to durably do in this model.
    from django.contrib.auth.models import Group, Permission, User

    # Content models: what Paperless exists to manage day to day.
    CONTENT_MODELS = [
        "correspondent", "tag", "documenttype", "storagepath", "document",
        "note", "sharelink", "sharelinkbundle", "savedview",
        "savedviewfilterrule", "uisettings", "paperlesstask",
    ]
    # Config models: global automation/schema that affects every user's
    # documents, not just the acting user's own -- the closest thing this
    # app has to the ADR's "IAM-shaped" access, reserved for Owner.
    CONFIG_MODELS = [
        "workflow", "workflowtrigger", "workflowaction",
        "workflowactionemail", "workflowactionwebhook", "workflowrun",
        "customfield", "customfieldinstance",
    ]


    def ensure_group(name, codenames):
        group, _ = Group.objects.get_or_create(name=name)
        perms = list(Permission.objects.filter(
            codename__in=codenames, content_type__app_label="documents",
        ))
        group.permissions.set(perms)
        print(f"✓ '{name}' group ensured with {len(perms)} permissions")


    viewer_perms = [f"view_{m}" for m in CONTENT_MODELS]
    operator_perms = viewer_perms + [
        f"{action}_{m}" for m in CONTENT_MODELS for action in ("add", "change", "delete")
    ]
    admin_perms = operator_perms + [
        f"{action}_{m}" for m in CONFIG_MODELS for action in ("view", "add", "change", "delete")
    ]

    # Public self-registration lands here, via the Keycloak /self-service group
    # and PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS matching on name.
    #
    # Deliberately narrower than viewer, which is an ADR-002 tier granted to
    # people who were vetted. This set is the minimum that lets the UI render a
    # document the user owns: the document itself, the metadata shown on it, and
    # uisettings, without which the frontend will not load at all.
    #
    # What is left out matters more than what is in. No sharelink or
    # sharelinkbundle -- those are how documents are exposed outside the app,
    # and a self-registered account has no business enumerating them. No
    # paperlesstask, which leaks the filenames of documents being consumed. No
    # add/change/delete of anything.
    #
    # "Own workspace only" is not enforced by this list; it is enforced by
    # Paperless's object permissions, which show a non-superuser only documents
    # they own or have been granted. Verified 2026-08-25: 0 of 2 documents have
    # a null owner, so there is nothing an unowned-document fallback could
    # expose. That invariant is worth re-checking if documents are ever
    # bulk-imported, because an import that skips owner assignment makes every
    # such document visible to everyone holding view_document.
    self_service_perms = [
        "view_document", "view_correspondent", "view_tag",
        "view_documenttype", "view_storagepath", "view_uisettings",
    ]

    ensure_group("viewer", viewer_perms)
    ensure_group("app-operator", operator_perms)
    ensure_group("platform-admin", admin_perms)
    ensure_group("self-service", self_service_perms)

    # Django superuser status can't be granted via a Group (Django has no
    # "this permission set implies is_superuser" concept) -- but ADR-002's
    # Owner tier ("unrestricted... including IAM management") is what
    # is_superuser actually models. Paperless's own document-ownership
    # model (documents/permissions.py's PaperlessObjectPermissions /
    # _permitted_document_ids) only grants access to documents a user owns
    # or was explicitly shared, even with every model-level permission
    # granted via a Group -- confirmed live: a platform-admin user with
    # full documents.* permissions still couldn't see documents owned by
    # a different account. Django's own ModelBackend.has_perm() bypasses
    # ownership/object checks entirely for is_superuser, which is the only
    # mechanism in this app that actually matches "Owner: unrestricted".
    #
    # Two-way sync (promotes AND demotes) except for the bootstrap local
    # account (PAPERLESS_ADMIN_USER, "admin") which stays a superuser
    # unconditionally -- the non-SSO break-glass identity, same role
    # cert-based kubeconfig access plays for kubectl.
    platform_admin_members = set(
        Group.objects.get(name="platform-admin").user_set.values_list("username", flat=True),
    )
    for user in User.objects.exclude(username="admin"):
        should_be_superuser = user.username in platform_admin_members
        if user.is_superuser != should_be_superuser or user.is_staff != should_be_superuser:
            user.is_superuser = should_be_superuser
            user.is_staff = should_be_superuser
            user.save()
            action = "Promoted" if should_be_superuser else "Demoted"
            print(f"✓ {action} '{user.username}' {'to' if should_be_superuser else 'from'} superuser (platform-admin sync)")
