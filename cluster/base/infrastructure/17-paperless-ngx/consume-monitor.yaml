apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-consume-monitor
  namespace: paperless
data:
  monitor.py: |
    import os
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    CONSUME_DIR = "/consume"


    def scan_error(error):
        raise error


    def metrics():
        now = time.time()
        files = 0
        oldest = 0.0
        try:
            for root, _, names in os.walk(CONSUME_DIR, onerror=scan_error):
                for name in names:
                    path = os.path.join(root, name)
                    if os.path.isfile(path):
                        files += 1
                        oldest = max(oldest, now - os.stat(path).st_mtime)
            success = 1
        except OSError:
            success = 0
        return (
            "# HELP paperless_consume_files Files waiting in Paperless's consume directory.\n"
            "# TYPE paperless_consume_files gauge\n"
            f"paperless_consume_files {files}\n"
            "# HELP paperless_consume_oldest_file_age_seconds Age of the oldest waiting file.\n"
            "# TYPE paperless_consume_oldest_file_age_seconds gauge\n"
            f"paperless_consume_oldest_file_age_seconds {oldest:.0f}\n"
            "# HELP paperless_consume_scan_success Whether the consume directory scan succeeded.\n"
            "# TYPE paperless_consume_scan_success gauge\n"
            f"paperless_consume_scan_success {success}\n"
        ).encode()


    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path != "/metrics":
                self.send_error(404)
                return
            body = metrics()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *_):
            pass


    ThreadingHTTPServer(("0.0.0.0", 9101), Handler).serve_forever()
