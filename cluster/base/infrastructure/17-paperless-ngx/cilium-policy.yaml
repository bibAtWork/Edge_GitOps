apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace-egress
  namespace: paperless
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - {}
---
# Hub-and-spoke migration (2026-08-17): paperless-ngx's app pod and its redis/valkey
# sidecar -- previously covered only by allow-cluster-internal.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-intra-namespace-ingress
  namespace: paperless
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
---
# Allow Paperless-ngx to reach Keycloak directly (internal service DNS) for
# OIDC discovery/token/userinfo. See the matching rule in
# 26-keycloak/cilium-policy.yaml for why this bypasses the gateway.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-paperless-to-keycloak-egress
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app: paperless-ngx
  egress:
    - toEndpoints:
        - matchLabels:
            app: keycloak
            io.kubernetes.pod.namespace: keycloak
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
