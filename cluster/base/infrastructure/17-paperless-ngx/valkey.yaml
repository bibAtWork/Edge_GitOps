apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-valkey
  namespace: paperless
spec:
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-valkey
  namespace: paperless
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paperless-valkey
  template:
    metadata:
      labels:
        app: paperless-valkey
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9-alpine
          ports:
            - containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-valkey
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-valkey
  namespace: paperless
spec:
  selector:
    app: paperless-valkey
  ports:
    - port: 6379
      targetPort: 6379
