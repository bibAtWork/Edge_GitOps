apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: oidc-app-operator-edit
  namespace: example-app
subjects:
  - kind: Group
    name: oidc:app-operator
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
---
# DNS, gateway ingress and opted-in OTLP egress come from shared platform policies.
# Add only the application's additional database/object-store/peer destinations.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: example-app-isolation
  namespace: example-app
spec:
  endpointSelector: {}
  ingress: []
  egress: []
