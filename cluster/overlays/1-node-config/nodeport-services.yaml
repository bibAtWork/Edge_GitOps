apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: zot-nodeport
  namespace: zot
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: zot
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
