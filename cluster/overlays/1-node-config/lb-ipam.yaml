apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-pool
spec:
  blocks:
    - cidr: REPLACE_WITH_GATEWAY_IP/32
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: homelab-gateway
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-announce
spec:
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: homelab-gateway
  interfaces:
    - ^eth[0-9]+$
    - ^enp[0-9]+s[0-9]+.*$
  loadBalancerIPs: true
