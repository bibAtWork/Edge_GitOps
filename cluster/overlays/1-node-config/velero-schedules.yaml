# Only back up namespaces with irreplaceable user data — everything else is
# recoverable from the GitOps repository via Flux reconciliation.
#
# immich: PostgreSQL DB (photo metadata/albums/faces) + photo library files
# paperless: document database + scanned document files
# keycloak: PostgreSQL DB (users, groups, OIDC clients — not reproducible from git)
#
# Deliberately excluded:
#   - monitoring: Grafana config is fully provisioned from git (dashboards via
#     gnetId, alerts/contact points via Helm values); VictoriaMetrics holds
#     scraped metrics (historical data, not application state)
#   - zot: OCI image cache, rebuildable from upstream registries
#   - All other namespaces: Flux recreates all workload resources from git
#   - includeClusterResources: CRDs, ClusterRoles, etc. are all in git
#
# Shorter local retention (4 days) because local = same machine.
# AWS S3 is the durable guard against machine-level failures.
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-local
  namespace: velero
spec:
  schedule: "0 2 * * *"
  template:
    storageLocation: seaweedfs-local
    ttl: 96h
    snapshotVolumes: false
    # Objects only. Velero's file-system backup has never captured a single PVC
    # in this cluster: Kopia silently skips hostPath volumes (every local-path
    # PVC), so no PodVolumeBackup is even created, and on SeaweedFS CSI volumes
    # the data path fails outright. Across 37 days the only volumes it ever
    # stored were ephemeral -- dshm, tmp, empty-dir.
    #
    # Leaving it on was worse than useless: it produced failed PodVolumeBackups
    # and PartiallyFailed backups, which is a red signal that protects nothing
    # and trains people to ignore it. Turning it off also lets the node-agent
    # DaemonSet be removed entirely (see helmrelease.yaml) -- that pod ran as
    # root and hostPath-mounted /var/lib/kubelet/pods, i.e. every pod's volumes
    # on the node.
    #
    # Volume data is protected by layer instead, all of it landing in SeaweedFS:
    # databases via logical dumps to the db-backups bucket, application blobs by
    # living on SeaweedFS already. Velero's job here is the Kubernetes object
    # graph -- notably the runtime-generated state that Git does not hold, such
    # as cert-manager's issued TLS secrets and PV binding identity.
    defaultVolumesToFsBackup: false
    includedNamespaces:
      - immich
      - paperless
      - keycloak
    includeClusterResources: false
    excludedResources:
      - events
      - events.events.k8s.io
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: weekly-offsite
  namespace: velero
spec:
  schedule: "0 3 * * 0"
  template:
    storageLocation: aws-s3
    ttl: 2160h
    snapshotVolumes: false
    # Objects only -- see daily-local above.
    defaultVolumesToFsBackup: false
    includedNamespaces:
      - immich
      - paperless
      - keycloak
    includeClusterResources: false
    excludedResources:
      - events
      - events.events.k8s.io
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: monthly-offsite
  namespace: velero
spec:
  schedule: "0 4 1 * *"
  template:
    storageLocation: aws-s3
    ttl: 8760h
    snapshotVolumes: false
    # Objects only -- see daily-local above.
    defaultVolumesToFsBackup: false
    includedNamespaces:
      - immich
      - paperless
      - keycloak
    includeClusterResources: false
    excludedResources:
      - events
      - events.events.k8s.io
