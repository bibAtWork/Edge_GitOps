# Two volume servers pinned to separate physical disks.
# etcd-backups and velero-backups land on the backup-disk volume server.
# A primary disk failure does not destroy local backups.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  values:
    master:
      replicaCount: 1
    volume:
      replicaCount: 2
      replication: "000"
      dataDirs:
        - name: primary
          path: /data/primary
          maxVolumes: 0
          type: hdd
        - name: backup
          path: /data/backup
          maxVolumes: 0
          type: hdd
    filer:
      replicaCount: 1
