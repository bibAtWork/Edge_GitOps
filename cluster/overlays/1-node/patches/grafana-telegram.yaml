apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  values:
    # envValueFrom injects TELEGRAM_BOT_TOKEN via secretKeyRef so Grafana can
    # substitute $TELEGRAM_BOT_TOKEN in contactpoints.yaml at startup.
    # chatid is a literal string — Helm's toYaml (go-yaml v3) quotes integer-
    # looking strings, so '-1004444712571' becomes "-1004444712571" in the
    # ConfigMap and Grafana parses it as a string, not an int.
    envValueFrom:
      TELEGRAM_BOT_TOKEN:
        secretKeyRef:
          name: telegram-credentials
          key: TELEGRAM_BOT_TOKEN

    # Reloader restarts Grafana whenever telegram-credentials is rotated.
    podAnnotations:
      reloader.stakater.com/auto: "true"

    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: Telegram
            receivers:
              - uid: telegram
                type: telegram
                disableResolveMessage: false
                settings:
                  bottoken: $TELEGRAM_BOT_TOKEN
                  chatid: '-1004444712571' # trunk-ignore(yamllint/quoted-strings)

      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: Telegram
            group_by:
              - alertname
              - namespace
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - matchers:
                  - severity = critical
                receiver: Telegram
                repeat_interval: 1h
