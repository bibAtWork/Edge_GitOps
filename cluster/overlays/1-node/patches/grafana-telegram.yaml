apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  values:
    # envValueFrom injects secret keys as env vars via valueFrom.secretKeyRef.
    # Grafana substitutes $VAR placeholders in provisioning files at startup.
    # (env: only supports plain strings; envFromSecret is ignored in chart 10.x)
    envValueFrom:
      TELEGRAM_BOT_TOKEN:
        secretKeyRef:
          name: telegram-credentials
          key: TELEGRAM_BOT_TOKEN
      TELEGRAM_CHAT_ID:
        secretKeyRef:
          name: telegram-credentials
          key: TELEGRAM_CHAT_ID

    # Reloader restarts Grafana whenever telegram-credentials is rotated.
    podAnnotations:
      reloader.stakater.com/auto: "true"

    # Chart 10.x adds alerting files to the main ConfigMap but omits the
    # volume mounts. Mount them explicitly via extraVolumeMounts using the
    # existing "config" volume (the grafana ConfigMap).
    alerting:
      contactpoints.yaml:
        apiVersion: 1
        contactPoints:
          - orgId: 1
            name: Telegram
            receivers:
              - uid: telegram
                type: telegram
                disableResolveMessage: false
                settings:
                  bottoken: $TELEGRAM_BOT_TOKEN
                  chatid: $TELEGRAM_CHAT_ID

      # warning → 4h repeat; critical → 1h repeat.
      policies.yaml:
        apiVersion: 1
        policies:
          - orgId: 1
            receiver: Telegram
            group_by:
              - alertname
              - namespace
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              - matchers:
                  - severity = critical
                receiver: Telegram
                repeat_interval: 1h
