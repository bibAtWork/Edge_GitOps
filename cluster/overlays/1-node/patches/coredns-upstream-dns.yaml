apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    # Split DNS zone for Tailscale clients: resolves *.homelab.data-harness.org
    # to the Tailscale gateway via CNAME. Tailscale admin must point
    # homelab.data-harness.org to this CoreDNS instance (homelab-dns device).
    homelab.data-harness.org:53 {
        template IN A homelab.data-harness.org {
            answer "{{ .Name }} 60 IN CNAME homelab-gateway.olm-dominant.ts.net."
        }
        template IN AAAA homelab.data-harness.org {
            rcode NOERROR
        }
    }
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153

        kubernetes cluster.local in-addr.arpa ip6.arpa {
            pods insecure
            fallthrough in-addr.arpa ip6.arpa
            ttl 30
        }
        forward . 1.1.1.1 8.8.8.8 {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
