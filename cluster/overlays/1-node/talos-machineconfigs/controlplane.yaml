# FIRST BOOT ONLY: talosctl apply-config --insecure --nodes <node-ip> --file controlplane.yaml
#
# ⚠️ DO NOT run apply-config against an already-running node to make a change.
# This file is a TEMPLATE, not the live config: encryptionConfig below still
# carries the literal REPLACE_WITH_ETCD_ENCRYPTION_KEY placeholder, which
# bootstrap/scripts/apply-config.py substitutes at provisioning time. Applying
# it wholesale to a live node would push that placeholder over the real etcd
# encryption key. (An earlier revision of this repo -- PR #197's own
# description -- told you to do exactly that; it was wrong.)
#
# To change a running node, patch only the delta instead, which leaves every
# other field untouched and needs no reboot:
#   talosctl patch machineconfig --patch @some-patch.yaml --dry-run   # inspect
#   talosctl patch machineconfig --patch @some-patch.yaml             # apply
#
# Applied to the live node this way and verified (2026-08-18):
#   - cluster.apiServer.extraArgs (OIDC, below) -- confirmed live on the
#     running kube-apiserver via its --oidc-* flags
#   - the UserVolumeConfig document at the end of this file
---
machine:
  type: controlplane
  install:
    # Factory image, not the stock ghcr.io/siderolabs/installer -- it carries the
    # iscsi-tools and util-linux-tools extensions Longhorn V1 needs. Talos is
    # immutable, so extensions are part of the image and cannot be added at
    # runtime.
    #
    # Keep this in step with talos-image.env, which pins the schematic ID and the
    # Talos version this tag must match. Changing schematic.yaml means a new
    # schematic ID and a new value here.
    image: factory.talos.dev/installer/613e1592b2da41ae5e265e8789429f22e121aab91cb4deb6bc3c0b6262961245:v1.13.6
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - talos-backup

cluster:
  # Required on single-node: no worker nodes, so control-plane must run all workloads
  allowSchedulingOnControlPlanes: true

  # Cilium is the CNI (installed by the inlineManifest below) and runs with
  # kubeProxyReplacement: true. Without these two stanzas Talos also deploys its
  # own defaults — flannel and kube-proxy — and both ran alongside Cilium for 35
  # days (security review 2026-08-14, finding H3).
  #
  # This is not merely redundant. kube-proxy independently programs nftables DNAT
  # for the same Services Cilium handles in eBPF, logging "Deleting stale nftables
  # chains" on every reconcile — two datapaths racing for the same traffic.
  #
  # It also removes two privileged host-network workloads: kube-proxy runs
  # privileged: true, flannel holds NET_ADMIN + NET_RAW.
  #
  # Note: this was initially suspected of causing the LoadBalancer-VIP failure that
  # blocked the Envoy Gateway cutover. It is not — after this change was applied and
  # the node rebooted, the VIP still failed. The real cause was a missing
  # world-ingress CiliumNetworkPolicy on the backend pods (verified 2026-08-16).
  #
  # Talos stops rendering the manifests but never deletes already-deployed
  # DaemonSets, and kube-proxy's nftables table survives its own deletion — so
  # applying this requires deleting both DaemonSets and rebooting the node.
  network:
    cni:
      name: none
  proxy:
    disabled: true

  etcd:
    advertisedSubnets:
      - 192.168.178.0/24

  # kube-controller-manager and kube-scheduler bind their metrics and health
  # endpoints to 127.0.0.1 by default on Talos, which means nothing off the
  # node can scrape them. vmagent reported both as "connection refused" and
  # they sat down indefinitely -- and because a metric that is never collected
  # produces no series, any alert built on them would sit in noData rather
  # than firing. Two of the three components that decide what runs where were
  # therefore unobserved.
  #
  # 0.0.0.0 rather than the node IP: Talos renders this config before the
  # address is known, so pinning it would mean templating the machine config
  # per node. The endpoints are not open by binding them -- both use delegated
  # authn/authz against the API server, so a scrape still needs a token bound
  # to a role that permits it, which is what the vmagent ServiceAccount has.
  #
  # Applied live via `talosctl patch machineconfig` (NOT apply-config -- see
  # the placeholder warning at the top of this file). Both components restart,
  # which pauses scheduling and controller reconciliation for a few seconds on
  # a single-node cluster; running workloads are unaffected.
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0

  scheduler:
    extraArgs:
      bind-address: 0.0.0.0

  apiServer:
    # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): closes the
    # gap docs/backlog.md tracked as "Kubernetes-native RBAC has no
    # identity layer" -- kubectl access was cert-based only until now.
    # Cert-based admin kubeconfig access is completely unaffected: this
    # is an ADDITIONAL authenticator, not a replacement, and remains the
    # break-glass path if OIDC is ever misconfigured.
    #
    # oidc-username-prefix/oidc-groups-prefix ("oidc:"): upstream
    # Kubernetes' own recommendation, so an OIDC-sourced username or
    # group can never collide with a service account, a cert CN, or any
    # other auth mechanism's identity. 31-cluster-rbac/
    # clusterrolebindings.yaml's Group subjects carry this same prefix
    # for exactly that reason -- "platform-admin" alone is not what
    # Kubernetes RBAC actually sees.
    #
    # Applied live 2026-08-18 via `talosctl patch machineconfig` (NOT
    # apply-config -- see the placeholder warning at the top of this file)
    # and confirmed on the running kube-apiserver's --oidc-* flags.
    extraArgs:
      oidc-issuer-url: https://keycloak.homelab.data-harness.org/realms/homelab
      oidc-client-id: kubernetes
      oidc-username-claim: email
      oidc-username-prefix: "oidc:"
      oidc-groups-claim: groups
      oidc-groups-prefix: "oidc:"
    encryptionConfig:
      providers:
        - aescbc:
            keys:
              - name: key1
                secret: REPLACE_WITH_ETCD_ENCRYPTION_KEY
        - identity: {}
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: None
          users:
            - system:kube-proxy
          verbs:
            - watch
          resources:
            - group: ""
              resources:
                - endpoints
                - services
                - services/status
        - level: None
          userGroups:
            - system:authenticated
          nonResourceURLs:
            - /api*
            - /version
            - /healthz
            - /readyz
            - /livez
        - level: None
          resources:
            - group: ""
              resources:
                - events
        - level: Metadata
          resources:
            - group: ""
              resources:
                - secrets
                - configmaps
                - serviceaccounts/token
            - group: authentication.k8s.io
              resources:
                - tokenreviews
            - group: authorization.k8s.io
              resources:
                - subjectaccessreviews
        - level: Metadata
          omitStages:
            - RequestReceived

  inlineManifests:
    - name: cilium-install
      contents: |
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: cilium-install
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: cilium-install
            namespace: kube-system
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: cilium-install
          namespace: kube-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: cilium-install
          namespace: kube-system
        spec:
          backoffLimit: 10
          template:
            metadata:
              labels:
                app: cilium-install
            spec:
              restartPolicy: OnFailure
              tolerations:
                - operator: Exists
                  effect: NoSchedule
              serviceAccountName: cilium-install
              hostNetwork: true
              containers:
                - name: cilium-install
                  image: quay.io/cilium/cilium-cli-ci:latest
                  env:
                    - name: KUBERNETES_SERVICE_HOST
                      valueFrom:
                        fieldRef:
                          apiVersion: v1
                          fieldPath: status.podIP
                    - name: KUBERNETES_SERVICE_PORT
                      value: "6443"
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set -e
                      cilium install \
                        --set=ipam.mode=kubernetes \
                        --set=kubeProxyReplacement=true \
                        --set=gatewayAPI.enabled=true \
                        --set=hubble.enabled=true \
                        --set=encryption.enabled=true \
                        --set=encryption.type=wireguard \
                        '--set=securityContext.capabilities.ciliumAgent={CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}' \
                        '--set=securityContext.capabilities.cleanCiliumState={NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}' \
                        --set=cgroup.autoMount.enabled=false \
                        --set=cgroup.hostRoot=/sys/fs/cgroup
                      kubectl delete clusterrolebinding cilium-install --ignore-not-found
                      kubectl delete serviceaccount cilium-install -n kube-system --ignore-not-found
---
# Dedicated NVMe for SeaweedFS, per Sidero's Talos+SeaweedFS guidance.
#
# The node has two disks and only one was in use: sda (500GB SATA SSD) holds
# EFI/META/STATE/EPHEMERAL and therefore the OS, etcd, container images, and
# every local-path PVC -- while nvme0n1 (512GB NVMe, faster) sat completely
# unpartitioned and idle. Confirmed empty before provisioning: no partition
# table, no filesystem signature, no label.
#
# Giving SeaweedFS its own disk takes cluster storage off the same spindle as
# the OS and etcd, so SeaweedFS load or a runaway volume can no longer create
# disk pressure on the control plane -- the shared-failure-domain risk called
# out in the 2026-08-18 cluster audit.
#
# The selector can only ever match the NVMe: sda is transport "sata" and is
# additionally excluded by !system_disk. Note Sidero's warning that a selector
# matching no disk fails SILENTLY -- verify with `talosctl get volumestatus`
# (expect u-seaweedfs phase=ready) rather than assuming success.
#
# Mounts at /var/mnt/seaweedfs. Verified live: /dev/nvme0n1p1, xfs, ready.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: seaweedfs
provisioning:
  diskSelector:
    match: disk.transport == "nvme" && !system_disk
  minSize: 100GiB
  maxSize: 480GiB
  grow: false
