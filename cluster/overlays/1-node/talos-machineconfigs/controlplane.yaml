# Apply with: talosctl apply-config --insecure --nodes <node-ip> --file controlplane.yaml
---
machine:
  type: controlplane
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - talos-backup

cluster:
  # Required on single-node: no worker nodes, so control-plane must run all workloads
  allowSchedulingOnControlPlanes: true

  # Cilium is the CNI (installed by the inlineManifest below) and runs with
  # kubeProxyReplacement: true. Without these two stanzas Talos also deploys its
  # own defaults — flannel and kube-proxy — and both ran alongside Cilium for 35
  # days (security review 2026-08-14, finding H3).
  #
  # This is not merely redundant. kube-proxy independently programs nftables DNAT
  # for the same Services Cilium handles in eBPF, logging "Deleting stale nftables
  # chains" on every reconcile — two datapaths racing for the same traffic.
  #
  # It also removes two privileged host-network workloads: kube-proxy runs
  # privileged: true, flannel holds NET_ADMIN + NET_RAW.
  #
  # Note: this was initially suspected of causing the LoadBalancer-VIP failure that
  # blocked the Envoy Gateway cutover. It is not — after this change was applied and
  # the node rebooted, the VIP still failed. The real cause was a missing
  # world-ingress CiliumNetworkPolicy on the backend pods (verified 2026-08-16).
  #
  # Talos stops rendering the manifests but never deletes already-deployed
  # DaemonSets, and kube-proxy's nftables table survives its own deletion — so
  # applying this requires deleting both DaemonSets and rebooting the node.
  network:
    cni:
      name: none
  proxy:
    disabled: true

  etcd:
    advertisedSubnets:
      - 192.168.178.0/24

  apiServer:
    # ADR-002 (docs/adr/0002-flattened-hierarchical-rbac.md): closes the
    # gap docs/backlog.md tracked as "Kubernetes-native RBAC has no
    # identity layer" -- kubectl access was cert-based only until now.
    # Cert-based admin kubeconfig access is completely unaffected: this
    # is an ADDITIONAL authenticator, not a replacement, and remains the
    # break-glass path if OIDC is ever misconfigured.
    #
    # oidc-username-prefix/oidc-groups-prefix ("oidc:"): upstream
    # Kubernetes' own recommendation, so an OIDC-sourced username or
    # group can never collide with a service account, a cert CN, or any
    # other auth mechanism's identity. 31-cluster-rbac/
    # clusterrolebindings.yaml's Group subjects carry this same prefix
    # for exactly that reason -- "platform-admin" alone is not what
    # Kubernetes RBAC actually sees.
    #
    # This file's own top-of-file comment ("talosctl apply-config
    # --insecure") is leftover first-bootstrap guidance, not applicable
    # to updating an already-running node -- apply with a real
    # talosconfig instead: talosctl apply-config --nodes <node-ip>
    # --file controlplane.yaml. Applying this specific change was not
    # possible in the environment this was authored in (no talosconfig
    # available there); it needs to be applied by whoever holds it.
    extraArgs:
      oidc-issuer-url: https://keycloak.homelab.data-harness.org/realms/homelab
      oidc-client-id: kubernetes
      oidc-username-claim: email
      oidc-username-prefix: "oidc:"
      oidc-groups-claim: groups
      oidc-groups-prefix: "oidc:"
    encryptionConfig:
      providers:
        - aescbc:
            keys:
              - name: key1
                secret: REPLACE_WITH_ETCD_ENCRYPTION_KEY
        - identity: {}
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: None
          users:
            - system:kube-proxy
          verbs:
            - watch
          resources:
            - group: ""
              resources:
                - endpoints
                - services
                - services/status
        - level: None
          userGroups:
            - system:authenticated
          nonResourceURLs:
            - /api*
            - /version
            - /healthz
            - /readyz
            - /livez
        - level: None
          resources:
            - group: ""
              resources:
                - events
        - level: Metadata
          resources:
            - group: ""
              resources:
                - secrets
                - configmaps
                - serviceaccounts/token
            - group: authentication.k8s.io
              resources:
                - tokenreviews
            - group: authorization.k8s.io
              resources:
                - subjectaccessreviews
        - level: Metadata
          omitStages:
            - RequestReceived

  inlineManifests:
    - name: cilium-install
      contents: |
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: cilium-install
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: cilium-install
            namespace: kube-system
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: cilium-install
          namespace: kube-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: cilium-install
          namespace: kube-system
        spec:
          backoffLimit: 10
          template:
            metadata:
              labels:
                app: cilium-install
            spec:
              restartPolicy: OnFailure
              tolerations:
                - operator: Exists
                  effect: NoSchedule
              serviceAccountName: cilium-install
              hostNetwork: true
              containers:
                - name: cilium-install
                  image: quay.io/cilium/cilium-cli-ci:latest
                  env:
                    - name: KUBERNETES_SERVICE_HOST
                      valueFrom:
                        fieldRef:
                          apiVersion: v1
                          fieldPath: status.podIP
                    - name: KUBERNETES_SERVICE_PORT
                      value: "6443"
                  command:
                    - /bin/sh
                    - -c
                    - |
                      set -e
                      cilium install \
                        --set=ipam.mode=kubernetes \
                        --set=kubeProxyReplacement=true \
                        --set=gatewayAPI.enabled=true \
                        --set=hubble.enabled=true \
                        --set=encryption.enabled=true \
                        --set=encryption.type=wireguard \
                        '--set=securityContext.capabilities.ciliumAgent={CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}' \
                        '--set=securityContext.capabilities.cleanCiliumState={NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}' \
                        --set=cgroup.autoMount.enabled=false \
                        --set=cgroup.hostRoot=/sys/fs/cgroup
                      kubectl delete clusterrolebinding cilium-install --ignore-not-found
                      kubectl delete serviceaccount cilium-install -n kube-system --ignore-not-found
