apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/overlays/1-node
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: homelab-cluster
  decryption:
    provider: sops
    secretRef:
      name: sops-age
