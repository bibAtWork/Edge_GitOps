apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/overlays/1-node
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    # flux bootstrap names the GitRepository it creates "flux-system" by
    # default (no --source-name/--name override in bootstrap-1node.sh's
    # invocation) -- confirmed against the real, committed
    # flux-system/gotk-sync.yaml, which flux itself generated and which
    # carries this exact name. This file is documentation, not applied
    # anywhere, so getting the name wrong broke nothing live -- but it
    # would mislead anyone using it as a reference.
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
