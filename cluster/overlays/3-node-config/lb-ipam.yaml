# Same LAN IP as the 1-node overlay's copy of this file, for the same reason
# 14-tailscale-operator/config/subnet-router-hostnetwork.yaml (shared between
# both profiles) already hardcodes it: both are the gateway's dedicated
# address on the one LAN subnet either profile runs on
# (192.168.178.0/24, cluster.etcd.advertisedSubnets in both talos-machineconfigs).
# The two profiles are alternatives, not simultaneous deployments, so there is
# no live collision -- but keep this in step with that file if the LAN IP is
# ever changed, since nothing currently ties the two together automatically.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: gateway-pool
spec:
  blocks:
    - cidr: 192.168.178.200/32
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: homelab-gateway
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: gateway-announce
spec:
  serviceSelector:
    matchLabels:
      io.cilium.gateway/owning-gateway: homelab-gateway
  interfaces:
    - ^eth[0-9]+$
    - ^enp[0-9]+s[0-9]+.*$
  loadBalancerIPs: true
