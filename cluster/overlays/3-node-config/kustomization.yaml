apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/platform-config
  # network policies: CiliumNetworkPolicy + CiliumClusterwideNetworkPolicy (cilium.io CRDs)
  # cert-manager: ClusterIssuer + ACME keys (cert-manager.io CRDs)
  # envoy-gateway: EnvoyProxy (gateway.envoyproxy.io CRD from the bootstrap-layer
  # HelmRelease) — needed before the Gateway object below references its GatewayClass
  # ingress gateway: Gateway (gateway.networking.k8s.io) + wildcard Certificate (cert-manager.io)
  # grafana: HTTPRoute (gateway.networking.k8s.io)
  # cilium: Hubble UI HTTPRoute (gateway.networking.k8s.io)
  # zot: HTTPRoute (gateway.networking.k8s.io)
  # tailscale: ProxyClass (tailscale.com) + Service that uses it
  # system-upgrade: Plans (upgrade.cattle.io)
  # immich: HTTPRoute (gateway.networking.k8s.io)
  # paperless-ngx: HTTPRoute (gateway.networking.k8s.io)
  # kyverno: ClusterPolicy (kyverno.io) — needs Kyverno CRDs from 19-kyverno HelmRelease
  # keycloak: HTTPRoute (gateway.networking.k8s.io) for OIDC endpoint
  # kubeopencode: HTTPRoute (gateway.networking.k8s.io) + Agent (kubeopencode.io CRD
  # installed by the bootstrap-layer HelmRelease)
  # Cilium LB IPAM: assigns a dedicated LAN IP to the gateway + announces it via ARP
  - lb-ipam.yaml

# tailscaled-subnet-router (14-tailscale-operator/config/subnet-router-hostnetwork.yaml,
# included above) lives in this config layer, not the base overlay -- so its own
# HA patch lives here too, not in ../3-node/kustomization.yaml where the resource
# it targets would not exist in the same kustomize build.
patches:
  - path: patches/subnet-router-ha.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: tailscaled-subnet-router
      namespace: tailscale
