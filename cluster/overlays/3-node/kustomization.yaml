apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/00-bootstrap
  - ../../base/infrastructure/sources
  - ../../base/infrastructure/01-seaweedfs
  - ../../base/infrastructure/02-victoriametrics-stack
  - ../../base/infrastructure/03-otel-collector
  - ../../base/infrastructure/35-node-exporter
  - ../../base/infrastructure/36-talos-cve-watch
  - ../../base/infrastructure/04-grafana
  - ../../base/infrastructure/05-cilium
  - ../../base/infrastructure/06-cert-manager
  - ../../base/infrastructure/07-velero
  - ../../base/infrastructure/08-external-dns
  - ../../base/infrastructure/09-reloader
  - ../../base/infrastructure/10-network-policies
  - ../../base/infrastructure/11-ingress-gateway
  - ../../base/infrastructure/12-zot
  - ../../base/infrastructure/13-trivy-operator
  - ../../base/infrastructure/14-tailscale-operator
  - ../../base/infrastructure/15-system-upgrade-controller
  - ../../base/infrastructure/21-flux-notifications
  - patches/velero-schedules-ha.yaml

patches:
  - path: patches/seaweedfs-ha.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: seaweedfs
  - path: patches/otel-gateway-2-replicas.yaml
    target:
      kind: Deployment
      name: otel-collector-gateway
  - path: patches/zot-replicas-2.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: zot
  - path: patches/trivy-concurrency-2.yaml
    target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: trivy-operator
  - path: patches/subnet-router-ha.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
      name: tailscaled-subnet-router
      namespace: tailscale
  # Cap Helm release history on every HelmRelease at once.
  #
  # maxHistory was never set anywhere, so all 23 releases kept the default and
  # accumulated 101 `sh.helm.release.v1.*` Secrets between them -- kube-system
  # 11, and monitoring / immich / kubeopencode-system 10 each. Every one is a
  # gzipped copy of a full release manifest sitting in etcd, which is the same
  # etcd that has a 2GB backend quota and, until recently, no monitoring at all.
  #
  # An unnamed target matches every HelmRelease in the overlay, so this is one
  # patch rather than 23 edits that would drift apart the moment a release is
  # added. A new HelmRelease inherits the cap automatically.
  #
  # 3 rather than the default: `helm rollback` in a GitOps repo is a last
  # resort -- the real rollback is `git revert`, which reproduces the release
  # from source rather than from a snapshot. Keeping three still allows an
  # emergency rollback past a bad revision without holding ten.
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
    patch: |
      - op: add
        path: /spec/maxHistory
        value: 3
