apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/overlays/3-node-config
  prune: true
  # Keep platform readiness visible without making every optional application
  # Deployment a prerequisite for the entire config layer. Deployment availability
  # is alerted independently; a missing private-app credential must not hold back
  # later Gateway, policy, and backup configuration revisions.
  healthChecks:
    - apiVersion: cert-manager.io/v1
      kind: ClusterIssuer
      name: letsencrypt-prod
    - apiVersion: cert-manager.io/v1
      kind: Certificate
      name: homelab-wildcard-tls
      namespace: gateway-system
    - apiVersion: gateway.networking.k8s.io/v1
      kind: Gateway
      name: homelab-gateway
      namespace: gateway-system
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  dependsOn:
    - name: operators-ready
