# This file documents what `flux bootstrap github --path=overlays/3-node` creates.
# Flux's kustomize-controller reconciles this path; the kustomization.yaml above
# is the Kustomize entrypoint. This Kustomization CRD is created by `flux bootstrap`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-infrastructure
  namespace: flux-system
spec:
  interval: 10m
  path: ./cluster/overlays/3-node
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    # flux bootstrap names the GitRepository it creates "flux-system" by
    # default -- confirmed against the 1-node overlay's real, committed
    # flux-system/gotk-sync.yaml (flux-generated, "DO NOT EDIT"), which
    # carries this exact name from the same kind of invocation
    # bootstrap-3node.sh uses. This file is documentation, not applied
    # anywhere.
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
