# Apply with: talosctl apply-config --insecure --nodes <node-ip> --file controlplane.yaml
# Generate secrets bundle first: talosctl gen config --with-secrets secrets.yaml homelab https://<vip>:6443
---
machine:
  type: controlplane
  features:
    kubernetesTalosAPIAccess:
      enabled: true
      allowedRoles:
        - os:etcd:backup
      allowedKubernetesNamespaces:
        - talos-backup

  # Pin the node IP to the LAN subnet -- same reason as the 1-node overlay, and
  # the same subnet etcd.advertisedSubnets already uses below.
  #
  # The kubelet otherwise picks a node IP from whatever interfaces exist at
  # start. hostNetwork pods inherit it as POD_IP, and kube-apiserver publishes
  # that address via --advertise-address=$(POD_IP) into the `kubernetes`
  # Endpoints. If it picks an address belonging to an interface that can go
  # away -- a Tailscale subnet router's tailscale0, for instance -- then losing
  # that interface breaks every pod's route to the API server. That took the
  # 1-node cluster down on 2026-08-26.
  #
  # It matters more here, not less: with three nodes each one picks
  # independently, so the failure can affect one node's workloads while the
  # others look fine.
  kubelet:
    nodeIP:
      validSubnets:
        - 192.168.178.0/24

cluster:
  # Workers handle workloads on 3-node; control-plane taint stays active
  allowSchedulingOnControlPlanes: false

  # Cilium is the CNI (installed by the inlineManifest below) and runs with
  # kubeProxyReplacement: true. Without these two stanzas Talos also deploys its
  # own defaults — flannel and kube-proxy — which then conflict with Cilium:
  # kube-proxy programs nftables DNAT for the same Services Cilium handles in
  # eBPF. See the 1-node overlay's copy of this comment for the full rationale
  # (security review 2026-08-14, finding H3).
  #
  # Kept identical across both overlays so the 3-node profile never reintroduces
  # the conflict — it was verified on 1-node, but the defect is profile-agnostic.
  network:
    cni:
      name: none
  proxy:
    disabled: true

  etcd:
    advertisedSubnets:
      - 192.168.178.0/24

  apiServer:
    # There is deliberately no encryptionConfig here.
    #
    # `cluster.apiServer.encryptionConfig` is not a Talos field. Talos rejects
    # the whole document with "unknown keys found during decoding", so a block
    # here never reaches the node AND silently disables `talosctl validate` for
    # this file -- which is how it went unnoticed: the validator that would
    # have caught it was the thing it broke.
    #
    # Secrets encryption at rest is already enabled, by Talos itself, through
    # cluster.secretboxEncryptionSecret in the generated secrets bundle. The
    # apiserver runs with --encryption-provider-config pointing at a config
    # Talos writes. There is nothing to configure here, and a raw Kubernetes
    # EncryptionConfiguration is not the way to configure it if there were.
    auditPolicy:
      apiVersion: audit.k8s.io/v1
      kind: Policy
      rules:
        - level: None
          users:
            - system:kube-proxy
          verbs:
            - watch
          resources:
            - group: ""
              resources:
                - endpoints
                - services
                - services/status
        - level: None
          userGroups:
            - system:authenticated
          nonResourceURLs:
            - /api*
            - /version
            - /healthz
            - /readyz
            - /livez
        - level: None
          resources:
            - group: ""
              resources:
                - events
        - level: Metadata
          resources:
            - group: ""
              resources:
                - secrets
                - configmaps
                - serviceaccounts/token
            - group: authentication.k8s.io
              resources:
                - tokenreviews
            - group: authorization.k8s.io
              resources:
                - subjectaccessreviews
        - level: Metadata
          omitStages:
            - RequestReceived

  # Cilium is bootstrapped inline so the cluster has a CNI before Flux runs.
  # Flux's HelmRelease (05-cilium) manages the full configuration after bootstrap.
  inlineManifests:
    - name: cilium-install
      contents: |
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: cilium-install
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
          - kind: ServiceAccount
            name: cilium-install
            namespace: kube-system
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: cilium-install
          namespace: kube-system
        ---
        # Bootstrap only. Cilium is a Flux HelmRelease in steady state; this Job
        # exists solely for the chicken-and-egg at first boot, where Flux cannot
        # run until something has provided a CNI. `cilium install` creates a real
        # Helm release, which is what lets the HelmRelease adopt it afterwards.
        #
        # Talos re-materialises inlineManifests at bootstrap and at OS/Kubernetes
        # upgrades -- NOT on a plain reboot. On those re-runs `cilium install`
        # correctly fails, because the Helm release already exists. That is
        # bounded rather than prevented: cilium-cli has no install-if-missing
        # mode, and a pre-flight check is impossible in a distroless image with
        # no shell. So backoffLimit stops it at 3 attempts instead of the
        # previous 10, and ttlSecondsAfterFinished removes the Job and its pods
        # afterwards so the failure cannot masquerade as a live incident.
        #
        # backoffLimit is 2 rather than 0 because the genuine bootstrap path does
        # need retries -- the API server is not always ready on the first try.
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: cilium-install
          namespace: kube-system
        spec:
          backoffLimit: 2
          ttlSecondsAfterFinished: 900
          template:
            metadata:
              labels:
                app: cilium-install
            spec:
              restartPolicy: Never
              tolerations:
                - operator: Exists
                  effect: NoSchedule
              serviceAccountName: cilium-install
              hostNetwork: true
              containers:
                - name: cilium-install
                  image: quay.io/cilium/cilium-cli:v0.20.0
                  env:
                    - name: KUBERNETES_SERVICE_HOST
                      valueFrom:
                        fieldRef:
                          apiVersion: v1
                          fieldPath: status.podIP
                    - name: KUBERNETES_SERVICE_PORT
                      value: "6443"
                  # These images are DISTROLESS -- there is no /bin/sh in them.
                  # `command` therefore execs the binary directly; a shell form
                  # here fails the container at StartError before any of it runs,
                  # which is exactly how the previous version broke.
                  command:
                    - cilium
                  args:
                    - install
                    # Pinned to the same chart version as the 05-cilium
                    # HelmRelease. Without it the CLI's own built-in default
                    # decides which Cilium gets installed at bootstrap, so a CLI
                    # bump would silently change the cluster's CNI version.
                    - --version=v1.20.1
                    # Makes the Job's exit code mean "CNI is actually up" rather
                    # than "the helm release was created".
                    - --wait
                    - --set=ipam.mode=kubernetes
                    - --set=kubeProxyReplacement=true
                    - --set=gatewayAPI.enabled=true
                    - --set=hubble.enabled=true
                    - --set=encryption.enabled=true
                    - --set=encryption.type=wireguard
                    - '--set=securityContext.capabilities.ciliumAgent={CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}'
                    - '--set=securityContext.capabilities.cleanCiliumState={NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}'
                    - --set=cgroup.autoMount.enabled=false
                    - --set=cgroup.hostRoot=/sys/fs/cgroup
