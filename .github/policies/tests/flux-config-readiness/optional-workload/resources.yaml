apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: config
  namespace: flux-system
spec:
  dependsOn:
  - name: operators-ready
  healthChecks:
  - apiVersion: cert-manager.io/v1
    kind: ClusterIssuer
    name: letsencrypt-prod
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    name: homelab-wildcard-tls
    namespace: gateway-system
  - apiVersion: apps/v1
    kind: Deployment
    name: optional-app
    namespace: example
