apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-internet-egress-https-only
spec:
  endpointSelector:
    matchExpressions:
      - key: io.kubernetes.pod.namespace
        operator: In
        values: [backup-system, cert-manager, external-dns, flux-system, tailscale, trivy-system, paperless]
  egress:
    - toEntities: [world]
