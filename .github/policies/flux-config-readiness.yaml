apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: flux-config-readiness
spec:
  validationActions: [Deny]
  matchConstraints:
    resourceRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [kustomizations]
  matchConditions:
    - name: platform-config-only
      expression: >-
        object.metadata.namespace == 'flux-system' &&
        object.metadata.name == 'config'
  validations:
    - message: Platform config must depend on operators-ready.
      expression: >-
        has(object.spec.dependsOn) &&
        object.spec.dependsOn.exists(d, d.name == 'operators-ready')
    - message: Platform config must not wait for every optional application.
      expression: "!has(object.spec.wait) || object.spec.wait == false"
    - message: Platform config must check the shared issuer, certificate, and Gateway.
      expression: >-
        has(object.spec.healthChecks) &&
        object.spec.healthChecks.exists(h,
          h.apiVersion == 'cert-manager.io/v1' &&
          h.kind == 'ClusterIssuer' && h.name == 'letsencrypt-prod') &&
        object.spec.healthChecks.exists(h,
          h.apiVersion == 'cert-manager.io/v1' &&
          h.kind == 'Certificate' && h.name == 'homelab-wildcard-tls' &&
          h.namespace == 'gateway-system') &&
        object.spec.healthChecks.exists(h,
          h.apiVersion == 'gateway.networking.k8s.io/v1' &&
          h.kind == 'Gateway' && h.name == 'homelab-gateway' &&
          h.namespace == 'gateway-system')
    - message: Optional workloads must not gate shared platform config.
      expression: >-
        !has(object.spec.healthChecks) ||
        object.spec.healthChecks.all(h,
          !(h.kind in ['Deployment', 'StatefulSet', 'DaemonSet']))
