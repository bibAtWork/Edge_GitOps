name: Secret Scanning

on:
  pull_request:
    branches: [ops/talos_linux, main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION=$(curl -sL https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | jq -r '.tag_name')
          curl -sL "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          echo "gitleaks $(gitleaks version)"

      - name: Scan PR commits for secrets
        run: |
          gitleaks detect \
            --source . \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1
