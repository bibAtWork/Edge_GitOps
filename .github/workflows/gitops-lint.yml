name: GitOps Lint

on:
  pull_request:
    branches: [ops/talos_linux]
  # No `paths:` filter, deliberately.
  #
  # These jobs validate whole repo state -- they build the overlays and check
  # the result -- so they behave identically no matter which files a PR
  # touches, and cost under ten seconds.
  #
  # Filtering them on cluster/**/*.yaml made them unusable as required status
  # checks. A required check whose workflow never triggers is not treated as
  # skipped: the PR sits on "Expected -- waiting for status to be reported"
  # for ever. Every docs, README, renovate.json or .gitignore PR would have
  # deadlocked, which is most of what lands here between cluster changes.

permissions:
  contents: read

# Each check is a script under scripts/ (the ones in scripts/ci/ have unit tests
# in scripts/ci/tests, run by the last job here). They used to be shell and
# Python embedded in this file, which nothing could test or run locally, and
# which is where every defect in these guardrails so far turned out to be. The
# reasoning behind each rule lives in that script's docstring and comments, next
# to the code it explains.
#
# The job ids and names below are the required status checks' names. Renaming
# one leaves the ruleset waiting on a check that never reports.
jobs:
  sops-enforcement:
    name: SOPS encryption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify all Secrets with data are SOPS-encrypted
        run: python3 scripts/ci/sops_enforcement.py

  no-latest-tags:
    name: No :latest image tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject :latest image tags in rendered overlays
        run: python3 scripts/ci/no_latest_tags.py

  unreplaced-sentinels:
    name: No unreplaced sentinels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Reject sentinels surviving a render
        run: python3 scripts/ci/unreplaced_sentinels.py

  flux-references:
    name: Flux reference integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify HelmRelease sourceRef and dependsOn references resolve
        run: python3 scripts/ci/flux_references.py

  recovery-policy-cronworkflows:
    name: Recovery policy / CronWorkflow consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify every policy application has a recovery-point CronWorkflow, and vice versa
        run: python3 scripts/ci/recovery_policy_cronworkflows.py

  overlay-component-parity:
    name: 1-node / 3-node component parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify both profiles reference the same base/infrastructure components
        run: python3 scripts/ci/overlay_component_parity.py

  platform-contracts:
    name: Platform extension contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify RBAC, Flux dependencies, telemetry and application template
        run: python3 scripts/check-platform-contracts.py

  secret-bootstrap-coverage:
    name: SOPS bootstrap coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify every encrypted Secret has a generator
        run: python3 scripts/check-secret-bootstrap.py

  recovery-policy-drills:
    name: Recovery policy / restore drill consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify restore drill coverage and maximum schedule intervals
        run: python3 scripts/check-recovery-drills.py

  recovery-volume-coverage:
    name: Recovery policy / Longhorn PVC coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require a recovery decision for every declared Longhorn PVC
        run: python3 scripts/check-recovery-volume-coverage.py

  retention-record-deletion:
    name: Retention record deletion
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify absent records are harmless and real deletion errors fail
        run: python3 scripts/test-retention-record-deletion.py

  # The checks above are only as good as their logic, and that logic is now code
  # with tests: each case is a failure a check exists to catch, or the false
  # pass that once let it do nothing.
  ci-script-tests:
    name: CI script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the unit tests for scripts/ci
        run: python3 -m unittest discover -s scripts/ci/tests -v
