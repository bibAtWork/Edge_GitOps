name: GitOps Lint

on:
  pull_request:
    branches: [ops/talos_linux]
  # No `paths:` filter, deliberately.
  #
  # These jobs validate whole repo state -- they build the overlays and check
  # the result -- so they behave identically no matter which files a PR
  # touches, and cost under ten seconds.
  #
  # Filtering them on cluster/**/*.yaml made them unusable as required status
  # checks. A required check whose workflow never triggers is not treated as
  # skipped: the PR sits on "Expected -- waiting for status to be reported"
  # for ever. Every docs, README, renovate.json or .gitignore PR would have
  # deadlocked, which is most of what lands here between cluster changes.

permissions:
  contents: read

jobs:
  # ── Job 1: every Secret with data must be SOPS-encrypted ─────────────────────
  sops-enforcement:
    name: SOPS encryption
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify all Secrets with data are SOPS-encrypted
        run: |
          python3 - <<'PY'
          import sys, pathlib, yaml

          SKIP_ANNOTATION = 'gitops.homelab/sops-skip'
          errors = []
          for path in sorted(pathlib.Path('cluster').rglob('*.yaml')):
              try:
                  content = path.read_text(encoding='utf-8')
              except Exception:
                  continue
              try:
                  for doc in yaml.safe_load_all(content):
                      if not doc or doc.get('kind') != 'Secret':
                          continue
                      annotations = (doc.get('metadata') or {}).get('annotations') or {}
                      if annotations.get(SKIP_ANNOTATION) == 'true':
                          continue
                      has_data = bool(doc.get('data') or doc.get('stringData'))
                      encrypted = 'sops' in doc
                      if has_data and not encrypted:
                          errors.append(str(path))
              except yaml.YAMLError:
                  # SOPS-encrypted files may not parse cleanly — skip them
                  pass

          if errors:
              print('The following Secrets have data but are not SOPS-encrypted:')
              for e in errors:
                  print(f'  {e}')
              print()
              print('Encrypt with: sops --encrypt --in-place <file>')
              sys.exit(1)
          else:
              print('All Secrets are SOPS-encrypted.')
          PY

  # ── Job 2: no :latest image tags in either rendered overlay ──────────────────
  no-latest-tags:
    name: No :latest image tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Reject :latest image tags in rendered overlays
        run: |
          FAIL=0
          for overlay in 1-node 3-node; do
            # The `-?` is load-bearing. Container specs render as list items
            # (`      - image: foo:latest`), and the previous pattern required
            # whitespace immediately before `image:`, so the leading dash broke
            # every match. This gate passed on everything for as long as it has
            # existed, including on the one image in this repo that did use
            # :latest -- which is exactly what it was written to catch.
            # Render to a file first. Piping straight into grep hides the build's
            # own exit status behind `|| true`, so a failed render reads as "no
            # violations found" and the gate passes on nothing at all.
            rendered=$(mktemp)
            if ! kubectl kustomize "cluster/overlays/${overlay}" > "$rendered"; then
              echo "ERROR: kubectl kustomize failed for ${overlay}"
              FAIL=1; rm -f "$rendered"; continue
            fi
            if [ ! -s "$rendered" ]; then
              echo "ERROR: ${overlay} rendered empty"
              FAIL=1; rm -f "$rendered"; continue
            fi
            hits=$(grep -E '^\s*-?\s*image:\s+\S+:latest(\s|$)' "$rendered" || true)

            # An image with NO tag is :latest too, and says so nowhere -- the
            # check above cannot see it. local-path-provisioner's helper pod
            # carried a bare `busybox` for the life of this repo, inside a
            # ConfigMap, so neither this gate nor schema validation touched it.
            # A digest pin is fine; a bare repository name is not.
            untagged=$(grep -E '^[[:space:]]*-?[[:space:]]*image:' "$rendered" | sed -E 's/^.*image:[[:space:]]*"?([^"[:space:]]+)"?.*$/\1/' | grep -v '@sha256:' | awk -F/ '$NF !~ /:/' || true)
            rm -f "$rendered"
            if [ -n "$untagged" ]; then
              echo "ERROR: untagged images in ${overlay} overlay (resolve to :latest at pull time):"
              echo "$untagged"
              FAIL=1
            fi
            if [ -n "$hits" ]; then
              echo "ERROR: :latest tags found in ${overlay} overlay (bypasses Trivy gate and Renovate tracking):"
              echo "$hits"
              FAIL=1
            fi
          done

          # The loop above only sees what Kustomize renders. Talos machine
          # configs are not in any kustomization -- they are applied by hand via
          # talosctl -- so an image pinned in an inlineManifest is invisible to
          # it. That blind spot is not hypothetical: the CNI bootstrap Job sat
          # on cilium-cli-ci:latest until that tag went distroless and broke a
          # fresh bootstrap outright, and this gate passed on every run in
          # between. Grep the files directly, since there is nothing to render.
          mc_hits=$(grep -rnE 'image:[[:space:]]*[^[:space:]]+:latest([[:space:]]|$)' cluster/overlays/*/talos-machineconfigs/*.yaml || true)
          if [ -n "$mc_hits" ]; then
            echo "ERROR: :latest tags found in Talos machine configs (applied out-of-band, so nothing else tracks them):"
            echo "$mc_hits"
            FAIL=1
          fi

          [ "$FAIL" -eq 0 ] && echo "No :latest tags found."
          exit $FAIL

  unreplaced-sentinels:
    name: No unreplaced sentinels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The version pins in the SUC Plans and the fleet-health CronJob are
      # Kustomize `replacements` targets sourced from versions.env. Their
      # literals in git are the sentinel REPLACED-BY-KUSTOMIZE, never a
      # version.
      #
      # They used to be real versions, on the reasoning that a build should
      # still "produce something sane" if a replacement were dropped. That is
      # backwards: it produced a Plan pinned to a stale but perfectly
      # installable version, with nothing reporting anything -- the Plans said
      # v1.13.9 and one said v1.32.3 while the cluster ran v1.13.0/v1.36.0, and
      # Renovate read those literals as if they were real pins.
      #
      # A sentinel cannot be pulled, so a dropped replacement fails. This makes
      # it fail HERE, before merge, rather than at image-pull time on a node
      # that has already been cordoned.
      - name: Reject sentinels surviving a render
        run: |
          FAIL=0
          # 1-node-config, NOT 1-node. The Plans and the gate CronJobs are
          # CRD-dependent and live in the config overlay; 1-node pulls in only
          # the SUC operator. Checking 1-node would render nothing containing a
          # sentinel and pass unconditionally -- which is exactly what the
          # first draft of this job did.
          #
          # LoadRestrictionsNone because 1-node-config references a file
          # outside its own directory (19-kyverno/policies), which plain
          # kubectl kustomize refuses.
          for overlay in 1-node-config 3-node; do
            rendered=$(mktemp)
            if ! kubectl kustomize --load-restrictor LoadRestrictionsNone "cluster/overlays/${overlay}" > "$rendered"; then
              echo "ERROR: kubectl kustomize failed for ${overlay}"
              FAIL=1; rm -f "$rendered"; continue
            fi
            if [ ! -s "$rendered" ]; then
              echo "ERROR: ${overlay} rendered empty"
              FAIL=1; rm -f "$rendered"; continue
            fi
            hits=$(grep -n 'REPLACED-BY-KUSTOMIZE' "$rendered" || true)
            rm -f "$rendered"
            if [ -n "$hits" ]; then
              echo "ERROR: sentinel survived the ${overlay} render -- a replacements target is missing or mis-pathed:"
              echo "$hits"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] && echo "No unreplaced sentinels."
          exit $FAIL

  # ── Job 3: HelmRelease sourceRef and dependsOn references must resolve ───────
  flux-references:
    name: Flux reference integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify HelmRelease sourceRef and dependsOn references resolve
        run: |
          python3 - <<'PY'
          import subprocess, sys, yaml

          errors = []

          for overlay in ('1-node', '3-node'):
              result = subprocess.run(
                  ['kubectl', 'kustomize', f'cluster/overlays/{overlay}'],
                  capture_output=True, text=True,
              )
              if result.returncode != 0:
                  errors.append(f'[{overlay}] kubectl kustomize failed:\n{result.stderr.strip()}')
                  continue

              docs = [d for d in yaml.safe_load_all(result.stdout) if d]

              helm_repos = {
                  d['metadata']['name']
                  for d in docs if d.get('kind') == 'HelmRepository'
              }
              helm_releases = {
                  d['metadata']['name']
                  for d in docs if d.get('kind') == 'HelmRelease'
              }

              for doc in docs:
                  if doc.get('kind') != 'HelmRelease':
                      continue
                  name = doc['metadata']['name']

                  # sourceRef — the chart source must exist in the same overlay
                  source = (
                      doc.get('spec', {})
                         .get('chart', {})
                         .get('spec', {})
                         .get('sourceRef', {})
                  )
                  if source.get('kind') == 'HelmRepository':
                      ref = source.get('name', '')
                      if ref not in helm_repos:
                          errors.append(
                              f'[{overlay}] HelmRelease/{name}: sourceRef '
                              f'HelmRepository/{ref} not found in overlay'
                          )

                  # dependsOn — every named dependency must exist
                  for dep in doc.get('spec', {}).get('dependsOn', []):
                      dep_name = dep.get('name', '')
                      if dep_name and dep_name not in helm_releases:
                          errors.append(
                              f'[{overlay}] HelmRelease/{name}: dependsOn '
                              f'HelmRelease/{dep_name} not found in overlay'
                          )

          if errors:
              print(f'{len(errors)} reference error(s) found:\n')
              for e in errors:
                  print(f'  ERROR: {e}')
              sys.exit(1)
          else:
              print('All HelmRelease references resolve correctly.')
          PY
