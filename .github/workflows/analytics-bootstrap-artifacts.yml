name: Analytics bootstrap artifacts
on:
  pull_request:
    branches: [ops/talos_linux]
    paths: [.github/workflows/analytics-bootstrap-artifacts.yml]
permissions:
  contents: read
jobs:
  templates-and-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install template tooling
        run: |
          pip install uv==0.9.2 PyYAML==6.0.3
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64 -o /usr/local/bin/sops
          chmod +x /usr/local/bin/sops
      - name: Produce encrypted inactive templates and pinned dependency locks
        run: python scripts/ci/analytics_bootstrap_artifacts.py
      - uses: actions/upload-artifact@v6
        with:
          name: analytics-bootstrap-artifacts
          path: /tmp/analytics-bootstrap-artifacts
          retention-days: 1
