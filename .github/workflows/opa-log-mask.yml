name: OPA decision-log mask

on:
  pull_request:
    branches: [ops/talos_linux]

permissions:
  contents: read

jobs:
  synthetic-credentials:
    name: Synthetic credential masking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OPA and PyYAML
        run: |
          curl -fsSL -o /tmp/opa https://openpolicyagent.org/downloads/v1.21.0/opa_linux_amd64_static
          sudo install -m 0755 /tmp/opa /usr/local/bin/opa
          pip install --quiet pyyaml==6.0.3
      - name: Evaluate the deployed ConfigMap policy against synthetic headers
        run: python3 scripts/ci/check_opa_log_mask.py
