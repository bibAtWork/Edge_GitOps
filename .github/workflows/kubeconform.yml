name: Kubeconform

on:
  pull_request:
    branches: [ops/talos_linux]
  # No `paths:` filter, deliberately.
  #
  # These jobs validate whole repo state -- they build the overlays and check
  # the result -- so they behave identically no matter which files a PR
  # touches, and cost under ten seconds.
  #
  # Filtering them on cluster/**/*.yaml made them unusable as required status
  # checks. A required check whose workflow never triggers is not treated as
  # skipped: the PR sits on "Expected -- waiting for status to be reported"
  # for ever. Every docs, README, renovate.json or .gitignore PR would have
  # deadlocked, which is most of what lands here between cluster changes.

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The two -config overlays validate standalone: kubeconform checks
        # resource shape against its own schema catalog (default + generated
        # Argo schemas + datreeio for the remaining third-party CRDs),
        # not against CRDs actually present in the same build, so the
        # base overlay's operators don't need to be in this same pass.
        overlay: [1-node, 3-node, 1-node-config, 3-node-config]

    steps:
      - uses: actions/checkout@v7

      # Pinned 2026-08-17: this used to resolve "latest" via an unauthenticated
      # `curl api.github.com` call on every run. That endpoint's anonymous rate
      # limit (60/hr per source IP, shared across the whole GitHub Actions
      # runner pool) made this fail intermittently and unrelated to any PR's
      # actual content -- confirmed by identical "not in gzip format" failures
      # (a rate-limit error body downloaded instead of the real release
      # tarball) on unrelated PRs. Bump these pins by hand when there's a
      # reason to.
      # renovate: datasource=github-releases depName=yannh/kubeconform
      - name: Install kubeconform
        run: |
          VERSION=v0.8.0
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          echo "kubeconform $(kubeconform -v)"

      - name: Generate schemas for the pinned Argo Workflows release
        shell: bash
        run: |
          set -euo pipefail
          chart_file=cluster/base/infrastructure/37-backup-system/argo-workflows.yaml
          chart_version="$(yq -r 'select(.kind == "HelmRelease" and .metadata.name == "argo-workflows") | .spec.chart.spec.version' "$chart_file")"
          test -n "$chart_version"
          test "$chart_version" != "null"

          # The chart's full-CRD installer defaults to Chart.appVersion, so
          # resolving it from the exact chart pin gives CI the same CRDs that
          # Helm installs in the cluster.  Argo v4 release manifests contain
          # the full OpenAPI schemas used by that installer image.
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo
          app_version="$(helm show chart argo/argo-workflows --version "$chart_version" | yq -r '.appVersion')"
          test -n "$app_version"
          test "$app_version" != "null"
          echo "Argo Workflows chart $chart_version uses application $app_version"

          crd_manifest="$RUNNER_TEMP/argo-workflows-$app_version-install.yaml"
          curl --fail --show-error --silent --location --retry 3 \
            "https://github.com/argoproj/argo-workflows/releases/download/$app_version/install.yaml" \
            --output "$crd_manifest"
          schema_dir="$RUNNER_TEMP/crd-schemas"
          yq eval-all -o=json -I=0 '[.]' "$crd_manifest" \
            | python scripts/generate-crd-schemas.py \
                --group argoproj.io \
                --output "$schema_dir"
          echo "CRD_SCHEMA_DIR=$schema_dir" >> "$GITHUB_ENV"

      - name: Test CRD schema generator
        run: python scripts/test-generate-crd-schemas.py

      - name: Build and validate ${{ matrix.overlay }} overlay
        run: |
          # pipefail so a failed render fails the step. Without it the pipeline's
          # status is kubeconform's alone, and kubeconform given an empty stream
          # exits 0 -- the job would go green having validated nothing.
          set -o pipefail
          # Build the full rendered manifest, then strip SOPS-encrypted documents
          # before feeding to kubeconform — SOPS adds a root-level `sops:` key
          # that would trigger strict-mode failures on every secret.
          # LoadRestrictionsNone: the 1-node-config overlay's 19-kyverno/config
          # reads its policies from outside its own component directory. Flux
          # renders that fine, but plain kubectl kustomize refuses it.
          kubectl kustomize --load-restrictor LoadRestrictionsNone cluster/overlays/${{ matrix.overlay }} \
            | yq 'select(.sops == null)' \
            | kubeconform \
                -schema-location default \
                -schema-location "$CRD_SCHEMA_DIR/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -ignore-missing-schemas \
                -strict \
                -summary \
                -output pretty \
                -
