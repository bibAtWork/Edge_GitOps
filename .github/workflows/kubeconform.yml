name: Kubeconform

on:
  pull_request:
    branches: [ops/talos_linux]
    paths:
      - 'cluster/**/*.yaml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay: [1-node, 3-node]

    steps:
      - uses: actions/checkout@v7

      # Pinned 2026-08-17: this used to resolve "latest" via an unauthenticated
      # `curl api.github.com` call on every run. That endpoint's anonymous rate
      # limit (60/hr per source IP, shared across the whole GitHub Actions
      # runner pool) made this fail intermittently and unrelated to any PR's
      # actual content -- confirmed by identical "not in gzip format" failures
      # (a rate-limit error body downloaded instead of the real release
      # tarball) on unrelated PRs. Bump these pins by hand when there's a
      # reason to.
      - name: Install kubeconform
        run: |
          VERSION=v0.8.0
          curl -sL "https://github.com/yannh/kubeconform/releases/download/${VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform
          echo "kubeconform $(kubeconform -v)"

      - name: Install kustomize
        run: |
          VERSION=v5.8.1
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${VERSION}/kustomize_${VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kustomize
          echo "kustomize $(kustomize version)"

      - name: Build and validate ${{ matrix.overlay }} overlay
        run: |
          # Build the full rendered manifest, then strip SOPS-encrypted documents
          # before feeding to kubeconform — SOPS adds a root-level `sops:` key
          # that would trigger strict-mode failures on every secret.
          kustomize build cluster/overlays/${{ matrix.overlay }} \
            | yq 'select(.sops == null)' \
            | kubeconform \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -ignore-missing-schemas \
                -strict \
                -summary \
                -output pretty \
                -
