name: Talos image

# Proves that the Talos installer image a PR points at actually exists, that
# the schematic ID pinned in the repo still matches schematic.yaml, that a
# Kubernetes version bump names a real release, and that a version DECREASE
# (a revert, or a hand-edited downgrade) gets the same review scrutiny a
# forward bump does rather than applying unconditionally.
#
# ── Deliberately NOT a required status check ─────────────────────────────────
# The "Protect ops/talos_linux" ruleset requires six checks before a merge.
# This one is not among them, and that is a decision rather than an oversight.
#
# The image/schematic/kubernetes-release steps below make live calls to
# factory.talos.dev and api.github.com. Requiring this check would put those
# third parties on the critical path of every merge to this repo: an outage,
# or a slow response, would block PRs that have nothing to do with Talos. The
# value of the check is real but narrow -- it applies only when a PR touches
# Talos/Kubernetes pins -- and that is not worth coupling the whole
# repository's ability to merge to somebody else's uptime.
#
# The `paths:` filter below is the other half of the same decision. It keeps
# this off unrelated PRs, and it is also what makes the check unrequirable:
# GitHub does not treat a required check whose workflow never triggered as
# skipped -- the PR waits on a status that never arrives. Removing the filter
# to make it requirable would reintroduce exactly the coupling above.
#
# So: it runs on the PRs where it matters, it goes red when it finds something,
# and a human decides. If that ever feels too weak, the fix is to make the
# live-call steps tolerant of failure -- distinguishing "the image is missing"
# from "the Factory/GitHub did not answer" -- not to require it as it stands.
#
# ── Why the image-existence check exists ─────────────────────────────────────
# The Image Factory builds an image per (schematic, version) pair, and system
# extensions are published per Talos version. So a version bump can reference an
# image that has not been built:
#
#   v1.13.9  ->  iscsi-tools + util-linux-tools present
#   v1.14.0  ->  "version 1.14.0 is not available"
#
# Renovate will happily bump the tag either way. Without this check the failure
# surfaces at upgrade time instead: the SUC Job pulls a 404, the upgrade never
# runs, and the node is left cordoned in the middle of a plan. That is a bad
# place to discover a typo.
#
# ── Why the schematic check exists ───────────────────────────────────────────
# The schematic ID is a content hash of the extension list, not a version-linked
# value -- the same ID serves v1.12.0 through v1.13.9. It therefore does NOT
# need regenerating when the Talos version moves. It DOES need regenerating
# whenever schematic.yaml changes: an extension added to schematic.yaml while
# the old ID stayed pinned would build and deploy the old extension set,
# silently, with the file saying otherwise. Re-POSTing schematic.yaml is the
# whole check -- the Factory is a pure function of the content, so if the
# returned ID differs from what the repo pins, the repo is stale.
#
# ── Why there is no Talos/Kubernetes compatibility check ─────────────────────
# There is no stable, scriptable API for "is Kubernetes vX supported by Talos
# vY" beyond the two version-existence checks below. `talosctl upgrade-k8s`
# validates that pairing itself at upgrade time and refuses an unsupported
# one -- that is the actual safety net for compatibility, not this workflow.

on:
  pull_request:
    branches: [ops/talos_linux]
    paths:
      - 'cluster/overlays/*/talos-machineconfigs/**'
      - 'cluster/base/infrastructure/15-system-upgrade-controller/**'
      - '.github/workflows/talos-image-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Talos version pin agrees with the machine config
        run: |
          set -euo pipefail
          # Down from nine independently-edited places to two: versions.env is
          # now the single source of truth, and Kustomize `replacements`
          # (config/kustomization.yaml) projects it into every SUC Plan at
          # build time -- so the Plans' own literals are placeholders, not
          # pins, and checking them here would produce a false positive on
          # every ordinary version bump that doesn't also hand-edit them.
          #
          # The one pin Kustomize cannot reach is the machine config's
          # install.image, applied by hand via talosctl outside Flux entirely
          # -- that still has to agree by hand, which is what this checks.
          #
          # Matched structurally, on the specific keys, never by grepping for
          # a version pattern. versions.env's own comments mention several
          # versions in prose, and a blanket grep would report those as pins.
          {
            grep -hoP '^TALOS_VERSION=\Kv[0-9]+\.[0-9]+\.[0-9]+' \
              cluster/base/infrastructure/15-system-upgrade-controller/config/versions.env
            grep -rhoP 'image:\s*factory\.talos\.dev/installer/[0-9a-f]{64}:\Kv[0-9]+\.[0-9]+\.[0-9]+' \
              cluster/overlays/*/talos-machineconfigs/ || true
          } > /tmp/versions.txt

          echo "Pins found: $(wc -l < /tmp/versions.txt)"
          sort /tmp/versions.txt | uniq -c | sed 's/^/  /'

          distinct=$(sort -u /tmp/versions.txt | wc -l)
          if [ "$distinct" -ne 1 ]; then
            echo "::error::Talos version pins disagree ($distinct distinct values). versions.env's TALOS_VERSION and every machine config's install.image must name the same version. A mismatch means a rebuilt node installs something other than the automated upgrade targets."
            exit 1
          fi
          echo "All pins agree on $(head -1 /tmp/versions.txt)"

      - name: Verify schematic ID matches schematic.yaml
        run: |
          set -euo pipefail
          fail=0
          for sch in cluster/overlays/*/talos-machineconfigs/schematic.yaml; do
            [ -e "$sch" ] || continue
            echo "::group::$sch"
            expected=$(curl -sf -X POST --data-binary "@$sch" \
              https://factory.talos.dev/schematics \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
            echo "Factory returns: $expected"

            # Every schematic ID pinned anywhere in the repo must equal it.
            # versions.env and each machine config's install.image are edited
            # by hand and drift independently -- the Plans no longer carry a
            # literal ID at all, they read it live from the talos-versions
            # ConfigMap, so there is nothing of theirs left to check here.
            found=$(grep -rhoE '[0-9a-f]{64}' \
              cluster/overlays/*/talos-machineconfigs/ \
              cluster/base/infrastructure/15-system-upgrade-controller/config/versions.env \
              | sort -u)
            for id in $found; do
              if [ "$id" = "$expected" ]; then
                echo "  ok      $id"
              else
                echo "::error::Stale schematic ID $id pinned in the repo; schematic.yaml now hashes to $expected. Regenerate it everywhere: curl -X POST --data-binary @$sch https://factory.talos.dev/schematics"
                fail=1
              fi
            done
            echo "::endgroup::"
          done
          exit $fail

      - name: Verify every referenced installer image exists
        run: |
          set -euo pipefail
          # Collect every (schematic, version) pair the repo would actually
          # pull. The SUC Plans build the tag from spec.version at runtime via
          # SYSTEM_UPGRADE_PLAN_LATEST_VERSION and SCHEMATIC_ID from the
          # talos-versions ConfigMap -- both trace back to versions.env, which
          # is checked directly below rather than re-derived from the Plans.
          {
            grep -rhoE 'factory\.talos\.dev/installer/[0-9a-f]{64}:v[0-9]+\.[0-9]+\.[0-9]+' \
              cluster/ | sed 's|.*/installer/||'

            v=$(grep -oP '^TALOS_VERSION=\K.*' cluster/base/infrastructure/15-system-upgrade-controller/config/versions.env)
            s=$(grep -oP '^SCHEMATIC_ID=\K.*' cluster/base/infrastructure/15-system-upgrade-controller/config/versions.env)
            [ -n "$v" ] && [ -n "$s" ] && echo "$s:$v"
          } | sort -u > /tmp/pairs.txt

          echo "Image references to verify:"; sed 's/^/  /' /tmp/pairs.txt

          fail=0
          while read -r pair; do
            [ -n "$pair" ] || continue
            sid=${pair%%:*}; ver=${pair##*:}
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              "https://factory.talos.dev/v2/installer/$sid/manifests/$ver")
            if [ "$code" = "200" ]; then
              echo "  ok    $ver  (${sid:0:12}...)"
            else
              echo "::error::factory.talos.dev has no installer for $ver with schematic ${sid:0:12}... (HTTP $code). Either the version is not released yet, or a system extension in the schematic has not been published for it. The upgrade Job would pull a 404 and leave the node cordoned."
              fail=1
            fi
          done < /tmp/pairs.txt
          exit $fail

      - name: Verify the Kubernetes version pin is a real release
        run: |
          set -euo pipefail
          # kubernetes/kubernetes tags every release vX.Y.Z. A single ref
          # lookup (not the releases list) sits comfortably inside GitHub's
          # unauthenticated rate limit even if this runs on every PR.
          v=$(grep -oP '^KUBERNETES_VERSION=\K.*' cluster/base/infrastructure/15-system-upgrade-controller/config/versions.env)
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/kubernetes/kubernetes/git/refs/tags/$v")
          if [ "$code" = "200" ]; then
            echo "  ok    kubernetes/kubernetes@$v exists"
          else
            echo "::error::kubernetes/kubernetes has no tag $v (HTTP $code). KUBERNETES_VERSION in versions.env does not name a real release -- talosctl upgrade-k8s would fail against it."
            exit 1
          fi

  guard-downgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require confirmed-downgrade label on a version decrease
        env:
          # pull_request.labels is part of the trigger payload -- no API call,
          # no extra permission beyond the default read this job already has.
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          # git-revert-triggered rollback (see versions.env) means reverting a
          # version bump takes the exact same reviewed path forward bumps do.
          # But Talos does not uniformly support downgrading across arbitrary
          # version pairs, and a Kubernetes apiserver can refuse to serve
          # objects a newer version already wrote in a newer schema -- so a
          # decrease is not unconditionally safe the way a revert's mechanics
          # imply, and gets flagged here rather than applying silently.
          VF=cluster/base/infrastructure/15-system-upgrade-controller/config/versions.env
          base_ref="origin/${{ github.event.pull_request.base.ref }}"

          ver() { grep -oP "^$1=\K.*" "$2" 2>/dev/null || echo ""; }
          semver() { echo "$1" | grep -oP '[0-9]+' | paste -sd. -; }

          is_downgrade() {
            local key=$1
            local old new
            old=$(ver "$key" <(git show "$base_ref:$VF" 2>/dev/null || true))
            new=$(ver "$key" "$VF")
            [ -n "$old" ] && [ -n "$new" ] || return 1
            [ "$old" = "$new" ] && return 1
            # Compare numerically via sort -V; a "decrease" is new < old.
            [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -1)" = "$old" ]
          }

          downgraded=""
          for key in TALOS_VERSION KUBERNETES_VERSION; do
            if is_downgrade "$key"; then
              downgraded="$downgraded $key"
            fi
          done

          if [ -z "$downgraded" ]; then
            echo "No version decrease in this PR."
            exit 0
          fi

          echo "Version decrease detected in:$downgraded"
          if echo "$PR_LABELS" | grep -q '"confirmed-downgrade"'; then
            echo "confirmed-downgrade label present -- proceeding."
            exit 0
          fi

          echo "::error::This PR decreases$downgraded in versions.env. Talos and Kubernetes do not uniformly support downgrading across arbitrary version pairs, so this needs the same explicit review a forward bump gets. Add the 'confirmed-downgrade' label once that review has happened."
          exit 1
