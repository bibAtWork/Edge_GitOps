name: Trivy CVE gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Found 2026-08-16: this workflow ran 5 times for the identical commit on a
# single Renovate PR (confirmed via check-runs timestamps, all within ~2
# seconds), each posting its own duplicate PR comment. Renovate's own
# automation adds labels (renovate, minor-update/major-update, sometimes
# security) via separate API calls rather than atomically at PR creation, and
# `labeled` fires once per label — so one PR open can trigger this workflow
# several times over, all evaluating the identical commit to the identical
# conclusion. Narrowing `types:` risks the opposite failure (never firing with
# the right label present, if Renovate's labeling order differs from
# assumed), so the first fix left trigger semantics alone and cancelled all but
# the most recent run for a given PR.
#
# That stopped the duplicate comments and the ambiguity about which result the
# merge decision honours. It did not stop the waste: measured 2026-08-25 across
# three Renovate PRs, the pattern is still 5 runs — 4 cancelled, 1 successful —
# and a cancelled run has already claimed a runner and begun checking out.
#
# So the run itself is now skipped when a `labeled` event carries a label this
# gate does not care about. A job skipped by `if:` allocates no runner at all,
# where a cancelled one has already paid for itself.
#
# This does NOT reintroduce the ordering risk. The guard tests which label was
# just added, never the order they arrive in: whenever `minor-update` or
# `security` lands, that specific event runs the gate, and the `opened` event
# still covers the case where Renovate applies labels atomically.
#
# The concurrency group is split for a reason that is easy to miss. Concurrency
# is evaluated per workflow run, before any job `if:` — so without the split, an
# irrelevant `labeled` event arriving after a real one would enter the same
# group, cancel the running gate, then skip its own job, and the gate would
# never report at all. Skipped runs are therefore parked in a group of their own
# where they can cancel nothing.
concurrency:
  group: >-
    trivy-gate-${{ github.event.pull_request.number }}-${{
      (github.event.action == 'labeled' &&
       !contains(fromJSON('["minor-update","security"]'), github.event.label.name))
      && 'ignored' || 'active' }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  trivy-gate:
    # Only run on Renovate PRs that touch minor/patch or security
    # (vulnerability-alert) updates.
    #
    # The middle clause is the deduplication: on a `labeled` event, proceed only
    # if the label just added is one this gate acts on. Every other trigger type
    # passes it untouched, so `opened` and `synchronize` behave exactly as
    # before. The final clause is unchanged and still decides eligibility from
    # the PR's full label set, not from whichever label happened to arrive.
    if: |
      github.actor == 'renovate[bot]' &&
      (github.event.action != 'labeled' ||
       contains(fromJSON('["minor-update","security"]'), github.event.label.name)) &&
      (contains(github.event.pull_request.labels.*.name, 'minor-update') ||
       contains(github.event.pull_request.labels.*.name, 'security'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Pinned release tarball rather than `install.sh | sh` off the `main`
      # branch. That form fetched an unversioned script from a moving branch and
      # piped it straight into a shell: unpinned remote code execution in CI, and
      # unreproducible besides -- two runs a week apart could install different
      # Trivy versions with nothing in the diff to show for it.
      # renovate: datasource=github-releases depName=aquasecurity/trivy
      - name: Install Trivy
        run: |
          VERSION=v0.74.0
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/${VERSION}/trivy_${VERSION#v}_Linux-64bit.tar.gz" \
            | tar -xz -C /usr/local/bin trivy
          trivy --version

      # Pinned, not resolved via unauthenticated api.github.com "latest". That
      # endpoint's anonymous rate limit is shared across the whole Actions runner
      # pool and fails intermittently regardless of anything in this repo. The
      # sibling workflow trivy-auto-patch.yml was fixed for this in 2026-08; this
      # one was missed.
      # renovate: datasource=github-releases depName=google/go-containerregistry
      - name: Install crane (registry tag lister)
        run: |
          VERSION=v0.21.9
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /usr/local/bin crane

      # Chart rendering is what makes case (c) reachable: a chart that changes
      # its own default registry or repository between versions moves the
      # running image without changing a single line in this repository, so no
      # diff-based check can see it. Rendering both revisions and comparing the
      # resulting image sets can.
      #
      # 3.x rather than 4.x deliberately: Flux's helm-controller renders with
      # Helm 3, and a gate that renders differently from the cluster would be
      # answering a question nobody asked. 3.21.4 also clears the floor for
      # `fromToml`, added in 3.17 -- below that the SeaweedFS chart fails to
      # render at all, which cost a chart of real consequence its coverage.
      # renovate: datasource=github-releases depName=helm/helm
      - name: Install Helm (chart rendering)
        run: |
          VERSION=v3.21.4
          curl -fsSL "https://get.helm.sh/helm-${VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp linux-amd64/helm
          install -m 0755 /tmp/linux-amd64/helm /usr/local/bin/helm
          helm version --short

      - name: Install PyYAML
        run: pip install --quiet "pyyaml==6.0.3"

      # ── Resolve every changed image, then decide ─────────────────────────────
      #
      # This replaces what used to be seven steps of diff-grepping. The old
      # extractor matched `image:` lines only, and every ADR-009 pin is a
      # registry/repository/tag triple in HelmRelease values -- so it matched
      # none of them and classified real image updates as "chart-only", merging
      # them with no CVE scan at all. #520, #523, #530 and #535 all merged that
      # way. It also took `head -1`, scanning one image per PR, which stopped
      # being survivable once charts and their images were grouped into a single
      # proposal.
      #
      # The script resolves the full image set at both revisions from three
      # sources -- what we write, what the chart renders, and what the chart's
      # appVersion says -- and compares those sets. A tag change, a registry
      # change, a repository rename and a chart-side default change then all
      # arrive as the same kind of event. It fails closed: an image it cannot
      # scan, an appVersion it cannot resolve, or a pin it cannot order all
      # block the merge rather than passing quietly.
      - name: Resolve image changes and evaluate
        id: decision
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          mapfile -t LABEL_LIST < <(printf '%s' "$LABELS" | jq -r '.[]')
          ARGS=()
          for l in "${LABEL_LIST[@]}"; do ARGS+=(--label "$l"); done

          python3 scripts/pr-image-gate.py \
            --base "origin/${{ github.base_ref }}" --head HEAD \
            --scan --helm helm --trivy trivy --crane crane \
            "${ARGS[@]}" \
            --json /tmp/image-gate.json \
            --report /tmp/image-gate.md \
            --github-output "$GITHUB_OUTPUT" \
            --quiet

          echo "── verdict ──"
          cat /tmp/image-gate.md

      - name: Post image gate report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/image-gate.md

      # ── Label auto-merges that still land on a HIGH/CRITICAL image ───────────
      # Chosen policy (the still_high flag in pr-image-gate.py): keep
      # auto-merging when 3c passes even if the result is still HIGH/CRITICAL —
      # a clean version may not exist yet — but never let that go silent. The
      # label makes these greppable/dashboard-able after merge instead of
      # disappearing into the ordinary merged-PR list unflagged.
      - name: Label if still HIGH/CRITICAL CVSS
        if: steps.decision.outputs.still_high == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cvss-high --color B60205 \
            --description "Auto-merged by the Trivy CVE gate while still HIGH/CRITICAL — no clean version was available yet" \
            --force
          gh pr edit ${{ github.event.pull_request.number }} --add-label cvss-high

      # ── Auto-merge if the gate raised no blocker ─────────────────────────────
      - name: Auto-merge PR
        if: steps.decision.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --auto, because this gate finishes before the checks the branch
          # ruleset requires. Six checks are required to merge into
          # ops/talos_linux, and this job reaches its merge step in about ten
          # seconds -- often while they are still running. A plain `gh pr merge`
          # does not wait: it asks whether the PR is mergeable right now, gets
          # no, and exits 1. The gate then reports failure having actually PASSED
          # its CVE evaluation, and the PR sits open with every check green and
          # nothing left to merge it.
          #
          # --auto queues the merge instead, and GitHub performs it once the
          # required checks pass. It needs allow_auto_merge on the repository,
          # which was off -- GitHub rejects the flag outright rather than
          # ignoring it -- and is now on.
          # Both orderings have to work, because GitHub refuses each flag in the
          # other's case:
          #
          #   checks still running -> a plain merge exits 1 ("base branch policy
          #                           prohibits the merge"); --auto queues it
          #   checks already green -> --auto exits 1 ("Pull request is in clean
          #                           status"); a plain merge succeeds
          #
          # This gate reaches here in about ten seconds against six required
          # checks, so which case applies is a race decided by runner scheduling.
          # Try to queue first, and merge directly if there is nothing to queue.
          PR=${{ github.event.pull_request.number }}
          SUBJECT="chore(deps): auto-merge minor update (Trivy CVE gate passed)"
          if gh pr merge "$PR" --auto --squash --subject "$SUBJECT" --delete-branch; then
            echo "auto-merge queued (or performed) for #$PR"
          else
            echo "--auto refused; PR is already mergeable, merging directly"
            gh pr merge "$PR" --squash --subject "$SUBJECT" --delete-branch
          fi
