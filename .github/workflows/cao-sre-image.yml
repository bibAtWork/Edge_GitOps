name: CAO SRE image

on:
  push:
    branches: [ops/talos_linux, 'codex/cao-sre-*']
    paths:
      - cluster/base/applications/cao-sre/Dockerfile
      - .github/workflows/cao-sre-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check deterministic incident handling
        run: python3 -B -m unittest discover -s cluster/base/applications/cao-sre/runtime -p 'test_*.py'
      - uses: docker/setup-buildx-action@v4
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cao-sre" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: cluster/base/applications/cao-sre
          file: cluster/base/applications/cao-sre/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
      - name: Show immutable image reference
        shell: bash
        run: echo "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
