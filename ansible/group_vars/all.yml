# Tool versions — update these or override with -e var=value on the CLI.
# Renovate bumps these automatically; the inline comments drive datasource lookup.
talosctl_version:  "1.10.0"   # renovate: datasource=github-releases depName=siderolabs/talos
kubectl_version:   "1.33.1"   # renovate: datasource=github-releases depName=kubernetes/kubernetes
flux_version:      "2.5.1"    # renovate: datasource=github-releases depName=fluxcd/flux2
sops_version:      "3.9.4"    # renovate: datasource=github-releases depName=getsops/sops
age_version:       "1.2.1"    # renovate: datasource=github-releases depName=FiloSottile/age
terraform_version: "1.12.1"   # renovate: datasource=github-releases depName=hashicorp/terraform
helm_version:      "3.17.3"   # renovate: datasource=github-releases depName=helm/helm

# Where to install binaries.
# Override with: -e tools_bin_dir=~/.local/bin (no become required)
tools_bin_dir: /usr/local/bin
tools_become:  true      # set false when installing into a user-owned directory
