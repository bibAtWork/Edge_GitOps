# Drill 4: Paperless' SQLite database, restored from AWS alone, then opened and
# checked: integrity_check plus the policy's restore-checks.
#
# The template this submits is Flux-managed (37-backup-system/workflow-templates/
# drill-sqlite-aws.yaml) -- see drill-files-aws.yaml in this directory for why
# this file has to stay this small (Strict requires workflowTemplateRef).
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: drill-sqlite-aws-
  namespace: backup-system
  labels:
    recovery-scratch: "true"
spec:
  workflowTemplateRef:
    name: drill-sqlite-aws
