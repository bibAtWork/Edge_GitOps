# Drill 1: Immich's photo library, restored from AWS alone.
#
# The template this submits is Flux-managed
# (cluster/base/infrastructure/37-backup-system/deferred/workflow-templates/drill-files-aws.yaml)
# and carries everything else -- entrypoint, volumes, the steps themselves.
# It has to be, and this has to stay this small: controller.workflowRestrictions.
# templateReferencing: Strict (argo-workflows.yaml) requires workflowTemplateRef
# and rejects a Workflow that defines its own templates:, which this file was
# until code review found Strict broke every `kubectl create` of it.
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: drill-files-aws-
  namespace: backup-system
  labels:
    recovery-scratch: "true"
spec:
  workflowTemplateRef:
    name: drill-files-aws
