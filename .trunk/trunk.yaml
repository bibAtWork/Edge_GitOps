# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    - name: no-image-latest
      description: Image tags must be explicit versions, not ':latest'
      files: [yaml]
      commands:
        - name: lint
          run: scripts/check-no-latest.sh ${target}
          output: regex
          parse_regex: (?P<path>.+):(?P<line>\d+):\d+:\s+error:\s+(?P<message>.+)
          error_codes: [1]
          success_codes: [0]
          batch: false
  enabled:
    - checkov@3.3.8
    - git-diff-check
    - markdownlint@0.49.1
    - prettier@3.9.6
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - tflint@0.64.0
    - trufflehog@3.96.0
    - yamllint@1.38.0
    - no-image-latest
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
